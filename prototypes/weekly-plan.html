<title>週案</title>
<style>
/* ▼ src/plan-tokens.css から。直すのは src のほう ▼ */
/* 週案の色トークン。weekly-plan.html だけが読む。
   ノート評価の tokens.css とは別にしてある（用途が違う色は混ぜない）。

   色分けの上限に従って組んである。
     塗り  … 2色まで。ここでは「降ってきた」と「重なっている」の2つにだけ使う
     線・印 … 4色まで。層（全体・学年・専科）の左端の線に使う
   層そのものは色ではなく**ラベルの文字**で運ぶ。色を外しても意味が残る。
   値は scripts/check-palette.mjs で全項目クリア済み（1型・2型・3型）。 */
:root{
  --paper:#FCFBF7; --sheet:#FFFFFF;
  --ink:#1A1A1A; --ink-sub:#616870; --ink-link:#0F5EA8; --ink-alert:#C0330A;

  --rule:#B9BDC2;        /* 枠の実線 */
  --rule-soft:#DCDFE3;   /* タイトルと詳細を分ける点線 */
  --rule-week:#8C9298;   /* 外周と時程の区切り */

  /* 塗り（2色まで） */
  --fill-a:#D7E8F8;      /* 上位から降ってきたコマ */
  --fill-b:#FBE3B4;      /* 重なっているコマ */

  /* 層の左端の線（4色まで。必ずラベルと併用する） */
  --cat-school:#0F5EA8;  /* 学校全体 */
  --cat-grade:#C86A00;   /* 学年 */
  --cat-special:#6E4310; /* 専科 */
  --cat-none:#7A7F86;    /* 印を出さない層のための保険 */

  --band:#EFEDE8;        /* 休み行の地 */
  --ui:#F1F3F5; --ui-line:#CDD2D8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15181B; --ink:#E9ECEF; --ink-sub:#A2AAB3; --ink-link:#8ABBEE;
    --ui:#1E2226; --ui-line:#333A41;
  }
}
:root[data-theme="dark"]{
  --paper:#15181B; --ink:#E9ECEF; --ink-sub:#A2AAB3; --ink-link:#8ABBEE;
  --ui:#1E2226; --ui-line:#333A41;
}
/* ▲ src/plan-tokens.css ここまで ▲ */

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:14px/1.5 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}

/* ── 画面まわり（刷らない） ───────────────────────── */
.chrome{position:sticky;top:0;z-index:20;background:var(--ui);
  border-bottom:1px solid var(--ui-line)}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:7px 12px}
.grp{display:flex;gap:6px;align-items:center}
.grp label{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--ink-sub)}
button,select,input[type=date],input[type=url],input[type=text]{
  font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--ui-line);
  border-radius:5px;background:var(--sheet);color:var(--ink)}
button{cursor:pointer}
button:hover{background:var(--fill-a)}
button.primary{background:var(--ink-link);border-color:var(--ink-link);color:#fff}
button.primary:hover{filter:brightness(1.12)}
#weeklabel{font-size:15px;font-weight:700;min-width:11em;text-align:center}
.hint{padding:0 12px 7px;font-size:12px;color:var(--ink-sub)}
.hint b{color:var(--ink-alert)}

.stage{padding:14px;display:flex;justify-content:center}

/* ── 用紙 ─────────────────────────────────────────
   画面でも刷ったときと同じ mm で並べる。倍率 --k で全体が伸縮する。 */
.sheet{
  --k:1;
  --pw:182mm; --ph:257mm; --pm:8mm;      /* B5・余白。設定から動く */
  --labw:calc(9mm*var(--k));
  --wkw:calc(20mm*var(--k));
  --h-head:calc(8mm*var(--k));
  --h-break:calc(6mm*var(--k));
  --h-title:calc(8mm*var(--k));
  --h-note:calc(21mm*var(--k));
  --h-foot:calc(33mm*var(--k));
  --fs:calc(8.5pt*var(--k));
  --fs-s:calc(6pt*var(--k));

  /* 用紙の中は暗い配色にしない。刷る紙の見えをそのまま画面に出す */
  --ink:#1A1A1A; --ink-sub:#616870; --ink-link:#0F5EA8;
  background:#fff;color:#1A1A1A;
  width:calc(var(--pw) - var(--pm)*2);
  min-height:calc(var(--ph) - var(--pm)*2);
  display:grid;
  grid-template-columns:var(--labw) repeat(5,1fr) var(--wkw);
  border:1.2px solid var(--rule-week);
  box-shadow:0 1px 10px rgba(0,0,0,.13);
  font-size:var(--fs);
}
.sheet>*{border-right:.6px solid var(--rule);border-bottom:.6px solid var(--rule);
  min-width:0;position:relative}
.sheet>.lastcol{border-right:none}

/* 見出し行 */
.hd{display:flex;align-items:center;justify-content:center;gap:.35em;
  height:var(--h-head);font-weight:700;border-bottom:1.2px solid var(--rule-week)}
.hd .dow{font-size:var(--fs-s);color:var(--ink-sub);font-weight:400}
.hd.sat .dow{color:#0F5EA8}
.hd.corner{font-size:var(--fs-s);font-weight:400;color:var(--ink-sub)}

/* 時程のラベル */
.lab{display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:var(--fs-s);color:var(--ink-sub);line-height:1.15;padding:0 1px}
.lab.period{font-size:calc(11pt*var(--k));font-weight:700;color:var(--ink)}
.row-break .lab,.row-break{background:var(--band)}

/* コマ */
.cell{display:flex;flex-direction:column;overflow:hidden}
.cell.lesson{height:calc(var(--h-title) + var(--h-note))}
.cell.brk{height:var(--h-break)}
.cell .t,.cell .n{padding:1px calc(1.4mm*var(--k));outline:none;overflow:hidden;
  word-break:break-word;line-height:1.25}
.cell .t{height:var(--h-title);display:flex;align-items:center;font-weight:600}
.cell.brk .t{height:100%;font-weight:400;font-size:var(--fs-s)}
.cell .n{flex:1;font-size:var(--fs-s);color:var(--ink-sub);
  border-top:.6px dashed var(--rule-soft);padding-top:calc(.6mm*var(--k))}
.cell .t:focus,.cell .n:focus{background:#FFFBEA;box-shadow:inset 0 0 0 1.6px var(--ink-link)}
.cell.sel{box-shadow:inset 0 0 0 1.6px var(--ink-link)}

/* 出どころ。塗りは2色しか使わない。層はラベルの文字が運ぶ */
.cell.from-base .t{color:var(--ink-sub);font-weight:500}   /* 基本時間割のまま */
.cell.upper{background:var(--fill-a)}                       /* 上位から降ってきた */
.cell.clash{background:var(--fill-b)}                       /* 重なっている */
.cell.upper::before,.cell.clash::before{content:"";position:absolute;
  left:0;top:0;bottom:0;width:calc(1.6mm*var(--k));background:var(--cat-none)}
.cell[data-layer=school]::before{background:var(--cat-school)}
.cell[data-layer=grade]::before {background:var(--cat-grade)}
.cell[data-layer=special]::before{background:var(--cat-special)}
.tag{position:absolute;right:0;top:0;font-size:calc(5pt*var(--k));line-height:1.35;
  padding:0 .35em;color:#fff;background:var(--cat-none);border-bottom-left-radius:3px;
  letter-spacing:.02em;z-index:1}
.cell[data-layer=school] .tag{background:var(--cat-school)}
.cell[data-layer=grade]  .tag{background:var(--cat-grade)}
.cell[data-layer=special] .tag{background:var(--cat-special)}
.cell.clash .tag{background:var(--ink-alert)}
.lk{text-decoration:underline;text-decoration-color:var(--ink-link);
  text-underline-offset:1.5px}

/* 土日の列 */
.wk{display:flex;flex-direction:column}
.wk .cap{font-size:var(--fs-s);color:var(--ink-sub);text-align:center;
  border-bottom:.6px dashed var(--rule-soft);padding:1px 0}
.wk .t{flex:1;padding:1px calc(1.2mm*var(--k));outline:none;font-size:var(--fs-s);
  overflow:hidden;word-break:break-word}
.wk .t:focus{background:#FFFBEA;box-shadow:inset 0 0 0 1.6px var(--ink-link)}

/* 下の帯 */
.foot{grid-column:1/8;height:var(--h-foot);display:grid;
  grid-template-columns:var(--labw) 1fr;border-right:none}
.foot .lab{border-right:.6px solid var(--rule)}
.foot .t{padding:calc(1mm*var(--k)) calc(1.6mm*var(--k));outline:none;
  font-size:var(--fs-s);line-height:1.6;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent
    calc(4.8mm*var(--k) - .6px),var(--rule-soft) calc(4.8mm*var(--k)))}

/* ── 編集バー ─────────────────────────────────── */
.editbar{position:sticky;bottom:0;z-index:20;background:var(--ui);
  border-top:1px solid var(--ui-line);padding:8px 12px;
  display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.editbar .where{font-weight:700;font-size:13px;min-width:9em}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:3px 8px;font-size:12px;border:1px solid var(--ui-line);border-radius:11px;
  background:var(--sheet);cursor:pointer}
.chip:hover{background:var(--fill-a)}
.chip.off{color:var(--ink-sub)}
.editbar input[type=url]{width:15em}

dialog{border:1px solid var(--ui-line);border-radius:9px;padding:0;max-width:94vw;
  background:var(--ui);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.42)}
.dlg{padding:16px 18px;max-height:82vh;overflow:auto}
.dlg h2{margin:0 0 4px;font-size:16px}
.dlg p{margin:0 0 12px;font-size:12.5px;color:var(--ink-sub);line-height:1.6}
.dlg .row{display:flex;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.dlg .end{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
table.base{border-collapse:collapse;font-size:12.5px}
table.base th,table.base td{border:1px solid var(--ui-line);padding:2px 3px;text-align:center}
table.base th{background:var(--fill-a);color:#1A1A1A;font-weight:600}
table.base select,table.base input{padding:2px 4px;font-size:12px;min-width:6.4em}
ul.clashes{margin:0;padding-left:1.1em;font-size:13px;line-height:1.85}
ul.clashes b{color:var(--ink-alert)}

/* ── 刷るとき ────────────────────────────────────
   層の色も印も刷らない。貼った紙に要るのは中身だけ。 */
@media print{
  .chrome,.editbar,.stage{padding:0}
  .chrome,.editbar{display:none!important}
  body{background:#fff}
  .stage{display:block}
  .sheet{box-shadow:none;width:auto;min-height:0;border-color:#000}
  .cell.upper,.cell.clash,.row-break .lab,.row-break{background:transparent}
  .row-break,.row-break .lab{background:#EFEFEF}
  .cell.upper::before,.cell.clash::before,.tag{display:none}
  .cell.from-base .t{color:#1A1A1A;font-weight:600}
  .lk{text-decoration-color:#1A1A1A}
}
</style>

<div class="chrome">
  <div class="bar">
    <div class="grp">
      <button id="prev" title="前の週">◀</button>

<dialog id="baseDlg"><div class="dlg">

  <p>ここに入れたものが、<b>週案枠を作った時点で全部のコマに流し込まれる</b>。<br>
     担任は毎週30コマ埋めるのではなく、変わったところだけ直す。</p>
  <div class="row">クラス <select id="baseCls"></select></div>

<dialog id="setDlg"><div class="dlg">
  <h2>用紙</h2>
  <p>刷って教務必携に当て、枠が合う値を見つける。<br>
     見つけた値は設定シートに書いて全職員で同じものを使う。</p>
  <div class="row">用紙
    <select id="stPaper"><option value="B5">B5</option><option value="A4">A4</option></select></div>
  <div class="row">余白 <input type="range" id="stMg" min="4" max="20" step="1">
    <span id="stMgV"></span> mm</div>

    <span id="stKV"></span></div>

<dialog id="warnDlg"><div class="dlg">
  <h2>重なっているコマがあります</h2>
  <p>同じコマに2つ以上の予定が入っている。<b>あとから書かれたほうが出ている。</b><br>
     <b>閉じるとこの重なりについては二度出ない</b>（中身が変わったら出し直す）。</p>
  <ul class="clashes" id="warnList"></ul>
  <div class="end"><button class="primary" id="warnClose">確かめた</button></div>
</div></dialog>

<script>
"use strict";

/* ══ 設定（本番では設定シートから来る） ══════════════════ */

const SLOTS = [
  {id:"am1",  name:"朝休み", kind:"brk"},
  {id:"am2",  name:"朝学習", kind:"brk"},
  {id:"p1",   name:"1",      kind:"lesson"},
  {id:"p2",   name:"2",      kind:"lesson"},
  {id:"br",   name:"業間",   kind:"brk"},
  {id:"p3",   name:"3",      kind:"lesson"},
  {id:"p4",   name:"4",      kind:"lesson"},
  {id:"lun",  name:"昼休み", kind:"brk"},
  {id:"p5",   name:"5",      kind:"lesson"},
  {id:"p6",   name:"6",      kind:"lesson"}
];

/* 時数表の列。学年で使わない教科も列は残す（Excel 側の列が固定のため） */
const SUBJECTS = [
  {code:"kokugo",  name:"国語",  count:true},
  {code:"shakai",  name:"社会",  count:true},
  {code:"sansu",   name:"算数",  count:true},
  {code:"rika",    name:"理科",  count:true},
  {code:"seikatsu",name:"生活",  count:true},
  {code:"ongaku",  name:"音楽",  count:true},
  {code:"zuko",    name:"図工",  count:true},
  {code:"katei",   name:"家庭",  count:true},
  {code:"taiiku",  name:"体育",  count:true},
  {code:"doutoku", name:"道徳",  count:true},
  {code:"gaikoku", name:"外国語",count:true},
  {code:"sogo",    name:"総合",  count:true},
  {code:"gakkatsu",name:"学活",  count:true},
  /* 数えないもの。時数表には列を持たない */
  {code:"gyoji",   name:"行事",  count:false},
  {code:"kyushoku",name:"給食",  count:false},
  {code:"club",    name:"クラブ",count:false},
  {code:"iinkai",  name:"委員会",count:false}
];
const SUB_BY_NAME = Object.fromEntries(SUBJECTS.map(s=>[s.name,s]));
const SUB_BY_CODE = Object.fromEntries(SUBJECTS.map(s=>[s.code,s]));

const CLASSES = ["3-1","3-2","3-3","2-1","2-2"];
const gradeOf = c => c.split("-")[0];

const ROLES = [
  {id:"h33", label:"担任 3年3組",     kind:"home",    cls:"3-3"},
  {id:"h31", label:"担任 3年1組",     kind:"home",    cls:"3-1"},
  {id:"g3",  label:"学年主任 3年",     kind:"grade",   grade:"3"},
  {id:"kyo", label:"教務（学校全体）", kind:"school"},
  {id:"ong", label:"音楽専科",         kind:"special", subject:"ongaku",
             me:"ongaku@edu.nishi.or.jp", classes:CLASSES}
];
const LAYER_NAME = {base:"", school:"全体", grade:"学年", special:"専", home:""};
/* 警告の文の中では「担任」も名前で呼ぶ必要がある。コマの隅の印では邪魔なので空にしてある */
const LAYER_FULL = {base:"基本時間割", school:"学校全体", grade:"学年", special:"専科", home:"担任"};
const RANK = {base:0, home:1, special:2, grade:3, school:4};

const DOW = ["月","火","水","木","金"];

/* ══ 保存 ══════════════════════════════════════════ */

const KEY = "weekly-plan-v0";
const blank = () => ({
  settings:{paper:"B5", margin:8, k:1, head:true},
  base:{}, weeks:{}
});
let db;
try{ db = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||"{}")); }
catch(e){ db = blank(); }
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} };

/* ══ 週 ════════════════════════════════════════════ */

const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function mondayOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay()+6)%7));   // 日曜=0 を 6 に読み替える
  return x;
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }

let monday = mondayOf(new Date());
const wk = () => iso(monday);

function week(){
  const k = wk();
  if(!db.weeks[k]) db.weeks[k] = {school:{}, grade:{}, special:{}, home:{}, acked:[]};
  const w = db.weeks[k];
  for(const f of ["school","grade","special","home"]) if(!w[f]) w[f]={};
  if(!w.acked) w.acked=[];
  return w;
}
const ck = (d,s) => d+"|"+s;                      /* コマの鍵 */

/* ══ 合成 ══════════════════════════════════════════
   基本時間割 → 学校全体 → 学年 → 専科 → 担任 の順に重ねる。
   あとのものが前のものを置き換え、置き換えたことを clash として残す。 */

function baseCell(cls,d,s){
  const v = (db.base[cls]||{})[ck(d,s)];
  if(!v) return null;
  return {title:v.title||"", note:"", subject:v.subject||null, layer:"base"};
}
function compose(cls,d,s){
  const w = week(), key = ck(d,s), g = gradeOf(cls);
  const cand = [];
  const b = baseCell(cls,d,s);
  if(b) cand.push(Object.assign(b, {at:0}));
  const push = (e,layer) => { if(e) cand.push(Object.assign({}, e, {layer, at:e.at||0})); };
  push(w.school[key], "school");
  push((w.grade[g]||{})[key], "grade");
  push((w.special[cls]||{})[key], "special");
  push((w.home[cls]||{})[key], "home");
  if(!cand.length) return {title:"", note:"", subject:null, layer:"base", clash:null};

  /* 勝つのは「最後に書かれたもの」。層は勝ち負けを決めない（層は出どころの表示だけ）。
     時刻で決めないと、上位があとから入れた予定が、先に入っていた担任の予定に負ける。
     それでは学年主任が学年体育を入れても反映されず、入れた本人にも見えない。 */
  cand.sort((x,y) => (x.at - y.at) || (RANK[x.layer] - RANK[y.layer]));
  const cur = Object.assign({}, cand[cand.length-1]);
  const lost = cand.slice(0,-1).filter(e => e.layer!=="base" && (e.title||e.note));
  cur.clash = lost.length ? lost : null;
  return cur;
}

/* 書き込み先は「見ている人の層」で決まる。層は権限ではなく出どころ */
function store(role, cls){
  const w = week();
  if(role.kind==="school")  return w.school;
  if(role.kind==="grade")   return (w.grade[role.grade] ||= {});
  if(role.kind==="special") return (w.special[cls] ||= {});
  return (w.home[cls] ||= {});
}
function writeCell(d,s,patch){
  const st = store(role(), cls());
  const key = ck(d,s);
  const cur = compose(cls(),d,s);
  const e = st[key] || {title:cur.layer==="base"?cur.title:"", note:"",
                        subject:cur.layer==="base"?cur.subject:null};
  Object.assign(e, patch);
  if(role().kind==="special") e.teacher = role().me;
  e.by = role().label;
  e.at = Date.now();
  if(!e.title && !e.note && !e.titleUrl && !e.noteUrl) delete st[key];
  else st[key] = e;
  save();
}

/* ══ 画面の状態 ════════════════════════════════════ */

const $ = id => document.getElementById(id);
let roleId = ROLES[0].id, clsId = "3-3", ownView = false, sel = null;
const role = () => ROLES.find(r=>r.id===roleId);
const cls  = () => clsId;

function visibleClasses(){
  const r = role();
  if(r.kind==="home")   return [r.cls];
  if(r.kind==="grade")  return CLASSES.filter(c=>gradeOf(c)===r.grade);
  if(r.kind==="special")return r.classes;
  return CLASSES;
}

/* ══ 描く ══════════════════════════════════════════ */

function build(){
  const sh = $("sheet");
  sh.innerHTML = "";
  const add = (html, cl) => {
    const el = document.createElement("div");
    el.className = cl; el.innerHTML = html; sh.appendChild(el); return el;
  };

  /* 見出し */
  add("", "hd corner lab");
  for(let d=0; d<5; d++){
    const dt = addDays(monday,d);
    add("<span>"+(dt.getMonth()+1)+"/"+dt.getDate()+"</span>"
       +"<span class='dow'>"+DOW[d]+"</span>", "hd");
  }
  add("<span class='dow'>土日</span>", "hd sat lastcol");

  /* 時程 */
  SLOTS.forEach((s,i)=>{
    const brk = s.kind==="brk";
    const lab = add(s.name, "lab "+(s.kind==="lesson"?"period":""));
    if(brk) lab.classList.add("row-break");
    for(let d=0; d<5; d++) sh.appendChild(cellEl(d,s));
    if(i===0) sh.appendChild(wkEl("土", 2, 8));
    if(i===7) sh.appendChild(wkEl("日", 9, 11));
  });

  /* 下の帯 */
  const f = add("<div class='lab'>週の<br>メモ</div>"
    +"<div class='t' contenteditable='plaintext-only' data-foot='1'></div>", "foot lastcol");
  f.querySelector(".t").textContent = (week().memo||"");
  f.querySelector(".t").addEventListener("input", ev=>{
    week().memo = ev.target.textContent; save();
  });

  paint();
}

function wkEl(cap, r1, r2){
  const el = document.createElement("div");
  el.className = "wk lastcol";
  el.style.gridColumn = "7";
  el.style.gridRow = r1+" / "+(r2+1);
  el.innerHTML = "<div class='cap'>"+cap+"</div>"
    +"<div class='t' contenteditable='plaintext-only' data-wk='"+cap+"'></div>";
  const t = el.querySelector(".t");
  t.textContent = (week().weekend||{})[cap] || "";
  t.addEventListener("input", ()=>{
    (week().weekend ||= {})[cap] = t.textContent; save();
  });
  return el;
}

function cellEl(d, s){
  const el = document.createElement("div");
  el.className = "cell " + (s.kind==="lesson" ? "lesson" : "brk row-break");
  el.dataset.d = d; el.dataset.s = s.id;
  el.innerHTML = "<span class='tag' hidden></span>"
    + "<div class='t' contenteditable='plaintext-only'></div>"
    + (s.kind==="lesson" ? "<div class='n' contenteditable='plaintext-only'></div>" : "");
  const t = el.querySelector(".t"), n = el.querySelector(".n");
  const focus = () => select(d, s.id, el);
  t.addEventListener("focus", focus);
  if(n) n.addEventListener("focus", focus);
  t.addEventListener("input", ()=>{
    const v = t.textContent.trim();
    const sub = SUB_BY_NAME[v];
    writeCell(d, s.id, {title:t.textContent, subject:sub?sub.code:null});
    paint(el);
  });
  if(n) n.addEventListener("input", ()=>{
    writeCell(d, s.id, {note:n.textContent}); paint(el);
  });
  return el;
}

/* 中身を流し込む。el を渡すとそのコマだけ塗り直す */
function paint(one){
  const list = one ? [one] : [...document.querySelectorAll(".cell")];
  const clashes = [];
  for(const el of list){
    const d = +el.dataset.d, s = el.dataset.s;
    const c = ownView ? composeOwn(d,s) : compose(cls(), d, s);
    const t = el.querySelector(".t"), n = el.querySelector(".n");
    if(document.activeElement !== t) t.textContent = c.title || "";
    if(n && document.activeElement !== n) n.textContent = c.note || "";
    t.classList.toggle("lk", !!c.titleUrl);
    if(n) n.classList.toggle("lk", !!c.noteUrl);

    el.dataset.layer = c.layer;
    el.classList.toggle("from-base", c.layer==="base");
    const upper = RANK[c.layer] > RANK[role().kind==="home"?"home":role().kind];
    el.classList.toggle("upper", upper && !c.clash);
    el.classList.toggle("clash", !!c.clash);
    const tag = el.querySelector(".tag");
    const name = c.clash ? "！重なり" : LAYER_NAME[c.layer];
    tag.hidden = !name;
    tag.textContent = name;
    if(c.clash) clashes.push({d, s, c});
  }
  if(!one) warn(clashes);
}

/* 専科の「自分の週」。同じデータを、教科名ではなくクラス名で見る */
function composeOwn(d,s){
  const r = role();
  for(const c of r.classes){
    const x = compose(c,d,s);
    if(x.layer==="special" && x.teacher===r.me)
      return Object.assign({}, x, {title:c});
  }
  return {title:"", note:"", layer:"base"};
}

/* ══ 重なりの警告。開いたとき1回だけ ══════════════════ */

function warn(list){
  const w = week();
  const sig = c => cls()+"|"+ck(c.d,c.s)+"|"+c.c.title+"|"
                 + c.c.clash.map(p=>p.layer+":"+p.title).join(",");
  const fresh = list.filter(c => !w.acked.includes(sig(c)));
  if(!fresh.length) return;
  $("warnList").innerHTML = fresh.map(c=>{
    const dt = addDays(monday, c.d), sl = SLOTS.find(x=>x.id===c.s);
    const prev = c.c.clash.map(p=>LAYER_FULL[p.layer]+"「"+(p.title||"（空）")+"」").join(" / ");
    return "<li>"+(dt.getMonth()+1)+"/"+dt.getDate()+"("+DOW[c.d]+") "+sl.name
      +(sl.kind==="lesson"?"校時":"")+" "+cls()+"<br>"
      +"　出ていない予定：<b>"+prev+"</b><br>"
      +"　いま出ている："+LAYER_FULL[c.c.layer]+"「"+(c.c.title||"（空）")+"」</li>";
  }).join("");
  $("warnDlg").showModal();
  $("warnDlg").onclose = () => {
    fresh.forEach(c => w.acked.push(sig(c)));
    save();
  };
}

/* ══ 編集バー ══════════════════════════════════════ */

function select(d, sid, el){
  document.querySelectorAll(".cell.sel").forEach(x=>x.classList.remove("sel"));
  el.classList.add("sel");
  sel = {d, s:sid};
  const slot = SLOTS.find(x=>x.id===sid), dt = addDays(monday,d);
  const c = compose(cls(), d, sid);
  $("editbar").hidden = false;
  $("ebWhere").textContent = (dt.getMonth()+1)+"/"+dt.getDate()+"("+DOW[d]+") "
    + slot.name + (slot.kind==="lesson"?"校時":"");
  $("ebTu").value = c.titleUrl || "";
  $("ebNu").value = c.noteUrl || "";
  $("ebAll").hidden = slot.kind!=="brk";
  $("ebRevert").hidden = !(store(role(),cls())[ck(d,sid)]);
  const useful = slot.kind==="lesson";
  $("ebChips").innerHTML = !useful ? "" : SUBJECTS.map(s=>
    "<span class='chip"+(s.count?"":" off")+"' data-code='"+s.code+"'>"+s.name+"</span>").join("");
}

$("ebChips").addEventListener("click", ev=>{
  const chip = ev.target.closest(".chip"); if(!chip || !sel) return;
  const s = SUB_BY_CODE[chip.dataset.code];
  writeCell(sel.d, sel.s, {title:s.name, subject:s.code});
  paint(); select(sel.d, sel.s, cellAt(sel.d, sel.s));
});
const cellAt = (d,s) => document.querySelector(".cell[data-d='"+d+"'][data-s='"+s+"']");
$("ebTu").addEventListener("change", ()=>{ if(sel){ writeCell(sel.d,sel.s,{titleUrl:$("ebTu").value}); paint(); }});
$("ebNu").addEventListener("change", ()=>{ if(sel){ writeCell(sel.d,sel.s,{noteUrl:$("ebNu").value}); paint(); }});
$("ebClear").addEventListener("click", ()=>{
  if(!sel) return;
  writeCell(sel.d, sel.s, {title:"", note:"", titleUrl:"", noteUrl:"", subject:null});
  paint();
});
$("ebRevert").addEventListener("click", ()=>{
  if(!sel) return;
  delete store(role(),cls())[ck(sel.d,sel.s)];
  save(); paint(); select(sel.d, sel.s, cellAt(sel.d,sel.s));
});
$("ebAll").addEventListener("click", ()=>{
  if(!sel) return;
  const c = compose(cls(), sel.d, sel.s);
  for(let d=0; d<5; d++) writeCell(d, sel.s, {title:c.title, note:c.note||""});
  paint();
});

/* ══ 基本時間割 ════════════════════════════════════ */

function baseGrid(){
  const c = $("baseCls").value;
  db.base[c] ||= {};
  let h = "<table class='base'><tr><th></th>"
        + DOW.map(d=>"<th>"+d+"</th>").join("") + "</tr>";
  for(const s of SLOTS){
    h += "<tr><th>"+s.name+"</th>";
    for(let d=0; d<5; d++){
      const v = db.base[c][ck(d,s.id)] || {};
      h += "<td>" + (s.kind==="lesson"
        ? "<select data-k='"+ck(d,s.id)+"'><option value=''>—</option>"
          + SUBJECTS.map(x=>"<option value='"+x.code+"'"
            +(v.subject===x.code?" selected":"")+">"+x.name+"</option>").join("")
          + "</select>"
        : "<input data-k='"+ck(d,s.id)+"' value='"+(v.title||"").replace(/"/g,"&quot;")+"'>")
        + "</td>";
    }
    h += "</tr>";
  }
  $("baseGrid").innerHTML = h + "</table>";
  $("baseGrid").querySelectorAll("select").forEach(el=>el.onchange = ()=>{
    const s = SUB_BY_CODE[el.value];
    if(s) db.base[c][el.dataset.k] = {title:s.name, subject:s.code};
    else delete db.base[c][el.dataset.k];
    save();
  });
  $("baseGrid").querySelectorAll("input").forEach(el=>el.onchange = ()=>{
    if(el.value.trim()) db.base[c][el.dataset.k] = {title:el.value, subject:null};
    else delete db.base[c][el.dataset.k];
    save();
  });
}

/* ══ 時数 ══════════════════════════════════════════ */

function tally(cls, upToWeek){
  const n = {};
  for(const k of Object.keys(db.weeks).sort()){
    if(k > upToWeek) continue;
    const cur = (k === upToWeek);
    const keep = monday;
    monday = new Date(k+"T00:00:00");
    for(let d=0; d<5; d++) for(const s of SLOTS){
      if(s.kind!=="lesson") continue;
      const c = compose(cls, d, s.id);
      const sub = c.subject ? SUB_BY_CODE[c.subject] : SUB_BY_NAME[(c.title||"").trim()];
      if(!sub || !sub.count) continue;
      n[sub.code] ||= {week:0, cum:0};
      n[sub.code].cum++;
      if(cur) n[sub.code].week++;
    }
    monday = keep;
  }
  return n;
}

function tsv(){
  const cols = SUBJECTS.filter(s=>s.count);
  const n = tally(cls(), wk());
  const wRow = cols.map(s => (n[s.code]||{}).week || 0);
  const cRow = cols.map(s => (n[s.code]||{}).cum  || 0);
  const sum = a => a.reduce((x,y)=>x+y,0);
  const rows = [];
  if(db.settings.head) rows.push([""].concat(cols.map(s=>s.name), "計"));
  rows.push(["実施"].concat(wRow, sum(wRow)));
  rows.push(["累計"].concat(cRow, sum(cRow)));
  return rows.map(r=>r.join("\t")).join("\n");
}

async function copyTsv(){
  const s = tsv();
  try{ await navigator.clipboard.writeText(s); flash("時数をコピーした。Excel の当該週シートに貼る"); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = s; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
    flash("時数をコピーした。Excel の当該週シートに貼る");
  }
}

/* ══ 画面の組み立て ════════════════════════════════ */

let flashT = 0;
function flash(msg){
  clearTimeout(flashT);
  $("hint").innerHTML = msg;
  flashT = setTimeout(hint, 4200);
}
function hint(){
  const r = role();
  const where = r.kind==="school" ? "全クラスに入る"
    : r.kind==="grade" ? r.grade+"年の全クラスに入る"
    : r.kind==="special" ? "担当クラスの音楽に入る（担任には「音楽」と出る）"
    : "このクラスだけに入る";
  $("hint").innerHTML = "いま書き込むと <b>"+(LAYER_NAME[r.kind]||"担任")
    + "</b> の予定として "+where+"。"
    + "　色のついたコマ＝上位から降ってきたもの。直せる。直すと右上に印が付く。";
}

function fill(sel, arr, val){
  sel.innerHTML = arr.map(o=>"<option value='"+o.v+"'"+(o.v===val?" selected":"")+">"
    +o.t+"</option>").join("");
}

function refreshRole(){
  const r = role();
  const list = visibleClasses();
  if(!list.includes(clsId)) clsId = list[0];
  fill($("cls"), list.map(c=>({v:c,t:c})), clsId);
  $("cls").disabled = list.length===1;
  $("ownWrap").hidden = r.kind!=="special";
  if(r.kind!=="special"){ ownView = false; $("own").checked = false; }
  hint(); build();
}

function refreshWeek(){
  const e = addDays(monday,6);
  $("weeklabel").textContent =
    (monday.getMonth()+1)+"/"+monday.getDate()+" → "+(e.getMonth()+1)+"/"+e.getDate();
  $("jump").value = wk();
  build();
}

function applyPaper(){
  const s = db.settings, sh = $("sheet");
  const [w,h] = s.paper==="A4" ? ["210mm","297mm"] : ["182mm","257mm"];
  sh.style.setProperty("--pw", w);
  sh.style.setProperty("--ph", h);
  sh.style.setProperty("--pm", s.margin+"mm");
  sh.style.setProperty("--k", s.k);
  let st = document.getElementById("pagecss");
  if(!st){ st = document.createElement("style"); st.id="pagecss"; document.head.appendChild(st); }
  st.textContent = "@page{size:"+s.paper+" portrait;margin:"+s.margin+"mm}";
  $("stPaper").value = s.paper;
  $("stMg").value = s.margin;  $("stMgV").textContent = s.margin;
  $("stK").value  = s.k;       $("stKV").textContent  = (+s.k).toFixed(2);
  $("stHead").checked = !!s.head;
}

/* 操作 */
$("prev").onclick = ()=>{ monday = addDays(monday,-7); refreshWeek(); };
$("next").onclick = ()=>{ monday = addDays(monday, 7); refreshWeek(); };
$("jump").onchange = e=>{ if(e.target.value){ monday = mondayOf(new Date(e.target.value+"T00:00:00")); refreshWeek(); }};
$("role").onchange = e=>{ roleId = e.target.value; refreshRole(); };
$("cls").onchange  = e=>{ clsId = e.target.value; build(); };
$("own").onchange  = e=>{ ownView = e.target.checked; build(); };
$("printBtn").onclick = ()=>window.print();
$("copyBtn").onclick  = copyTsv;
$("tanpopoBtn").onclick = ()=>flash(
  "たんぽぽ時間割の<b>対応表が未設定</b>。実物のシートを見てから対応表シートを埋める（docs/weekly-plan.md 0節 c）");
$("setBtn").onclick  = ()=>$("setDlg").showModal();
$("setClose").onclick= ()=>$("setDlg").close();
$("stPaper").onchange = e=>{ db.settings.paper = e.target.value; save(); applyPaper(); };
$("stMg").oninput = e=>{ db.settings.margin = +e.target.value; save(); applyPaper(); };
$("stK").oninput  = e=>{ db.settings.k = +e.target.value; save(); applyPaper(); };
$("stHead").onchange = e=>{ db.settings.head = e.target.checked; save(); };
$("baseBtn").onclick = ()=>{
  fill($("baseCls"), CLASSES.map(c=>({v:c,t:c})), cls());
  baseGrid(); $("baseDlg").showModal();
};
$("baseCls").onchange = baseGrid;
$("baseClose").onclick = ()=>{ $("baseDlg").close(); build(); };
$("baseApply").onclick = ()=>{
  const w = week(), c = $("baseCls").value;
  delete w.home[c];
  save(); $("baseDlg").close();
  if(c===cls()) build();
  flash(c+" の "+wk()+" の週を基本時間割で入れ直した（担任が入れた分は消えた）");
};
$("warnClose").onclick = ()=>$("warnDlg").close();

/* はじめの一回 */
fill($("role"), ROLES.map(r=>({v:r.id,t:r.label})), roleId);
if(!Object.keys(db.base).length) seed();
applyPaper();
refreshRole();
refreshWeek();

/* 手元で触れるだけの見本。本番では基本時間割シートから来る */
function seed(){
  const w = ["kokugo","sansu","rika","ongaku","taiiku","zuko","shakai","doutoku",
             "gaikoku","sogo","gakkatsu","kokugo","sansu","taiiku","kokugo",
             "sansu","shakai","rika","kokugo","sansu","zuko","ongaku","taiiku",
             "sansu","kokugo","sogo","gakkatsu","kokugo","sansu","rika"];
  for(const c of CLASSES){
    db.base[c] = {};
    let i = 0;
    for(let d=0; d<5; d++) for(const s of SLOTS){
      if(s.kind==="brk"){
        if(s.id==="am2") db.base[c][ck(d,s.id)] = {title:["漢字","計算","読書","漢字","計算"][d], subject:null};
        if(s.id==="lun") db.base[c][ck(d,s.id)] = {title:"給食・そうじ", subject:null};
        continue;
      }
      const code = w[(i + CLASSES.indexOf(c)*7) % w.length]; i++;
      db.base[c][ck(d,s.id)] = {title:SUB_BY_CODE[code].name, subject:code};
    }
  }
  save();
}
