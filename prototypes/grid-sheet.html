<title>評価シート 3年3組</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#FCFBF7;
  --sheet:#FFFFFF;
  --ink:#1D2126;
  --ink-soft:#5A6470;
  --ink-faint:#9AA3AD;
  --rule:#DFDCD2;
  --rule-soft:#EDEAE2;
  --accent:#2C5C9E;

  --a-bg:#DCE8F6;   --a-line:#8FB4DC;   --a-ink:#173E70;
  --z-bg:#F7EBCB;   --z-line:#D6B461;   --z-ink:#5C4408;
  --warn:#B0392B;
  --todo-bg:#FFF6E8; --todo-line:#E0B36A;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131619;
    --sheet:#1A1E23;
    --ink:#E8EBEF;
    --ink-soft:#A0A9B4;
    --ink-faint:#6A727C;
    --rule:#2E343B;
    --rule-soft:#242A30;
    --accent:#7BAAE4;

    --a-bg:#1E3352;   --a-line:#3F6598;   --a-ink:#BDD5F0;
    --z-bg:#3D3113;   --z-line:#8A7028;   --z-ink:#F0D794;
    --warn:#E5776A;
    --todo-bg:#332811; --todo-line:#7A5F22;
  }
}
:root[data-theme="dark"]{
  --paper:#131619;
  --sheet:#1A1E23;
  --ink:#E8EBEF;
  --ink-soft:#A0A9B4;
  --ink-faint:#6A727C;
  --rule:#2E343B;
  --rule-soft:#242A30;
  --accent:#7BAAE4;

  --a-bg:#1E3352;   --a-line:#3F6598;   --a-ink:#BDD5F0;
  --z-bg:#3D3113;   --z-line:#8A7028;   --z-ink:#F0D794;
  --warn:#E5776A;
  --todo-bg:#332811; --todo-line:#7A5F22;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif;
  font-size:15px;line-height:1.7;
}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 64px;display:flex;flex-direction:column;gap:26px}

.note{
  font-size:12.5px;color:var(--ink-soft);
  border:1px dashed var(--rule);border-radius:8px;padding:7px 13px;background:var(--sheet);
}
.note b{color:var(--ink);font-weight:600}

/* ---- 見出し ---- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:10px}
.head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.02em}
.head h1 small{font-size:13px;font-weight:500;color:var(--ink-soft);margin-left:10px;letter-spacing:0}
.todo-count{
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
  color:var(--warn);border:1.5px solid currentColor;border-radius:6px;padding:3px 11px;
}
.todo-count.clear{color:var(--ink-faint)}

/* ---- セクション ---- */
section{display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.06em;
  display:flex;align-items:center;gap:12px;color:var(--ink-soft)}
h2::after{content:"";flex:1;height:1px;background:var(--rule)}

/* ---- 70セルの表 ---- */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(10,minmax(88px,1fr));gap:1px;background:var(--rule-soft);
  border:1px solid var(--rule-soft);min-width:900px}
.cell{background:var(--sheet);padding:6px 6px 7px;display:flex;flex-direction:column;gap:3px}
.cell .no{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  color:var(--ink-faint);letter-spacing:.03em;display:flex;justify-content:space-between;align-items:center;
}
.cell .unit{font-size:9.5px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46px}
.cell select{
  width:100%;appearance:none;font-family:"IBM Plex Mono",monospace;
  font-size:17px;font-weight:600;text-align:center;text-align-last:center;
  padding:5px 2px;border:1px solid var(--rule);border-radius:5px;
  background:var(--sheet);color:var(--ink);cursor:pointer;
}
.cell select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cell select:hover{border-color:var(--accent)}

/* 未入力（授業は済んでいる）: ここだけ目を引かせる */
.cell.todo{background:var(--todo-bg)}
.cell.todo select{border:1.5px dashed var(--todo-line);background:transparent}

/* 未実施 */
.cell.future select{background:var(--rule-soft);color:var(--ink-faint);border-style:dotted;cursor:not-allowed}

/* A と Z にだけ色を置く */
.cell select.is-a{background:var(--a-bg);border-color:var(--a-line);color:var(--a-ink)}
.cell select.is-z{
  border-color:var(--z-line);color:var(--z-ink);
  background:linear-gradient(112deg,var(--z-bg) 0%,color-mix(in srgb,var(--z-bg) 62%,#ffffff) 42%,var(--z-bg) 72%,color-mix(in srgb,var(--z-bg) 70%,#ffffff) 100%);
}
/* D と C は色を塗らず、文字だけ警告色にする */
.cell select.is-warn{color:var(--warn)}

/* ---- 単元の評価 ---- */
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:12px}
.unit-card{
  background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;
  display:flex;flex-direction:column;gap:8px;
}
.unit-card .name{font-size:14px;font-weight:600}
.unit-card .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.unit-card .val{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600;letter-spacing:-.01em}
.unit-card .val.is-a{color:var(--a-ink)}
.unit-card .val.is-z{color:var(--z-ink)}
.unit-card .val.is-warn{color:var(--warn)}
.unit-card .val.none{color:var(--ink-faint);font-size:20px}
.tag{
  font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--ink-soft);
  border:1px solid var(--rule);border-radius:999px;padding:1px 9px;white-space:nowrap;
}
.unit-card .meta{font-size:11.5px;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;
  display:flex;gap:12px;flex-wrap:wrap}

/* ---- 折れ線 ---- */
.chartcard{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px 12px;overflow-x:auto}
svg.trend{display:block;min-width:820px;width:100%;height:auto}
svg.trend .band{fill:var(--rule-soft)}
svg.trend .baseline{stroke:var(--rule);stroke-width:1}
svg.trend .ylab{fill:var(--ink-soft);font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600}
svg.trend .ysub{fill:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:9px}
svg.trend .xlab{fill:var(--ink-faint);font-family:"IBM Plex Mono",monospace;font-size:9.5px}
svg.trend .unitlab{fill:var(--ink-soft);font-family:"IBM Plex Sans JP",sans-serif;font-size:11px;font-weight:600}
svg.trend .sep{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 3}
svg.trend .path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.trend .dot{fill:var(--accent)}
svg.trend .dot.z{fill:var(--z-line);stroke:var(--sheet);stroke-width:1.5}

@media (max-width:640px){
  .grid{grid-template-columns:repeat(5,minmax(88px,1fr));min-width:460px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="note"><b>案2・ためしの画面</b>　児童名と評価はダミー。もとの一覧表と同じ形で、各セルをプルダウンにした。</div>

  <div class="head">
    <h1>さくら<small>3年3組　算数　2026年度</small></h1>
    <div class="todo-count" id="todo">未入力 3</div>
  </div>

  <section>
    <h2>授業の評価</h2>
    <div class="sheet"><div class="grid" id="grid"></div></div>
  </section>

  <section>
    <h2>単元の評価</h2>
    <div class="units" id="units"></div>
  </section>

  <section>
    <h2>きろくの うつりかわり</h2>
    <div class="chartcard">
      <svg class="trend" id="trend" viewBox="0 0 1040 300" role="img" aria-label="授業ごとの評価の推移"></svg>
    </div>
  </section>
</div>

<script>
/* ==================================================================
   評価スケール：基本字 5 × ニュアンス 3 ＝ 15段
   内部値 1..15（低→高）。児童には数値を見せない。
   ※ 写真にあった A++ の扱いは未確定。ここでは A+ までとしている。
================================================================== */
const BASES = ["D","C","B","A","Z"];
const MODS  = ["−","","+"];
const SYMBOLS = [];
BASES.forEach(b => MODS.forEach(m => SYMBOLS.push(b + m)));   // D− D D+ C− ... Z+
const val  = sym => SYMBOLS.indexOf(sym) + 1;
const base = v => BASES[Math.floor((v-1)/3)];

const UNITS = [
  {name:"九九の表とかけ算", from:1,  to:14},
  {name:"わり算",           from:15, to:30},
  {name:"たし算とひき算の筆算", from:31, to:48},
  {name:"時こくと時間",     from:49, to:70}
];
const unitOf = no => UNITS.find(u => no >= u.from && no <= u.to);

/* ダミーの記録。done=入力済 / todo=授業は済んだが未入力 / future=これから */
const LESSONS = [];
const seed = ["B","B+","B","A−","B+","A","A","B+","A−","A","A+","A","B+","A",
              "B","B−","C","B+","A−","B+","A","A+"];
for(let no=1; no<=70; no++){
  if(no <= seed.length)      LESSONS.push({no, state:"done", v:val(seed[no-1])});
  else if(no <= seed.length+3) LESSONS.push({no, state:"todo", v:null});
  else                       LESSONS.push({no, state:"future", v:null});
}
/* 天井突破を1回混ぜておく（表示確認用） */
LESSONS[13].v = val("Z");

const $ = id => document.getElementById(id);

/* ---------- 70セルの表 ---------- */
function optionsHTML(){
  let h = '<option value="">‥</option>';
  BASES.forEach((b,bi)=>{
    h += '<optgroup label="' + b + '">';
    MODS.forEach((m,mi)=>{
      const v = bi*3 + mi + 1;
      h += '<option value="' + v + '">' + b + m + '</option>';
    });
    h += '</optgroup>';
  });
  return h;
}

function paint(sel, v){
  sel.classList.remove("is-a","is-z","is-warn");
  if(!v) return;
  const b = base(v);
  if(b === "A")                    sel.classList.add("is-a");
  else if(b === "Z")               sel.classList.add("is-z");
  else if(b === "C" || b === "D")  sel.classList.add("is-warn");
}

LESSONS.forEach(l=>{
  const u = unitOf(l.no);
  const c = document.createElement("div");
  c.className = "cell " + l.state;
  c.innerHTML =
    '<div class="no"><span>' + String(l.no).padStart(2,"0") + '</span>' +
    '<span class="unit">' + (u ? u.name : "") + '</span></div>' +
    '<select aria-label="No.' + l.no + ' ' + (u?u.name:"") + ' の評価">' + optionsHTML() + '</select>';
  const sel = c.querySelector("select");
  if(l.state === "future") sel.disabled = true;
  if(l.v){ sel.value = String(l.v); paint(sel, l.v); }
  sel.addEventListener("change", ()=>{
    l.v = sel.value ? Number(sel.value) : null;
    if(l.state === "todo" && l.v) c.classList.remove("todo");
    paint(sel, l.v);
    refresh();
  });
  $("grid").appendChild(c);
});

/* ---------- 単元の評価（仮値） ----------
   順序尺度なので平均は取らない。D は到達度の欠測として除外する。
------------------------------------------------------------------ */
function median(arr){
  if(!arr.length) return null;
  const a = arr.slice().sort((x,y)=>x-y);
  const m = Math.floor(a.length/2);
  return a.length % 2 ? a[m] : a[m-1];   // 偶数個は下位側を採る（水増ししない）
}

function summarize(u){
  const rows = LESSONS.filter(l => l.no>=u.from && l.no<=u.to && l.v);
  const scored = rows.filter(l => base(l.v) !== "D").map(l => l.v);   // D は除外
  const late = scored.slice(-Math.max(1, Math.ceil(scored.length/3)));
  return {
    n: rows.length,
    prov: median(late),
    all:  median(scored),
    top:  scored.length ? Math.max(...scored) : null,
    z:    rows.filter(l => base(l.v)==="Z").length,
    c:    rows.filter(l => base(l.v)==="C").length,
    d:    rows.filter(l => base(l.v)==="D").length
  };
}

function renderUnits(){
  $("units").innerHTML = "";
  UNITS.forEach(u=>{
    const s = summarize(u);
    const cls = s.prov ? (base(s.prov)==="A" ? "is-a" : base(s.prov)==="Z" ? "is-z"
                        : (base(s.prov)==="C"||base(s.prov)==="D") ? "is-warn" : "") : "none";
    const card = document.createElement("div");
    card.className = "unit-card";
    card.innerHTML =
      '<div class="name">' + u.name + '</div>' +
      '<div class="row"><span class="val ' + cls + '">' +
        (s.prov ? SYMBOLS[s.prov-1] : "—") + '</span>' +
        '<span class="tag">' + (s.prov ? "仮 / 後半の中央値" : "記録なし") + '</span></div>' +
      '<div class="meta">' +
        '<span>入力 ' + s.n + '/' + (u.to-u.from+1) + '</span>' +
        (s.all ? '<span>全体 ' + SYMBOLS[s.all-1] + '</span>' : '') +
        (s.top ? '<span>最高 ' + SYMBOLS[s.top-1] + '</span>' : '') +
        (s.z ? '<span>Z ' + s.z + '回</span>' : '') +
        (s.c ? '<span>C ' + s.c + '回</span>' : '') +
        (s.d ? '<span>D ' + s.d + '回</span>' : '') +
      '</div>';
    $("units").appendChild(card);
  });
}

/* ---------- 折れ線 ---------- */
function drawTrend(){
  const data = LESSONS.filter(l => l.v);
  const W=1040, H=300, L=54, R=14, T=16, B=34;
  const iw=W-L-R, ih=H-T-B;
  const slot = ih/15;
  const x = i => L + (data.length<2 ? iw/2 : iw*i/(data.length-1));
  const y = v => T + ih - (v - 0.5)*slot;

  let s = "";
  for(let bi=0; bi<5; bi++){
    if(bi % 2 === 0)
      s += '<rect class="band" x="'+L+'" y="'+(T+ih-(bi+1)*slot*3)+'" width="'+iw+'" height="'+(slot*3)+'"/>';
    const cy = T + ih - (bi*3 + 1.5)*slot;
    s += '<text class="ylab" x="'+(L-14)+'" y="'+(cy+4)+'" text-anchor="end">'+BASES[bi]+'</text>';
    s += '<text class="ysub" x="'+(L-14)+'" y="'+(cy-slot+4)+'" text-anchor="end">+</text>';
    s += '<text class="ysub" x="'+(L-14)+'" y="'+(cy+slot+4)+'" text-anchor="end">−</text>';
  }
  s += '<line class="baseline" x1="'+L+'" y1="'+(T+ih)+'" x2="'+(L+iw)+'" y2="'+(T+ih)+'"/>';

  /* 単元の切れ目 */
  data.forEach((d,i)=>{
    if(i>0 && unitOf(d.no) !== unitOf(data[i-1].no)){
      const mx = (x(i)+x(i-1))/2;
      s += '<line class="sep" x1="'+mx+'" y1="'+T+'" x2="'+mx+'" y2="'+(T+ih)+'"/>';
    }
  });
  UNITS.forEach(u=>{
    const idx = data.map((d,i)=>({d,i})).filter(o=>unitOf(o.d.no)===u);
    if(!idx.length) return;
    const mid = (x(idx[0].i) + x(idx[idx.length-1].i)) / 2;
    s += '<text class="unitlab" x="'+mid+'" y="'+(T+11)+'" text-anchor="middle">'+u.name+'</text>';
  });

  s += '<polyline class="path" points="' + data.map((d,i)=>x(i)+","+y(d.v)).join(" ") + '"/>';
  data.forEach((d,i)=>{
    const isZ = base(d.v)==="Z";
    s += '<circle class="dot'+(isZ?" z":"")+'" cx="'+x(i)+'" cy="'+y(d.v)+'" r="'+(isZ?5.5:3.5)+'"/>';
    if(i % 2 === 0 || isZ)
      s += '<text class="xlab" x="'+x(i)+'" y="'+(T+ih+16)+'" text-anchor="middle">'+d.no+'</text>';
  });
  $("trend").innerHTML = s;
}

function refresh(){
  const n = LESSONS.filter(l => l.state==="todo" && !l.v).length;
  const t = $("todo");
  t.textContent = n ? "未入力 " + n : "未入力なし";
  t.classList.toggle("clear", n===0);
  renderUnits();
  drawTrend();
}
refresh();
</script>
