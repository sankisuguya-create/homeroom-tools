<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2328;--sub:#5f6670;--line:#d0d5dc;--accent:#1a73e8;--accent-ink:#fff;--err:#c62828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:48px 16px 64px}
h1{font-size:24px;font-weight:700;margin:0 0 8px}
.lead{color:var(--sub);margin:0 0 32px}
.step{background:var(--card);border-radius:16px;padding:24px;margin-bottom:24px}
.step.off{opacity:.4;pointer-events:none}
.no{display:inline-flex;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);align-items:center;justify-content:center;font-weight:700;margin-right:8px}
.ttl{display:flex;align-items:center;font-size:18px;font-weight:700;margin-bottom:16px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;height:56px;font-size:16px;padding:0 16px;border:2px solid var(--line);border-radius:12px;background:#fff}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.btn{height:56px;min-width:120px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:disabled{background:var(--line);cursor:default}
.btn.big{width:100%;height:64px;font-size:20px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--line);margin-top:16px;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{height:48px;padding:0;border:0;background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg input{width:3.5em;height:100%;border:0;background:transparent;color:inherit;font-size:16px;text-align:center}
.seg input::placeholder{color:inherit;opacity:.8}
.cnt{font-size:14px;color:var(--sub);margin:16px 0 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#msg{margin-top:8px;color:var(--sub);font-size:14px;min-height:24px}
#msg.err{color:var(--err)}
.sw{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:16px;cursor:pointer}
.sw button{width:56px;height:32px;border-radius:16px;border:0;background:var(--line);position:relative;cursor:pointer}
.sw button::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw button[aria-checked=true]{background:var(--accent)}
.sw button[aria-checked=true]::after{left:28px}
#pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:24px}
.pg{position:relative;background:#fff;border:2px solid var(--accent);border-radius:8px;padding:4px;font-size:12px;overflow:hidden;cursor:pointer;min-height:48px}
.pg::before{content:"✓";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;font-size:16px;line-height:24px;text-align:center;font-weight:700}
.pg.skip{border-color:var(--line)}
.pg.skip img{opacity:.3}
.pg.skip::before{content:"";background:#fff;border:2px solid var(--line)}
.pg.err::before{display:none}
.tag{display:inline-block;font-size:11px;padding:0 4px;border-radius:4px;background:var(--line);color:var(--ink);margin-left:4px}
.tools{display:flex;gap:8px;align-items:center;margin-top:16px}
.tools .cnt{flex:1;margin:0}
.sbtn{height:48px;min-width:112px;padding:0 12px;font-size:15px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer}
.hint{margin:8px 0 0;font-size:14px;color:var(--err);min-height:0}
.hist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.hist button{height:48px;max-width:100%;padding:0 16px;font-size:14px;border:1px solid var(--line);border-radius:24px;background:var(--card);color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg img{width:100%;display:block;border-radius:4px}
.pg .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 28px 2px 2px;min-height:28px}
.pg.err{color:var(--err);border-color:var(--err)}
#sheets{display:none}
.opt{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;margin-bottom:8px}
.opt .seg{margin-top:0}
.opt span{font-size:15px}
@media print{
  body{background:#fff}
  main{display:none}
  #sheets{display:block}
  .sheet{display:grid;gap:4mm;break-after:page;overflow:hidden}
  .sheet:last-child{break-after:auto}
  .cell{display:flex;flex-direction:column;min-width:0;min-height:0}
  .cell .nm{font-size:10pt;line-height:1.3}
  .cell img{flex:1;min-height:0;width:100%;object-fit:contain}
  body:not(.shownm) .cell .nm{display:none}
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16181c;--card:#22252b;--ink:#e8eaed;--sub:#a0a6ae;--line:#3a3f47}}
</style></head><body class="shownm">
<main>
  <h1>スライドまとめ印刷</h1>
  <p class="lead">Classroomで集めたスライドを、全員分まとめて印刷します。</p>

  <section class="step" id="s1">
    <div class="ttl"><span class="no">1</span>課題フォルダのURLを貼る</div>
    <div class="row">
      <input id="url" type="text" placeholder="フォルダのURL（またはID）" data-flow="1" autocomplete="off">
      <button class="btn" id="go" data-flow="2">読み込む</button>
    </div>
    <div class="hist" id="hist"></div>
    <div class="seg" id="which" role="group" aria-label="印刷するスライド">
      <button data-v="1" aria-pressed="true">1枚目</button>
      <button data-v="2" aria-pressed="false">2枚目</button>
      <button data-v="all" aria-pressed="false">すべて</button>
      <button data-v="n" aria-pressed="false"><input id="nth" type="number" min="1" inputmode="numeric" placeholder="◯">枚目</button>
    </div>
    <div class="bar" hidden id="bar"><i></i></div>
    <div id="msg"></div>
  </section>

  <section class="step off" id="s2">
    <div class="ttl"><span class="no">2</span>印刷する</div>
    <div class="opt"><span>用紙</span><div class="seg" id="paper" data-k="paper">
      <button data-v="A4">A4</button><button data-v="B5">B5</button><button data-v="A3">A3</button><button data-v="B4">B4</button></div></div>
    <div class="opt"><span>1ページに</span><div class="seg" id="per" data-k="per">
      <button data-v="1">1枚</button><button data-v="2">2枚</button><button data-v="4">4枚</button><button data-v="6">6枚</button></div></div>
    <div class="opt"><span>余白</span><div class="seg" id="mar" data-k="mar" style="grid-template-columns:repeat(3,1fr)">
      <button data-v="5">せまい</button><button data-v="12">ふつう</button><button data-v="30">広い</button></div></div>
    <label class="sw" for="nm">名前も印刷する<button id="nm" role="switch" aria-checked="true"></button></label>
    <button class="btn big" id="pr" data-flow="3">印刷</button>
    <p class="hint" id="hint"></p>
    <div class="tools"><p class="cnt" id="cnt"></p>
      <button class="sbtn" id="allOn">全部入れる</button><button class="sbtn" id="allOff">全部外す</button></div>
    <div id="pages"></div>
  </section>
</main>
<div id="sheets"></div>
<style id="pagecss"></style>
<script>
var $=function(id){return document.getElementById(id)};
function run(fn){var a=[].slice.call(arguments,1);return new Promise(function(ok,ng){var r=google.script.run;if(typeof r[fn]!=='function')return ng(new Error('サーバーに「'+fn+'」がありません。Code.gs を貼り直してください'));var h=r.withSuccessHandler(ok).withFailureHandler(ng);h[fn].apply(h,a)})}
function msg(t,err){$('msg').textContent=t;$('msg').className=err?'err':''}
$('nm').onclick=function(e){e.preventDefault();var on=this.getAttribute('aria-checked')!=='true';this.setAttribute('aria-checked',on);document.body.classList.toggle('shownm',on)};
var opt={paper:'A4',per:'1',mar:'12'};
try{Object.assign(opt,JSON.parse(localStorage.getItem('slidePrintOpt')||'{}'))}catch(e){}
['paper','per','mar'].forEach(function(k){
  var g=$(k);
  function show(){[].forEach.call(g.children,function(b){b.setAttribute('aria-pressed',b.dataset.v===opt[k])})}
  [].forEach.call(g.children,function(b){b.onclick=function(){opt[k]=b.dataset.v;show();try{localStorage.setItem('slidePrintOpt',JSON.stringify(opt))}catch(e){}}});
  show();
});
function paperHint(){$('hint').textContent=opt.paper==='A4'?'':'印刷画面の「用紙サイズ」も '+opt.paper+' にしてください（A4のままだと縮んで印刷されます）'}
[].forEach.call($('paper').children,function(b){b.addEventListener('click',paperHint)});paperHint();
var PAPER={A4:[210,297],B5:[182,257],A3:[297,420],B4:[257,364]};
// 縦長スライド(p)と横長(l)で、用紙の向きと並べ方を決める。[用紙を横にするか, 列, 行]
var GRID={p:{1:[0,1,1],2:[1,2,1],4:[0,2,2],6:[1,3,2]},l:{1:[1,1,1],2:[0,1,2],4:[1,2,2],6:[0,2,3]}};
function buildSheets(){
  var per=+opt.per,m=+opt.mar,pp=PAPER[opt.paper],box=$('sheets');box.innerHTML='';
  var items=[].filter.call($('pages').querySelectorAll('.pg'),function(d){return !d.classList.contains('skip')&&!d.classList.contains('err')});
  var sheet=null,ori=null,cnt=0;
  items.forEach(function(d){
    var o=d.classList.contains('l')?'l':'p';
    if(!sheet||o!==ori||cnt===per){
      ori=o;cnt=0;var g=GRID[o][per],land=g[0];
      var w=(land?pp[1]:pp[0])-2*m,h=(land?pp[0]:pp[1])-2*m-1;
      sheet=document.createElement('div');sheet.className='sheet';
      sheet.style.cssText='page:'+(land?'L':'P')+';width:'+w+'mm;height:'+h+'mm;grid-template-columns:repeat('+g[1]+',1fr);grid-template-rows:repeat('+g[2]+',1fr)';
      box.appendChild(sheet);
    }
    var c=document.createElement('div');c.className='cell';
    c.innerHTML='<div class="nm"></div>';c.firstChild.textContent=d.dataset.label;
    c.appendChild(d.querySelector('img').cloneNode());sheet.appendChild(c);cnt++;
  });
  $('pagecss').textContent='@page L{size:'+pp[1]+'mm '+pp[0]+'mm;margin:'+m+'mm}@page P{size:'+pp[0]+'mm '+pp[1]+'mm;margin:'+m+'mm}';
}
var loadedAt=0;
$('pr').onclick=function(){
  if(Date.now()-loadedAt>20*60*1000){msg('読み込みから時間がたったので、読み直しています。終わったらもう一度「印刷」を押してください。');reloadKeepSkip();return;}
  buildSheets();setTimeout(function(){window.print()},50)};
function reloadKeepSkip(){var off={};[].forEach.call($('pages').querySelectorAll('.pg.skip'),function(d){off[d.dataset.key]=1});load(off)}
window.addEventListener('beforeprint',buildSheets);
$('url').addEventListener('paste',function(){setTimeout(load,0)});
$('url').addEventListener('keydown',function(e){if(e.key==='Enter')load()});
$('go').onclick=load;
var which=1;
function setWhich(btn){
  [].forEach.call($('which').children,function(b){b.setAttribute('aria-pressed',b===btn)});
  var v=btn.dataset.v;
  if(v==='n'){var n=parseInt($('nth').value,10);if(!(n>=1)){$('nth').focus();return;}which=n;}
  else which=v==='all'?'all':+v;
  if($('url').value.trim())load();
}
[].forEach.call($('which').children,function(b){b.onclick=function(e){if(e.target.id!=='nth'||this.getAttribute('aria-pressed')!=='true')setWhich(this)}});
$('nth').addEventListener('change',function(){setWhich(this.parentNode)});
$('nth').addEventListener('keydown',function(e){if(e.key==='Enter')setWhich(this.parentNode)});
$('allOn').onclick=function(){setAll(false)};$('allOff').onclick=function(){setAll(true)};
function setAll(skip){[].forEach.call($('pages').querySelectorAll('.pg:not(.err)'),function(d){d.classList.toggle('skip',skip)});count()}
$('pages').onclick=function(e){var d=e.target.closest('.pg');if(!d||d.classList.contains('err'))return;d.classList.toggle('skip');count()};
function count(){var on=$('pages').querySelectorAll('.pg:not(.skip):not(.err)').length;$('cnt').textContent='印刷 '+on+'枚（画像を押して選ぶ）';$('pr').disabled=on===0}
var busy=false;
function getHist(){try{return JSON.parse(localStorage.getItem('slidePrintHist')||'[]')}catch(e){return []}}
function saveHist(url,name){var h=getHist().filter(function(x){return x.name!==name});h.unshift({url:url,name:name});h=h.slice(0,3);try{localStorage.setItem('slidePrintHist',JSON.stringify(h))}catch(e){}showHist()}
function showHist(){var box=$('hist');box.innerHTML='';getHist().forEach(function(x){var b=document.createElement('button');b.textContent=x.name;b.title=x.url;b.onclick=function(){$('url').value=x.url;load()};box.appendChild(b)})}
showHist();
function tag(d,t){var s=document.createElement('span');s.className='tag';s.textContent=t;d.firstChild.appendChild(s)}
function card(label){var d=document.createElement('div');d.className='pg';d.innerHTML='<div class="nm"></div>';d.firstChild.textContent=label;d.dataset.label=label;$('pages').appendChild(d);return d}
async function load(keepOff){
  if(!keepOff||keepOff.type)keepOff=null;
  if(busy||!$('url').value.trim())return;
  busy=true;$('go').disabled=true;$('s2').classList.add('off');$('pages').innerHTML='';
  var bar=$('bar'),fill=bar.firstChild;bar.hidden=false;fill.style.width='0';
  try{
    msg('フォルダを確認しています…');
    var r=await run('apiListFiles',$('url').value);
    if(!r.files.length)throw new Error('このフォルダにスライドがありません');
    var firstErr='',ng=0,loads=[],n=r.files.length,t0=Date.now(),size=which==='all'?'MEDIUM':'LARGE';
    for(var i=0;i<n;i++){
      var f=r.files[i];
      var eta=i>=2?Math.ceil((Date.now()-t0)/i*(n-i)/1000):0;
      msg('読み込み中 '+(i+1)+' / '+n+(eta>=20?'（あと約'+(eta>=60?Math.round(eta/60)+'分':eta+'秒')+'）':''));
      try{
        var r2=await run('apiThumbs',f.id,which,size);
        if(!r2.items.length)throw new Error(which+'枚目がありません（全'+r2.total+'枚）');
        r2.items.forEach(function(t){
          var d=card(f.label+(which==='all'?' '+t.no+'/'+r2.total:''));
          d.dataset.key=f.id+':'+t.no;
          if(f.template){d.classList.add('skip');tag(d,'元ファイル？')}else if(f.mine)tag(d,'提出済');
          if(keepOff)d.classList.toggle('skip',!!keepOff[d.dataset.key]);
          d.classList.add(t.w>=t.h?'l':'p');
          var img=new Image();img.alt='';img.src=t.url;d.appendChild(img);
          loads.push(new Promise(function(ok){img.onload=img.onerror=ok}));
        });
      }catch(e){ng++;var em=String(e&&e.message||e);if(!firstErr)firstErr=em;var d=card(f.label);d.classList.add('err');d.appendChild(document.createTextNode(em.indexOf('枚目')>=0?em:'読み込めません：'+em));}
      fill.style.width=((i+1)/n*100)+'%';
    }
    await Promise.all(loads);
    loadedAt=Date.now();saveHist($('url').value.trim(),r.folder);
    var people=r.files.filter(function(f){return !f.template}).length;
    msg(r.folder+'：'+people+'人分'+(ng?'（赤枠の'+ng+'件は読み込めず、印刷されません）':'')+(keepOff?'。もう一度「印刷」を押してください':'')+(firstErr&&firstErr.indexOf('枚目')<0?' ／ 原因：'+firstErr:''),ng>0);
    $('s2').classList.remove('off');count();$('pr').focus();
  }catch(e){msg(e.message.indexOf('URL')>=0||e.message.indexOf('スライド')>=0?e.message:'読み込めませんでした。URLを確かめてください（'+e.message+'）',true);bar.hidden=true}
  busy=false;$('go').disabled=false;
}
</script></body></html>
