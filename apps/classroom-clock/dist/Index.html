<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教室の時計</title>
<style>
/* ▼ src/view.css から。直すのは src のほう ▼ */
/* モニターに映す面。操作の部品は置かない。
   ui-layout の S（4pxの刻み）の注意は、この面が cq 単位で縮むために出る。画面の大きさに比例させるのが目的なので残す。
   寸法は cq 単位（この面自身の大きさに対する割合）で書く：
   手元の小さな見本でも、モニターの全画面でも、同じ見た目で縮む。 */
.cv{
  --bg:#FFFFFF;--ink:#1A1A1A;--sub:#4A525B;--line:#C9CED4;
  --fill:#A9CBEE;--edge:#0F5EA8;        /* 残り時間の面（ふつう） */
  --wfill:#F7C873;--wedge:#C86A00;--wtext:#A85800;  /* 残り1分 */
  --alert:#C0330A;                      /* おわり */
  position:relative;width:100%;height:100%;container-type:size;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","IPAexGothic","IPAGothic",sans-serif;
  font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;
}
.cv[data-theme=dark]{
  --bg:#101418;--ink:#F2F4F6;--sub:#A0A9B4;--line:#3A424B;
  --fill:#1D5A96;--edge:#7DB8F5;--wfill:#7A5210;--wedge:#F2A93B;--wtext:#F2A93B;--alert:#FF9A7A;
}
.cv *{box-sizing:border-box}
.cv-in{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);padding:3cqmin 4cqmin}
.cv-top{display:flex;justify-content:space-between;align-items:baseline;font-size:5.5cqmin;font-weight:700;color:var(--sub);line-height:1.2;min-height:1.2em}
.cv-main{display:grid;grid-template-columns:minmax(0,1fr);place-items:center;min-height:0;gap:2cqh 4cqw}
.cv-analog{display:none;height:100%;max-width:100%;aspect-ratio:1;min-height:0}
.cv-read{display:flex;flex-direction:column;align-items:center;gap:2.5cqh;min-width:0;max-width:100%}
.cv-label{font-size:8cqmin;font-weight:700;line-height:1.2}
.cv-label:empty,.cv-sub:empty{display:none}
.cv-big{font-size:min(23cqw,52cqh);font-weight:700;line-height:1;white-space:nowrap;letter-spacing:-.01em}
.cv-b2{font-size:.42em;color:var(--sub);margin-left:.08em}
.cv-bar{display:none;position:relative;width:88cqw;height:26cqh;border-radius:2cqh;background:var(--line);overflow:hidden;border:.5cqmin solid var(--ink)}
.cv-bar i{display:block;height:100%;background:var(--edge)}
.cv-bar b{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100% / var(--n) - .35cqw),var(--bg) calc(100% / var(--n) - .35cqw) calc(100% / var(--n)))}
/* 横棒：残りを長さで見せる。数字は棒の上に小さく */
.cv[data-face=bar][data-bar="1"] .cv-bar{display:block}
.cv[data-face=bar][data-bar="1"] .cv-big{font-size:min(15cqw,30cqh)}
.cv-sub{font-size:7cqmin;font-weight:700;line-height:1.25;text-align:center}
.cv-laps{list-style:none;margin:0;padding:0;font-size:5.5cqmin;font-weight:700;color:var(--sub);display:flex;flex-wrap:wrap;justify-content:center;gap:1cqh 4cqw}
.cv-laps:empty{display:none}
/* 数字の枠。幅は 0〜9 で最も広い字に合わせる（字形は中央寄せ） */
.cv i{font-style:normal}
.cv-d{display:inline-block;width:.64em;text-align:center}
.cv-p{display:inline-block;width:.34em;text-align:center}

/* アナログ：時計を左、読み取りを右。時計だけのときは時計を中央に置き、下に1行。 */
.cv[data-face=analog] .cv-analog{display:block}
.cv[data-face=analog] .cv-main{grid-template-columns:minmax(0,auto) minmax(34cqw,1fr)}
.cv[data-face=analog] .cv-analog{max-width:58cqw}
.cv[data-face=analog] .cv-big{font-size:min(10cqw,30cqh)}
.cv[data-face=analog] .cv-sub{font-size:6cqmin;white-space:nowrap}
.cv[data-face=analog][data-mode=clock] .cv-main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.cv[data-face=analog][data-mode=clock] .cv-big{display:none}
.cv[data-mode=clock] .cv-now{display:none}
.cv[data-face=analog] .cv-now{display:none}

/* 残り1分・おわり：色に加えて、言葉（もうすぐ おわり／おわり）と面の大きさで伝える。 */
.cv[data-phase=warn] .cv-big,.cv[data-phase=warn] .cv-label{color:var(--wtext)}
.cv[data-phase=warn] .cv-bar i{background:var(--wedge)}
.cv[data-phase=over] .cv-big,.cv[data-phase=over] .cv-label{color:var(--alert)}

.cv-face{fill:var(--bg);stroke:var(--ink);stroke-width:2.5}
.cv-tick{stroke:var(--sub);stroke-width:1.2}
.cv-tick5{stroke:var(--ink);stroke-width:2.2}
.cv-num{fill:var(--ink);font-size:17px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.cv-sector{fill:var(--fill)}
.cv-goal{stroke:var(--edge);stroke-width:3;stroke-linecap:round}
.cv-tri{fill:var(--alert)}
.cv[data-phase=warn] .cv-sector{fill:var(--wfill)}
.cv[data-phase=warn] .cv-goal{stroke:var(--wedge)}
.cv-hh{stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.cv-mh{stroke:var(--ink);stroke-width:3.6;stroke-linecap:round}
.cv-sh{stroke:var(--alert);stroke-width:1.2;stroke-linecap:round}
.cv-pin{fill:var(--ink)}

/* 合図は音と同時に画面でも出す（消音・聞こえにくい児童への保険）。点滅は1秒に1回（3Hz未満）。 */
.cv.flash::after{content:"";position:absolute;inset:0;border:3.5cqmin solid var(--alert);pointer-events:none;animation:cvflash 1s steps(2,jump-none) infinite}
@keyframes cvflash{from{opacity:1}to{opacity:0}}
.cv-banner{position:absolute;left:50%;top:4cqh;transform:translateX(-50%);max-width:92cqw;padding:2cqh 5cqw;border-radius:3cqh;
  background:var(--ink);color:var(--bg);font-size:9cqmin;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-banner:empty{display:none}
.cv-hint{position:absolute;left:50%;bottom:2cqh;transform:translateX(-50%);padding:1cqh 3cqw;border-radius:2cqh;
  background:var(--ink);color:var(--bg);font-size:4cqmin;font-weight:700;white-space:nowrap;opacity:.9}
.cv-hint:empty{display:none}
/* ▲ src/view.css ここまで ▲ */

/* ---- 操作画面（教師の手元のPCだけに出す） ---- */
:root{
  --paper:#F7F6F2;--tint:#D7E8F8;--sheet:#FFFFFF;--ink:#1A1A1A;--sub:#616870;--rule:#D5DAE0;
  --accent:#0F5EA8;--on:#FFFFFF;--alert:#C0330A;
  --s1:4px;--s2:8px;--s3:16px;--s4:24px;
  --font:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","IPAexGothic","IPAGothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:var(--s3);height:100%;padding:var(--s3)}
.stage{display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--s2);min-height:0}
.stage-head{display:flex;align-items:center;gap:var(--s2);color:var(--sub);font-size:13px;font-weight:700;min-height:24px}
.stage-head .dot{width:10px;height:10px;border-radius:50%;background:var(--sub)}
.stage-head.live{color:var(--accent)} .stage-head.live .dot{background:var(--accent)}
.preview{min-height:0;display:grid;place-items:center}
.pv-box{cursor:pointer;width:100%;max-height:100%;aspect-ratio:16/9;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.panel{display:flex;flex-direction:column;gap:var(--s3);overflow:auto;min-height:0;padding-right:var(--s1)}
.card{background:var(--sheet);border:2px solid var(--rule);border-radius:14px;padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.card h2{margin:0;font-size:13px;color:var(--sub)}
button,select,input{font:inherit;color:inherit}
.btn{height:48px;padding:0 var(--s2);border:2px solid var(--rule);border-radius:12px;background:var(--sheet);font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);color:var(--on);border-color:var(--accent)}
.btn.danger{color:var(--alert)}
/* 1回だけ押す操作なので強い塗りにしない（強い塗りは授業中にくり返す主操作に1つだけ） */
#goMonitor{color:var(--accent);border-color:var(--accent)}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--s2)}
/* 選んでいる側は淡い塗り＋青枠＋✓（強い塗りは主操作だけに使う。design/ui-patterns の型） */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:var(--s2)}
.seg button{height:48px;padding:0 2px;min-width:0;font-size:14px;white-space:nowrap;border:2px solid var(--rule);border-radius:12px;background:var(--sheet);font-weight:700;cursor:pointer}
.seg button[aria-checked=true]{background:var(--tint);border-color:var(--accent)}
.seg button[aria-checked=true]::before{content:"✓ "}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.sw{display:flex;align-items:center;gap:var(--s3);min-height:48px;padding:0;border:0;background:none;cursor:pointer;width:100%;text-align:left;font-weight:700}
.sw .lab{flex:1}
.sw .st{font-size:13px;color:var(--sub);width:16px}
.sw[aria-checked=true] .st::after{content:"入"}
.sw[aria-checked=false] .st::after{content:"切"}
.sw::after{content:"";flex:0 0 44px;height:26px;border-radius:13px;background:var(--rule);
  background-image:radial-gradient(circle at 13px 50%,#fff 9px,transparent 10px)}
.sw[aria-checked=true]::after{background-color:var(--accent);background-image:radial-gradient(circle at 31px 50%,#fff 9px,transparent 10px)}
.field{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:var(--s2);min-height:48px;font-weight:700}
.field select,.field input[type=range]{height:48px;width:100%}
.field select{border:1px solid var(--rule);border-radius:8px;background:var(--sheet);padding:0 var(--s2)}
.fold{display:flex;flex-direction:column;gap:var(--s2)}
details.card>summary{cursor:pointer;font-weight:700;min-height:48px;display:flex;align-items:center;list-style:none}
details.card>summary::before{content:"▶";font-size:11px;margin-right:var(--s2);color:var(--sub)}
details.card[open]>summary::before{content:"▼"}
.note{font-size:13px;color:var(--sub);margin:0}
.warn{font-size:13px;color:var(--alert);margin:0;font-weight:700}
textarea{font:14px/1.6 var(--font);width:100%;min-height:200px;border:1px solid var(--rule);border-radius:8px;padding:var(--s2)}
.alarm{display:grid;grid-template-columns:120px minmax(0,1fr) 48px;gap:var(--s2);align-items:center}
.alarm input{height:48px;border:1px solid var(--rule);border-radius:8px;padding:0 var(--s2);min-width:0}
.alarm .x{width:48px}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}.pv-box{max-height:none}}
</style>

<div class="app">
  <section class="stage">
    <div class="stage-head" id="stageHead"><span class="dot"></span><span id="stageText">見本（モニター未出力）　画面クリック・スペースキーでスタート／一時停止</span></div>
    <div class="preview"><div class="pv-box" id="pv"></div></div>
  </section>

  <section class="panel">
    <div class="card">
      <button class="btn" id="goMonitor" data-flow="1">モニターに出す</button>
      <p class="note" id="monNote">モニターを「拡張」でつなぐと、操作の画面は手元だけに残り、モニターには時計だけが出ます。</p>
    </div>

    <div class="card">
      <div class="seg" role="radiogroup" id="segMode" data-flow="2">
        <button role="radio" data-v="clock">時計</button>
        <button role="radio" data-v="timer">タイマー</button>
        <button role="radio" data-v="sw">ストップウォッチ</button>
      </div>
      <div class="seg" role="radiogroup" id="segFace">
        <button role="radio" data-v="digital">デジタル</button>
        <button role="radio" data-v="analog">アナログ</button>
        <button role="radio" data-v="bar">横棒</button>
      </div>
    </div>

    <div class="card" id="ctlTimer" hidden>
      <h2>時間を選ぶ</h2>
      <div class="grid4" id="presets"></div>
      <div class="row">
        <button class="btn" id="tMinus">−1分</button>
        <button class="btn" id="tPlus">＋1分</button>
      </div>
      <div class="row">
        <button class="btn main" id="tToggle" data-flow="3">スタート</button>
        <button class="btn" id="tReset">リセット</button>
      </div>
    </div>

    <div class="card" id="ctlSw" hidden>
      <div class="row">
        <button class="btn main" id="sToggle">スタート</button>
        <button class="btn" id="sLap">ラップ</button>
        <button class="btn" id="sReset">リセット</button>
      </div>
    </div>

    <div class="card">
      <button class="sw" role="switch" id="swDark">ダークモード</button>
    </div>

    <div class="card" id="ctlClock" hidden>
      <button class="sw" role="switch" id="swSched">時間割と連動</button>
      <p class="note" id="schedNote"></p>
    </div>

    <details class="card" id="dSound">
      <summary data-group="fold-dSound">音・音声</summary>
      <div class="fold">
      <div class="field">音量<input type="range" id="vol" min="0" max="1" step="0.05"></div>
      <div class="field">終了音<select id="endTune">
        <option value="alarm">電子音（ピピピピッ）</option><option value="bell">ベル</option>
        <option value="marimba">マリンバ</option><option value="school">チャイム（学校）</option><option value="none">なし</option></select></div>
      <button class="sw" role="switch" id="swWarn">残り1分で予告音</button>
      <button class="sw" role="switch" id="swTick">残り10秒のカウント音</button>
      <button class="sw" role="switch" id="swVoice">音声で読み上げる</button>
      <p class="note" id="voiceNote" hidden>この端末には日本語の音声がないため、読み上げは行われません。</p>
      <button class="sw" role="switch" id="swFlash">鳴るときに画面の枠を点滅</button>
      <button class="btn" id="testSound">試聴</button>
      </div>
    </details>

    <details class="card" id="dAlarm">
      <summary data-group="fold-dAlarm">アラーム</summary>
      <div class="fold">
      <div id="alarms"></div>
      <button class="btn" id="addAlarm">アラームを追加</button>
      <p class="note">指定時刻にメッセージを表示し、読み上げます（例：10:25 片付け）。終了音は「音・音声」の設定に従います。</p>
      </div>
    </details>

    <details class="card" id="dSched">
      <summary data-group="fold-dSched">時間割（日課）</summary>
      <div class="fold">
      <div class="field">日課表<select id="pattern"></select></div>
      <textarea id="schedText" spellcheck="false"></textarea>
      <p class="note">1行に1件「名前 開始-終了」。例：1時間目 8:45-9:30</p>
      <p class="warn" id="schedErr" hidden></p>
      <button class="sw" role="switch" id="swChime">開始・終了時にチャイム</button>
      </div>
    </details>

  </section>
</div>

<script>
/* ▼ src/core.js から。直すのは src のほう ▼ */
/* 時間の計算の正本。画面にも音にも触れない（node のテストからそのまま読む）。
   決まり：残り時間・経過時間は「数えた回数」ではなく時刻の差から出す。
   タブが裏に回って処理が間引かれても、読み込み直しても、ずれない。 */
var ClockCore = (function () {
  'use strict';
  var SEC = 1000, MIN = 60000, HOUR = 3600000;
  var TIMER_MAX = 180 * MIN;
  var LATE_LIMIT = 5 * SEC;   // これより遅れて気づいた合図は鳴らさない（スリープ明けに古い合図をまとめて鳴らさない）

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hm2min(hm) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(hm || '');
    if (!m) return null;
    var h = +m[1], mi = +m[2];
    return (h > 23 || mi > 59) ? null : h * 60 + mi;
  }
  function dayStart(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function atHm(ts, hm) { var m = hm2min(hm); return m === null ? null : dayStart(ts) + m * MIN; }

  function fmtClock(ts) { var d = new Date(ts); return { h: String(d.getHours()), m: pad(d.getMinutes()), s: pad(d.getSeconds()) }; }
  function fmtDate(ts) { var d = new Date(ts); return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + '日月火水木金土'.charAt(d.getDay()) + '）'; }
  function fmtHmJa(ts) { var d = new Date(ts); return d.getHours() + '時' + (d.getMinutes() ? d.getMinutes() + '分' : ''); }
  /* 残りは切り上げる：0:00 が出るのは終わった瞬間だけ（「0:00 なのにまだ鳴らない」1秒を作らない） */
  function fmtRemain(ms) { var s = Math.max(0, Math.ceil(ms / SEC)); return Math.floor(s / 60) + ':' + pad(s % 60); }
  function fmtOver(ms) { var s = Math.max(0, Math.floor(ms / SEC)); return '+' + Math.floor(s / 60) + ':' + pad(s % 60); }
  function fmtSw(ms) { var t = Math.floor(Math.max(0, ms) / 100), s = Math.floor(t / 10); return { main: Math.floor(s / 60) + ':' + pad(s % 60), tenth: '.' + (t % 10) }; }
  function ceilMin(ms) { return Math.max(1, Math.ceil(ms / MIN)); }

  /* ---- タイマー ---- { dur, left, running, endAt, started }
     不変条件：running のとき残りは endAt - now、止まっているとき残りは left。 */
  function newTimer(dur) { return { dur: dur, left: dur, running: false, endAt: 0, started: false }; }
  function timerLeft(t, now) { return t.running ? t.endAt - now : t.left; }
  function timerStart(t, now) {
    if (t.running) return;
    if (t.left <= 0) t.left = t.dur;          // 終わったあとのスタートは同じ長さでもう一度
    t.running = true; t.started = true; t.endAt = now + t.left;
  }
  function timerPause(t, now) { if (!t.running) return; t.left = t.endAt - now; t.running = false; }
  function timerReset(t) { t.running = false; t.started = false; t.left = t.dur; t.endAt = 0; }
  /* 時間を選ぶだけで、始めない（スタートは別の操作） */
  function timerPreset(t, dur) { t.dur = dur; t.left = dur; t.running = false; t.started = false; t.endAt = 0; }
  function timerAdd(t, ms, now) {
    var left = timerLeft(t, now);
    var next = left <= 0 ? (ms > 0 ? ms : 0) : left + ms;   // 終わったあとの＋は「今から」延ばす
    if (next < MIN && ms < 0) next = left > 0 ? Math.min(left, MIN) : left;  // −は1分より下へ行かない
    if (next > TIMER_MAX) next = TIMER_MAX;
    if (t.running) t.endAt = now + next; else { t.left = next; if (!t.started && next > 0) t.dur = next; }
  }

  /* ---- ストップウォッチ ---- { running, startAt, acc, laps[] } */
  function newSw() { return { running: false, startAt: 0, acc: 0, laps: [] }; }
  function swElapsed(w, now) { return w.acc + (w.running ? now - w.startAt : 0); }
  function swStart(w, now) { if (!w.running) { w.running = true; w.startAt = now; } }
  function swStop(w, now) { if (w.running) { w.acc = swElapsed(w, now); w.running = false; } }
  function swLap(w, now) { var e = swElapsed(w, now); if (e > 0) w.laps.push(e); }
  function swReset(w) { w.running = false; w.acc = 0; w.startAt = 0; w.laps = []; }

  /* ---- 時間割 ---- rows: [{name, s:'08:45', e:'09:30'}]
     今が授業中なら {kind:'in'}、次の授業まで60分以内なら {kind:'before'}、どちらでもなければ null。
     60分で切るのは、アナログ盤の扇形（長針1周）で表せる範囲に合わせるため。 */
  function schedNow(rows, now) {
    var next = null;
    for (var i = 0; i < rows.length; i++) {
      var s = atHm(now, rows[i].s), e = atHm(now, rows[i].e);

        target = sd.screens.filter(function (s) { return s !== sd.currentScreen; })[0] || null;
        if (target) feat = 'popup,left=' + target.availLeft + ',top=' + target.availTop + ',width=' + target.availWidth + ',height=' + target.availHeight;
      }
    } catch (e) {}
    var w = window.open('', 'classroom-clock-monitor', feat);
    if (!w) { $('monNote').textContent = 'ポップアップが止められました。アドレスバー右の印から「常に許可」を選んで、もう一度押してください。'; return; }
    var d = w.document;
    d.open();
    d.write('<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>教室の時計（モニター）</title><style>html,body{margin:0;height:100%;overflow:hidden;cursor:none}'
      + document.querySelector('style').textContent.split('/* ---- 操作画面')[0] + '</style></head><body><div id="m" style="width:100vw;height:100vh"></div></body></html>');
    d.close();
    mon = { win: w, view: ClockView.create(d, d.getElementById('m')), full: false };
    d.addEventListener('click', function () {
      S.unlock();
      if (d.fullscreenElement) { toggle(); return; }
      var el = d.documentElement;
      var p = target ? el.requestFullscreen({ screen: target }) : el.requestFullscreen();
      if (p && p.then) p.then(function () { mon.full = true; }, function () {});
    });
    w.addEventListener('keydown', function (e) { if (e.key === 'Escape') mon.full = false; });
    syncUi();
  }

  /* 画面が暗くならないように（モニター表示中だけ） */
  var lock = null;
  async function keepAwake(on) {
    try {
      if (on && !lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', function () { lock = null; }); }
      if (!on && lock) { lock.release(); lock = null; }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && mon) keepAwake(true); });

  /* ---- 操作 ---- */
  function seg(id, get, set) {
    var box = $(id);
    box.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; set(b.dataset.v); changed(); });
    return function () { box.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-checked', String(b.dataset.v === get())); }); };
  }
  function sw(id, get, set) {
    var b = $(id), lab = document.createElement('span'), st = document.createElement('span');
    lab.className = 'lab'; st.className = 'st'; lab.textContent = b.textContent; b.textContent = ''; b.append(lab, st);
    b.addEventListener('click', function () { set(!get()); changed(); });
    return function () { b.setAttribute('aria-checked', String(!!get())); };
  }
  var syncs = [
    seg('segMode', function () { return state.mode; }, function (v) { state.mode = v; }),
    seg('segFace', function () { return state.face; }, function (v) { state.face = v; }),
    sw('swDark', function () { return state.theme === 'dark'; }, function (v) { state.theme = v ? 'dark' : 'light'; }),
    sw('swSched', function () { return state.sched.on; }, function (v) { state.sched.on = v; }),
    sw('swChime', function () { return state.sched.chime; }, function (v) { state.sched.chime = v; if (v) state.sched.on = true; }),
    sw('swWarn', function () { return state.sound.warn; }, function (v) { state.sound.warn = v; }),
    sw('swTick', function () { return state.sound.tick; }, function (v) { state.sound.tick = v; }),
    sw('swVoice', function () { return state.sound.voice; }, function (v) { state.sound.voice = v; }),
    sw('swFlash', function () { return state.sound.flash; }, function (v) { state.sound.flash = v; })
  ];
  function changed() { S.unlock(); save(); syncUi(); tick(); }

  PRESETS.forEach(function (m) {
    var b = document.createElement('button'); b.className = 'btn'; b.textContent = m + '分';
    b.onclick = function () { C.timerPreset(state.timer, m * C.MIN); changed(); };
    $('presets').appendChild(b);
  });
  $('tToggle').onclick = function () { toggle(); };
  function toggleTimer() { var t = state.timer, n = Date.now(); if (C.timerLeft(t, n) <= 0 && t.running) { C.timerReset(t); fx.flashUntil = 0; fx.banner = null; } else if (t.running) C.timerPause(t, n); else C.timerStart(t, n); prev = n; changed(); }
  $('tReset').onclick = function () { C.timerReset(state.timer); fx.flashUntil = 0; fx.banner = null; changed(); };
  $('tPlus').onclick = function () { C.timerAdd(state.timer, C.MIN, Date.now()); changed(); };
  $('tMinus').onclick = function () { C.timerAdd(state.timer, -C.MIN, Date.now()); changed(); };
  $('sToggle').onclick = function () { toggle(); };
  /* スタート／一時停止。ボタン・見本やモニターの画面のクリック・スペースキーの3つから同じ動き */
  function toggle() {
    if (S.ringing()) { S.stop(); fx.flashUntil = 0; fx.banner = null; if (state.mode !== 'timer' || C.timerLeft(state.timer, Date.now()) > 0) { changed(); return; } }
    if (state.mode === 'timer') toggleTimer();
    else if (state.mode === 'sw') { var w = state.sw, n = Date.now(); if (w.running) C.swStop(w, n); else C.swStart(w, n); changed(); }
    else changed();
  }
  $('pv').addEventListener('click', toggle);
  document.addEventListener('keydown', function (e) {
    if (e.code !== 'Space' || /INPUT|TEXTAREA|SELECT|BUTTON|SUMMARY/.test(e.target.tagName)) return;
    e.preventDefault(); toggle();
  });
  /* 操作ボタンを押したら、鳴っている終了音・アラームは止める */
  document.querySelector('.panel').addEventListener('click', function (e) { if (e.target.closest('button') && e.target.id !== 'testSound') S.stop(); }, true);
  $('sLap').onclick = function () { C.swLap(state.sw, Date.now()); changed(); };
  $('sReset').onclick = function () { C.swReset(state.sw); changed(); };
  $('goMonitor').onclick = function () { openMonitor(); };

  $('vol').oninput = function () { state.sound.vol = +this.value; S.setVol(state.sound.vol); save(); };
  $('endTune').onchange = function () { state.sound.endTune = this.value; changed(); S.stop(); S.play(this.value); setTimeout(S.stop, 3000); };
  $('testSound').onclick = function () { S.stop(); S.unlock(); var ms = S.play(state.sound.endTune); if (state.sound.voice) S.speak('時間です', ms); setTimeout(S.stop, 4000); };

  /* アラーム */
  function drawAlarms() {
    var box = $('alarms'); box.textContent = '';
    state.alarms.forEach(function (a, i) {
      var row = document.createElement('div'); row.className = 'alarm';
      var t = document.createElement('input'); t.type = 'time'; t.value = a.hm; t.setAttribute('aria-label', '時刻'); t.dataset.group = 'atime';
      var l = document.createElement('input'); l.type = 'text'; l.value = a.label; l.placeholder = '片付け'; l.setAttribute('aria-label', 'メッセージ'); l.dataset.group = 'alabel';
      var x = document.createElement('button'); x.className = 'btn x danger'; x.textContent = '×'; x.setAttribute('aria-label', 'このアラームを消す');
      t.onchange = function () { a.hm = t.value; save(); };
      l.oninput = function () { a.label = l.value; save(); };
      x.onclick = function () { state.alarms.splice(i, 1); save(); drawAlarms(); };
      row.append(t, l, x); box.appendChild(row);
    });
  }
  $('addAlarm').onclick = function () {
    var d = new Date(Date.now() + 10 * C.MIN);
    state.alarms.push({ on: true, hm: ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2), label: '' });
    save(); drawAlarms();
  };

  /* 時間割：1行1つの文字で編む（スプレッドシートの日課表から貼り付けられる形） */
  function schedToText(rows) { return rows.map(function (r) { return r.name + ' ' + r.s.replace(/^0/, '') + '-' + r.e.replace(/^0/, ''); }).join('\n'); }
  function parseSched(text) {
    var rows = [], bad = [];
    text.split('\n').forEach(function (line, i) {
      line = line.replace(/[０-９：－〜～]/g, function (c) { return { '：': ':', '－': '-', '〜': '-', '～': '-' }[c] || String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).trim();
      if (!line) return;
      var m = /^(.*?)[\s\t]*(\d{1,2}:\d{2})\s*[-\t ]\s*(\d{1,2}:\d{2})$/.exec(line);
      if (!m || !m[1] || C.hm2min(m[2]) === null || C.hm2min(m[3]) === null || C.hm2min(m[3]) <= C.hm2min(m[2])) { bad.push(i + 1); return; }
      rows.push({ name: m[1].trim(), s: pad(m[2]), e: pad(m[3]) });
    });
    return { rows: rows, bad: bad };
  }
  function drawPatterns() {
    var sel = $('pattern'); sel.textContent = '';
    Object.keys(state.sched.patterns).forEach(function (k) { var o = document.createElement('option'); o.value = o.textContent = k; sel.appendChild(o); });
    sel.value = state.sched.pattern;
    $('schedText').value = schedToText(state.sched.patterns[state.sched.pattern].rows);
  }
  $('pattern').onchange = function () { state.sched.pattern = this.value; save(); drawPatterns(); syncUi(); };
  $('schedText').oninput = function () {
    var r = parseSched(this.value);
    state.sched.patterns[state.sched.pattern].rows = r.rows;
    $('schedErr').hidden = !r.bad.length;
    $('schedErr').textContent = r.bad.length ? r.bad.join('・') + '行目を読み取れません（読み取れた行のみ使用）' : '';
    save(); syncUi();
  };

  /* ---- 画面の状態を合わせる ---- */
  function syncUi() {
    syncs.forEach(function (f) { f(); });
    $('ctlTimer').hidden = state.mode !== 'timer';
    $('ctlSw').hidden = state.mode !== 'sw';
    $('ctlClock').hidden = state.mode !== 'clock';
    var live = !!(mon && !mon.win.closed);
    $('stageHead').classList.toggle('live', live);
    $('stageText').textContent = live ? 'モニターに出力中（この見本と同じ表示）　画面クリック・スペースキーでスタート／一時停止' : '見本（モニター未出力）　画面クリック・スペースキーでスタート／一時停止';
    $('goMonitor').textContent = live ? 'モニターの窓を前に出す' : 'モニターに出す';
    keepAwake(live);
    var n = state.sched.patterns[state.sched.pattern].rows.length;
    $('schedNote').textContent = n ? '「' + state.sched.pattern + '」（' + n + '件）を使用中。編集は下の「時間割」から。' : '「' + state.sched.pattern + '」が空です。下の「時間割」で入力してください。';
    $('vol').value = state.sound.vol; S.setVol(state.sound.vol);
    $('endTune').value = state.sound.endTune;
    $('voiceNote').hidden = S.canSpeak() || !state.sound.voice;
  }
  var lastBtn = '';
  function updateButtons(now) {
    var t = state.timer, w = state.sw;
    var k = (t.running ? 1 : 0) + '' + (C.timerLeft(t, now) <= 0 ? 1 : 0) + (w.running ? 1 : 0);
    if (k === lastBtn) return; lastBtn = k;
    $('tToggle').textContent = t.running ? (C.timerLeft(t, now) <= 0 ? 'リセット' : '一時停止') : (t.started && t.left > 0 ? '再開' : 'スタート');
    $('sToggle').textContent = w.running ? '一時停止' : (w.acc ? '再開' : 'スタート');
  }
  setTimeout(syncUi, 800);  // 声の一覧は少し遅れて届く
  window.addEventListener('beforeunload', function () { if (mon && !mon.win.closed) mon.win.close(); });
  drawAlarms(); drawPatterns(); syncUi(); tick();
  window.__cc = { state: state, sound: S, openMonitor: openMonitor };
})();
</script>
</body>
</html>
