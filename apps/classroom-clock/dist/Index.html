<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教室の時計</title>
<style>
/* ▼ src/view.css から。直すのは src のほう ▼ */
/* モニターに映す面。操作の部品は置かない。
   ui-layout の S（4pxの刻み）の注意は、この面が cq 単位で縮むために出る。画面の大きさに比例させるのが目的なので残す。
   寸法は cq 単位（この面自身の大きさに対する割合）で書く：
   手元の小さな見本でも、モニターの全画面でも、同じ見た目で縮む。 */
/* 配色は2つ（docs/preview/luxury.html の A・B）。
   A 象牙：明るい教室。色は紺1色＋赤い三角。B 夜：まぶしい時。色は琥珀1色＋珊瑚の三角。
   遠くから読むもの（数字・針・5分目盛り・残りの面）はコントラストを保ち、高級感は線の強弱・余白・地色で出す。 */
.cv{
  --bg:#F3F0EA;--dial:#FBFAF7;--ink:#22262B;--sub:#5E636A;--hair:#B9B3A8;--line:#E2DDD3;
  --fill:#D2D9E1;--edge:#2D4A6B;                       /* 残り時間の面（ふつう） */
  --wfill:#F1D7B4;--wedge:#B4600A;--wtext:#9A5208;     /* 残り1分 */
  --alert:#A63B25;                                     /* 終了・赤い三角・秒針 */
  --shadow:0 .8cqmin 2.4cqmin rgba(60,50,30,.14);
  --num:"Segoe UI Variable Display","Segoe UI","Roboto","Helvetica Neue","Inter","Yu Gothic UI","Noto Sans CJK JP",sans-serif;
  --wnum:300;
  position:relative;width:100%;height:100%;container-type:size;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","IPAexGothic","IPAGothic",sans-serif;
  font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;
}
.cv[data-theme=dark]{
  --bg:#121417;--dial:#1A1D21;--ink:#ECE8E1;--sub:#9AA0A8;--hair:#454B53;--line:#2C3137;
  --fill:#4A3A22;--edge:#D9A55B;--wfill:#5A2E22;--wedge:#EE8A6A;--wtext:#EE8A6A;--alert:#EE8A6A;
  --shadow:0 .8cqmin 2.4cqmin rgba(0,0,0,.5);
}
/* 「数字を太く」：後ろの席から細い数字が読みにくい時 */
.cv[data-bold="1"]{--wnum:600}
.cv *{box-sizing:border-box}
.cv-in{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);padding:3cqmin 4cqmin}
.cv-top{display:flex;justify-content:space-between;align-items:baseline;font-size:4.6cqmin;font-weight:700;color:var(--sub);letter-spacing:.12em;line-height:1.2;min-height:1.2em}
.cv-main{display:grid;grid-template-columns:minmax(0,1fr);place-items:center;min-height:0;gap:2cqh 4cqw}
.cv-analog{display:none;height:100%;max-width:100%;aspect-ratio:1;min-height:0}
.cv-read{display:flex;flex-direction:column;align-items:center;gap:2.5cqh;min-width:0;max-width:100%}
.cv-label{font-size:8cqmin;font-weight:700;line-height:1.2}
.cv-label:empty,.cv-sub:empty{display:none}
.cv-big{font-family:var(--num);font-size:min(25cqw,56cqh);font-weight:var(--wnum);line-height:1;white-space:nowrap;letter-spacing:-.02em}
.cv-b2{font-size:.42em;color:var(--sub);margin-left:.08em}
.cv-gauge{display:none;width:88cqw}
.cv-bar{position:relative;height:22cqh;border-radius:2cqh;background:var(--line);overflow:hidden;box-shadow:inset 0 0 0 .3cqmin var(--hair)}
/* 目盛りの数字（分）。棒の下に、位置を合わせて置く */
.cv-scale{position:relative;height:7cqmin;margin-top:1.6cqh;font-family:var(--num);font-size:5cqmin;font-weight:500;color:var(--sub)}
.cv-scale span{position:absolute;top:0;white-space:nowrap;transform:translateX(-50%);line-height:1}
.cv-scale span::before{content:"";position:absolute;left:50%;top:-1.4cqh;height:1cqh;border-left:.25cqmin solid var(--hair)}
.cv-bar i{display:block;height:100%;background:var(--edge)}
.cv-bar b{position:absolute;inset:0}
.cv-bar b span{position:absolute;top:0;bottom:0;width:.3cqw;margin-left:-.15cqw;background:var(--bg)}
/* 横棒：残りを長さで見せる。数字は棒の上に小さく */
.cv[data-face=bar][data-bar="1"] .cv-gauge{display:block}
.cv[data-face=bar][data-bar="1"] .cv-big{font-size:min(15cqw,30cqh)}
.cv-sub{font-size:7cqmin;font-weight:700;line-height:1.25;text-align:center}
.cv-laps{list-style:none;margin:0;padding:0;font-size:5.5cqmin;font-weight:700;color:var(--sub);display:flex;flex-wrap:wrap;justify-content:center;gap:1cqh 4cqw}
.cv-laps:empty{display:none}
/* 数字の枠。幅は 0〜9 で最も広い字に合わせる（字形は中央寄せ） */
.cv i{font-style:normal}
.cv-d{display:inline-block;width:.64em;text-align:center}
.cv-p{display:inline-block;width:.34em;text-align:center}

/* アナログ：時計を左、読み取りを右。時計だけのときは時計を中央に置き、下に1行。 */
.cv[data-face=analog] .cv-analog{display:block}
.cv[data-face=analog] .cv-main{grid-template-columns:auto minmax(30cqw,1fr)}
.cv[data-face=analog] .cv-analog{width:auto;max-height:64cqw;max-width:none}
.cv[data-face=analog] .cv-big{font-size:min(10cqw,30cqh)}
.cv[data-face=analog] .cv-sub{font-size:6cqmin;white-space:nowrap}
.cv[data-face=analog][data-mode=clock] .cv-main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.cv[data-face=analog][data-mode=clock] .cv-big{display:none}
.cv[data-mode=clock] .cv-now{display:none}
.cv[data-face=analog] .cv-now{display:none}

/* 残り1分・おわり：色に加えて、言葉（もうすぐ おわり／おわり）と面の大きさで伝える。 */
.cv[data-phase=warn] .cv-big,.cv[data-phase=warn] .cv-label{color:var(--wtext)}
.cv[data-phase=warn] .cv-bar i{background:var(--wedge)}
/* 一時停止中は文字で書かず、数字を薄くして示す */
.cv[data-phase=paused] .cv-big{opacity:.4}
.cv[data-phase=over] .cv-big,.cv[data-phase=over] .cv-label{color:var(--alert)}

.cv-face{fill:var(--dial);stroke:var(--hair);stroke-width:1;filter:drop-shadow(var(--shadow))}
.cv-tick{stroke:var(--sub);stroke-width:.9}
.cv-tick5{stroke:var(--ink);stroke-width:2.8}
.cv-num{fill:var(--ink);font-family:var(--num);font-size:22px;font-weight:500;text-anchor:middle;dominant-baseline:central;letter-spacing:-.02em}
.cv-sector{fill:var(--fill)}
.cv-goal{stroke:var(--edge);stroke-width:2;stroke-linecap:round}
.cv-tri{fill:var(--alert)}
.cv[data-phase=warn] .cv-sector{fill:var(--wfill)}
.cv[data-phase=warn] .cv-goal{stroke:var(--wedge)}
/* 針は先細りの面で描く（根元が太く、先が細い）。中心に座金 */
.cv-hh,.cv-mh{fill:var(--ink)}
.cv-sh{stroke:var(--alert);stroke-width:1.2;stroke-linecap:round}
.cv-pin{fill:var(--ink)}
.cv-pin2{fill:var(--dial)}

/* 合図は音と同時に画面でも出す（消音・聞こえにくい児童への保険）。点滅は1秒に1回（3Hz未満）。 */
.cv.flash::after{content:"";position:absolute;inset:0;border:2cqmin solid var(--alert);pointer-events:none;animation:cvflash 1s steps(2,jump-none) infinite}
@keyframes cvflash{from{opacity:1}to{opacity:0}}
.cv-banner{position:absolute;left:50%;top:4cqh;transform:translateX(-50%);max-width:92cqw;padding:2cqh 5cqw;border-radius:3cqh;
  background:var(--ink);color:var(--bg);font-size:9cqmin;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-banner:empty{display:none}
.cv-hint{position:absolute;left:50%;bottom:2cqh;transform:translateX(-50%);padding:1cqh 3cqw;border-radius:2cqh;
  background:var(--ink);color:var(--bg);font-size:4cqmin;font-weight:700;white-space:nowrap;opacity:.9}
.cv-hint:empty{display:none}
/* ▲ src/view.css ここまで ▲ */

/* ---- 操作画面（教師の手元のPCだけに出す） ----
   見た目は docs/preview/luxury.html の A（象牙）・B（夜）。枠線で区切らず面の明暗で区切る。
   強い塗りはスタート（丸いボタン）1つだけ。選択は溝の中を滑る白い面で示す。 */
:root{
  --paper:#EAE6DE;--surf:#FBFAF7;--track:#DED9CF;--ink:#22262B;--sub:#565B62;--rule:#D3CDC2;
  --accent:#22262B;--on:#FBFAF7;--alert:#A63B25;--focus:#2D4A6B;
  --s1:4px;--s2:8px;--s3:16px;--s4:24px;
  --font:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","IPAexGothic","IPAGothic",sans-serif;
  --num:"Segoe UI Variable Display","Segoe UI","Roboto","Helvetica Neue","Inter","Yu Gothic UI","Noto Sans CJK JP",sans-serif;
}
body[data-theme=dark]{
  --paper:#16181B;--surf:#23272C;--track:#2C3137;--ink:#ECE8E1;--sub:#9AA0A8;--rule:#353A41;
  --accent:#ECE8E1;--on:#16181B;--alert:#EE8A6A;--focus:#D9A55B;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.4}
.app{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s4);height:100%;padding:var(--s4)}
.stage{display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--s2);min-height:0}
.stage-head{display:flex;align-items:center;gap:var(--s2);color:var(--sub);font-size:12px;min-height:24px;letter-spacing:.04em}
.stage-head .dot{width:8px;height:8px;border-radius:50%;background:var(--rule)}
.stage-head.live{color:var(--ink)} .stage-head.live .dot{background:var(--alert)}
.kbd{margin-left:auto;font-size:11px}
.preview{min-height:0;display:grid;place-items:center}
.pv-box{cursor:pointer;width:100%;max-height:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.14)}
.panel{display:flex;flex-direction:column;gap:var(--s4);overflow:auto;min-height:0;padding:var(--s1)}
.card{display:flex;flex-direction:column;gap:var(--s2)}
.card+.card,.card+details,details+details{border-top:1px solid var(--rule);padding-top:var(--s4)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{height:48px;padding:0 var(--s2);border:0;border-radius:12px;background:var(--surf);font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:13px;transition:background .15s}
.btn:hover{background:var(--track)}
.btn.danger{color:var(--alert)}
.btn.icon{width:48px;flex:none;padding:0}
.btn .cap{color:var(--sub)}
#goMonitor{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
#goMonitor:hover{background:var(--surf)}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--s2)}
/* 再生の列：−1・丸いスタート・＋1、その下にリセット等 */
.ctl{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:var(--s3)}
.ctl .btn{width:48px;justify-self:center;background:transparent;font-family:var(--num);font-size:15px;color:var(--sub)}
.ctl .btn:hover{background:var(--surf)}
.btn.main{justify-self:center;width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on);box-shadow:0 6px 16px rgba(0,0,0,.2)}
.btn.main:hover{background:var(--accent);filter:brightness(1.15)}
.btn.main .ic{width:26px;height:26px}
.btn.main .cap,.ctl .btn .cap{display:none}
.sub2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--s2)}
.sub2 .btn{background:transparent;height:48px}
.sub2 .btn:hover{background:var(--surf)}
/* 切り替え：溝の中を白い面が滑る（design/ui-patterns のセグメントの高級版） */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:3px;border-radius:14px;background:var(--track)}
.seg button{height:52px;padding:0 2px;min-width:0;border:0;border-radius:11px;background:transparent;color:var(--sub);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .2s,color .2s}
.seg button[aria-checked=true]{background:var(--surf);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 .btn{font-family:var(--num);font-weight:500}
.grid4 .btn b{font-weight:500}
.grid4 .btn.sel{box-shadow:inset 0 0 0 1.5px var(--ink)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:currentColor;stroke:none}
.cap{font-size:11px;font-weight:700;line-height:1;letter-spacing:.02em}
.sw{display:flex;align-items:center;gap:var(--s2);min-height:48px;padding:0;border:0;background:none;cursor:pointer;width:100%;text-align:left;font-weight:700}
.sw .lab{flex:1;display:flex;align-items:center;gap:10px}
.sw .lab .ic{color:var(--sub)}
.sw .st{font-size:11px;color:var(--sub);width:14px}
.sw[aria-checked=true] .st::after{content:"入"}
.sw[aria-checked=false] .st::after{content:"切"}
.sw::after{content:"";flex:0 0 40px;height:24px;border-radius:12px;background:var(--track);transition:background .2s;
  background-image:radial-gradient(circle at 12px 50%,var(--surf) 8px,transparent 9px)}
.sw[aria-checked=true]::after{background-color:var(--accent);background-image:radial-gradient(circle at 28px 50%,var(--on) 8px,transparent 9px)}
.field{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--s2);min-height:48px;font-weight:700}
.field select,.field input[type=range]{height:48px;width:100%}
.field select{border:0;border-radius:12px;background:var(--surf);padding:0 var(--s2)}
input[type=range]{accent-color:var(--accent)}
.ficon{display:flex;align-items:center;color:var(--sub)}
#cues{display:flex;flex-direction:column;gap:var(--s2)}
.flab{width:84px;font-size:12px;color:var(--sub);font-weight:700}
.fold{display:flex;flex-direction:column;gap:var(--s2);padding-top:var(--s2)}
details.card>summary{cursor:pointer;font-weight:700;min-height:48px;padding-right:6px;display:flex;align-items:center;list-style:none;color:var(--ink)}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.5px solid var(--sub);border-bottom:1.5px solid var(--sub);transform:rotate(45deg);transition:transform .2s}
details.card[open]>summary::after{transform:rotate(-135deg)}
summary [data-ic]{display:flex;align-items:center;gap:10px}
summary [data-ic] .ic{color:var(--sub)}
.note{font-size:11px;color:var(--sub);margin:0}
.warn{font-size:12px;color:var(--alert);margin:0;font-weight:700}
textarea{font:13px/1.6 var(--font);width:100%;min-height:200px;border:0;border-radius:12px;background:var(--surf);color:var(--ink);padding:var(--s3)}
.alarm{display:grid;grid-template-columns:112px minmax(0,1fr) 48px;gap:var(--s2);align-items:center;margin-bottom:var(--s2)}
.alarm input{height:48px;border:0;border-radius:12px;background:var(--surf);padding:0 var(--s2);min-width:0;color:var(--ink)}
.alarm .x{width:48px;background:transparent}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}.pv-box{max-height:none}}
</style>

<div class="app">
  <section class="stage">
    <div class="stage-head" id="stageHead"><span class="dot"></span><span id="stageText">見本</span><span class="kbd" title="見本・モニターの画面クリック、またはスペースキーでスタート／一時停止">クリック／Space＝開始・停止</span></div>
    <div class="preview"><div class="pv-box" id="pv"></div></div>
  </section>

  <section class="panel">
    <div class="card">
      <button class="btn" id="goMonitor" data-flow="1" data-ic="monitor" title="モニターを「拡張」でつなぐと、操作の画面は手元だけに残り、モニターには時計だけが出ます">モニターに出す</button>
      <p class="note" id="monNote" hidden></p>
    </div>

    <div class="card">
      <div class="seg" role="radiogroup" id="segMode" data-flow="2">
        <button role="radio" data-v="clock" data-ic="clock">時計</button>
        <button role="radio" data-v="timer" data-ic="timer">タイマー</button>
        <button role="radio" data-v="sw" data-ic="stopwatch">ストップウォッチ</button>
      </div>
      <div class="seg" role="radiogroup" id="segFace">
        <button role="radio" data-v="digital" data-ic="digital">デジタル</button>
        <button role="radio" data-v="analog" data-ic="analog">アナログ</button>
        <button role="radio" data-v="bar" data-ic="bar">横棒</button>
      </div>
    </div>

    <div class="card" id="ctlTimer" hidden>
      <div class="grid4" id="presets"></div>
      <div class="ctl">
        <button class="btn" id="tMinus" data-tier="std" aria-label="1分へらす">−1分</button>
        <button class="btn main" data-tier="main" id="tToggle" data-flow="3"></button>
        <button class="btn" id="tPlus" data-tier="std" aria-label="1分ふやす">＋1分</button>
      </div>
      <div class="sub2"><button class="btn" id="tMinus10" aria-label="10秒へらす">−10秒</button><button class="btn" id="tReset" data-ic="reset">リセット</button><button class="btn" id="tPlus10" aria-label="10秒ふやす">＋10秒</button></div>
    </div>

    <div class="card" id="ctlSw" hidden>
      <div class="ctl">
        <button class="btn" id="sLap" data-tier="std" data-ic="lap">ラップ</button>
        <button class="btn main" data-tier="main" id="sToggle"></button>
        <button class="btn" id="sReset" data-tier="std" data-ic="reset">リセット</button>
      </div>
    </div>

    <div class="card">
      <button class="sw" role="switch" id="swSched" data-ic="calendar">時間割</button>
      <p class="note" id="schedNote"></p>
      <button class="sw" role="switch" id="swDark" data-ic="moon">ダーク</button>
      <button class="sw" role="switch" id="swBold" data-ic="bold">数字を太く</button>
    </div>

    <details class="card" id="dSound">
      <summary data-group="fold-dSound"><span data-ic="speaker">音</span></summary>
      <div class="fold">
      <div class="field"><span class="ficon" data-ic="volume" title="音量"></span><input type="range" id="vol" min="0" max="1" step="0.05" aria-label="音量"></div>
      <div id="cues"></div>
      <div class="field"><span class="flab">終了音</span><select id="endTune" aria-label="終了音">
        <option value="alarm">電子音</option><option value="bell">ベル</option>
        <option value="marimba">マリンバ</option><option value="school">チャイム</option><option value="none">なし</option></select>
        <button class="btn icon" id="testSound" data-ic="play" aria-label="終了音の試聴" title="試聴"></button></div>
      <p class="note" id="voiceCredit">声：VOICEVOX:冥鳴ひまり / VOICEVOX:青山龍星 / VOICEVOX:玄野武宏</p>
      <p class="note" id="voiceNote" hidden>この端末に日本語音声なし（アラーム・時間割の読み上げは出ません）</p>
      <button class="sw" role="switch" id="swFlash">画面の点滅</button>
      </div>
    </details>

    <details class="card" id="dAlarm">
      <summary data-group="fold-dAlarm"><span data-ic="alarm">アラーム</span></summary>
      <div class="fold">
      <div id="alarms"></div>
      <button class="btn" id="addAlarm" data-ic="plus">追加</button>
      </div>
    </details>

    <details class="card" id="dSched">
      <summary data-group="fold-dSched"><span data-ic="calendar">日課表</span></summary>
      <div class="fold">
      <div class="field"><span class="ficon" data-ic="list" title="日課の種類"></span><select id="pattern" aria-label="日課の種類"></select></div>
      <textarea id="schedText" spellcheck="false" aria-label="日課（1行に1件「名前 開始-終了」）" placeholder="1時間目 8:45-9:30"></textarea>
      <p class="warn" id="schedErr" hidden></p>
      <button class="sw" role="switch" id="swChime" data-ic="bell">チャイム</button>
      </div>
    </details>

  </section>
</div>

<script>

    mon = { win: w, view: ClockView.create(d, d.getElementById('m')), full: false };
    d.addEventListener('click', function () {
      S.unlock();
      if (d.fullscreenElement) { toggle(); return; }
      var el = d.documentElement;
      var p = target ? el.requestFullscreen({ screen: target }) : el.requestFullscreen();
      if (p && p.then) p.then(function () { mon.full = true; }, function () {});
    });
    w.addEventListener('keydown', function (e) { if (e.key === 'Escape') mon.full = false; });
    syncUi();
  }

  /* 画面が暗くならないように（モニター表示中だけ） */
  var lock = null;
  async function keepAwake(on) {
    try {
      if (on && !lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', function () { lock = null; }); }
      if (!on && lock) { lock.release(); lock = null; }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && mon) keepAwake(true); });

  /* ---- 操作 ---- */
  function seg(id, get, set) {
    var box = $(id);
    box.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; set(b.dataset.v); changed(); });
    return function () { box.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-checked', String(b.dataset.v === get())); }); };
  }
  function sw(id, get, set) {
    var b = $(id), lab = document.createElement('span'), st = document.createElement('span');
    lab.className = 'lab'; st.className = 'st'; lab.innerHTML = (b.dataset.ic ? svg(b.dataset.ic) : '') + b.textContent; b.textContent = ''; b.append(lab, st);
    b.addEventListener('click', function () { set(!get()); changed(); });
    return function () { b.setAttribute('aria-checked', String(!!get())); };
  }
  var syncs = [
    seg('segMode', function () { return state.mode; }, function (v) { state.mode = v; }),
    seg('segFace', function () { return state.face; }, function (v) { state.face = v; }),
    sw('swBold', function () { return !!state.bold; }, function (v) { state.bold = v; }),
    sw('swDark', function () { return state.theme === 'dark'; }, function (v) { state.theme = v ? 'dark' : 'light'; }),
    sw('swSched', function () { return state.sched.on; }, function (v) { state.sched.on = v; }),
    sw('swChime', function () { return state.sched.chime; }, function (v) { state.sched.chime = v; if (v) state.sched.on = true; }),
    sw('swFlash', function () { return state.sound.flash; }, function (v) { state.sound.flash = v; })
  ];
  function changed() { S.unlock(); save(); syncUi(); tick(); }

  PRESETS.forEach(function (m) {
    var b = document.createElement('button'); b.className = 'btn'; b.innerHTML = '<b style="font-size:16px">' + m + '</b>'; b.setAttribute('aria-label', m + '分');
    b.onclick = function () { C.timerPreset(state.timer, m * C.MIN); changed(); };
    $('presets').appendChild(b);
  });
  $('tToggle').onclick = function () { toggle(); };
  function toggleTimer() { var t = state.timer, n = Date.now(); if (C.timerLeft(t, n) <= 0 && t.running) { C.timerReset(t); fx.flashUntil = 0; fx.banner = null; } else if (t.running) C.timerPause(t, n); else C.timerStart(t, n); prev = n; changed(); }
  $('tReset').onclick = function () { C.timerReset(state.timer); fx.flashUntil = 0; fx.banner = null; changed(); };
  $('tPlus').onclick = function () { C.timerAdd(state.timer, C.MIN, Date.now()); changed(); };
  $('tMinus').onclick = function () { C.timerAdd(state.timer, -C.MIN, Date.now()); changed(); };
  $('tPlus10').onclick = function () { C.timerAdd(state.timer, 10 * C.SEC, Date.now()); changed(); };
  $('tMinus10').onclick = function () { C.timerAdd(state.timer, -10 * C.SEC, Date.now()); changed(); };
  $('sToggle').onclick = function () { toggle(); };
  /* スタート／一時停止。ボタン・見本やモニターの画面のクリック・スペースキーの3つから同じ動き */
  function toggle() {
    if (S.ringing()) { S.stop(); fx.flashUntil = 0; fx.banner = null; if (state.mode !== 'timer' || C.timerLeft(state.timer, Date.now()) > 0) { changed(); return; } }
    if (state.mode === 'timer') toggleTimer();
    else if (state.mode === 'sw') { var w = state.sw, n = Date.now(); if (w.running) C.swStop(w, n); else C.swStart(w, n); changed(); }
    else changed();
  }
  $('pv').addEventListener('click', toggle);
  document.addEventListener('keydown', function (e) {
    if (e.code !== 'Space' || /INPUT|TEXTAREA|SELECT|BUTTON|SUMMARY/.test(e.target.tagName)) return;
    e.preventDefault(); toggle();
  });
  /* 操作ボタンを押したら、鳴っている終了音・アラームは止める */
  document.querySelector('.panel').addEventListener('click', function (e) { if (e.target.closest('button') && !/^testSound$/.test(e.target.closest('button').id) && !e.target.closest('#cues')) S.stop(); }, true);
  $('sLap').onclick = function () { C.swLap(state.sw, Date.now()); changed(); };
  $('sReset').onclick = function () { C.swReset(state.sw); changed(); };
  $('goMonitor').onclick = function () { openMonitor(); };

  $('vol').oninput = function () { state.sound.vol = +this.value; S.setVol(state.sound.vol); save(); };
  /* 区切りごとの音の選択。並びと既定はここ1か所 */
  var VOICE_OPTS = [['female', '女性の声'], ['male', '低い男性の声'], ['robot', 'ロボット']];
  var CUES = [
    { k: 'm1', label: '残り1分', beep: ['warn', 'ピッピッ'], clips: ['m1'] },
    { k: 's30', label: '残り30秒', beep: ['warn', 'ピッピッ'], clips: ['s30'] },
    { k: 'count', label: '5・4・3・2・1', beep: ['tick', 'ピッ'], clips: ['c5', 'c4', 'c3', 'c2', 'c1'] },
    { k: 'end', label: 'そこまで', beep: null, clips: ['end'] }
  ];
  if (!state.sound.cues) state.sound.cues = { m1: 'female', s30: 'female', count: 'female', end: 'female' };
  function previewCue(c) {
    S.stop(); S.unlock();
    var v = state.sound.cues[c.k];
    if (v === 'none') return;
    if (v === 'beep') { c.clips.forEach(function (_, i) { setTimeout(function () { S.play(c.beep[0]); }, i * 1000); }); return; }
    c.clips.forEach(function (ck, i) { setTimeout(function () { S.playClip(v + '-' + ck); }, i * 1000); });
  }
  CUES.forEach(function (c) {
    var row = document.createElement('div'); row.className = 'field';
    var lab = document.createElement('span'); lab.className = 'flab'; lab.textContent = c.label;
    var sel = document.createElement('select'); sel.id = 'cue-' + c.k; sel.setAttribute('aria-label', c.label + 'の音');
    var opts = VOICE_OPTS.slice(); if (c.beep) opts.push(['beep', c.beep[1]]); opts.push(['none', 'なし']);
    opts.forEach(function (o) { var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; sel.appendChild(op); });
    var b = document.createElement('button'); b.className = 'btn icon'; b.dataset.ic = 'play'; setBtn(b, 'play', '');
    b.setAttribute('aria-label', c.label + 'の試聴'); b.title = '試聴';
    sel.onchange = function () { state.sound.cues[c.k] = sel.value; state.sound.voice = true; changed(); previewCue(c); };
    b.onclick = function () { previewCue(c); };
    row.append(lab, sel, b); $('cues').appendChild(row);
  });
  $('endTune').onchange = function () { state.sound.endTune = this.value; changed(); S.stop(); S.play(this.value); setTimeout(S.stop, 3000); };
  $('testSound').onclick = function () { S.stop(); S.unlock(); var ms = S.play(state.sound.endTune); if (state.sound.voice) S.speak('時間です', ms); setTimeout(S.stop, 4000); };

  /* アラーム */
  function drawAlarms() {
    var box = $('alarms'); box.textContent = '';
    state.alarms.forEach(function (a, i) {
      var row = document.createElement('div'); row.className = 'alarm';
      var t = document.createElement('input'); t.type = 'time'; t.value = a.hm; t.setAttribute('aria-label', '時刻'); t.dataset.group = 'atime';
      var l = document.createElement('input'); l.type = 'text'; l.value = a.label; l.placeholder = '片付け'; l.setAttribute('aria-label', 'メッセージ'); l.dataset.group = 'alabel';
      var x = document.createElement('button'); x.className = 'btn x danger'; x.innerHTML = svg('x'); x.setAttribute('aria-label', 'このアラームを消す');
      t.onchange = function () { a.hm = t.value; save(); };
      l.oninput = function () { a.label = l.value; save(); };
      x.onclick = function () { state.alarms.splice(i, 1); save(); drawAlarms(); };
      row.append(t, l, x); box.appendChild(row);
    });
  }
  $('addAlarm').onclick = function () {
    var d = new Date(Date.now() + 10 * C.MIN);
    state.alarms.push({ on: true, hm: ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2), label: '' });
    save(); drawAlarms();
  };

  /* 時間割：1行1つの文字で編む（スプレッドシートの日課表から貼り付けられる形） */
  function schedToText(rows) { return rows.map(function (r) { return r.name + ' ' + r.s.replace(/^0/, '') + '-' + r.e.replace(/^0/, ''); }).join('\n'); }
  function parseSched(text) {
    var rows = [], bad = [];
    text.split('\n').forEach(function (line, i) {
      line = line.replace(/[０-９：－〜～]/g, function (c) { return { '：': ':', '－': '-', '〜': '-', '～': '-' }[c] || String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).trim();
      if (!line) return;
      var m = /^(.*?)[\s\t]*(\d{1,2}:\d{2})\s*[-\t ]\s*(\d{1,2}:\d{2})$/.exec(line);
      if (!m || !m[1] || C.hm2min(m[2]) === null || C.hm2min(m[3]) === null || C.hm2min(m[3]) <= C.hm2min(m[2])) { bad.push(i + 1); return; }
      rows.push({ name: m[1].trim(), s: pad(m[2]), e: pad(m[3]) });
    });
    return { rows: rows, bad: bad };
  }
  function drawPatterns() {
    var sel = $('pattern'); sel.textContent = '';
    Object.keys(state.sched.patterns).forEach(function (k) { var o = document.createElement('option'); o.value = o.textContent = k; sel.appendChild(o); });
    sel.value = state.sched.pattern;
    $('schedText').value = schedToText(state.sched.patterns[state.sched.pattern].rows);
  }
  $('pattern').onchange = function () { state.sched.pattern = this.value; save(); drawPatterns(); syncUi(); };
  $('schedText').oninput = function () {
    var r = parseSched(this.value);
    state.sched.patterns[state.sched.pattern].rows = r.rows;
    $('schedErr').hidden = !r.bad.length;
    $('schedErr').textContent = r.bad.length ? r.bad.join('・') + '行目を読み取れません（読み取れた行のみ使用）' : '';
    save(); syncUi();
  };

  /* ---- 画面の状態を合わせる ---- */
  function syncUi() {
    syncs.forEach(function (f) { f(); });
    document.body.dataset.theme = state.theme;
    document.querySelectorAll('#presets .btn').forEach(function (b, k) { b.classList.toggle('sel', PRESETS[k] * C.MIN === state.timer.dur); });
    $('ctlTimer').hidden = state.mode !== 'timer';
    $('ctlSw').hidden = state.mode !== 'sw';
    var live = !!(mon && !mon.win.closed);
    $('stageHead').classList.toggle('live', live);
    $('stageText').textContent = live ? 'モニターに出力中' : '見本';
    setBtn($('goMonitor'), 'monitor', live ? 'モニターの窓を前へ' : 'モニターに出す');
    keepAwake(live);
    var n = state.sched.patterns[state.sched.pattern].rows.length;
    $('schedNote').textContent = n ? '「' + state.sched.pattern + '」' + n + '件' : '「' + state.sched.pattern + '」は空（日課表で入力）';
    $('vol').value = state.sound.vol; S.setVol(state.sound.vol);
    $('endTune').value = state.sound.endTune;
    CUES.forEach(function (c) { $('cue-' + c.k).value = state.sound.cues[c.k] || 'none'; });
    $('voiceNote').hidden = S.canSpeak() || !state.sound.voice;
  }
  var lastBtn = '';
  function updateButtons(now) {
    var t = state.timer, w = state.sw;
    var k = (t.running ? 1 : 0) + '' + (C.timerLeft(t, now) <= 0 ? 1 : 0) + (w.running ? 1 : 0);
    if (k === lastBtn) return; lastBtn = k;
    if (t.running && C.timerLeft(t, now) <= 0) setBtn($('tToggle'), 'reset', 'リセット');
    else setBtn($('tToggle'), t.running ? 'pause' : 'play', t.running ? '一時停止' : (t.started && t.left > 0 ? '再開' : 'スタート'));
    setBtn($('sToggle'), w.running ? 'pause' : 'play', w.running ? '一時停止' : (w.acc ? '再開' : 'スタート'));
  }
  setTimeout(syncUi, 800);  // 声の一覧は少し遅れて届く
  window.addEventListener('beforeunload', function () { if (mon && !mon.win.closed) mon.win.close(); });
  drawAlarms(); drawPatterns(); syncUi(); tick();
  window.__cc = { state: state, sound: S, openMonitor: openMonitor };
})();
</script>
</body>
</html>
