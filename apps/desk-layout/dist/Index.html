<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机の配置図</title>
<style>
/* ▼ src/tokens.css から。直すのは src のほう ▼ */
/* 色と書体のトークン — 両画面が読む。@dark{} は build.py が
   @media (prefers-color-scheme:dark) 側と [data-theme="dark"] 側の
   2つに展開する。暗い配色の値はここ1箇所にしかない。
   中立トークン（書体・紙/ink/rule/accent）は base.css が正本。
   このファイルが評価ドメインの色を足す。 */
/* ▼ base.css から ▼ */
/* 中立の色・書体トークン — 全ツールが読む最小共通セット。
   評価ドメインの色（単元20色・A/B系・警告など）は tokens.css 側。
   @dark{} は build.py が暗い配色の2ブロックへ展開する。
   light 固定のツール（icon-maker）は build 側で @dark を除く。 */
:root{
  /* 書体。ウェブフォントは読まない。--font-ja は左から
     Mac（Hiragino）→ Windows（Yu Gothic / BIZ UD / Meiryo）→ Chromebook
     （Noto）の順に当たる。BIZ UD は Windows 10 以降の標準添付。
     --font-mono は数・記号の桁そろえ用。日本語が入る場面（診断行など）は
     後ろの BIZ UDゴシック／Noto Sans Mono CJK JP に落ちて読める。 */
  --font-ja:"Hiragino Sans","Yu Gothic UI","BIZ UDPGothic","Noto Sans JP","Noto Sans CJK JP","Meiryo",sans-serif;
  --font-mono:"Consolas","Menlo","Roboto Mono","BIZ UDGothic","Noto Sans Mono CJK JP",monospace;

  --paper:#FCFBF7; --sheet:#FFFFFF; --ink:#1D2126;
  --ink-soft:#5A6470; --ink-faint:#9AA3AD;
  --rule:#DFDCD2; --rule-soft:#EDEAE2; --accent:#2C5C9E;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131619; --sheet:#1A1E23; --ink:#E8EBEF;
    --ink-soft:#A0A9B4; --ink-faint:#6A727C;
    --rule:#2E343B; --rule-soft:#242A30; --accent:#7BAAE4;
  }
}
:root[data-theme="dark"]{
  --paper:#131619; --sheet:#1A1E23; --ink:#E8EBEF;
  --ink-soft:#A0A9B4; --ink-faint:#6A727C;
  --rule:#2E343B; --rule-soft:#242A30; --accent:#7BAAE4;
}
/* ▲ base.css ここまで ▲ */
:root{
  /* 評価の色。A 系と突破層にだけ置く。B 系は無色、警告層は文字だけ */
  --a-bg:#DCE8F6; --a-line:#8FB4DC; --a-ink:#173E70;
  --z-bg:#F7EBCB; --z-line:#D6B461; --z-ink:#5C4408;
  --warn:#B0392B; --warn-bg:#FBEEEC;
  --ok:#2F6E4E;

  /* 教師の貫通・ロック・スケール外の記号 */
  --open:#2E7D8A; --open-bg:#EAF5F6;
  --open-cell:#FFF4E4; --open-line:#DFAE62;
  --lock-ink:#A29C90;
  --off-bg:#EFEDE8; --off-ink:#8A8578; --skip-line:rgba(29,33,38,.42);
  --stripe:rgba(29,33,38,.07);

  /* 単元の20色。色相を 126° ずつ飛ばしてあるので連番でも近づかない
     （20 と 126 は互いに素）。明度は色相ごとに補正済み */
  --u0:#57C18C; --u1:#A670CA; --u2:#B08F41; --u3:#61C4B0; --u4:#BE69C8;
  --u5:#AFAF41; --u6:#69BEC8; --u7:#C461B0; --u8:#8FB041; --u9:#70A6CA;
  --u10:#C1578C; --u11:#70B543; --u12:#748ECC; --u13:#BE4E65; --u14:#52BB46;
  --u15:#7575CC; --u16:#BB5246; --u17:#4EBE65; --u18:#8E74CC; --u19:#B57043;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --a-bg:#1E3352; --a-line:#3F6598; --a-ink:#BDD5F0;
    --z-bg:#3D3113; --z-line:#8A7028; --z-ink:#F0D794;
    --warn:#E5776A; --warn-bg:#2E1C1A;
    --ok:#6FBF92;

    --open:#6FBECC; --open-bg:#182C30;
    --open-cell:#33270F; --open-line:#7E6224;
    --lock-ink:#6A727C;
    --off-bg:#22262B; --off-ink:#767E88; --skip-line:rgba(232,235,239,.45);
    --stripe:rgba(232,235,239,.09);

    --u0:#72C59C; --u1:#B389CF; --u2:#BA9C56; --u3:#7BC9B9; --u4:#C583CC;
    --u5:#B9B955; --u6:#83C5CC; --u7:#C97BB9; --u8:#9CBA56; --u9:#89B3CF;
    --u10:#C5729C; --u11:#81BC5A; --u12:#8DA2D1; --u13:#C2697B; --u14:#6ABE61;
    --u15:#8F8FD1; --u16:#BE6A61; --u17:#69C27B; --u18:#A28DD1; --u19:#BC815A;
  }
}
:root[data-theme="dark"]{
  --a-bg:#1E3352; --a-line:#3F6598; --a-ink:#BDD5F0;
  --z-bg:#3D3113; --z-line:#8A7028; --z-ink:#F0D794;
  --warn:#E5776A; --warn-bg:#2E1C1A;
  --ok:#6FBF92;

  --open:#6FBECC; --open-bg:#182C30;
  --open-cell:#33270F; --open-line:#7E6224;
  --lock-ink:#6A727C;
  --off-bg:#22262B; --off-ink:#767E88; --skip-line:rgba(232,235,239,.45);
  --stripe:rgba(232,235,239,.09);

  --u0:#72C59C; --u1:#B389CF; --u2:#BA9C56; --u3:#7BC9B9; --u4:#C583CC;
  --u5:#B9B955; --u6:#83C5CC; --u7:#C97BB9; --u8:#9CBA56; --u9:#89B3CF;
  --u10:#C5729C; --u11:#81BC5A; --u12:#8DA2D1; --u13:#C2697B; --u14:#6ABE61;
  --u15:#8F8FD1; --u16:#BE6A61; --u17:#69C27B; --u18:#A28DD1; --u19:#BC815A;
}
/* ▲ src/tokens.css ここまで ▲ */
/* ▼ src/style.css から。直すのは src のほう ▼ */
*{box-sizing:border-box}
*[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Noto Sans JP","Meiryo",sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;
}
button,input{font:inherit;color:inherit}
button{
  min-height:40px;padding:6px 14px;border:1px solid var(--rule);border-radius:8px;
  background:var(--sheet);cursor:pointer;touch-action:manipulation;
}
button:hover{border-color:var(--ink-faint)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.danger{color:var(--warn);border-color:var(--warn-bg);background:var(--warn-bg)}
button.ghost{background:transparent;border-style:dashed}
button[aria-pressed="true"],button.on{background:var(--a-bg);border-color:var(--a-line);color:var(--a-ink);font-weight:700}
button:disabled{opacity:.4;cursor:default}
.sp{flex:1}
.hint{font-size:13px;color:var(--ink-soft);margin:6px 0 0}
ruby rt{font-size:.45em;font-weight:400;color:var(--ink-soft)}

/* ---- ① えらぶ ---- */
.home{max-width:1200px;margin:0 auto;padding:16px 16px 60px}
.hbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.hbar h1{font-size:20px;margin:0}
.hscenes>button{font-size:14px;padding:6px 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:14px;background:var(--sheet);overflow:hidden}
.card .go{display:flex;flex-direction:column;align-items:stretch;gap:6px;border:0;border-radius:0;padding:12px 12px 14px;background:none;min-height:0;text-align:center}
.card .go svg{width:100%;height:150px}
.card .go .nm{font-size:26px;font-weight:700;line-height:1.5}
.card .fix{position:absolute;top:8px;right:8px;min-height:34px;padding:2px 10px;font-size:13px;background:var(--sheet)}
.data{margin-top:28px;border-top:1px solid var(--rule-soft);padding-top:12px;color:var(--ink-soft)}
.data summary{cursor:pointer;font-size:14px}
.data .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.filebtn{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);cursor:pointer;color:var(--ink)}

/* ---- ② 見せる ---- */
.show{display:flex;flex-direction:column;height:100vh;height:100dvh}
.tools{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule-soft)}
.tools .tb{min-height:40px;font-size:14px;color:var(--ink-soft)}
.tools .tb[aria-pressed="true"],.tools .tb.on{color:var(--a-ink)}
.stitle{margin:0 0 0 6px;font-size:clamp(26px,3.6vh,48px);line-height:1.3}
.seg{display:inline-flex}
.seg>button{border-radius:0}
.seg>button:first-child{border-radius:8px 0 0 8px}
.seg>button:last-child{border-radius:0 8px 8px 0}
.seg>button+button{margin-left:-1px}
.stage{flex:1;min-height:0;display:flex;gap:10px;padding:10px}
#stageSvg{flex:1;min-width:0;height:100%}
.away{flex:0 0 auto;width:clamp(150px,13vw,240px);display:flex;flex-direction:column;gap:12px;overflow:auto;
  border-left:1px solid var(--rule-soft);padding-left:12px}
.away:empty{display:none}
.away h3{margin:0 0 4px;font-size:clamp(18px,2.4vh,28px)}
.away .icons{display:flex;flex-wrap:wrap;gap:8px}
.away figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(14px,1.8vh,22px);font-weight:700;text-align:center}
.away figure svg{width:clamp(56px,7vh,96px);height:clamp(56px,7vh,96px)}

/* 大きく映す */
.bigmsg{display:none;flex:none;position:relative;z-index:2;margin:0;padding:2vh 64px 1.4vh;background:var(--paper);text-align:center;font-size:clamp(32px,7vh,96px);font-weight:700;line-height:1.5;letter-spacing:.04em}
.bigmsg rt{font-size:.38em}
.show.big .bigmsg{display:block}
.show.big .tools,.show.big .away{display:none}
.show.big .stage{padding:2.5vh 2vw 3vh}
.bigexit{position:fixed;z-index:3;top:10px;right:10px;min-height:44px;width:44px;padding:0;font-size:22px;color:var(--ink-faint);background:transparent;border-color:transparent}
.bigexit:hover{border-color:var(--rule)}

/* SVG の文字・線 */
svg text{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Noto Sans JP","Meiryo",sans-serif}
.lb{fill:var(--ink);font-weight:700}
.rb{fill:var(--ink-soft)}
.lbox{fill:var(--sheet);stroke:var(--ink);stroke-width:3}
.lead{stroke:var(--ink);stroke-width:4}
.lead-halo{stroke:var(--sheet);stroke-width:10;stroke-linecap:round}
.lead-dot{fill:var(--ink);stroke:var(--sheet);stroke-width:3}
.cap{fill:var(--ink-soft);font-weight:700}
.cut{stroke:var(--ink-faint);stroke-width:3;stroke-dasharray:14 10}
.chair.ghost{opacity:.35}
.grid{pointer-events:none}
.grid line{stroke:rgba(29,33,38,.28);stroke-width:2}
.grid circle{fill:rgba(255,255,255,.85);stroke:rgba(29,33,38,.55);stroke-width:2}
.snapmark{fill:none;stroke:var(--accent);stroke-width:5;pointer-events:none}
.selbox{fill:none;stroke:var(--accent);stroke-width:6;stroke-dasharray:18 10}

/* ---- ③ つくる ---- */
.edit{display:flex;flex-direction:column;min-height:100vh}
.ebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-bottom:1px solid var(--rule-soft)}
.fld{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)}
.fld input{width:9em;min-height:40px;padding:4px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);font-size:16px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px}
.gridsel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)}
.gridsel .seg>button{min-height:36px;padding:4px 10px;font-size:13px}
.ebody{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:12px}
.ecanvas{display:flex;flex-direction:column;gap:10px;min-width:0}
#editSvg{width:100%;height:min(62vh,620px);background:var(--sheet);border:1px solid var(--rule-soft);border-radius:12px;touch-action:none}
#editSvg .it{cursor:grab}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--a-line);background:var(--a-bg);border-radius:10px}
.selbar strong{margin-right:4px}
.swatches{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.swatches .sw{width:40px;min-height:40px;padding:0;border:2px solid var(--rule);border-radius:8px}
.swatches .sw.on{border:3px solid var(--ink);box-shadow:0 0 0 2px var(--sheet) inset}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lists .wide{grid-column:1/-1}
.lists h3{margin:0 0 4px;font-size:14px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:6px;border:1px dashed var(--rule);border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 6px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.chip .pl{font-size:12px;color:var(--ink-soft)}
.chip button{min-height:34px;padding:2px 8px;font-size:12px}
.palette{display:flex;flex-direction:column;gap:8px;min-width:0}
.tabs{display:flex}
.tabs button{flex:1;border-radius:0}
.tabs button:first-child{border-radius:8px 0 0 8px}
.tabs button:last-child{border-radius:0 8px 8px 0}
.tabs button+button{margin-left:-1px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.dest{width:100%}
.dest>button{flex:1;font-size:13px}
.dest:empty{display:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:auto;max-height:70vh}
.tiles button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:12px;line-height:1.3}
.tiles svg{width:54px;height:54px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:10px;font-size:14px;z-index:10}

@media (max-width:820px){
  .ebody{grid-template-columns:1fr}
  .away{width:120px}
}
/* ▲ src/style.css ここまで ▲ */
</style>
</head>
<body>

<!-- ① えらぶ：活動カード -->
<main id="vHome" class="home">
  <header class="hbar">
    <h1 id="hTitle">机の配置図</h1>
    <div id="hScenes" class="seg hscenes" role="group" aria-label="場所"></div>
    <span class="sp"></span>
    <button type="button" id="hNew" class="ghost">＋ 新しい配置</button>
  </header>
  <div id="cards" class="cards"></div>
  <details class="data">
    <summary>データの書き出し・読み込み</summary>
    <div class="row">
      <button type="button" id="dExport">書き出す（JSON）</button>
      <label class="filebtn">読み込む<input type="file" id="dImport" accept="application/json,.json" hidden></label>
      <button type="button" id="dReset" class="danger">標準の配置に戻す</button>
    </div>
    <p class="hint">配置はこの端末のブラウザに保存されます。別の端末へは書き出したファイルで移します。</p>
  </details>
</main>

<!-- ② 見せる：モニターに映す -->
<section id="vShow" class="show" hidden>
  <div class="tools">
    <button type="button" id="sBack" class="tb" aria-label="もどる">←</button>
    <h2 id="sTitle" class="stitle"></h2>
    <span class="sp"></span>
    <div class="seg" id="sGroup" role="group" aria-label="机の数">
      <button type="button" id="sOne" class="tb">1人</button><button type="button" id="sFour" class="tb">4人</button>
    </div>
    <button type="button" id="sFlip" class="tb" aria-pressed="false">左右反転</button>
    <button type="button" id="sSides" class="tb" aria-pressed="true">横から見た図</button>
    <button type="button" id="sChair" class="tb" aria-pressed="false">いす</button>
    <button type="button" id="sRuby" class="tb" aria-pressed="true">ふりがな</button>
    <button type="button" id="sBig" class="primary">大きく映す</button>
  </div>
  <p id="bigMsg" class="bigmsg" hidden><ruby>机<rt>つくえ</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>をこの<ruby>形<rt>かたち</rt></ruby>にしてね</p>
  <button type="button" id="bigExit" class="bigexit" hidden aria-label="大きく映すのをやめる">×</button>
  <div class="stage">
    <svg id="stageSvg" preserveAspectRatio="xMidYMid meet" role="img"></svg>
    <aside id="away" class="away"></aside>
  </div>
</section>

<!-- ③ つくる・なおす -->
<section id="vEdit" class="edit" hidden>
  <header class="ebar">
    <button type="button" id="eBack">← もどる</button>
    <label class="fld">活動の名前<input id="eName" maxlength="20"></label>
    <label class="fld">よみ<input id="eYomi" maxlength="30" placeholder="ひらがな"></label>
    <label class="chk"><input type="checkbox" id="eFlip">左右反転してよい</label>
    <div class="gridsel">グリッド<div id="eGrid" class="seg" role="group" aria-label="グリッドの細かさ"></div></div>
    <span class="sp"></span>
    <button type="button" id="eShow" class="primary">映す</button>
    <button type="button" id="eCopy">複製</button>
    <button type="button" id="eDel" class="danger">削除</button>
  </header>
  <div class="ebody">
    <div class="ecanvas">
      <div id="selBar" class="selbar" hidden>
        <strong id="selName"></strong>
        <span id="selState" class="seg"></span>
        <button type="button" id="selSize"></button>
        <span id="selColors" class="swatches"></span>
        <button type="button" id="selRot">回す ↻</button>
        <label id="selTextBox" class="fld" hidden>文字<input id="selText" maxlength="16" placeholder="例：漢字①"></label>
        <button type="button" id="selLabel" aria-pressed="false">名前を出す</button>
        <button type="button" id="selFront">いちばん上へ</button>
        <button type="button" id="selDel" class="danger">けす</button>
      </div>
      <svg id="editSvg" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="lists" id="eLists">
        <div><h3>左のフック</h3><div id="lHookL" class="chips"></div></div>
        <div><h3>右のフック</h3><div id="lHookR" class="chips"></div></div>
        <div class="wide"><h3>しまう物</h3><div id="lAway" class="chips"></div></div>
      </div>
    </div>
    <div class="palette">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="top" aria-selected="true">机の上</button>
        <button type="button" role="tab" data-tab="hang" aria-selected="false">フック</button>
        <button type="button" role="tab" data-tab="away" aria-selected="false">しまう</button>
      </div>
      <div id="pDest" class="seg dest"></div>
      <div id="pItems" class="tiles"></div>
    </div>
  </div>
</section>

<div id="toast" role="status" hidden></div>

<script>
/* ▼ src/data.js から。直すのは src のほう ▼ */
/* ===== 机・用具・標準配置の正本 =====
   寸法はすべて mm。机の上から見た座標は
     x: 0（児童の左）→ 650（児童の右）
     y: 0（黒板がわ＝前）→ 450（児童がすわる がわ＝後ろ）
   用具の名前は {漢字|よみ} でふりがなを付ける。 */

/* ---- 場所（モード）：床の大きさ・置ける物・細かい設定 ----
   「机の上」に加えて、教室・体育館・運動場の配置図を作れる（メニューで場所を選ぶ）。
   useScene で DESK・GRID_LEVELS・K がいまの場所に切り替わる（描画・編集の仕組みは机と同じ）。
   K は文字・線・余白の見た目の倍率：床の幅を机の幅 650 で割ったもの（広い場所ほど大きく描く）。
   items: その場所に置ける物の id（机は全種）。grid: あらい→ふつう→こまかい（各2倍、包含が保たれる）。 */
var SCENES = {
  /* 机：写真の机（天板は平ら・物入れは児童がわに開く・フックは左右両側）に合わせる */

(function () {
  var COLS = { r1: 1, r2: 2, r4: 4 };
  ['rowdot', 'rowline'].forEach(function (id) {
    Object.keys(ITEMS[id].states).forEach(function (k) {
      var n = COLS[k];
      ITEMS[id].states[k].draw = function (w, h) {
        var s = '', i, j;
        for (i = 0; i < n; i++) {
          var cx = w * (i + 0.5) / n;
          if (id === 'rowline') s += L(cx, h * 0.08, cx, h * 0.92, '#3A3F45', 140);
          else for (j = 0; j < 4; j++) s += C(cx, h * (j + 0.5) / 4, 100, '#3A3F45', 10);
        }
        return s;
      };
    });
  });

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---- 名前とふりがな ---- */
function parseName(name) {
  var out = [], re = /\{([^|}]+)\|([^}]+)\}|([^{]+)/g, m;
  while ((m = re.exec(name))) out.push(m[3] != null ? { b: m[3], r: '' } : { b: m[1], r: m[2] });

    if (it.colors) $('selColors').innerHTML = '色' + it.colors.map(function (c, k) {
      return '<button type="button" class="sw' + (k === colorIndex(p) ? ' on' : '') + '" data-col="' + k + '" style="background:' + c + '" aria-label="色' + (k + 1) + '"></button>';
    }).join('');
  }
  renderChips();
  $('eGrid').innerHTML = GRID_LEVELS.map(function (g) {
    return '<button type="button" data-grid="' + g.id + '" class="' + (g.id === gridLevel(S.prefs.grid).id ? 'on' : '') + '">' + g.name + '</button>';
  }).join('');
}
$('eGrid').addEventListener('click', function (e) {
  var b = e.target.closest('[data-grid]'); if (!b) return;
  S.prefs.grid = b.getAttribute('data-grid'); save(); renderEdit();
});
function chipHtml(entry, where, k, extra) {
  return '<span class="chip">' + iconSvg(entry.item, 34) + '<span>' + esc(plainName(ITEMS[entry.item].name)) + '</span>' + (extra || '') +
    '<button type="button" data-lab="' + where + ':' + k + '" aria-pressed="' + !!entry.label + '">名前</button>' +
    '<button type="button" data-rm="' + where + ':' + k + '" aria-label="けす">×</button></span>';
}
function renderChips() {
  $('eLists').hidden = !SCENE.desk;   // フック・しまう物は机だけの仕組み
  $('lHookL').innerHTML = cur.hooks.left.map(function (h, k) { return chipHtml(h, 'left', k); }).join('');
  $('lHookR').innerHTML = cur.hooks.right.map(function (h, k) { return chipHtml(h, 'right', k); }).join('');
  $('lAway').innerHTML = cur.away.map(function (a, k) {
    var pl = PLACES.filter(function (p) { return p.id === a.place; })[0];
    return chipHtml(a, 'away', k, '<span class="pl">（' + plainName(pl.name) + '）</span>');
  }).join('');
}
function listOf(where) { return where === 'away' ? cur.away : cur.hooks[where]; }
document.querySelector('.lists').addEventListener('click', function (e) {
  var lab = e.target.closest('[data-lab]'), rm = e.target.closest('[data-rm]');
  var ref = (lab || rm); if (!ref) return;
  var parts = (ref.getAttribute('data-lab') || ref.getAttribute('data-rm')).split(':'), list = listOf(parts[0]), k = +parts[1];
  if (lab) list[k].label = !list[k].label; else list.splice(k, 1);
  save(); renderEdit();
});

function renderPalette() {
  var deskMode = !!SCENE.desk;
  document.querySelector('.tabs').hidden = !deskMode;   // 机以外はタブなし：置ける物をそのまま並べる
  if (!deskMode) tab = 'top';
  document.querySelectorAll('.tabs [data-tab]').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tab)); });
  var d = '';
  if (tab === 'hang') d = [['left', '左のフック'], ['right', '右のフック']].map(function (x) {
    return '<button type="button" data-dest="' + x[0] + '" class="' + (dest.hang === x[0] ? 'on' : '') + '">' + x[1] + 'へ</button>';
  }).join('');
  if (tab === 'away') d = PLACES.map(function (p) {
    return '<button type="button" data-dest="' + p.id + '" class="' + (dest.away === p.id ? 'on' : '') + '">' + plainName(p.name) + '</button>';
  }).join('');
  $('pDest').innerHTML = d;
  var kind = tab === 'hang' ? 'hang' : 'top';
  var ids = deskMode ? Object.keys(ITEMS).filter(function (id) { return (tab === 'away' || ITEMS[id].kind === kind) && !(ITEMS[id].scenes || []).length; })
                     : SCENE.items.slice();
  $('pItems').innerHTML = ids.map(function (id) {
    return '<button type="button" data-add="' + id + '">' + iconSvg(id, 54) + '<span>' + plainName(ITEMS[id].name) + '</span></button>';
  }).join('');
}
document.querySelector('.tabs').addEventListener('click', function (e) {
  var b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.getAttribute('data-tab'); renderPalette();
});
$('pDest').addEventListener('click', function (e) {
  var b = e.target.closest('[data-dest]'); if (!b) return;
  dest[tab] = b.getAttribute('data-dest'); renderPalette();
});
$('pItems').addEventListener('click', function (e) {
  var b = e.target.closest('[data-add]'); if (!b) return;
  var id = b.getAttribute('data-add');
  if (tab === 'top') {
    cur.top.push({ item: id, state: Object.keys(ITEMS[id].states)[0], x: DESK.w / 2, y: DESK.d / 2, r: 0, label: false });
    sel = cur.top.length - 1;
  } else if (tab === 'hang') cur.hooks[dest.hang].push({ item: id, label: false });
  else cur.away.push({ item: id, place: dest.away, label: false });
  save(); renderEdit();
});

$('eName').oninput = function () { cur.name = this.value.trim() || '無題'; save(); };
$('eYomi').oninput = function () { cur.yomi = this.value.trim(); save(); };
$('eFlip').onchange = function () { cur.flip = this.checked; save(); };
$('eBack').onclick = renderHome;
$('eShow').onclick = function () { openShow(cur.id); };
$('eCopy').onclick = function () {
  var c = clone(cur); c.id = 'l' + Date.now().toString(36); c.name = cur.name + '（コピー）';
  S.layouts.splice(S.layouts.indexOf(cur) + 1, 0, c); save(); openEdit(c.id); toast('複製しました');
};
$('eDel').onclick = function () {
  if (!confirm('「' + cur.name + '」の配置を削除します。元に戻せません。よろしいですか？')) return;
  S.layouts.splice(S.layouts.indexOf(cur), 1);
  S.recent = S.recent.filter(function (x) { return x !== cur.id; });
  save(); renderHome(); toast('削除しました');
};
$('selState').addEventListener('click', function (e) {
  var b = e.target.closest('[data-st]'); if (!b) return;
  var p = cur.top[sel]; p.state = b.getAttribute('data-st'); clampP(p); save(); renderEdit();
});
$('selSize').onclick = function () {
  var p = cur.top[sel], ks = Object.keys(ITEMS[p.item].sizes);
  p.size = ks[(ks.indexOf(sizeOf(p)) + 1) % ks.length]; save(); renderEdit();
};
$('selColors').addEventListener('click', function (e) {
  var b = e.target.closest('[data-col]'); if (!b) return;
  cur.top[sel].color = +b.getAttribute('data-col'); save(); renderEdit();
});
$('selText').addEventListener('input', function () {
  var p = cur.top[sel]; if (!p) return;
  p.text = this.value; save(); renderEdit();
});
$('selRot').onclick = function () { var p = cur.top[sel]; p.r = ((p.r || 0) + 90) % 360; clampP(p); save(); renderEdit(); };
$('selLabel').onclick = function () { var p = cur.top[sel]; p.label = !p.label; save(); renderEdit(); };
$('selFront').onclick = function () { toFront(); save(); renderEdit(); };
$('selDel').onclick = function () { cur.top.splice(sel, 1); sel = -1; save(); renderEdit(); };
function toFront() { var p = cur.top.splice(sel, 1)[0]; cur.top.push(p); sel = cur.top.length - 1; }

/* 物の中心をいちばん近いグリッドの交点に合わせる。交点は机の外にも「あらい」1目分広がる
   （本が半分だけ机に乗る配置）。それ以上はみ出すのは物の形まかせで許す（重ね置きなど実際の机でも起きる） */
function clampP(p) {
  var q = snap(p.x, p.y, gridLevel(S.prefs.grid));
  p.x = q.x; p.y = q.y;
}

/* ドラッグ：動かしている間は transform だけを書き換え、離したら描き直す */
var drag = null;
function svgPoint(svg, e) {
  var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
$('editSvg').addEventListener('pointerdown', function (e) {
  var g = e.target.closest('.it');
  if (!g) {
    // 物を選んでいるときに机の上の空いた所を押すと、そこへ移す（指で引きずらなくてよい）
    var q = svgPoint(this, e);
    var gm = gridMargin();
    if (sel >= 0 && q.x >= -gm.x && q.x <= DESK.w + gm.x && q.y >= -gm.y && q.y <= DESK.d + gm.y) {
      var sp = cur.top[sel]; sp.x = q.x; sp.y = q.y; clampP(sp); save(); renderEdit();
    } else if (sel >= 0) { sel = -1; renderEdit(); }
    return;
  }
  var i = +g.getAttribute('data-i'), p = cur.top[i], pt = svgPoint(this, e);
  if (sel !== i) { sel = i; renderEdit(); g = this.querySelector('.it[data-i="' + i + '"]'); }
  drag = { el: g, p: p, dx: pt.x - p.x, dy: pt.y - p.y, moved: false };
  this.setPointerCapture(e.pointerId);
});
$('editSvg').addEventListener('pointermove', function (e) {
  if (!drag) return;
  var pt = svgPoint(this, e), p = drag.p;
  var nx = p.x, ny = p.y;
  p.x = pt.x - drag.dx; p.y = pt.y - drag.dy; clampP(p);
  if (p.x !== nx || p.y !== ny) drag.moved = true;
  drag.el.setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ') rotate(' + (p.r || 0) + ')');
});
function endDrag() {
  if (!drag) return;
  var moved = drag.moved; drag = null;
  if (moved) { save(); renderEdit(); }
}
$('editSvg').addEventListener('pointerup', endDrag);
document.addEventListener('keydown', function (e) {   // 矢印キーでグリッド1目ずつ動かす
  if ($('vEdit').hidden || sel < 0 || e.target.closest('input')) return;
  var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!d) return;
  e.preventDefault();
  var g = gridLevel(S.prefs.grid), p = cur.top[sel];
  p.x += d[0] * DESK.w / g.nx; p.y += d[1] * DESK.d / g.ny; clampP(p); save(); renderEdit();
});
$('editSvg').addEventListener('pointercancel', endDrag);

renderHome();
/* ▲ src/app.js ここまで ▲ */
</script>
</body>
</html>
