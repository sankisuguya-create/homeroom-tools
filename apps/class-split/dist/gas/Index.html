<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>クラス替え</title>
<style>
/* ▼ src/app.css から。直すのは src のほう ▼ */
/* 配置: メニュー → 名簿（年度・組・範囲の切替＋右に児童の記録）／クラス分け（全員を1画面に並べる盤面）。
   色分けは投影と色覚検証を白地で行ったため、明るい配色1種に固定する（docs/design.md §5） */
:root{
  color-scheme:light;
  --bg:#eef1f4; --panel:#ffffff; --ink:#1A1A1A; --sub:#616870; --line:#c9d1d9; --soft:#F1F3F5;
  --link:#0F5EA8; --alert:#C0330A; --alert-soft:#fbe7e1; --fill:#D7E8F8; --fill-b:#FBE3B4;
  /* 校務PC(Windows)・Chromebook・Mac の順。入っていない名前が続くと探す処理で描画が重くなる */
  --f:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","IPAexGothic","IPAGothic",sans-serif;
  --rowh:30px; --ic:12px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);margin:0;font-size:15px;line-height:1.45;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px;
  box-sizing:border-box;display:flex;flex-direction:column}
body.fit{overflow:hidden}
body.fit .top{display:none}
/* 試行中：画面の上端に太い帯と、ボタンの色で、本番でないことを常に見せる */
.btn.trial{font-weight:700}
.btn.trial[aria-pressed="true"]{background:#A85800;color:#fff;border-color:#A85800}
body.trying{box-shadow:inset 0 6px 0 #A85800;padding-top:12px}
body.trying .demo{color:#A85800;font-weight:700;margin-left:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--link)}
kbd{font-family:Consolas,Menlo,var(--f);font-size:.8em;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel)}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:6px}
.top h1{font-size:1.1rem;margin:0}
.crumb{color:var(--sub)}
.crumb button{border:0;background:none;color:var(--link);text-decoration:underline;cursor:pointer;padding:0}
.demo{font-size:.8rem;color:var(--sub);margin-left:auto}
.save{font-size:.8rem;color:var(--sub)}
.save.err{color:var(--alert);font-weight:700}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--link);color:#fff;border-color:var(--link);font-weight:700}
.btn.danger{color:var(--alert);border-color:var(--alert);font-weight:700}
.btn.primary kbd{background:transparent;color:#fff;border-color:#ffffff99}
.btn kbd{margin-left:4px}
@media (max-width:1500px){.bar .btn kbd,.vio kbd{display:none}}
.btn:focus-visible,.tab:focus-visible,.gbtn:focus-visible,.big:focus-visible,.chip:focus-visible,.head:focus-visible,.lv:focus-visible{outline:3px solid var(--link);outline-offset:1px}
.note{font-size:.85rem;color:var(--sub)}
.sp{flex:1}

/* ===== メニュー ===== */
.menu{max-width:760px;width:100%;margin:24px auto;display:flex;flex-direction:column;gap:20px}
.menu h2{font-size:1rem;margin:0 0 8px;color:var(--sub);font-weight:400}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.gbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:14px 0;font-size:1.3rem;font-weight:700;cursor:pointer}
.gbtn[aria-pressed="true"]{border:3px solid var(--link);background:var(--fill);padding:12px 0}
.gbtn small{display:block;font-size:.7rem;font-weight:400;color:var(--sub)}
.bigs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:22px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.big b{font-size:1.4rem}
.big span{color:var(--sub);font-size:.9rem}
.big:hover{border-color:var(--link)}
@media (max-width:560px){.grades{grid-template-columns:repeat(3,1fr)}.bigs{grid-template-columns:1fr}}

/* ===== 印（頭文字＋色＋形。＋で程度） ===== */
.b{position:relative;display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;font-size:.78em;font-weight:700;line-height:1;flex:none;vertical-align:middle;filter:drop-shadow(0 0 .6px #1A1A1A)}
.b>i{position:absolute;inset:0;background:var(--c)}
.b>em{position:relative;font-style:normal;color:var(--t)}
/* ＋は形の中の字の位置に左右されないよう、印の枠を基準に全アイコンで同じ高さ・同じ距離に置く */
.b>u{position:absolute;left:calc(50% + .3em);top:-.32em;display:flex;line-height:0;text-decoration:none}
.b>u>svg{width:.95em;height:.95em;display:block}
/* アイコンの説明（カーソルを合わせると出す）。1つの枠を使い回す */
.tip{position:fixed;z-index:40;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px #0003;padding:8px 12px;font-size:.85rem;line-height:1.6;max-width:22rem;pointer-events:none}
.tip h3{margin:0 0 4px;font-size:.9rem}
.tip table{border-collapse:collapse}
.tip td{padding:1px 8px 1px 0;vertical-align:top}
.tip td:first-child{white-space:nowrap;font-size:1.1rem}
.tip tr.on td{font-weight:700}
.tip .tn{margin:6px 0 0;padding:4px 8px;background:var(--panel,#f4f4f4);border-left:3px solid var(--ink);white-space:pre-wrap;font-weight:700}
.tip p{margin:4px 0 0;color:var(--sub);font-size:.8rem}
/* 学：角が欠けたボロボロの四角（利用者の選んだ案A） */
.square>i{clip-path:polygon(14% 4%,62% 4%,70% 12%,96% 6%,92% 40%,97% 70%,84% 96%,40% 92%,24% 97%,4% 82%,8% 50%,3% 20%)}
.circle>i{clip-path:circle(50%)}
.diamond>i{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
/* 問：ちくちくした形（とげ14本）。保：家の形。リ：旗の形（長方形の右端に「く」の字の切れ込み。利用者のスケッチの案B） */
.burst>i{clip-path:polygon(50.0% 0.0%,59.3% 9.1%,71.7% 5.0%,76.2% 17.2%,89.1% 18.8%,87.8% 31.8%,98.7% 38.9%,92.0% 50.0%,98.7% 61.1%,87.8% 68.2%,89.1% 81.2%,76.2% 82.8%,71.7% 95.0%,59.3% 90.9%,50.0% 100.0%,40.7% 90.9%,28.3% 95.0%,23.8% 82.8%,10.9% 81.2%,12.2% 68.2%,1.3% 61.1%,8.0% 50.0%,1.3% 38.9%,12.2% 31.8%,10.9% 18.8%,23.8% 17.2%,28.3% 5.0%,40.7% 9.1%)}
/* 字はすべての印で同じ大きさ。字が収まらない形は、形の方を大きくする。問は、その分だけ形を大きくする（とげの内側に字が収まる大きさ） */
.b.burst{width:1.8em;height:1.8em;margin:-.15em}
.bs>.b.burst{width:1.5em;height:1.5em;margin:0}
.house>i{clip-path:polygon(50% 0,100% 44%,100% 100%,0 100%,0 44%)}
.house>em{top:.12em}
.b.house{width:1.65em;height:1.65em;margin:-.08em}
.bs>.b.house{width:1.4em;height:1.4em;margin:0}
.crown>i{clip-path:polygon(0 4%,100% 4%,62% 50%,100% 96%,0 96%)}
.crown>em{left:-.2em}
.b.crown{width:1.75em}
.bs>.b.crown{width:1.45em}
.diamond>em{font-size:.82em}
.hexagon>i{clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%)}
.pentagon>i{clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.pentagon>em{top:.1em}
.b.pill{width:2em}.pill>i{clip-path:inset(12% 0 round 999px)}
.b.para{width:1.9em}.para>i{clip-path:polygon(25% 6%,100% 6%,75% 94%,0 94%)}
.b.shell{width:2.15em}
.bs>.b.shell{width:1.8em}
/* 通：貝殻の形（上下がふくらんだ横長の形。左右の小さなとげは無し） */
.shell>i{clip-path:polygon(2.0% 50.0%,6.0% 40.4%,10.0% 34.0%,14.0% 28.6%,18.0% 23.8%,22.0% 19.7%,26.0% 16.1%,30.0% 13.0%,34.0% 10.5%,38.0% 8.5%,42.0% 7.1%,46.0% 6.3%,50.0% 6.0%,54.0% 6.3%,58.0% 7.1%,62.0% 8.5%,66.0% 10.5%,70.0% 13.0%,74.0% 16.1%,78.0% 19.7%,82.0% 23.8%,86.0% 28.6%,90.0% 34.0%,94.0% 40.4%,98.0% 50.0%,94.0% 59.1%,90.0% 65.2%,86.0% 70.4%,82.0% 75.0%,78.0% 78.9%,74.0% 82.4%,70.0% 85.3%,66.0% 87.7%,62.0% 89.6%,58.0% 90.9%,54.0% 91.7%,50.0% 92.0%,46.0% 91.7%,42.0% 90.9%,38.0% 89.6%,34.0% 87.7%,30.0% 85.3%,26.0% 82.4%,22.0% 78.9%,18.0% 75.0%,14.0% 70.4%,10.0% 65.2%,6.0% 59.1%)}
.b.shell{height:1.7em;margin:-.1em 0}
.bs>.b.shell{height:1.45em;margin:0}
.octagon>i{clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.shield>i{clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
.shield>em{top:-.1em}
/* 事案の数字：点線の枠の上下左右の中央に置く */
.jn{display:inline-flex;align-items:center;justify-content:center;min-width:1.25em;height:1.25em;border:1.5px dashed #1A1A1A;border-radius:3px;padding:0 .15em;font-size:.82em;line-height:1;box-sizing:border-box;font-variant-numeric:tabular-nums;text-align:center}
.band{display:inline-block;width:5px;height:1.2em;vertical-align:middle;margin-right:6px;border-radius:1px}

/* ===== 名簿 ===== */
.rbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--fill);border:2px solid var(--link);padding:3px 9px;font-weight:700}
.lab{color:var(--sub);font-size:.85rem;margin-right:2px}
.chk{display:inline-flex;gap:4px;align-items:center;font-size:.9rem;cursor:pointer}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:10px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:1fr}}
.tw{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:100%}
table.r{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.r th,table.r td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:center;white-space:nowrap}
table.r th{background:var(--soft);font-weight:400;font-size:.85rem;position:sticky;top:0;z-index:1}
table.r td.nm{text-align:left;font-weight:700;cursor:pointer}
table.r td.nm:hover{text-decoration:underline}
table.r tr.on td{background:var(--fill)}
td.cell{cursor:pointer;min-width:2.2em;height:28px;font-size:17px}
td.cell:hover{background:var(--soft)}
table.ro td.cell{cursor:default}
table.ro td.cell:hover{background:none}
td.ji{cursor:pointer}
.sx{color:var(--sub);font-weight:400;font-size:.8rem;margin-right:4px}
.frozen{font-size:.85rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;box-sizing:border-box}
.pane h2{margin:0;font-size:1.2rem}
.pane h3{margin:0 0 4px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pane .id{color:var(--sub);font-size:.85rem;font-weight:400}
.empty{color:var(--sub);padding:20px 0;text-align:center}
table.h{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
table.h th,table.h td{border-bottom:1px solid var(--line);padding:3px 3px;text-align:center}
table.h th{background:var(--soft);font-weight:400}
table.h tr.cur td{font-weight:700}
.inc{display:flex;flex-direction:column;gap:6px}
.inc .it{border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.inc .meta{font-size:.8rem;color:var(--sub)}
.form{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px}
.form label{display:flex;flex-direction:column;gap:2px;font-size:.85rem}
.form input,.form select{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.form .row{display:flex;gap:6px}
.form .row>*{flex:1}
.picked{display:flex;flex-wrap:wrap;gap:4px}
.picked span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.85rem}
.picked button{border:0;background:none;cursor:pointer;color:var(--sub);padding:0 0 0 4px}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;background:var(--panel);max-height:150px;overflow:auto}
.sugg button{border:0;background:none;text-align:left;padding:3px 8px;cursor:pointer}
.sugg button:hover{background:var(--fill)}

/* ===== クラス分け ===== */
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:6px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.tab .k{font-size:.72rem;color:var(--sub);font-weight:400}
.tab .v{font-size:.78rem;color:var(--sub);font-weight:400}
.tab .v.bad{color:var(--alert);font-weight:700}
.tab .x{border:0;background:none;color:var(--sub);cursor:pointer;padding:0 2px;line-height:1}
.tab.cmp{border-style:dashed}
.vio{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.vio.has{border-color:var(--alert);color:var(--alert);background:var(--alert-soft);font-weight:700}
.hint{flex:1;min-width:0;font-size:.95rem;color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint b{color:var(--ink)}
.hint.follow{color:var(--ink);font-weight:700}
.decided{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:.9rem;display:flex;gap:10px;align-items:center}
.board{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden}
.cols{height:100%;display:grid;grid-template-columns:repeat(var(--nc),minmax(260px,1fr));gap:6px;min-width:min-content}
.col{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0;min-height:0}
.head{padding:2px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.head.target{background:var(--fill)}
.h1{display:flex;gap:10px;align-items:baseline;font-variant-numeric:tabular-nums;white-space:nowrap}
.h1 b{font-size:1.1rem}
.h1 .w{color:var(--alert);font-weight:700}
.jis{border:1.5px dashed #1A1A1A;border-radius:3px;padding:0 5px;font-size:.85rem}
.st{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:.8rem;font-variant-numeric:tabular-nums;align-items:center}
.st .w{color:var(--alert);font-weight:700}
.st .w::after{content:"△"}
.st.sub{color:var(--sub)}
.st .c{display:inline-flex;gap:2px;align-items:center}
.sub2{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px}
.gcol{display:flex;flex-direction:column;gap:2px;min-height:0;min-width:0}
.gcol>.chip{height:var(--rowh);flex:none;box-sizing:border-box}
/* 児童カード：男＝長方形、女＝ピル型。左端は旧学級の色の帯（旧番号）、地は旧学級の薄い色 */
.chip{display:grid;grid-template-columns:var(--bandw) minmax(0,1fr) var(--jrw);grid-template-rows:1fr 1fr;min-width:0;border:1px solid var(--line);
  cursor:pointer;--bandw:calc(var(--rowh)*.31);--jrw:calc(var(--rowh)*.5);font-size:calc(var(--rowh)*.36);line-height:1;user-select:none;overflow:hidden;position:relative;background:var(--ol,var(--panel))}
.chip.m{border-radius:2px}
.chip.f{border-radius:999px}
.chip:hover{border-color:var(--sub)}
.chip.sel{border:3px solid var(--link);box-shadow:inset 0 0 0 2px #fff}
.chip.locked{background:repeating-linear-gradient(135deg,var(--ol) 0 5px,#0000001f 5px 6px)}
.chip.locked .nm::before{content:"固 ";color:var(--sub);font-weight:400}
.chip.rel-far .nm::after{content:" 離";color:var(--alert)}
.chip.rel-near .nm::after{content:" つ";color:var(--link)}
.chip.rel-far{outline:4px solid var(--alert);outline-offset:-4px}
.chip.rel-near{outline:2px dashed var(--link);outline-offset:-1px}
.chip.flash{animation:fl 1.1s ease-out 2}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--fill-b)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.chip.flash{animation:none;box-shadow:0 0 0 4px var(--fill-b)}}
.old{grid-row:1/3;background:var(--oc);color:var(--ot);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.5em;font-variant-numeric:tabular-nums}
.l1{display:flex;align-items:center;gap:3px;padding:0 4px 1px;min-width:0}
.nm{font-weight:700;white-space:nowrap;font-size:calc(var(--rowh)*.42);letter-spacing:-.02em}
.side .chip .nm{font-size:20px}
.bs{position:relative;font-size:var(--ic);--slot:1.5em;margin:0 4px}
.bs>.b{position:absolute;left:calc(var(--s)*var(--slot));top:50%;transform:translateY(-50%)}
/* 右の枠（1段目＝賢・リ・運、2段目＝ア・身・通）は男女で同じ位置。縦に並ぶ児童でそろう */
.bs.gd{margin:0 0 0 auto;align-self:stretch;width:calc(3*var(--slot));flex:none}
.l2{display:flex;min-width:0;padding:0 4px 0 0}
.l2>.bs:first-child{flex:1}
/* 事案の数：旧番号の帯の反対側（右端）に、2段の真ん中で置く */
.jr{grid-column:3;grid-row:1/3;display:flex;align-items:center;justify-content:flex-start;font-size:var(--ic)}
.bs>.b{width:1.25em;height:1.25em}
.bs>.b.pill,.bs>.b.para{width:1.3em}
.rt{font-size:.85em;font-weight:700;flex:none}
.rt.far{color:var(--alert)} .rt.near{color:var(--link)}
.lkm{flex:none;color:var(--sub);font-size:.85em}
.cmpwrap{flex:1;min-height:0;overflow:auto}
table.cmp{border-collapse:collapse;background:var(--panel);font-variant-numeric:tabular-nums}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 12px;text-align:center;white-space:nowrap}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp thead th{background:var(--fill);cursor:pointer;white-space:normal;min-width:7em}
table.cmp td.best{font-weight:700}
table.cmp td.best::after{content:" ★";color:var(--link)}
table.cmp td.bad{color:var(--alert);font-weight:700}
table.cmp td.small{font-size:.8rem;white-space:normal;max-width:14em;text-align:left}
.legend{font-size:.78rem;color:var(--sub);padding-top:2px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.legend .c{display:inline-flex;gap:3px;align-items:center}

/* ===== 浮く枠 ===== */
.pop{position:fixed;inset:0;background:#1a1a1a66;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg{background:var(--panel);border-radius:10px;padding:18px 20px;max-width:min(920px,100%);width:100%;box-shadow:0 10px 30px #0004;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto;box-sizing:border-box}
.dlg h2{margin:0;font-size:1.3rem}
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.side .lab{font-size:.9rem;color:var(--sub);font-variant-numeric:tabular-nums}
.side .lab b{color:var(--ink);font-size:1.05rem}

    ],

      { k: 'area', label: '地区',   s: '地区', w: 1 },

      { k: 'near', label: 'つける' },
      { k: 'fix',  label: '組に固定' },
      { k: 'heavy', label: '負担の＋を組に分ける' }, // heavy の項目の＋は、担任の負担が明確に増える印なので人数で分ける
      { k: 'cap',  label: '人数の上限' },
      { k: 'sex',  label: '男女の差±1' }

      { c: '#F2C200', t: '#1A1A1A', l: '#FFF5CC' },

    AREAS: ['東', '西', '南', '北'],
    INCIDENT_TYPES: ['対人', '物損', 'いじめ', 'けが', 'その他'],
    TEACHER_DOMAIN: 'edu.nishi.or.jp'

  // 年度の境目は4/1。年度に関わる値はすべてこの関数から出す（principles/roster-year-transition.md §1）
  CONFIG.fiscalYear = function (date) {
    var d = date || new Date();
    return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1;
  };
  CONFIG.fiscalYearOfIso = function (iso) {

/* ▼ src/engine.js から。直すのは src のほう ▼ */
// 計算の正本。画面にもサーバーにも依存しない純粋な関数だけを置く（tests/engine.test.mjs が直接読む）。
// 用語: asg＝案の割り当て（児童の並び順 i → 新しい組 0..nc-1）。kids[i].old＝旧学級（0始まり）。
(function (g) {
  'use strict';
  var C = g.CONFIG;
  var W_HARD = 1000;   // 必ず守る条件1件あたり
  var W_SIZE = 40;     // 人数の偏り（常に効く）
  var W_CAP = 1e5;     // 上限超え1人あたり（必ず守る条件がオンのとき）

  function rngOf(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // 案を作る設定の既定値。重みは段階（0〜3）、必ず守る条件は真偽
  function defaultGen() {
    var w = {};
    C.ATTRS.forEach(function (at) { w[at.k] = at.w; });
    C.EXTRA.forEach(function (ex) { w[ex.k] = ex.w; });
    var hard = {};
    C.HARD.forEach(function (h) { hard[h.k] = true; });
    return { w: w, hard: hard };
  }

  // P: { kids:[{id,male,old,a,area}], pairs:[{t:'far'|'near',i,j}|{t:'fix',i,k}], inc:[{kids:[i]}], nc }
  function prepare(P, gen) {
    gen = gen || defaultGen();
    var N = P.kids.length, nc = P.nc;
    var oldN = 0;
    P.kids.forEach(function (s) { if (s.old + 1 > oldN) oldN = s.old + 1; });
    var MET = [];
    MET.push({ k: 'sex', label: '男', w: C.LEVEL_W[gen.w.sex | 0], tol: 1, v: function (s) { return s.male ? 1 : 0; } });
    C.ATTRS.forEach(function (at) {
      // 程度は足さず「いるか」で数える（heavy の項目の＋は下の別枠で数える）
      MET.push({ k: at.k, label: at.s, w: C.LEVEL_W[gen.w[at.k] | 0], tol: 1, at: at, v: function (s) { return (s.a[at.k] | 0) ? 1 : 0; } });
    });
    for (var o = 0; o < oldN; o++) (function (o) {
      MET.push({ k: 'old' + o, grp: 'old', label: '旧' + (o + 1), w: C.LEVEL_W[gen.w.old | 0], tol: 2, v: function (s) { return s.old === o ? 1 : 0; } });
    })(o);
    C.AREAS.forEach(function (ar) {
      MET.push({ k: 'area' + ar, grp: 'area', label: ar, w: C.LEVEL_W[gen.w.area | 0], tol: 2, v: function (s) { return s.area === ar ? 1 : 0; } });
    });
    // ＋（程度2）：＋はアイコン2つ分ではなく、担任の負担が明確に増える印。項目ごとと、4項目のどれかが＋の児童の人数。必ず守る条件で各組の上限（均等割の切り上げ）を超えさせない
    var heavyAt = C.ATTRS.filter(function (at) { return at.heavy; });
    heavyAt.forEach(function (at) {
      MET.push({ k: at.k + '++', grp: 'heavy', label: at.s + '＋', w: C.LEVEL_W[gen.w[at.k] | 0], tol: 1, v: function (s) { return (s.a[at.k] | 0) >= 2 ? 1 : 0; } });
    });
    MET.push({ k: 'heavy', grp: 'heavy', label: '＋の児童', w: C.LEVEL_W[3], tol: 1, v: function (s) { return heavyAt.some(function (at) { return (s.a[at.k] | 0) >= 2; }) ? 1 : 0; } });
    var M = MET.length;
    var VAL = P.kids.map(function (s) { return MET.map(function (m) { return m.v(s); }); });
    var MEAN = MET.map(function (m, mi) { var t = 0; for (var i = 0; i < N; i++) t += VAL[i][mi]; return t / nc; });
    var relOf = P.kids.map(function () { return []; });
    P.pairs.forEach(function (p, pi) {
      if (p.t === 'fix') { relOf[p.i].push(pi); return; }
      relOf[p.i].push(pi); relOf[p.j].push(pi);
    });
    var incOfKid = P.kids.map(function () { return []; });
    (P.inc || []).forEach(function (x, xi) { x.kids.forEach(function (i) { incOfKid[i].push(xi); }); });
    var HV = [];
    MET.forEach(function (m, mi) { if (m.grp === 'heavy') HV.push({ m: mi, max: Math.ceil(MEAN[mi] - 1e-9) }); });
    return { P: P, N: N, nc: nc, cap: P.cap || C.CAP, M: M, MET: MET, VAL: VAL, MEAN: MEAN, SIZE_MEAN: N / nc, HV: HV,
      relOf: relOf, incOfKid: incOfKid, gen: gen, wInc: C.LEVEL_W[gen.w.inc | 0] };
  }

  function counts(ctx, asg) {
    var c = [], k, i, m;
    for (k = 0; k < ctx.nc; k++) c.push(new Float64Array(ctx.M + 1));
    for (i = 0; i < ctx.N; i++) {
      var r = c[asg[i]], v = ctx.VAL[i];
      r[ctx.M]++;
      for (m = 0; m < ctx.M; m++) r[m] += v[m];
    }
    return c;
  }

  // 違反の判定は1か所に置く（画面の表示と計算で食い違わないように）
  function pairBroken(p, asg) {
    if (p.t === 'far') return asg[p.i] === asg[p.j];
    if (p.t === 'near') return asg[p.i] !== asg[p.j];
    return asg[p.i] !== p.k; // fix
  }
  function hardPairViol(ctx, asg) {
    var n = 0, h = ctx.gen.hard;
    ctx.P.pairs.forEach(function (p) { if (h[p.t] && pairBroken(p, asg)) n++; });
    return n;
  }

  // 組の事案数：同じ事案に同じ組の児童が複数いても1件と数える
  function incByClass(ctx, asg) {
    var v = new Array(ctx.nc).fill(0);
    (ctx.P.inc || []).forEach(function (x) {
      var seen = {};
      x.kids.forEach(function (i) { var k = asg[i]; if (!seen[k]) { seen[k] = 1; v[k]++; } });
    });
    return v;
  }
  // 事案数は児童ごとの足し算にならないので別に計算する。重みが0の間は計算しない
  function incPenalty(ctx, asg) {
    if (!ctx.wInc) return 0;
    var v = incByClass(ctx, asg), m = 0, t = 0, k;
    for (k = 0; k < v.length; k++) m += v[k];
    m /= v.length;
    for (k = 0; k < v.length; k++) t += (v[k] - m) * (v[k] - m);
    return ctx.wInc * t;
  }

  function balance(ctx, c) {
    var t = 0, h = ctx.gen.hard, k, m;
    for (k = 0; k < ctx.nc; k++) {
      var r = c[k];
      for (m = 0; m < ctx.M; m++) { var d = r[m] - ctx.MEAN[m]; t += ctx.MET[m].w * d * d; }
      var ds = r[ctx.M] - ctx.SIZE_MEAN; t += W_SIZE * ds * ds;
      if (h.cap && r[ctx.M] > ctx.cap) t += W_CAP * (r[ctx.M] - ctx.cap);
      if (h.sex) { var ex = Math.abs(r[0] - ctx.MEAN[0]) - 1; if (ex > 0) t += W_HARD * ex; }
      if (h.heavy) for (var q = 0; q < ctx.HV.length; q++) { var eh = r[ctx.HV[q].m] - ctx.HV[q].max; if (eh > 0) t += W_HARD * eh; }
    }
    return t;
  }

  function score(ctx, asg) {
    return W_HARD * hardPairViol(ctx, asg) + balance(ctx, counts(ctx, asg)) + incPenalty(ctx, asg);
  }

  // 案を作る：固定（locked: Map i→組）と「組に固定」を守り、残りを焼きなましで入れ替える
  function optimize(ctx, locked, seed) {
    var r = rngOf(seed), N = ctx.N, nc = ctx.nc, M = ctx.M;
    var lock = new Map(locked || []);
    if (ctx.gen.hard.fix) ctx.P.pairs.forEach(function (p) { if (p.t === 'fix' && p.k < nc) lock.set(p.i, p.k); });
    var asg = new Int8Array(N), free = [], sz = new Array(nc).fill(0), i, j, k;
    for (i = 0; i < N; i++) { if (lock.has(i)) { asg[i] = lock.get(i); sz[asg[i]]++; } else free.push(i); }
    for (i = free.length - 1; i > 0; i--) { j = Math.floor(r() * (i + 1)); var tmp = free[i]; free[i] = free[j]; free[j] = tmp; }
    free.forEach(function (i) { var b = 0; for (var k = 1; k < nc; k++) if (sz[k] < sz[b]) b = k; asg[i] = b; sz[b]++; });
    if (free.length < 2) return asg;
    var c = counts(ctx, asg), pv = hardPairViol(ctx, asg);
    var cur = W_HARD * pv + balance(ctx, c) + incPenalty(ctx, asg);
    var IT = 50000, T = 8, cool = Math.pow(0.002 / 8, 1 / IT);
    for (var it = 0; it < IT; it++, T *= cool) {
      i = free[Math.floor(r() * free.length)]; j = free[Math.floor(r() * free.length)];
      var a = asg[i], b = asg[j];
      if (a === b) continue;
      var vi = ctx.VAL[i], vj = ctx.VAL[j], m, d;
      for (m = 0; m < M; m++) { d = vj[m] - vi[m]; c[a][m] += d; c[b][m] -= d; }
      asg[i] = b; asg[j] = a;
      var npv = (ctx.relOf[i].length || ctx.relOf[j].length) ? hardPairViol(ctx, asg) : pv;
      var nxt = W_HARD * npv + balance(ctx, c) + (ctx.wInc ? incPenalty(ctx, asg) : 0);
      if (nxt <= cur || r() < Math.exp((cur - nxt) / T)) { cur = nxt; pv = npv; }
      else { asg[i] = a; asg[j] = b; for (m = 0; m < M; m++) { d = vj[m] - vi[m]; c[a][m] -= d; c[b][m] += d; } }
    }
    return asg;
  }

  // 画面に出す違反（✕）と偏り（△）
  function analyze(ctx, asg) {
    var c = counts(ctx, asg), bad = [], warn = [], kids = ctx.P.kids, k, m;
    ctx.P.pairs.forEach(function (p) {
      if (!pairBroken(p, asg)) return;
      if (p.t === 'far') bad.push({ t: 'far', txt: '離す：' + kids[p.i].name + ' と ' + kids[p.j].name + ' が同じ' + (asg[p.i] + 1) + '組', ids: [p.i, p.j] });
      else if (p.t === 'near') bad.push({ t: 'near', txt: 'つける：' + kids[p.i].name + '（' + (asg[p.i] + 1) + '組）と ' + kids[p.j].name + '（' + (asg[p.j] + 1) + '組）が別', ids: [p.i, p.j] });
      else bad.push({ t: 'fix', txt: '組に固定：' + kids[p.i].name + ' が' + (p.k + 1) + '組でない', ids: [p.i] });
    });
    var flag = [];
    for (k = 0; k < ctx.nc; k++) {
      flag.push(new Array(ctx.M + 1).fill(false));
      if (c[k][ctx.M] > ctx.cap) { flag[k][ctx.M] = true; bad.push({ t: 'cap', txt: (k + 1) + '組 ' + c[k][ctx.M] + '人（上限' + ctx.cap + '人）', ids: [] }); }
      else if (Math.abs(c[k][ctx.M] - ctx.SIZE_MEAN) > 1) { flag[k][ctx.M] = true; warn.push({ txt: (k + 1) + '組 人数 ' + c[k][ctx.M] + '（平均' + ctx.SIZE_MEAN.toFixed(1) + '）', k: k, m: ctx.M }); }
      ctx.HV.forEach(function (hv) {
        if (c[k][hv.m] > hv.max) { flag[k][hv.m] = true; bad.push({ t: 'heavy', txt: (k + 1) + '組 ' + ctx.MET[hv.m].label + ' ' + c[k][hv.m] + '人（各組' + hv.max + '人まで）', ids: [] }); }
      });

// クラス分け：全員を1画面に並べ、案をタブに積み、入れ替え・比較・決定する。
// 計算はすべて Engine。ここは状態と描画と操作だけを持つ。
(function (g) {
  'use strict';
  var App = g.App, C = g.CONFIG, E = g.Engine;
  var LET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var S = null; // { P, ctx, plans, active, view, sel, follow, lastGen, nc, readOnly }

  // ===== 読み込み：今年度の名簿から問題を組み立てる =====
  function build() {
    var d = App.st.data, cur = d.years.filter(function (y) { return y.fy === d.fy; })[0];
    var rows = cur.rows.slice().sort(function (a, b) { return a.cls - b.cls || a.no - b.no; });
    var idx = {};
    var kids = rows.map(function (r, i) {
      var s = d.kids[r.id]; idx[r.id] = i;
      return { id: r.id, name: s.name, kana: s.kana, male: s.male, old: r.cls, no: r.no, a: r.a, area: s.area };
    });
    var pairs = [];
    d.pairs.forEach(function (p) {
      if (!(p.a in idx)) return;
      if (p.t === 'fix') pairs.push({ t: 'fix', i: idx[p.a], k: p.k });
      else if (p.b in idx) pairs.push({ t: p.t, i: idx[p.a], j: idx[p.b] });
    });
    // 事案数は在籍中の全期間で数える（同じ事案は1件）
    var inc = d.incidents.map(function (x) { return { kids: x.ids.filter(function (id) { return id in idx; }).map(function (id) { return idx[id]; }) }; })
      .filter(function (x) { return x.kids.length; });
    var oldN = 0; kids.forEach(function (s) { if (s.old + 1 > oldN) oldN = s.old + 1; });
    var nc = Math.min(C.MAX_CLASSES, Math.max(2, oldN));
    var P = { kids: kids, pairs: pairs, inc: inc, nc: nc, cap: C.CAP };
    var ji = kids.map(function () { return 0; });
    inc.forEach(function (x) { x.kids.forEach(function (i) { ji[i]++; }); });
    S = { P: P, idx: idx, ji: ji, plans: [], active: 0, view: 'plan', sel: -1, follow: null, lastGen: E.defaultGen(), letIdx: 0,
      decision: d.decision };
    S.ctx = E.prepare(P, S.lastGen);
    // 保存済みの案を戻す
    (d.plans || []).forEach(function (sp) {
      var asg = new Int8Array(kids.length);
      kids.forEach(function (s, i) { asg[i] = sp.assign[s.id] | 0; });
      var locks = new Set((sp.locks || []).filter(function (id) { return id in idx; }).map(function (id) { return idx[id]; }));
      S.plans.push({ letter: sp.letter, name: sp.name, auto: sp.auto, gen: sp.gen || E.defaultGen(), asg: asg, locks: locks, hist: [], fut: [], edits: sp.edits | 0, from: sp.from || null });
      var li = LET.indexOf(sp.letter); if (li + 1 > S.letIdx) S.letIdx = li + 1;
    });
    if (!S.plans.length) { addGenerated(E.defaultGen(), new Map(), null); persist(); } // 最初の案もすぐ保存する
  }

  function ctxFor(gen) { return E.prepare(S.P, gen); }
  function planName(p) { return '案' + p.letter + '（' + (p.name || p.auto) + '）'; }

  function serialize() {
    return S.plans.map(function (p) {
      var assign = {}; S.P.kids.forEach(function (s, i) { assign[s.id] = p.asg[i]; });
      return { letter: p.letter, name: p.name || '', auto: p.auto, gen: p.gen, assign: assign, locks: Array.from(p.locks).map(function (i) { return S.P.kids[i].id; }), edits: p.edits, from: p.from };
    });
  }
  var saveT = 0;
  function persist() {
    clearTimeout(saveT);
    App.saveState('saving');
    saveT = setTimeout(function () { var grade = App.st.grade, data = serialize(); App.save(function () { return App.pf().savePlans(grade, data); }); }, 1200);
  }

  function addGenerated(gen, locked, from) {
    var ctx = ctxFor(gen), t0 = performance.now();
    var asg = E.optimize(ctx, locked, (Date.now() & 0xffff) * 7919 + S.letIdx);
    var p = { letter: LET[S.letIdx++ % 26], name: '', auto: E.autoName(gen, locked.size), gen: JSON.parse(JSON.stringify(gen)), asg: asg,
      locks: new Set(locked.keys()), hist: [], fut: [], edits: 0, from: from };
    S.plans.push(p); S.active = S.plans.length - 1; S.view = 'plan'; S.sel = -1; S.follow = null;
    return { p: p, ms: Math.round(performance.now() - t0) };
  }

  // ===== 描画 =====
  function chipHTML(i, cls, extra) {
    var s = S.P.kids[i], oc = App.classColor(s.old), esc = App.esc;
    // 名前と旧学級の説明は名前と帯にだけ付ける（アイコンの上ではアイコンの説明を出すため）
    var tt = esc(s.name) + '（旧' + (s.old + 1) + '組' + s.no + '番・' + (s.male ? '男' : '女') + '）';
    // アイコンは項目ごとに決まった位置（--s 番目の枠）に置く。空の枠は要素を作らない（140人×10枠の要素が重いため）
    // 枠：1段目右＝良い項目（賢・リ・運）、2段目右＝その真下に有無だけの項目（ア・身・通）、2段目左＝負担の項目
    var slot = function (pick) {
      var n = 0, out = '';
      C.ATTRS.forEach(function (at) {
        if (!pick(at)) return;
        var v = s.a[at.k] | 0;
        if (v) out += App.mark(at, v, s.a[at.k + '_t']).replace('style="', 'style="--s:' + n + ';');
        n++;
      });
      return out;
    };
    var jn = S.ji[i] ? '<span class="jn" title="事案' + S.ji[i] + '件">' + S.ji[i] + '</span>' : '';
    return '<div class="chip ' + (s.male ? 'm' : 'f') + ' ' + (cls || '') + '" style="--oc:' + oc.c + ';--ot:' + oc.t + ';--ol:' + oc.l + '" data-i="' + i + '" role="button" tabindex="0" aria-label="' + tt + '">' +
      '<span class="old" title="' + tt + '">' + s.no + '</span><span class="l1"><span class="nm" title="' + tt + '">' + esc(s.name) + '</span>' + (extra || '') + '<span class="bs gd">' + slot(function (at) { return at.good; }) + '</span></span>' +
      '<span class="l2"><span class="bs">' + slot(function (at) { return !at.good && !at.side; }) + '</span><span class="bs gd">' + slot(function (at) { return at.side; }) + '</span></span>' +
      '<span class="jr">' + jn + '</span></div>';
  }

  function renderBar() {
    var h = '<button class="btn trial"></button><button class="btn" data-go="menu" title="メニューに戻る">← ' + App.st.grade + '年</button><div class="tabs" role="tablist">';
    S.plans.forEach(function (p, pi) {
      var a = E.analyze(S.ctx, p.asg), v = a.bad.length;
      h += '<span class="tab" role="tab" tabindex="0" data-p="' + pi + '" aria-selected="' + (S.view === 'plan' && pi === S.active) + '" title="ダブルクリックで名前を変える">' +
        (pi < 9 ? '<span class="k">' + (pi + 1) + '</span>' : '') + App.esc(planName(p)) + '<span class="v ' + (v ? 'bad' : '') + '">違反' + v + '・△' + a.warn.length + '</span>' +
        (S.plans.length > 1 && !S.decision ? '<button class="x" data-del="' + pi + '" aria-label="' + p.letter + 'を削除">×</button>' : '') + '</span>';
    });
    h += '<span class="tab cmp" role="tab" tabindex="0" data-cmp="1" aria-selected="' + (S.view === 'cmp') + '"><span class="k">0</span>比較（' + S.plans.length + '案）</span></div>';
    var p = S.plans[S.active], ro = !!S.decision;
    h += '<button class="vio" id="vbtn"' + (S.view === 'cmp' ? ' hidden' : '') + '></button><span class="hint" id="hint"></span><span class="save" id="save2" aria-live="polite"></span>';
    if (ro) h += '<span class="decided">決定済み：' + App.esc(S.decision.plan) + '　4/1まで取り消せます<button class="btn danger" id="undoDecide">決定を取り消す…</button></span>';
    else {
      h += '<button class="btn" id="undo"' + (S.view !== 'plan' || !p.hist.length ? ' disabled' : '') + '>↶ 戻す<kbd>Ctrl+Z</kbd></button>' +
        '<button class="btn" id="redo"' + (S.view !== 'plan' || !p.fut.length ? ' disabled' : '') + '>↷<kbd>Ctrl+Y</kbd></button>' +
        '<button class="btn" id="dup"' + (S.view !== 'plan' ? ' disabled' : '') + '>複製<kbd>D</kbd></button>' +
        (S.plans.length > 1 && !S.decision ? '<button class="btn" id="delp"' + (S.view !== 'plan' ? ' disabled' : '') + '>削除<kbd>Del</kbd></button>' : '') +
        '<button class="btn" id="pairs">つける・離す…<kbd>P</kbd></button>' +
        '<button class="btn" id="decide"' + (App.st.grade >= 6 ? ' disabled title="6年は決定しません"' : '') + '>決定…</button>';
    }
    h += '<button class="btn" id="fs">全画面<kbd>F</kbd></button><button class="btn" id="hbtn" aria-label="ショートカット一覧">?</button>';
    if (!ro) h += '<button class="btn primary" id="gen">案を作る<kbd>G</kbd></button>';
    return '<div class="bar">' + h + '</div>';
  }

  // 盤面の描画。重い処理（寸法の計測）はカードを入れる前に1回だけ行う
  function render() {
    App.$('main').innerHTML = renderBar() + '<div id="board" class="board"></div><div class="legend" id="legend"></div>';
    App.saveState(); App.paintTrial();
    if (S.view === 'cmp') { renderCmp(); return; }
    var p = S.plans[S.active], a = E.analyze(S.ctx, p.asg), nc = S.P.nc;
    var vb = App.$('vbtn');
    vb.className = 'vio' + (a.bad.length ? ' has' : '');
    vb.innerHTML = (a.bad.length ? '✕ 違反 ' + a.bad.length : '違反なし') + '・△ ' + a.warn.length + ' ▾<kbd>V</kbd>';
    var rows = 1, per = [], k, i;
    for (k = 0; k < nc; k++) {
      var ids = [];
      for (i = 0; i < S.ctx.N; i++) if (p.asg[i] === k) ids.push(i);
      ids.sort(function (x, y) { return S.P.kids[x].old - S.P.kids[y].old || S.P.kids[x].no - S.P.kids[y].no; });
      var half = Math.ceil(ids.length / 2);
      per.push([ids.slice(0, half), ids.slice(half)]); rows = Math.max(rows, half);
    }
    var M = S.ctx.M, h = '<div class="cols" style="--nc:' + nc + '">';
    var HM = S.ctx.MET.findIndex(function (m) { return m.k === 'heavy'; });
    for (k = 0; k < nc; k++) {
      var c = a.c[k], fl = a.flag[k];
      var cnt = function (m, inner) { return '<span class="c ' + (fl[m] ? 'w' : '') + '">' + inner + c[m] + '</span>'; };
      h += '<section class="col"><div class="head" data-k="' + k + '" role="button" tabindex="0">' +
        '<div class="h1"><b>' + (k + 1) + '組</b><span class="' + (fl[M] ? 'w' : '') + '">' + c[M] + '人</span><span class="' + (fl[0] ? 'w' : '') + '">男' + c[0] + (fl[0] ? '△' : '') + '</span><span>女' + (c[M] - c[0]) + '</span>' +
        '<span class="' + (fl[HM] ? 'w' : '') + '" title="学・欠・問・保のどれかが＋の児童">＋' + c[HM] + '人</span>' +
        '<span class="jis" title="同じ事案は1件と数える">事案数 ' + a.inc[k] + '</span></div>' +
        '<div class="st">' + C.ATTRS.map(function (at, ai) { return cnt(ai + 1, App.mark(at, 1)); }).join('') + '</div>' +
        '</div><div class="sub2"><div class="gcol"></div><div class="gcol"></div></div></section>';
    }
    App.$('board').innerHTML = h + '</div>';
    // 凡例は計測の前に入れる（後から折り返すと盤面が縮み、最後の児童がはみ出す）
    App.$('legend').innerHTML = C.ATTRS.map(function (at) { return '<span class="c">' + App.mark(at, 1) + at.label + '</span>'; }).join('');
    fit(rows);
    var gcols = App.$('board').querySelectorAll('.gcol');
    for (k = 0; k < nc; k++) for (var g2 = 0; g2 < 2; g2++)
      gcols[k * 2 + g2].innerHTML = per[k][g2].map(function (i) { return chipHTML(i, p.locks.has(i) ? 'locked' : ''); }).join('');
    updateSel();

  }
  function maxOld() { var n = 0; S.P.kids.forEach(function (s) { if (s.old + 1 > n) n = s.old + 1; }); return n; }

  // 選択・離す/つけるの印・移す先の見出し・案内の文だけを書き換える（盤面は作り直さない）
  var marked = [];
  function updateSel() {
    var board = App.$('board'), esc = App.esc;
    if (!board || S.view !== 'plan') return;
    marked.forEach(function (el) { el.classList.remove('sel', 'rel-far', 'rel-near'); });
    marked = [];
    var p = S.plans[S.active];
    var mark = function (i, cls) { var el = board.querySelector('.chip[data-i="' + i + '"]'); if (el) { el.classList.add(cls); marked.push(el); } };
    if (S.sel >= 0) {
      mark(S.sel, 'sel');
      S.ctx.relOf[S.sel].forEach(function (pi) { var pr = S.P.pairs[pi]; if (pr.t !== 'fix') mark(pr.i === S.sel ? pr.j : pr.i, 'rel-' + pr.t); });
    }
    board.querySelectorAll('.head').forEach(function (hd) { hd.classList.toggle('target', S.sel >= 0 && p.asg[S.sel] !== +hd.dataset.k); });
    var hint = App.$('hint');
    hint.className = 'hint' + (S.follow != null ? ' follow' : '');
    // 案内の文は出さない（操作は確認の枠と選択の印で分かる）。続けて入れ替える時だけ、誰の番かを出す
    hint.innerHTML = S.follow != null ? '続けて <b>' + esc(S.P.kids[S.follow].name) + '</b> の入れ替え相手をタップ' : '';
  }

  // 行の高さとアイコンの大きさを、空の列の寸法から決める（全員を1画面に収める）。
  // カードを入れた後に測ると、140人分の配置を2回計算することになり重い
  function fit(rows) {
    var gc = document.querySelector('.gcol');
    if (!gc) return;
    var rh = (gc.clientHeight - (rows - 1) * 2) / rows, rhc = Math.max(18, Math.min(40, rh)), root = document.documentElement.style;
    root.setProperty('--rowh', rhc.toFixed(2) + 'px');
    var ic = Math.min(rhc * .36, (gc.clientWidth - rhc * .31 - rhc * .38 - 10) / ((C.ATTRS.filter(function (a) { return !a.good; }).length + 1) * 1.5 + .1));
    root.setProperty('--ic', Math.max(8, ic).toFixed(2) + 'px');
  }

  function renderCmp() {
    var A = S.plans.map(function (p) { return E.analyze(S.ctx, p.asg); }), ref = S.plans[S.active], M = S.ctx.M;
    var rows = [
      { lab: '違反（離す・つける・固定・上限）', f: function (p, a) { return a.bad.length; }, bad: true },
      { lab: '人数の差', f: function (p, a) { return E.spread(a.c, M); } },
      { lab: '男の数の差', f: function (p, a) { return E.spread(a.c, 0); } }
    ].concat(C.ATTRS.map(function (at, ai) { return { lab: at.label, f: function (p, a) { return E.spread(a.c, ai + 1); } }; })).concat([
      { lab: '旧学級の偏り（最大）', f: function (p, a) { return Math.max.apply(null, S.ctx.MET.map(function (m, mi) { return m.grp === 'old' ? E.spread(a.c, mi) : 0; })); } },
      { lab: '地区の偏り（最大）', f: function (p, a) { return Math.max.apply(null, S.ctx.MET.map(function (m, mi) { return m.grp === 'area' ? E.spread(a.c, mi) : 0; })); } },
      { lab: '事案数の差', f: function (p, a) { return Math.max.apply(null, a.inc) - Math.min.apply(null, a.inc); } },
      { lab: '偏り△の数', f: function (p, a) { return a.warn.length; } },
      { lab: '手で動かした回数', f: function (p) { return p.edits; }, nobest: true },
      { lab: '案' + ref.letter + 'と所属が違う児童', f: function (p) { return E.diffCount(S.ctx, p.asg, ref.asg); }, nobest: true },
      { lab: '元にした案', f: function (p) { return p.from || '—'; }, txt: true },
      { lab: '重み（な・弱・中・強）', f: function (p) { return E.genSummary(p.gen); }, txt: true, small: true },
      { lab: '外した必ず守る条件', f: function (p) { return C.HARD.filter(function (h) { return !p.gen.hard[h.k]; }).map(function (h) { return h.label; }).join('・') || '—'; }, txt: true }
    ]);
    var h = '<div class="cmpwrap"><table class="cmp"><thead><tr><th>指標</th>' + S.plans.map(function (p, pi) { return '<th data-p="' + pi + '" tabindex="0">' + App.esc(planName(p)) + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (r) {
      var vs = S.plans.map(function (p, pi) { return r.f(p, A[pi]); });
      var best = r.nobest || r.txt ? null : Math.min.apply(null, vs), same = !r.txt && vs.every(function (v) { return v === vs[0]; });
      h += '<tr><td>' + App.esc(r.lab) + '</td>' + vs.map(function (v) {
        return '<td class="' + (r.bad && v > 0 ? 'bad ' : '') + (best !== null && v === best && !same ? 'best ' : '') + (r.small ? 'small' : '') + '">' + App.esc(v) + '</td>';
      }).join('') + '</tr>';
    });
    App.$('board').className = 'cmpwrap';
    App.$('board').innerHTML = h + '</tbody></table><p class="note">「所属が違う児童」は組の番号の付け替えを無視して数える。重みの略号：頭文字＋段階（な＝なし）。</p></div>';
  }

  // ===== 確認の枠 =====
  function chipsSide(ids, from, to, ex) {
    return '<div class="side"><div class="lab"><b>' + (from + 1) + '組</b> → ' + (to + 1) + '組</div>' + ids.map(function (i) { return chipHTML(i, ex && ex.indexOf(i) >= 0 ? 'extra' : ''); }).join('') + '</div>';
  }
  function swapDialog(d) {
    var p = S.plans[S.active];
    App.openDlg({
      focus: 'okbtn', d: d,
      html: function () {
        var left, right, arrow, title, ex = [], note = '';
        if (d.type === 'swap') { var r = E.swapChanges(d); d.ch = r.ch; ex = r.ex; left = r.A; right = r.B; arrow = '⇄'; title = '入れ替えますか？'; }
        else { left = d.GA; arrow = '→'; title = (d.kb + 1) + '組へ移しますか？'; }
        if (d.GA.length > 1 || (d.GB && d.GB.length > 1)) note += '<span>「つける」の相手と一緒に動かします。</span>';
        if (ex.length) note += '<span><b>' + ex.map(function (i) { return App.esc(S.P.kids[i].name); }).join('・') + '</b> は人数を合わせるため自動で選びました（偏りが最も小さくなる児童）。</span>' +
          (d.cands.length > d.cnt ? '<button class="btn" data-act="next">別の児童にする（' + ((d.ci / d.cnt | 0) + 1) + '/' + Math.floor(d.cands.length / d.cnt) + '）<kbd>Tab</kbd></button>' : '');
        var br = E.farBreaks(S.ctx, p.asg, d.ch), warn = '';
        d.br = br; d.next = null;
        if (br.length) {
          var tgt = E.farTargets(br, d.ch); d.next = tgt[0];
          warn = '<div class="farbox">離す児童と同じクラスになります。続けて離す児童の入れ替えに移ります。続行しますか？<div class="side" style="margin-top:6px"><div class="lab">離す児童（' + tgt.length + '人）</div>' +
            tgt.slice(0, 3).map(function (i) { return chipHTML(i, ''); }).join('') +
            (tgt.length > 3 ? '<details class="more"><summary>＋ あと' + (tgt.length - 3) + '人</summary><div class="side">' + tgt.slice(3).map(function (i) { return chipHTML(i, ''); }).join('') + '</div></details>' : '') + '</div></div>';
        }
        if (d.type === 'move' && E.sizeOf(p.asg, d.kb) + left.length > C.CAP) warn += '<div class="warnbox">✕ ' + (d.kb + 1) + '組が上限' + C.CAP + '人を超えます</div>';
        return '<div class="pop" data-close="1"><div class="dlg" role="dialog" aria-modal="true" aria-label="' + title + '"><h2>' + title + '</h2>' +
          '<div class="swap">' + chipsSide(left, d.ka, d.kb, ex) + '<div class="arrow">' + arrow + '</div>' +
          (right ? chipsSide(right, d.kb, d.ka, ex) : '<div class="side"><div class="lab"><b>' + (d.kb + 1) + '組</b>（' + E.sizeOf(p.asg, d.kb) + '人 → ' + (E.sizeOf(p.asg, d.kb) + left.length) + '人）</div></div>') + '</div>' +
          (note ? '<div class="notebox">' + note + '</div>' : '') + warn +
          '<div class="acts"><button class="btn" data-act="close">やめる<kbd>Esc</kbd></button><button class="btn primary" data-act="ok" id="okbtn">' +
          (br.length ? '続行する' : d.type === 'swap' ? '入れ替える' : '移す') + '<kbd>Enter</kbd></button></div></div></div>';
      },
      onOk: function () {
        var names = d.type === 'swap' ? d.GA.map(function (i) { return S.P.kids[i].name; }).join('・') + ' ⇄ ' + E.swapChanges(d).B.map(function (i) { return S.P.kids[i].name; }).join('・')
          : d.GA.map(function (i) { return S.P.kids[i].name; }).join('・') + ' → ' + (d.kb + 1) + '組';
        App.closeDlg();
        doMove(d.ch, names);
        if (d.next != null) { S.follow = d.next; S.sel = d.next; updateSel(); flash([d.next]); }
      },
      onTab: function () { if (d.extraSide && d.cands.length > d.cnt) { E.nextCandidate(d); App.refreshDlg(); return true; } return false; }
    });
  }

  function genDialog() {
    var gen = JSON.parse(JSON.stringify(S.lastGen)), p = S.plans[S.active];
    var keep = S.view === 'plan' && p.locks.size;

  // ===== 操作 =====
  function apply(p, ch) { ch.forEach(function (x) { p.asg[x[0]] = x[1]; }); }
  function doMove(changes, msg) {
    var p = S.plans[S.active], prev = changes.map(function (x) { return [x[0], p.asg[x[0]]]; });
    apply(p, changes); p.hist.push({ prev: prev, next: changes, msg: msg }); p.fut = []; p.edits++;
    S.sel = -1; S.follow = null; render(); persist(); App.toast(msg, undo);
    flash(changes.map(function (x) { return x[0]; }));
  }
  function undo() { if (S.view !== 'plan' || S.decision) return; var p = S.plans[S.active], h = p.hist.pop(); if (!h) return; apply(p, h.prev); p.fut.push(h); p.edits--; S.sel = -1; S.follow = null; render(); persist(); App.toast('戻しました：' + h.msg); }
  function redo() { if (S.view !== 'plan' || S.decision) return; var p = S.plans[S.active], h = p.fut.pop(); if (!h) return; apply(p, h.next); p.hist.push(h); p.edits++; S.sel = -1; S.follow = null; render(); persist(); App.toast('やり直しました：' + h.msg); }
  function tapChip(i) {
    if (S.decision) return;
    var p = S.plans[S.active];
    if (S.sel < 0) { S.sel = i; updateSel(); return; }
    if (S.sel === i) { S.sel = -1; S.follow = null; updateSel(); return; }
    if (p.asg[S.sel] === p.asg[i]) { if (S.follow != null) { App.toast('別の組の児童を選んでください'); return; } S.sel = i; updateSel(); return; }
    var d = E.buildSwap(ctxFor(p.gen), p.asg, p.locks, S.sel, i); // 補う児童は、その案を作った重みで選ぶ
    if (d.err) App.toast(d.err); else swapDialog(d);
  }

    if (S.sel < 0 || p.asg[S.sel] === k) return;
    var d = E.buildMove(S.ctx, p.asg, p.locks, S.sel, k);
