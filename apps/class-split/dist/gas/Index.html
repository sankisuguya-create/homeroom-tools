<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>クラス替え</title>
<style>
/* ▼ src/app.css から。直すのは src のほう ▼ */
/* 配置: メニュー → 名簿（年度・組・範囲の切替＋右に児童の記録）／クラス分け（全員を1画面に並べる盤面）。
   色分けは投影と色覚検証を白地で行ったため、明るい配色1種に固定する（docs/design.md §5） */
:root{
  color-scheme:light;
  --bg:#eef1f4; --panel:#ffffff; --ink:#1A1A1A; --sub:#616870; --line:#c9d1d9; --soft:#F1F3F5;
  --link:#0F5EA8; --alert:#C0330A; --alert-soft:#fbe7e1; --fill:#D7E8F8; --fill-b:#FBE3B4;
  /* 校務PC(Windows)・Chromebook・Mac の順。入っていない名前が続くと探す処理で描画が重くなる */
  --f:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","IPAexGothic","IPAGothic",sans-serif;
  --rowh:30px; --ic:12px; --slot:18px; --slotL:18px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);margin:0;font-size:15px;line-height:1.45;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px;
  box-sizing:border-box;display:flex;flex-direction:column}
body.fit{overflow:hidden}
body.fit .top{display:none}
/* 試行中：画面の上端に太い帯と、ボタンの色で、本番でないことを常に見せる */
.btn.trial{font-weight:700}
.btn.trial[aria-pressed="true"]{background:#A85800;color:#fff;border-color:#A85800}
body.trying{box-shadow:inset 0 6px 0 #A85800;padding-top:12px}
body.trying .demo{color:#A85800;font-weight:700;margin-left:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--link)}
kbd{font-family:Consolas,Menlo,var(--f);font-size:.8em;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel)}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:6px}
.top h1{font-size:1.1rem;margin:0}
.crumb{color:var(--sub)}
.crumb button{border:0;background:none;color:var(--link);text-decoration:underline;cursor:pointer;padding:0}
.demo{font-size:.8rem;color:var(--sub);margin-left:auto}
.save{font-size:.8rem;color:var(--sub)}
.save.err{color:var(--alert);font-weight:700}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--link);color:#fff;border-color:var(--link);font-weight:700}
.btn.danger{color:var(--alert);border-color:var(--alert);font-weight:700}
.btn.primary kbd{background:transparent;color:#fff;border-color:#ffffff99}
.btn kbd{margin-left:4px}
@media (max-width:1500px){.bar .btn kbd,.vio kbd{display:none}}
.btn:focus-visible,.tab:focus-visible,.gbtn:focus-visible,.big:focus-visible,.chip:focus-visible,.head:focus-visible,.lv:focus-visible{outline:3px solid var(--link);outline-offset:1px}
.note{font-size:.85rem;color:var(--sub)}
.sp{flex:1}

/* ===== メニュー ===== */
.menu{max-width:760px;width:100%;margin:24px auto;display:flex;flex-direction:column;gap:20px}
.menu h2{font-size:1rem;margin:0 0 8px;color:var(--sub);font-weight:400}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.gbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:14px 0;font-size:1.3rem;font-weight:700;cursor:pointer}
.gbtn[aria-pressed="true"]{border:3px solid var(--link);background:var(--fill);padding:12px 0}
.gbtn small{display:block;font-size:.7rem;font-weight:400;color:var(--sub)}
.bigs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:22px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.big b{font-size:1.4rem}
.big span{color:var(--sub);font-size:.9rem}
.big:hover{border-color:var(--link)}
@media (max-width:560px){.grades{grid-template-columns:repeat(3,1fr)}.bigs{grid-template-columns:1fr}}

/* ===== 印（頭文字＋色＋形。＋で程度） ===== */
.b{position:relative;display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;font-size:.78em;font-weight:700;line-height:1;flex:none;vertical-align:middle;filter:drop-shadow(0 0 .6px #1A1A1A)}
.b>i{position:absolute;inset:0;background:var(--c)}
.b>em{position:relative;font-style:normal;color:var(--t)}
/* ＋は形の中の字の位置に左右されないよう、印の枠を基準に全アイコンで同じ高さ・同じ距離に置く */
.b>u{position:absolute;left:calc(50% + .48em);top:-.34em;display:flex;line-height:0;text-decoration:none}
.b>u>svg{width:.62em;height:.62em;display:block}
/* アイコンの説明（カーソルを合わせると出す）。1つの枠を使い回す */
.tip{position:fixed;z-index:40;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px #0003;padding:8px 12px;font-size:.85rem;line-height:1.6;max-width:22rem;pointer-events:none}
.tip h3{margin:0 0 4px;font-size:.9rem}
.tip table{border-collapse:collapse}
.tip td{padding:1px 8px 1px 0;vertical-align:top}
.tip td:first-child{white-space:nowrap;font-size:1.1rem}
.tip tr.on td{font-weight:700}
.tip .tn{margin:6px 0 0;padding:4px 8px;background:var(--panel,#f4f4f4);border-left:3px solid var(--ink);white-space:pre-wrap;font-weight:700}
.tip p{margin:4px 0 0;color:var(--sub);font-size:.8rem}
/* 学：角が欠けたボロボロの四角（利用者の選んだ案A） */
.square>i{clip-path:polygon(14% 4%,62% 4%,70% 12%,96% 6%,92% 40%,97% 70%,84% 96%,40% 92%,24% 97%,4% 82%,8% 50%,3% 20%)}
.circle>i{clip-path:circle(50%)}
.diamond>i{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
/* 問：ちくちくした形（とげ14本）。保：家の形。リ：旗の形（長方形の右端に「く」の字の切れ込み。利用者のスケッチの案B） */
.burst>i{clip-path:polygon(50.0% 0.0%,59.3% 9.1%,71.7% 5.0%,76.2% 17.2%,89.1% 18.8%,87.8% 31.8%,98.7% 38.9%,92.0% 50.0%,98.7% 61.1%,87.8% 68.2%,89.1% 81.2%,76.2% 82.8%,71.7% 95.0%,59.3% 90.9%,50.0% 100.0%,40.7% 90.9%,28.3% 95.0%,23.8% 82.8%,10.9% 81.2%,12.2% 68.2%,1.3% 61.1%,8.0% 50.0%,1.3% 38.9%,12.2% 31.8%,10.9% 18.8%,23.8% 17.2%,28.3% 5.0%,40.7% 9.1%)}
/* 字はすべての印で同じ大きさ。字が収まらない形は、形の方を大きくする。問は、その分だけ形を大きくする（とげの内側に字が収まる大きさ） */
.b.burst{width:1.8em;height:1.8em;margin:-.15em}
.bs>.b.burst{width:1.5em;height:1.5em;margin:0}
.house>i{clip-path:polygon(50% 0,100% 44%,100% 100%,0 100%,0 44%)}
.house>em{top:.12em}
.b.house{width:1.65em;height:1.65em;margin:-.08em}
.bs>.b.house{width:1.4em;height:1.4em;margin:0}
/* リ：右の切れ込みは深さ38%（横幅を広げたので浅くした分を戻した） */
.crown>i{clip-path:polygon(0 4%,100% 4%,62% 50%,100% 96%,0 96%)}
.crown>em{left:-.2em}
.b.crown{width:1.75em}
.bs>.b.crown{width:1.45em}
.diamond>em{font-size:.82em}
.hexagon>i{clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%)}
/* 賢：正方形 */
.plain>i{inset:.06em}
.pentagon>i{clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.pentagon>em{top:.1em}
.b.pill{width:2em}.pill>i{clip-path:inset(12% 0 round 999px)}
.b.para{width:1.9em}.para>i{clip-path:polygon(25% 6%,100% 6%,75% 94%,0 94%)}
.b.shell{width:2.15em}
.bs>.b.shell{width:1.8em}
/* 通：貝殻の形（上下がふくらんだ横長の形。左右の小さなとげは無し） */
.shell>i{clip-path:polygon(2.0% 50.0%,6.0% 40.4%,10.0% 34.0%,14.0% 28.6%,18.0% 23.8%,22.0% 19.7%,26.0% 16.1%,30.0% 13.0%,34.0% 10.5%,38.0% 8.5%,42.0% 7.1%,46.0% 6.3%,50.0% 6.0%,54.0% 6.3%,58.0% 7.1%,62.0% 8.5%,66.0% 10.5%,70.0% 13.0%,74.0% 16.1%,78.0% 19.7%,82.0% 23.8%,86.0% 28.6%,90.0% 34.0%,94.0% 40.4%,98.0% 50.0%,94.0% 59.1%,90.0% 65.2%,86.0% 70.4%,82.0% 75.0%,78.0% 78.9%,74.0% 82.4%,70.0% 85.3%,66.0% 87.7%,62.0% 89.6%,58.0% 90.9%,54.0% 91.7%,50.0% 92.0%,46.0% 91.7%,42.0% 90.9%,38.0% 89.6%,34.0% 87.7%,30.0% 85.3%,26.0% 82.4%,22.0% 78.9%,18.0% 75.0%,14.0% 70.4%,10.0% 65.2%,6.0% 59.1%)}
.b.shell{height:1.7em;margin:-.1em 0}
.bs>.b.shell{height:1.45em;margin:0}
.octagon>i{clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.shield>i{clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
.shield>em{top:-.1em}
/* 事案の数字：点線の枠の上下左右の中央に置く */
.jn{display:inline-flex;align-items:center;justify-content:center;min-width:1.25em;height:1.25em;border:1.5px dashed #1A1A1A;border-radius:3px;padding:0 .15em;font-size:.82em;line-height:1;box-sizing:border-box;font-variant-numeric:tabular-nums;text-align:center}
.band{display:inline-block;width:5px;height:1.2em;vertical-align:middle;margin-right:6px;border-radius:1px}

/* ===== 名簿 ===== */
.rbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--fill);border:2px solid var(--link);padding:3px 9px;font-weight:700}
.lab{color:var(--sub);font-size:.85rem;margin-right:2px}
.chk{display:inline-flex;gap:4px;align-items:center;font-size:.9rem;cursor:pointer}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:10px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:1fr}}
.tw{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:100%}
table.r{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.r th,table.r td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:center;white-space:nowrap}
table.r th{background:var(--soft);font-weight:400;font-size:.85rem;position:sticky;top:0;z-index:1}
table.r td.nm{text-align:left;font-weight:700;cursor:pointer}
table.r td.nm:hover{text-decoration:underline}
table.r tr.on td{background:var(--fill)}
td.cell{cursor:pointer;min-width:2.2em;height:28px;font-size:17px}
td.cell:hover{background:var(--soft)}
table.ro td.cell{cursor:default}
table.ro td.cell:hover{background:none}
td.ji{cursor:pointer}
.sx{color:var(--sub);font-weight:700;font-size:.8rem;margin-right:4px}
.sx.f{color:#D11F3A}
.sx.m{color:#1A62D6}
.frozen{font-size:.85rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;box-sizing:border-box}
.pane h2{margin:0;font-size:1.2rem}
.pane h3{margin:0 0 4px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pane .id{color:var(--sub);font-size:.85rem;font-weight:400}
.empty{color:var(--sub);padding:20px 0;text-align:center}
table.h{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
table.h th,table.h td{border-bottom:1px solid var(--line);padding:3px 3px;text-align:center}
table.h th{background:var(--soft);font-weight:400}
table.h tr.cur td{font-weight:700}
.inc{display:flex;flex-direction:column;gap:6px}
.inc .it{border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.inc .meta{font-size:.8rem;color:var(--sub)}
.form{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px}
.form label{display:flex;flex-direction:column;gap:2px;font-size:.85rem}
.form input,.form select{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.form .row{display:flex;gap:6px}
.form .row>*{flex:1}
.picked{display:flex;flex-wrap:wrap;gap:4px}
.picked span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.85rem}
.picked button{border:0;background:none;cursor:pointer;color:var(--sub);padding:0 0 0 4px}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;background:var(--panel);max-height:150px;overflow:auto}
.sugg button{border:0;background:none;text-align:left;padding:3px 8px;cursor:pointer}
.sugg button:hover{background:var(--fill)}

/* ===== クラス分け ===== */
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:6px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.tab .k{font-size:.72rem;color:var(--sub);font-weight:400}
.tab .v{font-size:.78rem;color:var(--sub);font-weight:400}
.tab .v.bad{color:var(--alert);font-weight:700}
.tab .x{border:0;background:none;color:var(--sub);cursor:pointer;padding:0 2px;line-height:1}
.tab.cmp{border-style:dashed}
.vio{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.vio.has{border-color:var(--alert);color:var(--alert);background:var(--alert-soft);font-weight:700}
.hint{flex:1;min-width:0;font-size:.95rem;color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint b{color:var(--ink)}
.hint.follow{color:var(--ink);font-weight:700}
.decided{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:.9rem;display:flex;gap:10px;align-items:center}
.board{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden}
.cols{height:100%;display:grid;grid-template-columns:repeat(var(--nc),minmax(260px,1fr));gap:6px;min-width:min-content}
.col{container-type:inline-size;background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0;min-height:0}
.head{padding:2px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.head.target{background:var(--fill)}
.h1{display:flex;gap:10px;align-items:baseline;font-variant-numeric:tabular-nums;white-space:nowrap}
.h1 b{font-size:1.1rem}
.h1 .w{color:var(--alert);font-weight:700}
.jis{border:1.5px dashed #1A1A1A;border-radius:3px;padding:0 5px;font-size:.85rem}
.st{display:flex;flex-wrap:nowrap;gap:0 .4em;font-size:min(.8rem,calc((100cqw - 16px) / 37));white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;align-items:center}
.st .w{color:var(--alert);font-weight:700}
.st .w::after{content:"△"}
.st.sub{color:var(--sub)}
.st .c{display:inline-flex;gap:2px;align-items:center}
.sub2{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px}
.gcol{display:flex;flex-direction:column;gap:2px;min-height:0;min-width:0}
.gcol>.chip{height:var(--rowh);flex:none;box-sizing:border-box}
/* 児童カード：男＝長方形、女＝ピル型。左端は旧学級の色の帯（旧番号）、地は旧学級の薄い色 */
.chip{display:grid;grid-template-columns:var(--bandw) minmax(0,1fr) var(--jrw);grid-template-rows:1fr 1fr;min-width:0;border:1px solid var(--line);
  cursor:pointer;--bandw:calc(var(--rowh)*.31);--jrw:calc(var(--rowh)*.5);font-size:calc(var(--rowh)*.36);line-height:1;user-select:none;position:relative;background:var(--ol,var(--panel))}
.chip.m{border-radius:2px}
.chip.f{border-radius:999px}
/* 帯の角はカードの角に合わせる（アイコンをはみ出させるので、カードで切り取らない） */
.chip.m .old{border-radius:1px 0 0 1px}
.chip.f .old{border-radius:999px 0 0 999px}
.chip:hover{border-color:var(--sub)}
.chip.sel{border:3px solid var(--link);box-shadow:inset 0 0 0 2px #fff}
.chip.locked{background:repeating-linear-gradient(135deg,var(--ol) 0 5px,#0000001f 5px 6px)}
.chip.locked .nm::before{content:"固 ";color:var(--sub);font-weight:400}
.chip.rel-far .nm::after{content:" 離";color:var(--alert)}
.chip.rel-near .nm::after{content:" つ";color:var(--link)}
.chip.rel-far{outline:4px solid var(--alert);outline-offset:-4px}
.chip.rel-near{outline:2px dashed var(--link);outline-offset:-1px}
.chip.flash{animation:fl 1.1s ease-out 2}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--fill-b)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.chip.flash{animation:none;box-shadow:0 0 0 4px var(--fill-b)}}
.old{grid-row:1/3;background:var(--oc);color:var(--ot);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.5em;font-variant-numeric:tabular-nums}
.l1{display:flex;align-items:center;gap:3px;padding:0 4px 1px;min-width:0}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;font-size:calc(var(--rowh)*.38);letter-spacing:-.02em}
.side .chip .nm{font-size:20px}
.bs{position:relative;font-size:var(--ic);margin:0 4px}
.bs>.b{position:absolute;left:calc(var(--s)*var(--slot));top:50%;transform:translateY(-50%)}
/* 右の枠（1段目＝賢・リ・運、2段目＝ア・身・通）は男女で同じ位置。縦に並ぶ児童でそろう */
.bs.gd{margin:0 0 0 auto;align-self:stretch;width:calc(3*var(--slot));flex:none}
.l2{display:flex;min-width:0;padding:0 4px 0 0}
.l2>.bs:first-child{flex:1;--slot:var(--slotL)}
/* 事案の数：旧番号の帯の反対側（右端）に、2段の真ん中で置く */
.chip .bs>.b{z-index:1}
/* ＋のアイコン（学・欠・問・保）は大きくし、下へはみ出してよい */
.chip .bs>.b[data-lv="2"]{z-index:2;transform:translateY(-50%) scale(1.3);transform-origin:50% 10%}
.jr{grid-column:3;grid-row:1/3;display:flex;align-items:center;justify-content:flex-start;font-size:var(--ic)}
.bs>.b{width:1.25em;height:1.25em}
.bs>.b.pill,.bs>.b.para{width:1.3em}
/* 横幅はいちばん広い形（貝）にそろえ、ほかの形も横に広げる（縦はそのまま） */
.b.b{width:2.15em}
.bs>.b.b{width:1.8em}
.rt{font-size:.85em;font-weight:700;flex:none}
.rt.far{color:var(--alert)} .rt.near{color:var(--link)}
.lkm{flex:none;color:var(--sub);font-size:.85em}
.cmpwrap{flex:1;min-height:0;overflow:auto}
table.cmp{border-collapse:collapse;background:var(--panel);font-variant-numeric:tabular-nums}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 12px;text-align:center;white-space:nowrap}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp thead th{background:var(--fill);cursor:pointer;white-space:normal;min-width:7em}
table.cmp td.best{font-weight:700}
table.cmp td.best::after{content:" ★";color:var(--link)}
table.cmp td.bad{color:var(--alert);font-weight:700}
table.cmp td.small{font-size:.8rem;white-space:normal;max-width:14em;text-align:left}
.legend{font-size:.78rem;color:var(--sub);padding-top:2px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.legend .c{display:inline-flex;gap:3px;align-items:center}

/* ===== 浮く枠 ===== */
.pop{position:fixed;inset:0;background:#1a1a1a66;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg{background:var(--panel);border-radius:10px;padding:18px 20px;max-width:min(920px,100%);width:100%;box-shadow:0 10px 30px #0004;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto;box-sizing:border-box}
.dlg h2{margin:0;font-size:1.3rem}
.swap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.side .lab{font-size:.9rem;color:var(--sub);font-variant-numeric:tabular-nums}
.side .lab b{color:var(--ink);font-size:1.05rem}
.side .chip{--rowh:52px;height:52px;cursor:default}
.side .chip .bs{font-size:17px;--slot:1.7em}
.side .chip .old{font-size:.8em}
.side .chip.extra{border:2px dashed #A85800}
.arrow{font-size:2.4rem;color:var(--link);font-weight:700;line-height:1}
.notebox{font-size:.9rem;background:var(--fill-b);border-radius:6px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.farbox{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.more summary{cursor:pointer;padding:4px 0;font-weight:700;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more[open] summary{color:var(--sub)}
.warnbox{border:2px solid var(--alert);background:var(--alert-soft);color:var(--alert);border-radius:6px;padding:8px 10px;font-weight:700}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.acts .btn{padding:8px 16px;font-size:1rem}
.viol{position:fixed;z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #0003;padding:8px 12px;max-height:60vh;overflow:auto;max-width:min(560px,calc(100% - 32px))}
.viol ul{margin:0;padding-left:1.2em}
.viol li{cursor:pointer;padding:3px 0}
.viol li:hover{text-decoration:underline}
.viol .k{font-weight:700}.viol .k.bad{color:var(--alert)}
.gen table{border-collapse:collapse;width:100%}
.gen td{padding:4px 6px;border-bottom:1px solid var(--line)}
.gen td:first-child{white-space:nowrap}
.lvs{display:flex;gap:3px}
.lv{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:2px 10px;cursor:pointer;min-width:3em}
.lv[aria-pressed="true"]{background:var(--link);color:#fff;border-color:var(--link);font-weight:700}
/* 「必」：必ず守る条件になる特別な段階。濃い赤紫の地に金の縁 */
.lv.must{border:2px solid #8B1E5A;color:#8B1E5A;font-weight:700;margin-left:6px}
.lv.must[aria-pressed="true"]{background:#8B1E5A;color:#fff;border-color:#E0A800;box-shadow:0 0 0 2px #E0A800}
.mustwarn{border:2px solid #8B1E5A;background:#FBEAF2;color:#5A0E38;border-radius:6px;padding:6px 10px;font-size:.9rem}
.gencols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.gencols{grid-template-columns:1fr}}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--fill);border-color:var(--link);font-weight:700}
.tg[aria-pressed="true"]::before{content:"✓ "}
.help table{border-collapse:collapse}
.help td{padding:4px 10px;border-bottom:1px solid var(--line)}
.dlg input[type=text]{padding:6px 8px;border:1px solid var(--line);border-radius:4px;font-size:1rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;display:flex;gap:12px;align-items:center;z-index:30;cursor:pointer;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.toast button{background:none;border:1px solid #fff9;color:#fff;border-radius:4px;padding:2px 8px;cursor:pointer}

/* 特別支援学級（名簿の「支」）・転入生の凡例 */
.spb{display:inline-block;background:#FFE0BF;border:1px solid #C77A2E;color:#7A3E00;border-radius:3px;padding:0 4px;font-weight:700;font-size:.85em}
.lg{display:inline-block;width:1.6em;height:1em;border:1px solid var(--line);border-radius:2px;vertical-align:middle}
.lg.tr{background:linear-gradient(90deg,#8C8C8C 0 30%,#fff 30%)}
.trf{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;align-items:center}
.trf input{flex:1 1 10em;min-width:0;padding:6px 8px;font-size:1rem}

/* 設定：説明文の欄 */
.hrow td{border-top:0;padding-top:0}
.hlp{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.85rem}
.hlp label{display:flex;align-items:center;gap:4px;flex:1 1 14em;min-width:0}
.hlp label>span{flex:none;color:var(--sub);font-size:.9em;min-width:2.6em}
.hlp input{flex:1;min-width:0;padding:3px 6px;border:1px solid var(--line);border-radius:4px;font:inherit}

/* ===== 名簿・クラス分け：背景を黒に（板や表の中は白地のまま。色分けの検証は白地で行ったため） ===== */
body[data-screen="split"],body[data-screen="roster"]{background:#111;color:#ECECEC}
body[data-screen="split"] :is(.top,.bar,.legend),body[data-screen="roster"] :is(.top,.rbar,.legend){--sub:#B9C1C9}
body[data-screen="split"] .hint{color:#ECECEC}
:is(.btn,.tab,.lv,.frozen,.col,.tw,.pane,.dlg,.tip){color:var(--ink);--sub:#616870}
/* 新しい組の枠の中は、その組の色をさらに薄くした地（カードの地＝旧学級の色より薄い） */
.col{background:#F7F8FA}
/* 新しい組の枠：旧学級の色（カードの地）と混ざらないよう、色相を持たない灰の濃淡を交互に。組の名前は黒地に白で示す */
.col.nc1{background:#D9DFE6}
.ncl{display:inline-block;background:#1A1A1A;color:#fff;border-radius:4px;padding:0 8px;letter-spacing:.05em}
/* 名簿の表：横線に加えて縦線も薄く引く */
body[data-screen="roster"] table.r :is(th,td){border-right:1px solid #E3E8ED}
body[data-screen="roster"] table.r :is(th,td):last-child{border-right:0}
/* 黒地の凡例では、黒いアイコン（欠）が沈まないよう白い縁を付ける */
body[data-screen="split"] .legend .b,body[data-screen="roster"] .legend .b{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 .5px #fff)}

/* ===== 名簿：表を広く・大きく。＋のアイコンは大きく、ふつうのアイコンは少しだけ小さく ===== */
body[data-screen="roster"] .layout{grid-template-columns:minmax(0,1fr)}
body[data-screen="roster"] table.r{font-size:17px}
body[data-screen="roster"] table.r :is(th,td){padding:5px 6px}
/* マスの幅と高さを固定し、＋のアイコンは描くときだけ拡大する（行の高さ・列の幅を変えない） */
body[data-screen="roster"] table.r td.cell{width:2.6em;min-width:2.6em;max-width:2.6em;height:38px;padding:0;box-sizing:border-box;overflow:visible}
body[data-screen="roster"] table.r td.cell .b{font-size:.9em}
body[data-screen="roster"] table.r td.cell .b[data-lv="2"]{transform:scale(1.45)}
/* 特別支援学級：有無だけなので最小の幅 */
body[data-screen="roster"] table.r :is(th,td).spc{width:2.2em;min-width:2.2em;max-width:2.2em;padding:0 2px;font-size:.78em}
body[data-screen="roster"] table.r th.spc{vertical-align:bottom}
body[data-screen="roster"] table.r td.spc .spb{font-size:1.1em;padding:0 3px}
/* つける・離す：数だけ。相手はカーソルで出す */
body[data-screen="roster"] table.r th.pr{font-size:.78em;line-height:1.2;vertical-align:bottom}
table.r td.pr{min-width:3.4em;max-width:16em;white-space:normal;text-align:left}
table.r td.pr.ed,table.r td.memo.ed{cursor:pointer}
table.r td.pr.ed:hover,table.r td.memo.ed:hover{background:var(--soft)}
.prm{display:inline-flex;gap:3px}
:is(.prm,.prd) :is(b.pf,b.pn,b.px){font-size:.8em;padding:0 3px;border-radius:3px;border:1.5px solid;font-weight:700}
.prd .pf{color:var(--alert);border-color:var(--alert)}.prd .pn{color:var(--link);border-color:var(--link)}
.prm .pf{color:var(--alert);border-color:var(--alert)}
.prm .pn{color:var(--link);border-color:var(--link)}
.prm .px{color:var(--sub);border-color:var(--sub)}
/* 備考：1行で切り、全文はカーソルで出す（押すと書ける） */
table.r :is(th,td).memo{text-align:left;min-width:10em;font-size:.85em}
table.r td.memo>div{width:0;min-width:100%;overflow:hidden;text-overflow:ellipsis}
/* 名前の列は枠の幅だけ。表の余りは備考の列が受ける */
body[data-screen="roster"] table.r :is(th,td):nth-child(-n+3):not(.cell){width:1%}
body[data-screen="roster"] table.r th .b{font-size:.8em}
/* 児童の窓（経年の記録と事案） */
.kidpop{width:min(760px,94vw);max-height:88vh;max-width:none;position:relative;padding:14px 16px}
.kidpop .kx{position:absolute;right:12px;top:10px}
.kidpop h2{padding-right:7em}
.kidpop table.h{font-size:.95rem}
body[data-screen="roster"] table.r td.nm{font-size:1em;letter-spacing:0}
/* 名簿の見出し：項目は正式な名称で示す（長い名称は折り返す） */
body[data-screen="roster"] table.r th.an{white-space:normal;font-size:.78em;line-height:1.2;min-width:3.5em;max-width:6em;vertical-align:bottom}
/* 窓の経年の記録：学年-組-番 を全年度で縦にそろえる（左寄せ・等幅の数字・番号は2桁分の幅で右寄せ） */
table.h td.gcn{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:8px}
/* 学年・組・番は字の幅に頼らず、箱の幅で縦をそろえる */
table.h td.gcn .g,table.h td.gcn .sep,table.h td.gcn .no{display:inline-block;text-align:center}
table.h td.gcn .g{width:.8em}
table.h td.gcn .sep{width:.6em}
table.h td.gcn .no{width:1.4em;text-align:right}
/* 並び順の枠 */
.ordrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ordrow>b{min-width:5em}
.ordrow .lv{white-space:nowrap}
/* 項目で絞って見る：該当しない児童を暗くする。押した項目は見出しで枠を付ける */
.st [data-hl]{cursor:pointer;border-radius:4px;padding:0 2px}
.st [data-hl]:hover{background:#0000000f}
.st [data-hl].on{outline:2px solid var(--ink);background:#fff}
.board.hl .chip:not(.hit){opacity:.22;filter:grayscale(.6)}
/* カードの事案の数：押すと記録の窓 */
.board .chip .jn{cursor:zoom-in}
.board .chip .jn:hover{background:#fff;outline:2px solid var(--ink)}
/* メニュー：よく使う「名簿」を大きく、「クラス分け」は右に細く（使う頻度を大きさで示す） */
.bigs{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}
.bigs .big[data-go="roster"]{padding:34px 28px;min-height:9em;justify-content:center}
.bigs .big[data-go="roster"] b{font-size:2rem}
.bigs .big[data-go="roster"] span{font-size:1rem}
.bigs .big[data-go="split"]{padding:16px}
.bigs .big[data-go="split"] b{font-size:1.1rem}
.bigs .big[data-go="split"] span{font-size:.8rem}
.bigs .big:only-child{grid-column:1/-1}
/* ===== 事案の関係図 ===== */
.dg{display:flex;flex-direction:column;gap:6px}
.dg-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dg-hint{margin:0}
.dg-canvas{position:relative;width:100%;aspect-ratio:6/1;min-height:70px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;user-select:none;overflow:hidden}
.dg-svg{position:absolute;inset:0;width:100%;height:100%}
.dg-g{fill:#0F5EA80d;stroke:#0F5EA8;stroke-width:2}
.dg-g.from{stroke:#C0330A;stroke-width:3}
.dg-e{stroke:#C0330A;stroke-width:2.5;fill:none}
.dg-ah{fill:#C0330A}
.dg-eh{stroke:transparent;stroke-width:14;fill:none}
.dg-n{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:3px 8px;font-weight:700;white-space:nowrap;cursor:grab;font-size:15px;z-index:2}
.dg-n.from{outline:3px solid #C0330A}
.dg-n.pick{outline:3px solid var(--link);background:var(--fill)}
.dg-n.card{display:grid;grid-template-columns:auto auto;gap:0 6px;align-items:center;border-left:6px solid var(--oc);background:var(--ol);padding:3px 8px 3px 5px}
.dg-n.card.f{border-radius:999px 14px 14px 999px}
.dg-n.card .nb{font-size:.7em;color:var(--sub);font-weight:400}
.dg-n.card .nm2{grid-column:1/-1;display:flex;gap:2px;font-size:12px}
.dg-n.card{min-width:8em;box-sizing:border-box}
.dg-n.card .nm2 .ph{visibility:hidden}
.dg-gl{position:absolute;transform:translate(6px,-55%);background:#0F5EA8;color:#fff;font-weight:700;border-radius:4px;padding:0 6px;font-size:13px;cursor:pointer;z-index:3}
.dg-gl.from{background:#C0330A}
.dg-sum{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.9rem;align-items:baseline}
.dg-sum em,.meta em{font-style:normal;font-weight:700;margin-right:3px}
.r-harm{color:#C0330A}.r-victim{color:#0F5EA8}.r-mutual{color:#7B3FA0}.r-related{color:var(--sub)}
.inc .it .ie{align-self:flex-start;font-size:.8rem;padding:2px 8px}
.form .dg-bar label.chk{display:inline-flex;flex-direction:row;gap:4px;align-items:center;margin:0}
/* 名簿の上の帯：いまの状態（既定と違う時だけ）。戻す・解除のボタンを添える */
.rbar .state{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;background:var(--fill-b);color:var(--ink);border-radius:6px;padding:2px 4px 2px 10px}
.rbar .state .btn{padding:2px 8px}
.dlg.more section{margin-bottom:10px}
.dlg.more h3{margin:0 0 4px;font-size:.9rem}
/* 名簿の名前：空白込み8文字分の枠。入らない名前は左へ流して最初に戻す（動きを減らす設定では止める） */
.nmw{display:inline-block;width:8em;overflow:hidden;white-space:nowrap;vertical-align:bottom}
.nmt{display:inline-block}
.nmt.run{animation:nmscroll var(--dur,4s) linear infinite}
@keyframes nmscroll{0%,20%{transform:translateX(0)}75%,92%{transform:translateX(var(--d))}92.01%,100%{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.nmt.run{animation:none}}

/* 事案の詳細（関係図の下） */
.form textarea#fDetail{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;resize:vertical;width:100%;box-sizing:border-box}
.inc .it .dt{font-size:.85rem;white-space:pre-wrap;color:var(--ink);max-height:4.5em;overflow:hidden}
/* 名簿のつける・離す：苗字の羅列（小さめ。見やすさは窓とカードに任せる） */
.prm{display:flex;flex-direction:column;gap:1px;font-size:.72em;line-height:1.35}
.prm .pl{display:flex;gap:2px;align-items:center;white-space:nowrap;min-height:1.35em}
.prm .pk{cursor:help}
.prm .pk:hover{text-decoration:underline}
.prm .pmore{color:var(--sub);margin-left:3px}
.prd{display:flex;flex-direction:column;gap:10px}
.prd h3{margin:0 0 4px;font-size:.95rem}
.kcards{display:flex;flex-wrap:wrap;gap:6px}
/* 児童カード */
.kcard{display:inline-grid;grid-template-columns:auto auto;gap:0 6px;align-items:center;border:1.5px solid var(--ink);border-left:6px solid var(--oc);background:var(--ol);border-radius:6px;padding:3px 8px 3px 5px;color:var(--ink);font-size:15px}
.kcard.f{border-radius:999px 14px 14px 999px}
.kcard .nb{font-size:.7em;color:var(--sub)}
.kcard .mk{grid-column:1/-1;display:flex;gap:2px;font-size:12px}
.tip .kcard{border-color:transparent;border-left-color:var(--oc)}
/* つける・離すの窓 */
.kbtn{border:2px solid transparent;background:none;padding:2px;border-radius:10px;cursor:pointer;display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;font:inherit}
.kbtn.on{border-color:var(--link)}
.kbtn .ksince{font-size:.75rem;color:var(--sub);padding-left:4px}
.prd h3{display:flex;gap:8px;align-items:center}
.prd h3 .btn{font-size:.8rem;padding:2px 8px;font-weight:400}
.pdet{margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--soft)}
.pmemo{white-space:pre-wrap}
.pinc,.pinclist{display:flex;flex-direction:column;gap:3px;font-size:.9rem}
.pinc a,.pinclist a{margin-right:6px}
.pform{border:2px solid var(--link);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.pform h3{margin:0}
.pform input#pq,.pform textarea{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:6px}
.pform label{display:flex;flex-direction:column;gap:3px}
.pform label.chk{flex-direction:row;align-items:center}
.ptags{display:flex;flex-wrap:wrap;gap:4px}
.ptag{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;font-size:.85rem;cursor:pointer;color:var(--ink)}
.ptag.on{background:var(--link);border-color:var(--link);color:#fff}
span.ptag{cursor:default;margin-right:3px}
/* 名簿の欄：右下の灰色の角＝設定の窓。真ん中＝値を変える */
table.r td.cc{position:relative}
table.r td.cc::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;background:linear-gradient(135deg,transparent 50%,#b4bac1 50%);pointer-events:none}
table.r td.cc:hover::after{background:linear-gradient(135deg,transparent 50%,#6e767e 50%)}
table.r td.pr.cc,table.r td.memo.cc,table.r td.ji.cc{cursor:pointer}
table.r td.pr.cc:hover,table.r td.memo.cc:hover,table.r td.ji.cc:hover{background:var(--soft)}
/* 程度を選ぶ窓 */
.lvpick{display:flex;flex-direction:column;gap:6px}
.lvopt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.lvopt[aria-pressed="true"]{border-color:var(--link);background:var(--fill)}
.lvopt .ic{min-width:3em;font-size:20px;font-weight:700}
/* 備考の定型の言葉 */
.mpicks{display:flex;flex-wrap:wrap;gap:6px}
.mpicks select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff}
.ctxl{display:flex;flex-direction:column;gap:3px}
.ctxl textarea{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;resize:vertical}
/* クラス分けのカード：右下の灰色の角（押すと経年の記録）。女子のカードも男子と同じ位置（丸い縁からはみ出してよい） */
.board .chip:not(.trn)::after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;background:linear-gradient(135deg,transparent 50%,#9aa1a8 50%);pointer-events:none;z-index:3}
.board .chip.f:not(.trn)::after{right:-1px;bottom:-1px}
/* 入れ替えの確認：カードの大きさをそろえる */
.side .chip{width:min(100%,340px);box-sizing:border-box}
.side .chip .l2>.bs:first-child{--slot:1.9em}
/* 事案の数：上に全部の件数、下の（ ）に被害の件数 */
.jn.jn2{flex-direction:column;height:auto;min-height:1.25em;padding:1px .2em;gap:0;line-height:1.05}
.jn.jn2 b{font-weight:700}
.jn.jn2 i{font-style:normal;font-size:.78em}
.jn.jn1{width:auto;gap:.1em;padding:0 .3em;white-space:nowrap}
.jn.jn1 b{font-weight:700}
.jn.jn1 i{font-style:normal;font-size:.85em}

  // 角を押した時の窓：欄の種類ごとに、文字の入力・相手の選択・事案などをここに集める

    if (k === 'sp') { levelDialog(Y, r, { k: 'sp', label: '特別支援学級', max: 1, help: ['特別支援学級', '在籍している。'] }, td); return; }

  }

  // ===== 並び順（第一〜第三優先）。クラス分けと同じ窓。この端末にだけ覚える =====
  // 行には id・kana・male・cls・no・a・n（その年度の事案の件数）を持たせて比べる
  var SORT_KEYS = [
    { k: 'cls', label: '組', f: function (s) { return s.cls; } },

    { k: 'female', label: '男女（女が先）', f: function (s) { return s.male ? 1 : 0; } },

  function reset() { R.fy = editableFy(); R.cls = App.me && App.me.grade === App.st.grade && App.me.cls >= 0 ? App.me.cls : 0; R.scope = 'cls'; R.onlyInc = false; R.byCount = false; R.kid = null; R.form = null; R.school = null; }

        '<td class="cell spc" data-cell="' + r.id + '" data-k="sp" title="特別支援学級">' + (r.a.sp ? '<span class="spb">支</span>' : '') + '</td>' +
        C.ATTRS.map(function (at) { var v = r.a[at.k] | 0; return '<td class="cell' + (edit ? ' cc' : '') + '" data-cell="' + r.id + '" data-k="' + at.k + '">' + (v ? App.mark(at, v, r.a[at.k + '_t']) : '') + '</td>'; }).join('') +
        '<td class="ji cc" data-kid="' + r.id + '">' + App.incBox(x.n, incsOf(r.id, R.fy).filter(function (y) { return App.isVictim(y, r.id); }).length, 'この年度の事案' + x.n + '件（かっこは被害の件数）', true) + '</td>' +
        (showPairs ? '<td class="pr' + (pe || pairsOf(r.id).length ? ' cc' : '') + '"' + (pe || pairsOf(r.id).length ? ' data-rpair="' + r.id + '"' : '') + '>' + pairMarks(r.id) + '</td>' : '') +
        '<td class="memo' + (edit ? ' cc' : '') + '"' + (edit ? ' data-memo="' + r.id + '"' : '') + (r.a.memo ? ' title="' + esc(r.a.memo) + '"' : '') + '><div>' + esc(r.a.memo || '') + '</div></td></tr>';
    });

    return h + '</tbody></table></div>';
  }

  // その児童の「離す」（上の段）「つける」（下の段）の相手：苗字を・区切りで3人まで、4人目からは＋に畳む。
  // 名前にカーソルで児童カード、枠を押すと窓（相手の一覧・経緯・追加と削除）
  var PAIR_MAX = 3;
  function partners(id) {
    var out = { far: [], near: [], fix: [] };
    pairsOf(id).forEach(function (p) { if (p.t === 'fix') out.fix.push(p.k); else out[p.t].push(p.a === id ? p.b : p.a); });
    return out;
  }
  function pairMarks(id) {
    var d = D(), P = partners(id), esc = App.esc;
    var row = function (k, lab, cls) {
      var list = P[k], vis = list.slice(0, PAIR_MAX);
      return '<div class="pl"><b class="' + cls + '">' + lab + '</b>' + vis.map(function (o) { return '<span class="pk" data-kc="' + esc(o) + '">' + esc(App.surname(d.kids[o] ? d.kids[o].name : o)) + '</span>'; }).join('・') +
        (list.length > PAIR_MAX ? '<span class="pmore">＋' + (list.length - PAIR_MAX) + '</span>' : '') + '</div>';
    };
    if (!P.far.length && !P.near.length && !P.fix.length) return '';
    return '<div class="prm">' + (P.far.length ? row('far', '離', 'pf') : '<div class="pl"></div>') + (P.near.length ? row('near', 'つ', 'pn') : '') +
      (P.fix.length ? '<div class="pl"><b class="px">固</b>' + C.newClass(P.fix[0]) + '</div>' : '') + '</div>';
  }

  // その児童の、つける・離すの窓：相手をカードで並べ、カードを押すと経緯・理由・事案・何年生からを出す。追加と削除もここで
  function kidPairsDialog(id) {
    var d = D(), esc = App.esc, edit = pairEdit(), open = null, F = null;
    var Y = yearOf(d.fy), kids = Y.rows.map(function (r) { return r.id; }).concat((d.transfers || []).map(function (t) { return t.id; }));
    var list = d.pairs.map(function (p) { return JSON.parse(JSON.stringify(p)); });
    var mine = function () { return list.map(function (p, i) { return { p: p, i: i }; }).filter(function (x) { return x.p.t !== 'fix' && (x.p.a === id || x.p.b === id); }); };
    var other = function (p) { return p.a === id ? p.b : p.a; };
    var incsFor = function (ids) { return d.incidents.filter(function (x) { return ids.some(function (k) { return x.ids.indexOf(k) >= 0; }); }).sort(function (a, b) { return b.date < a.date ? -1 : 1; }); };
    var incLink = function (x) { return '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.title || '（名前なし）') + ' ↗</a><span class="note">' + App.span(x) + '</span>'; };
    var since = function (p) { var g0 = +p.since || d.grade; return g0 < d.grade ? g0 + '年生の時から継続' : g0 + '年生から'; };
    var save = function () { var grade = d.grade, data = list; App.save(function () { return App.pf().savePairs(grade, data); }).then(function () { d.pairs = JSON.parse(JSON.stringify(data)); render(); App.refreshDlg(); }); };
    var detail = function (x) {
      var p = x.p, incs = d.incidents.filter(function (y) { return (p.incs || []).indexOf(y.id) >= 0; });
      return '<div class="pdet"><div><b>' + since(p) + '</b>' + ((p.tags || []).length ? '　' + p.tags.map(function (t) { return '<span class="ptag on">' + esc(t) + '</span>'; }).join('') : '') + '</div>' +
        '<div class="pmemo">' + (p.memo ? esc(p.memo) : '<span class="note">経緯は書かれていません</span>') + '</div>' +
        (incs.length ? '<div class="pinc"><b>添えた事案</b>' + incs.map(function (y) { return '<div>' + incLink(y) + '</div>'; }).join('') + '</div>' : '') +
        (edit ? '<div class="row"><button type="button" class="btn" data-pedit="' + x.i + '">直す</button><button type="button" class="btn danger" data-pdel2="' + x.i + '">この組を消す</button></div>' : '') + '</div>';
    };
    // 相手の候補：入力欄は描き直さず、候補の欄だけを描き直す（入力欄を作り直すと日本語入力の変換が切れるため）
    var suggHtml = function () {
      var hit = F.q ? kids.filter(function (k) { var s = d.kids[k]; return k !== id && s && (s.name.indexOf(F.q) >= 0 || s.kana.indexOf(F.q) >= 0); }).slice(0, 8) : [];
      return hit.map(function (k) { return '<button type="button" data-pfb="' + esc(k) + '">' + esc(d.kids[k].name) + '</button>'; }).join('');
    };
    var form = function () {
      var rel = incsFor(F.b ? [id, F.b] : [id]);
      return '<div class="pform"><h3>' + (F.i != null ? '直す' : F.t === 'far' ? '離す相手を足す' : 'つける相手を足す') + '</h3>' +
        (F.b ? '<div class="row"><span class="picked"><span>' + esc(d.kids[F.b].name) + (F.i == null ? '<button type="button" data-pfb="" aria-label="外す">×</button>' : '') + '</span></span></div>' :
          '<input id="pq" placeholder="名前・よみで探す" autocomplete="off" value="' + esc(F.q || '') + '"><div class="sugg" id="psugg">' + suggHtml() + '</div>') +
        '<label>経緯<textarea id="pmemo2" rows="3" maxlength="1000" placeholder="なぜ離す（つける）のか、これまでの経緯">' + esc(F.memo) + '</textarea></label>' +
        '<div class="ptags">' + C.PAIR_TAGS.map(function (t) { return '<button type="button" class="ptag' + (F.tags.indexOf(t) >= 0 ? ' on' : '') + '" data-ptag="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') + '</div>' +
        '<label class="chk"><input type="checkbox" id="pincs"' + (F.showInc ? ' checked' : '') + '>関わる事案を見て添える（' + rel.length + '件）</label>' +
        (F.showInc ? '<div class="pinclist">' + (rel.map(function (y) { return '<label class="chk"><input type="checkbox" data-pinc="' + y.id + '"' + (F.incs.indexOf(y.id) >= 0 ? ' checked' : '') + '>' + incLink(y) + '</label>'; }).join('') || '<div class="note">事案はありません</div>') + '</div>' : '') +
        '<div class="row"><button type="button" class="btn" data-pcancel="1">やめる</button><button type="button" class="btn primary" data-psave="1"' + (F.b ? '' : ' disabled') + '>' + (F.i != null ? '直す' : '足す') + '</button></div></div>';
    };
    App.openDlg({
      noEnter: true,
      html: function () {
        var M = mine();
        var sec = function (t, lab, cls) {
          var xs = M.filter(function (x) { return x.p.t === t; });
          return '<div><h3><b class="' + cls + '">' + lab + '</b>（' + xs.length + '人）' + (edit && !F ? '<button type="button" class="btn" data-padd="' + t + '">＋ ' + lab + '相手を足す</button>' : '') + '</h3>' +
            '<div class="kcards">' + xs.map(function (x) { return '<button type="button" class="kbtn' + (open === x.i ? ' on' : '') + '" data-popen="' + x.i + '">' + App.kidCard(other(x.p)) + '<span class="ksince">' + since(x.p) + '</span></button>'; }).join('') + '</div>' +
            xs.filter(function (x) { return x.i === open; }).map(detail).join('') + '</div>';
        };
        return '<div class="pop" data-close="1"><div class="dlg" role="dialog" aria-modal="true" aria-label="つける・離す" style="max-width:760px"><h2>' + esc(d.kids[id].name) + ' の、つける・離す</h2>' +
          '<div class="prd">' + sec('far', '離す', 'pf') + sec('near', 'つける', 'pn') + (F ? form() : '') + '</div>' +
          (edit ? '' : '<div class="note">つける・離すは、今年度・決定前だけ直せます。</div>') +
          '<div class="acts"><button class="btn" data-act="close">閉じる<kbd>Esc</kbd></button></div></div></div>';
      },
      input: function (t) {
        if (!F) return;
        if (t.id === 'pq') { F.q = t.value.trim(); App.$('psugg').innerHTML = suggHtml(); }
        else if (t.id === 'pmemo2') F.memo = t.value;
        else if (t.id === 'pincs') { F.showInc = t.checked; App.refreshDlg(); }
        else if (t.dataset.pinc) { var n = +t.dataset.pinc, k = F.incs.indexOf(n); if (t.checked && k < 0) F.incs.push(n); if (!t.checked && k >= 0) F.incs.splice(k, 1); }
      },
      click: function (t) {
        var x;
        if ((x = t.closest('[data-popen]'))) { var i = +x.dataset.popen; open = open === i ? null : i; App.refreshDlg(); return true; }
        if ((x = t.closest('[data-padd]'))) { F = { t: x.dataset.padd, b: null, q: '', memo: '', tags: [], incs: [], showInc: false }; open = null; App.refreshDlg(); var q = App.$('pq'); if (q) q.focus(); return true; }
        if ((x = t.closest('[data-pedit]'))) { var p = list[+x.dataset.pedit]; F = { i: +x.dataset.pedit, t: p.t, b: other(p), memo: p.memo || '', tags: (p.tags || []).slice(), incs: (p.incs || []).slice(), showInc: !!(p.incs || []).length }; App.refreshDlg(); return true; }
        if ((x = t.closest('[data-pdel2]'))) { list.splice(+x.dataset.pdel2, 1); open = null; save(); return true; }
        if ((x = t.closest('[data-pfb]'))) { F.b = x.dataset.pfb || null; F.q = ''; App.refreshDlg(); return true; }
        if ((x = t.closest('[data-ptag]'))) { var tg = x.dataset.ptag, j = F.tags.indexOf(tg); if (j >= 0) F.tags.splice(j, 1); else F.tags.push(tg); App.refreshDlg(); return true; }
        if (t.closest('[data-pcancel]')) { F = null; App.refreshDlg(); return true; }
        if (t.closest('[data-psave]') && F && F.b) {
          var memo = (App.$('pmemo2') || {}).value; if (memo != null) F.memo = memo;
          if (F.i != null) Object.assign(list[F.i], { memo: F.memo.trim(), tags: F.tags, incs: F.incs });
          else {
            if (list.some(function (p) { return p.t !== 'fix' && ((p.a === id && p.b === F.b) || (p.a === F.b && p.b === id)); })) { App.toast('この2人の組はもうあります'); return true; }
            list.push({ t: F.t, a: id, b: F.b, memo: F.memo.trim(), tags: F.tags, incs: F.incs, since: d.grade });
          }
          F = null; save(); return true;
        }
        return false;
      }
    });
  }

  function schoolTable() {
    if (!R.school) {
      App.pf().schoolIncidents().then(function (rows) { R.school = rows; if (App.st.screen === 'roster' && R.scope === 'school') render(); });
      return '<div class="tw"><div class="empty">読み込んでいます…</div></div>';

    var esc = App.esc, rows = R.school.slice().sort(function (a, b) { return b.count - a.count || a.grade - b.grade || a.cls - b.cls || a.no - b.no; });
    return '<div class="tw"><table class="r ro"><thead><tr><th>学年</th><th>組</th><th>番号</th><th style="text-align:left">名前</th><th>件数</th><th>最新</th></tr></thead><tbody>' +
      rows.map(function (x) {
        return '<tr><td>' + x.grade + '</td><td><span class="band" style="background:' + App.classColor(x.cls).c + '"></span>' + (x.cls + 1) + '</td><td>' + x.no + '</td>' +
          '<td class="nm" data-jump="' + x.grade + ':' + x.id + '"><span class="sx">' + (x.male ? '男' : '女') + '</span>' + esc(x.name) + '</td><td><span class="jn">' + x.count + '</span></td><td>' + x.last + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  // 児童の窓：経年の記録と事案。名前を押すと開き、閉じると選択も外す
  function kidPop() {
    var d = D();
    if (!R.kid || !d.kids[R.kid]) { if (App.dlg && App.dlg.kid) App.closeDlg(); return; }
    if (App.dlg && App.dlg.kid) { App.refreshDlg(); return; }
    if (App.dlg) return; // ほかの枠が開いている間は出さない
    App.openDlg({
      kid: true,

      input: function (t) { App.screens.roster.input(t); },
      onClose: function () { R.kid = null; R.form = null; render(); }
    });

  function pane() { return recordHtml(R.kid, R.fy, true); }

  // 児童の記録（経年の記録と事案）。名簿の窓と、クラス分けのカードの事案の数から開く窓で使う
  function recordHtml(kid, curFy, canAdd) {
    var d = D(), esc = App.esc;
    var s = d.kids[kid];
    var h = '<aside class="dlg pane kidpop" role="dialog" aria-modal="true" aria-label="' + esc(s.name) + 'の記録"><button class="btn kx" data-act="close" aria-label="閉じる">閉じる<kbd>Esc</kbd></button><h2>' + esc(s.name) + ' <span class="id">' + s.id + '・' + (s.male ? '男' : '女') + '</span></h2>' +
      '<section><h3>経年の記録</h3><table class="h"><thead><tr><th>年度</th><th>学年-組-番</th>' +
      C.ATTRS.map(function (at) { return '<th>' + App.mark(at, 1) + '</th>'; }).join('') + '<th>事案<br><small>(被害)</small></th></tr></thead><tbody>';
    d.years.slice().sort(function (a, b) { return a.fy - b.fy; }).forEach(function (y) {
      var r = y.rows.filter(function (x) { return x.id === kid; })[0];
      if (!r) return;
      var yl = incsOf(kid, y.fy), n = yl.length, nv = yl.filter(function (x) { return App.isVictim(x, kid); }).length;
      h += '<tr class="' + (y.fy === curFy ? 'cur' : '') + '"><td>' + String(y.fy).slice(2) + (y.fy > d.fy ? '準' : '') + '</td><td class="gcn"><span class="band" style="background:' + App.classColor(r.cls).c + '"></span>' + '<span class="g">' + y.grade + '</span><span class="sep">-</span><span class="g">' + (r.cls + 1) + '</span><span class="sep">-</span><span class="no">' + r.no + '</span></td>' +
        C.ATTRS.map(function (at) { return '<td>' + ((r.a[at.k] | 0) || '') + '</td>'; }).join('') + '<td>' + (n ? n + '<small>(' + nv + ')</small>' : '') + '</td></tr>';
    });
    h += '</tbody></table><div class="note">項目の数字は程度（空欄＝なし）。事案の（ ）は被害の件数（関係図で被害・相互の側）。「準」は決定後の準備中の年度。</div></section>';
    var list = incsOf(kid).sort(function (a, b) { return b.date < a.date ? -1 : 1; });
    h += '<section><h3>事案（全' + list.length + '件）' + (canAdd && !R.form ? '<button class="btn primary" id="addInc">＋事案を登録</button>' : '') + '</h3>';
    h += '<div class="inc">' + (list.map(function (x) {
      var others = x.ids.filter(function (id) { return id !== kid; }).map(function (id) { return d.kids[id] ? d.kids[id].name : id; });
      var y = d.years.filter(function (yy) { return yy.fy === C.fiscalYearOfIso(x.date); })[0];
      var role = x.roles && x.roles[kid];
      return '<div class="it">' + (x.url ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.title || '（名前なし）') + ' ↗</a>' : '<b>' + esc(x.title || x.type + 'の事案') + '</b>') + '<span class="meta">' + App.span(x) + '・' + esc(x.type) +
        (y ? '・' + y.grade + '年の時' : '') + (role ? '・<em class="r-' + role + '">' + E.ROLE_NAMES[role] + '</em>' : '') + (others.length ? '・関係：' + others.map(esc).join('、') : '') + '</span>' + (x.detail ? '<div class="dt">' + esc(x.detail) + '</div>' : '') +
        (canAdd && !R.form ? '<button type="button" class="btn ie" data-editinc="' + x.id + '">事案管理で開く</button>' : '') + '</div>';
    }).join('') || '<div class="note">事案はありません</div>') + '</div></section></aside>';
    return h;
  }
  // クラス分けの画面から：見るだけの窓
  App.showRecord = function (kid) {

    App.openDlg({ html: function () { return '<div class="pop" data-close="1">' + recordHtml(kid, D().fy, false) + '</div>'; } });
  };

  // ===== 名簿を貼る =====
  // 既存の名簿の範囲をコピーして貼る。見出しで列を読み、読めた結果と誤りをその場で見せてから取り込む
  function pasteDialog() {
    var d = D(), fy = editableFy(), grade = fy === d.fy ? d.grade : d.grade + 1, esc = App.esc;
    var P = { text: '', cls: R.scope === 'cls' ? R.cls : 0, res: null };
    var summary = function () {
      var r = P.res = g.Paste.parseRoster(P.text, P.cls);
      if (!P.text.trim()) return '<div class="note">貼ると、読み取った結果がここに出ます</div>';
      var hasCls = r.roles.indexOf('cls') >= 0;
      var h = '<div class="rbar"><span class="lab">読み取った列</span>' + r.roles.map(function (x) { return '<span class="tab" style="cursor:default">' + (x ? g.Paste.LABEL[x] : '（使わない）') + '</span>'; }).join('') + '</div>';
      if (!hasCls) h += '<div class="rbar"><span class="lab">組の列が無いので、この組に入れる</span>' + [0, 1, 2, 3].map(function (k) {
        return '<button class="tab" data-pcls="' + k + '" aria-selected="' + (P.cls === k) + '"><span class="band" style="background:' + App.classColor(k).c + '"></span>' + (k + 1) + '組</button>';
      }).join('') + '</div>';
      h += '<div><b>' + r.rows.length + '人</b>（男' + r.counts.m + '・女' + r.counts.f + '）を ' + fy + '年度 ' + grade + '年 に取り込みます。同じ児童IDの児童は上書きし、入力済みの配慮項目は消しません。</div>';
      if (r.errors.length) h += '<div class="warnbox">✕ ' + r.errors.length + '件 取り込めない行があります<ul style="margin:4px 0 0;font-weight:400;color:var(--ink)">' +
        r.errors.slice(0, 6).map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + (r.errors.length > 6 ? '<li>ほか' + (r.errors.length - 6) + '件</li>' : '') + '</ul></div>';
      if (r.rows.length) h += '<div class="tw" style="max-height:180px"><table class="r ro"><thead><tr><th>組</th><th>番号</th><th>児童ID</th><th style="text-align:left">名前</th><th>よみ</th><th>性別</th></tr></thead><tbody>' +
        r.rows.slice(0, 5).map(function (x) { return '<tr><td>' + (x.cls + 1) + '</td><td>' + x.no + '</td><td>' + x.id + '</td><td style="text-align:left">' + esc(x.name) + '</td><td>' + esc(x.kana) + '</td><td>' + (x.sex || '—') + '</td></tr>'; }).join('') +
        (r.rows.length > 5 ? '<tr><td colspan="6" class="note">ほか' + (r.rows.length - 5) + '人</td></tr>' : '') + '</tbody></table></div>';
      return h;
    };
    var refresh = function () { App.$('psum').innerHTML = summary(); var b = App.$('okbtn'); b.disabled = !P.res.rows.length; b.firstChild.textContent = '取り込む（' + P.res.rows.length + '人）'; };
    App.openDlg({
      focus: 'ptxt',
      html: function () {
        return '<div class="pop" data-close="1"><div class="dlg" role="dialog" aria-modal="true" aria-label="名簿を貼る"><h2>名簿を貼る</h2>' +
          '<textarea id="ptxt" rows="6" style="width:100%;box-sizing:border-box;font:inherit;padding:6px" placeholder="既存の名簿の範囲（見出しの行を含めて）をコピーして、ここに貼り付けます">' + esc(P.text) + '</textarea>' +
          '<div id="psum">' + summary() + '</div>' +
          '<div class="acts"><button class="btn" data-act="close">やめる<kbd>Esc</kbd></button><button class="btn primary" data-act="ok" id="okbtn"' + (P.res && P.res.rows.length ? '' : ' disabled') + '>取り込む（' + (P.res ? P.res.rows.length : 0) + '人）<kbd>Ctrl+Enter</kbd></button></div></div></div>';
      },
      input: function (t) { if (t.id === 'ptxt') { P.text = t.value; refresh(); } },
      click: function (t) { var x = t.closest('[data-pcls]'); if (x) { P.cls = +x.dataset.pcls; refresh(); return true; } return false; },
      onOk: function () {
        if (!P.res || !P.res.rows.length) return;
        var rows = P.res.rows;
        App.closeDlg();

  // 行の高さとアイコンの大きさを、空の列の寸法から決める（全員を1画面に収める）。
  // カードを入れた後に測ると、140人分の配置を2回計算することになり重い
  function fit(rows) {
    var gc = document.querySelector('.gcol');
    if (!gc) return;
    var rh = (gc.clientHeight - (rows - 1) * 2) / rows, rhc = Math.max(18, Math.min(40, rh)), root = document.documentElement.style;
    root.setProperty('--rowh', rhc.toFixed(2) + 'px');
    // アイコンの間隔は崩れない範囲で最大にとる（＋で大きくしたアイコンどうしが重ならないように）。
    // 右の枠（1段目＝賢・リ・運、2段目＝ア・身・通）は縦にそろえるので同じ間隔：1段目の名前（空白を含め NAME_CHARS 文字）の残り。
    // 2段目の左の枠（学・欠・問・保）は、右の枠の残りを使い切る間隔
    var W = gc.clientWidth - 2 - rhc * .31 - rhc * .5 - 8, ic = rhc * .36;
    var nameW = (C.NAME_CHARS - .5) * rhc * .38 + 6; // 空白は半角の幅
    var nL = C.ATTRS.filter(function (a) { return !a.good && !a.side; }).length;
    // 右の枠（賢・リ・運／ア・身・通）は有無だけなので＋が無い：間隔はアイコン1つ分＋すき間。
    // 左の枠（学・欠・問・保）の＋は1.3倍で、右上の＋は中心から (.48em＋.62em)×1.3 はみ出す。
    // 間隔は「＋のアイコンの中心から＋の右端まで」＋「隣のアイコンの左半分」以上にする（＋が隣に被らない）
    var IW = 1.8, RW = IW + .1, PLUSW = Math.max((.48 + .62) * 1.3, IW / 2 * 1.3) + IW / 2; // IW＝カードのアイコンの横幅（em）
    // 右の枠は要る分（少しゆとり）だけ取り、残りを左の枠へ回す。足りなければアイコンを小さくする
    var slotR = Math.min((W - nameW) / 3, RW * ic * 1.15);
    ic = Math.min(ic, slotR / RW);
    var slotL = Math.min((W - 3 * slotR - 1.3 * IW * ic - 6) / (nL - 1), ic * 4);
    if (slotL < PLUSW * ic) {
      ic = (W - 6) / (3 * RW * 1.15 + (nL - 1) * PLUSW + 1.3 * IW);
      slotR = Math.min((W - nameW) / 3, RW * ic * 1.15); ic = Math.min(ic, slotR / RW);
      slotL = (W - 3 * slotR - 1.3 * IW * ic - 6) / (nL - 1);
    }
    ic = Math.max(8, ic);
    ic *= App.iconScale(); // ⚙ 設定の「表示」で選んだ倍率
    root.setProperty('--ic', ic.toFixed(2) + 'px');
    root.setProperty('--slot', slotR.toFixed(2) + 'px');
    root.setProperty('--slotL', Math.max(ic * 1.2, slotL).toFixed(2) + 'px');
  }

  function renderCmp() {

        return '<td class="' + (r.bad && v > 0 ? 'bad ' : '') + (best !== null && v === best && !same ? 'best ' : '') + (r.small ? 'small' : '') + '">' + App.esc(v) + '</td>';
      }).join('') + '</tr>';
    });
    App.$('board').className = 'cmpwrap';
    App.$('board').innerHTML = h + '</tbody></table><p class="note">「所属が違う児童」は組の番号の付け替えを無視して数える。重みの略号：頭文字＋段階（な＝なし）。</p></div>';
  }

  // 決定した組の番号。未設定の間は仮（A組＝1組…）
  // ===== 個人票の印刷 =====
  // 18×4cm の票を A4 縦に7枚、隙間なしで並べる（裁断機で切って既存の個人票に貼る）。新しい組ごとに改ページし、組の中は五十音順。
  // 左は上に良い項目（緑）、名前、下に負担の4項目と事案数。右上に配慮（紫）と備考、右下に離す・つける。色はアイコンと旧学級の帯（濃い方）だけ。女子は左を半円（画面のカードと同じ形）。字は枠に収まるまで縮める（下限6pt）
  var PRINT_PER_PAGE = 7, PRINT_MIN_PT = 6;
  function printCards() {
    var p = S.plans[S.active], kids = S.P.kids, esc = App.esc;
    var named = S.decision && S.decision.named, names = namesOf();
    var clsName = function (k) { return named ? names[k] + '組' : C.newClass(k) + (S.decision ? '' : '（案' + p.letter + '）'); };
    var rel = kids.map(function () { return { far: [], near: [] }; });
    S.P.pairs.forEach(function (q) {
      if (q.t !== 'far' && q.t !== 'near') return;
      rel[q.i][q.t].push(q.j); rel[q.j][q.t].push(q.i);
    });
    var side = C.ATTRS.filter(function (at) { return at.side; });
    var card = function (i) {
      var s = kids[i], a = s.a || {}, oc = App.classColor(s.old);
      // 項目ごとに決まった位置に出す（無い項目は見えないアイコンで場所を取る）
      var ic = function (good) { return C.ATTRS.filter(function (at) { return !at.side && !at.good === !good; }).map(function (at) { var v = a[at.k] | 0; return v ? App.mark(at, v) : '<span class="ph" aria-hidden="true">' + App.mark(at, 1) + '</span>'; }).join(''); };
      var who = function (js) { return js.map(function (j) { return esc(kids[j].name); }).join('・'); };
      var bot = (rel[i].far.length ? '<div><b>離</b> ' + who(rel[i].far) + '</div>' : '') + (rel[i].near.length ? '<div><b>つ</b> ' + who(rel[i].near) + '</div>' : '');
      var top = side.filter(function (at) { return a[at.k] | 0; }).map(function (at) { return '<div>' + App.mark(at, 1) + ' ' + esc(a[at.k + '_t'] || '') + '</div>'; }).join('') +
        (a.memo ? '<div><b>備考</b> ' + esc(a.memo) + '</div>' : '');
      return '<div class="pc ' + (s.male ? 'm' : 'f') + '"><div class="pc-in">' +
        '<div class="pc-band" style="background:' + oc.c + '"></div>' +
        '<div class="pc-l"><div class="pc-ic">' + ic(true) + (a.sp ? '<span class="pc-sp">特支</span>' : '') + '</div><div class="pc-kana">' + esc(s.kana || '') + '</div><div class="pc-name">' + esc(s.name) + '</div>' +
        '<div class="pc-ic">' + ic(false) + '<span class="pc-ji">' + App.incBox(S.ji[i], S.jv[i], '', true) + '</span>' + '</div></div>' +
        '<div class="pc-r"><div class="pc-t fit">' + top + '</div><div class="pc-b fit">' + bot + '</div></div>' +
        '<div class="pc-fam"><div>家庭環境</div><div>父子・母子</div><div>生保・就援</div><div>兄弟（　 年）</div></div>' +
        '</div></div>';
    };
    var pages = [], total = 0;
    for (var k = 0; k < S.P.nc; k++) {
      var ids = [];
      kids.forEach(function (s, i) { if (p.asg[i] === k) ids.push(i); });
      ids.sort(function (x, y) { return String(kids[x].kana).localeCompare(String(kids[y].kana), 'ja'); });
      var np = Math.ceil(ids.length / PRINT_PER_PAGE) || 1;
      for (var pg = 0; pg < np; pg++) {
        var part = ids.slice(pg * PRINT_PER_PAGE, (pg + 1) * PRINT_PER_PAGE);
        total += part.length;
        pages.push('<div class="pp"><div class="pp-h">' + App.st.grade + '年 ' + esc(clsName(k)) + '　' + (pg + 1) + '/' + np + '</div>' + part.map(card).join('') +
          '<div class="pp-f"><span class="pp-ruler"></span>この線が10cmなら実寸（倍率100%・余白なしで印刷）</div></div>');
      }
    }
    var box = document.createElement('div');
    box.id = 'printbox';
    box.innerHTML = '<div class="pbar"><b>個人票の印刷（' + total + '枚・' + pages.length + 'ページ）</b><span id="pover"></span><span class="sp"></span>' +
      '<button class="btn primary" id="pgo">印刷する</button><button class="btn" id="pclose">閉じる<kbd>Esc</kbd></button></div>' +
      '<div class="pages">' + pages.join('') + '</div>';
    document.body.appendChild(box);
    document.body.classList.add('printing');
    // 字を枠に収まるまで縮める。下限でも収まらない票は数えて知らせる
    var over = 0;
    box.querySelectorAll('.fit').forEach(function (el) {
      var pt = 9;
      el.style.fontSize = pt + 'pt';
      while (el.scrollHeight > el.clientHeight + 1 && pt > PRINT_MIN_PT) { pt -= .5; el.style.fontSize = pt + 'pt'; }
      if (el.scrollHeight > el.clientHeight + 1) { over++; el.classList.add('over'); }
    });
    // 長い名前は横幅だけを縮める（縦の大きさはそのまま）
    box.querySelectorAll('.pc-name').forEach(function (el) {
      var room = el.parentNode.clientWidth - 2 * parseFloat(getComputedStyle(el.parentNode).paddingLeft), w = el.scrollWidth;
      if (w > room) el.style.transform = 'scaleX(' + (room / w).toFixed(3) + ')';
    });
    if (over) box.querySelector('#pover').textContent = '　⚠ ' + over + 'か所が' + PRINT_MIN_PT + 'ptでも入りきりません（赤い点線の枠）';
    var close = function () { document.removeEventListener('keydown', onKey, true); box.remove(); document.body.classList.remove('printing'); };
    var onKey = function (e) { if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); close(); } };
    document.addEventListener('keydown', onKey, true);
    box.addEventListener('click', function (e) {
      if (e.target.closest('#pclose')) close();
      else if (e.target.closest('#pgo')) window.print();
    });
  }

  // ===== 操作 =====
  function apply(p, ch) { ch.forEach(function (x) { p.asg[x[0]] = x[1]; }); }
  function doMove(changes, msg) {
    var p = S.plans[S.active], prev = changes.map(function (x) { return [x[0], p.asg[x[0]]]; });
    apply(p, changes); p.hist.push({ prev: prev, next: changes, msg: msg }); p.fut = []; p.edits++;
    S.sel = -1; S.follow = null; render(); persist(); App.toast(msg, undo);
    flash(changes.map(function (x) { return x[0]; }));
  }
  function undo() { if (S.view !== 'plan' || S.decision) return; var p = S.plans[S.active], h = p.hist.pop(); if (!h) return; apply(p, h.prev); p.fut.push(h); p.edits--; S.sel = -1; S.follow = null; render(); persist(); App.toast('戻しました：' + h.msg); }
  function redo() { if (S.view !== 'plan' || S.decision) return; var p = S.plans[S.active], h = p.fut.pop(); if (!h) return; apply(p, h.next); p.hist.push(h); p.edits++; S.sel = -1; S.follow = null; render(); persist(); App.toast('やり直しました：' + h.msg); }
  function tapChip(i) {
    if (S.decision) return;
    var p = S.plans[S.active];
    if (S.sel < 0) { S.sel = i; updateSel(); return; }
    if (S.sel === i) { S.sel = -1; S.follow = null; updateSel(); return; }
    if (p.asg[S.sel] === p.asg[i]) { if (S.follow != null) { App.toast('別の組の児童を選んでください'); return; } S.sel = i; updateSel(); return; }
    var d = E.buildSwap(ctxFor(p.gen), p.asg, p.locks, S.sel, i); // 補う児童は、その案を作った重みで選ぶ
    if (d.err) App.toast(d.err); else swapDialog(d);
  }
  function tapHead(k) {
    if (S.decision) return;
    var p = S.plans[S.active];
    if (S.sel < 0 || p.asg[S.sel] === k) return;
    var d = E.buildMove(S.ctx, p.asg, p.locks, S.sel, k);
    if (d.err) App.toast(d.err); else swapDialog(d);
  }
  function toggleLock() {
    if (S.decision) return;
    var p = S.plans[S.active];
    if (S.sel < 0) { App.toast('先に児童を選んでください'); return; }
    var i = S.sel;
    if (p.locks.has(i)) p.locks.delete(i); else p.locks.add(i);
    var el = App.$('board').querySelector('.chip[data-i="' + i + '"]');
    if (el) el.classList.toggle('locked', p.locks.has(i));
    persist(); App.toast(S.P.kids[i].name + '：' + (p.locks.has(i) ? '固定しました' : '固定を外しました'));
  }
