<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>クラス替え</title>
<style>
/* ▼ src/app.css から。直すのは src のほう ▼ */
/* 配置: メニュー → 名簿（年度・組・範囲の切替＋右に児童の記録）／クラス分け（全員を1画面に並べる盤面）。
   色分けは投影と色覚検証を白地で行ったため、明るい配色1種に固定する（docs/design.md §5） */
:root{
  color-scheme:light;
  --bg:#eef1f4; --panel:#ffffff; --ink:#1A1A1A; --sub:#616870; --line:#c9d1d9; --soft:#F1F3F5;
  --link:#0F5EA8; --alert:#C0330A; --alert-soft:#fbe7e1; --fill:#D7E8F8; --fill-b:#FBE3B4;
  /* 校務PC(Windows)・Chromebook・Mac の順。入っていない名前が続くと探す処理で描画が重くなる */
  --f:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","IPAexGothic","IPAGothic",sans-serif;
  --rowh:30px; --ic:12px; --slot:18px; --slotL:18px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);margin:0;font-size:15px;line-height:1.45;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px;
  box-sizing:border-box;display:flex;flex-direction:column}
body.fit{overflow:hidden}
body.fit .top{display:none}
/* 試行中：画面の上端に太い帯と、ボタンの色で、本番でないことを常に見せる */
.btn.trial{font-weight:700}
.btn.trial[aria-pressed="true"]{background:#A85800;color:#fff;border-color:#A85800}
body.trying{box-shadow:inset 0 6px 0 #A85800;padding-top:12px}
body.trying .demo{color:#A85800;font-weight:700;margin-left:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--link)}
kbd{font-family:Consolas,Menlo,var(--f);font-size:.8em;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel)}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:6px}
.top h1{font-size:1.1rem;margin:0}
.crumb{color:var(--sub)}
.crumb button{border:0;background:none;color:var(--link);text-decoration:underline;cursor:pointer;padding:0}
.demo{font-size:.8rem;color:var(--sub);margin-left:auto}
.save{font-size:.8rem;color:var(--sub)}
.save.err{color:var(--alert);font-weight:700}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--link);color:#fff;border-color:var(--link);font-weight:700}
.btn.danger{color:var(--alert);border-color:var(--alert);font-weight:700}
.btn.primary kbd{background:transparent;color:#fff;border-color:#ffffff99}
.btn kbd{margin-left:4px}
@media (max-width:1500px){.bar .btn kbd,.vio kbd{display:none}}
.btn:focus-visible,.tab:focus-visible,.gbtn:focus-visible,.big:focus-visible,.chip:focus-visible,.head:focus-visible,.lv:focus-visible{outline:3px solid var(--link);outline-offset:1px}
.note{font-size:.85rem;color:var(--sub)}
.sp{flex:1}

/* ===== メニュー ===== */
.menu{max-width:760px;width:100%;margin:24px auto;display:flex;flex-direction:column;gap:20px}
.menu h2{font-size:1rem;margin:0 0 8px;color:var(--sub);font-weight:400}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.gbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:14px 0;font-size:1.3rem;font-weight:700;cursor:pointer}
.gbtn[aria-pressed="true"]{border:3px solid var(--link);background:var(--fill);padding:12px 0}
.gbtn small{display:block;font-size:.7rem;font-weight:400;color:var(--sub)}
.bigs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:22px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.big b{font-size:1.4rem}
.big span{color:var(--sub);font-size:.9rem}
.big:hover{border-color:var(--link)}
@media (max-width:560px){.grades{grid-template-columns:repeat(3,1fr)}.bigs{grid-template-columns:1fr}}

/* ===== 印（頭文字＋色＋形。＋で程度） ===== */
.b{position:relative;display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;font-size:.78em;font-weight:700;line-height:1;flex:none;vertical-align:middle;filter:drop-shadow(0 0 .6px #1A1A1A)}
.b>i{position:absolute;inset:0;background:var(--c)}
.b>em{position:relative;font-style:normal;color:var(--t)}
/* ＋は形の中の字の位置に左右されないよう、印の枠を基準に全アイコンで同じ高さ・同じ距離に置く */
.b>u{position:absolute;left:calc(50% + .48em);top:-.34em;display:flex;line-height:0;text-decoration:none}
.b>u>svg{width:.62em;height:.62em;display:block}
/* アイコンの説明（カーソルを合わせると出す）。1つの枠を使い回す */
.tip{position:fixed;z-index:40;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px #0003;padding:8px 12px;font-size:.85rem;line-height:1.6;max-width:22rem;pointer-events:none}
.tip h3{margin:0 0 4px;font-size:.9rem}
.tip table{border-collapse:collapse}
.tip td{padding:1px 8px 1px 0;vertical-align:top}
.tip td:first-child{white-space:nowrap;font-size:1.1rem}
.tip tr.on td{font-weight:700}
.tip .tn{margin:6px 0 0;padding:4px 8px;background:var(--panel,#f4f4f4);border-left:3px solid var(--ink);white-space:pre-wrap;font-weight:700}
.tip p{margin:4px 0 0;color:var(--sub);font-size:.8rem}
/* 学：角が欠けたボロボロの四角（利用者の選んだ案A） */
.square>i{clip-path:polygon(14% 4%,62% 4%,70% 12%,96% 6%,92% 40%,97% 70%,84% 96%,40% 92%,24% 97%,4% 82%,8% 50%,3% 20%)}
.circle>i{clip-path:circle(50%)}
.diamond>i{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
/* 問：ちくちくした形（とげ14本）。保：家の形。リ：旗の形（長方形の右端に「く」の字の切れ込み。利用者のスケッチの案B） */
.burst>i{clip-path:polygon(50.0% 0.0%,59.3% 9.1%,71.7% 5.0%,76.2% 17.2%,89.1% 18.8%,87.8% 31.8%,98.7% 38.9%,92.0% 50.0%,98.7% 61.1%,87.8% 68.2%,89.1% 81.2%,76.2% 82.8%,71.7% 95.0%,59.3% 90.9%,50.0% 100.0%,40.7% 90.9%,28.3% 95.0%,23.8% 82.8%,10.9% 81.2%,12.2% 68.2%,1.3% 61.1%,8.0% 50.0%,1.3% 38.9%,12.2% 31.8%,10.9% 18.8%,23.8% 17.2%,28.3% 5.0%,40.7% 9.1%)}
/* 字はすべての印で同じ大きさ。字が収まらない形は、形の方を大きくする。問は、その分だけ形を大きくする（とげの内側に字が収まる大きさ） */
.b.burst{width:1.8em;height:1.8em;margin:-.15em}
.bs>.b.burst{width:1.5em;height:1.5em;margin:0}
.house>i{clip-path:polygon(50% 0,100% 44%,100% 100%,0 100%,0 44%)}
.house>em{top:.12em}
.b.house{width:1.65em;height:1.65em;margin:-.08em}
.bs>.b.house{width:1.4em;height:1.4em;margin:0}
/* リ：右の切れ込みは深さ38%（横幅を広げたので浅くした分を戻した） */
.crown>i{clip-path:polygon(0 4%,100% 4%,62% 50%,100% 96%,0 96%)}
.crown>em{left:-.2em}
.b.crown{width:1.75em}
.bs>.b.crown{width:1.45em}
.diamond>em{font-size:.82em}
.hexagon>i{clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%)}
/* 賢：正方形 */
.plain>i{inset:.06em}
.pentagon>i{clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.pentagon>em{top:.1em}
.b.pill{width:2em}.pill>i{clip-path:inset(12% 0 round 999px)}
.b.para{width:1.9em}.para>i{clip-path:polygon(25% 6%,100% 6%,75% 94%,0 94%)}
.b.shell{width:2.15em}
.bs>.b.shell{width:1.8em}
/* 通：貝殻の形（上下がふくらんだ横長の形。左右の小さなとげは無し） */
.shell>i{clip-path:polygon(2.0% 50.0%,6.0% 40.4%,10.0% 34.0%,14.0% 28.6%,18.0% 23.8%,22.0% 19.7%,26.0% 16.1%,30.0% 13.0%,34.0% 10.5%,38.0% 8.5%,42.0% 7.1%,46.0% 6.3%,50.0% 6.0%,54.0% 6.3%,58.0% 7.1%,62.0% 8.5%,66.0% 10.5%,70.0% 13.0%,74.0% 16.1%,78.0% 19.7%,82.0% 23.8%,86.0% 28.6%,90.0% 34.0%,94.0% 40.4%,98.0% 50.0%,94.0% 59.1%,90.0% 65.2%,86.0% 70.4%,82.0% 75.0%,78.0% 78.9%,74.0% 82.4%,70.0% 85.3%,66.0% 87.7%,62.0% 89.6%,58.0% 90.9%,54.0% 91.7%,50.0% 92.0%,46.0% 91.7%,42.0% 90.9%,38.0% 89.6%,34.0% 87.7%,30.0% 85.3%,26.0% 82.4%,22.0% 78.9%,18.0% 75.0%,14.0% 70.4%,10.0% 65.2%,6.0% 59.1%)}
.b.shell{height:1.7em;margin:-.1em 0}
.bs>.b.shell{height:1.45em;margin:0}
.octagon>i{clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.shield>i{clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
.shield>em{top:-.1em}
/* 事案の数字：点線の枠の上下左右の中央に置く */
.jn{display:inline-flex;align-items:center;justify-content:center;min-width:1.25em;height:1.25em;border:1.5px dashed #1A1A1A;border-radius:3px;padding:0 .15em;font-size:.82em;line-height:1;box-sizing:border-box;font-variant-numeric:tabular-nums;text-align:center}
.band{display:inline-block;width:5px;height:1.2em;vertical-align:middle;margin-right:6px;border-radius:1px}

/* ===== 名簿 ===== */
.rbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--fill);border:2px solid var(--link);padding:3px 9px;font-weight:700}
.lab{color:var(--sub);font-size:.85rem;margin-right:2px}
.chk{display:inline-flex;gap:4px;align-items:center;font-size:.9rem;cursor:pointer}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:10px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:1fr}}
.tw{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:100%}
table.r{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.r th,table.r td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:center;white-space:nowrap}
table.r th{background:var(--soft);font-weight:400;font-size:.85rem;position:sticky;top:0;z-index:1}
table.r td.nm{text-align:left;font-weight:700;cursor:pointer}
table.r td.nm:hover{text-decoration:underline}
table.r tr.on td{background:var(--fill)}
td.cell{cursor:pointer;min-width:2.2em;height:28px;font-size:17px}
td.cell:hover{background:var(--soft)}
table.ro td.cell{cursor:default}
table.ro td.cell:hover{background:none}
td.ji{cursor:pointer}
.sx{color:var(--sub);font-weight:700;font-size:.8rem;margin-right:4px}
.sx.f{color:#D11F3A}
.sx.m{color:#1A62D6}
.frozen{font-size:.85rem;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;box-sizing:border-box}
.pane h2{margin:0;font-size:1.2rem}
.pane h3{margin:0 0 4px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pane .id{color:var(--sub);font-size:.85rem;font-weight:400}
.empty{color:var(--sub);padding:20px 0;text-align:center}
table.h{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
table.h th,table.h td{border-bottom:1px solid var(--line);padding:3px 3px;text-align:center}
table.h th{background:var(--soft);font-weight:400}
table.h tr.cur td{font-weight:700}
.inc{display:flex;flex-direction:column;gap:6px}
.inc .it{border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.inc .meta{font-size:.8rem;color:var(--sub)}
.form{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px}
.form label{display:flex;flex-direction:column;gap:2px;font-size:.85rem}
.form input,.form select{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.form .row{display:flex;gap:6px}
.form .row>*{flex:1}
.picked{display:flex;flex-wrap:wrap;gap:4px}
.picked span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.85rem}
.picked button{border:0;background:none;cursor:pointer;color:var(--sub);padding:0 0 0 4px}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;background:var(--panel);max-height:150px;overflow:auto}
.sugg button{border:0;background:none;text-align:left;padding:3px 8px;cursor:pointer}
.sugg button:hover{background:var(--fill)}

/* ===== クラス分け ===== */
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:6px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.tab .k{font-size:.72rem;color:var(--sub);font-weight:400}
.tab .v{font-size:.78rem;color:var(--sub);font-weight:400}
.tab .v.bad{color:var(--alert);font-weight:700}
.tab .x{border:0;background:none;color:var(--sub);cursor:pointer;padding:0 2px;line-height:1}
.tab.cmp{border-style:dashed}
.vio{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.vio.has{border-color:var(--alert);color:var(--alert);background:var(--alert-soft);font-weight:700}
.hint{flex:1;min-width:0;font-size:.95rem;color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint b{color:var(--ink)}
.hint.follow{color:var(--ink);font-weight:700}
.decided{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:.9rem;display:flex;gap:10px;align-items:center}
.board{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden}
.cols{height:100%;display:grid;grid-template-columns:repeat(var(--nc),minmax(260px,1fr));gap:6px;min-width:min-content}
.col{container-type:inline-size;background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0;min-height:0}
.head{padding:2px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.head.target{background:var(--fill)}
.h1{display:flex;gap:10px;align-items:baseline;font-variant-numeric:tabular-nums;white-space:nowrap}
.h1 b{font-size:1.1rem}
.h1 .w{color:var(--alert);font-weight:700}
.jis{border:1.5px dashed #1A1A1A;border-radius:3px;padding:0 5px;font-size:.85rem}
.st{display:flex;flex-wrap:nowrap;gap:0 .4em;font-size:min(.8rem,calc((100cqw - 16px) / 37));white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;align-items:center}
.st .w{color:var(--alert);font-weight:700}
.st .w::after{content:"△"}
.st.sub{color:var(--sub)}
.st .c{display:inline-flex;gap:2px;align-items:center}
.sub2{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px}
.gcol{display:flex;flex-direction:column;gap:2px;min-height:0;min-width:0}
.gcol>.chip{height:var(--rowh);flex:none;box-sizing:border-box}
/* 児童カード：男＝長方形、女＝ピル型。左端は旧学級の色の帯（旧番号）、地は旧学級の薄い色 */
.chip{display:grid;grid-template-columns:var(--bandw) minmax(0,1fr) var(--jrw);grid-template-rows:1fr 1fr;min-width:0;border:1px solid var(--line);
  cursor:pointer;--bandw:calc(var(--rowh)*.31);--jrw:calc(var(--rowh)*.5);font-size:calc(var(--rowh)*.36);line-height:1;user-select:none;position:relative;background:var(--ol,var(--panel))}
.chip.m{border-radius:2px}
.chip.f{border-radius:999px}
/* 帯の角はカードの角に合わせる（アイコンをはみ出させるので、カードで切り取らない） */
.chip.m .old{border-radius:1px 0 0 1px}
.chip.f .old{border-radius:999px 0 0 999px}
.chip:hover{border-color:var(--sub)}
.chip.sel{border:3px solid var(--link);box-shadow:inset 0 0 0 2px #fff}
.chip.locked{background:repeating-linear-gradient(135deg,var(--ol) 0 5px,#0000001f 5px 6px)}
.chip.locked .nm::before{content:"固 ";color:var(--sub);font-weight:400}
.chip.rel-far .nm::after{content:" 離";color:var(--alert)}
.chip.rel-near .nm::after{content:" つ";color:var(--link)}
.chip.rel-far{outline:4px solid var(--alert);outline-offset:-4px}
.chip.rel-near{outline:2px dashed var(--link);outline-offset:-1px}
.chip.flash{animation:fl 1.1s ease-out 2}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--fill-b)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.chip.flash{animation:none;box-shadow:0 0 0 4px var(--fill-b)}}
.old{grid-row:1/3;background:var(--oc);color:var(--ot);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.5em;font-variant-numeric:tabular-nums}
.l1{display:flex;align-items:center;gap:3px;padding:0 4px 1px;min-width:0}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;font-size:calc(var(--rowh)*.38);letter-spacing:-.02em}
.side .chip .nm{font-size:20px}
.bs{position:relative;font-size:var(--ic);margin:0 4px}
.bs>.b{position:absolute;left:calc(var(--s)*var(--slot));top:50%;transform:translateY(-50%)}
/* 右の枠（1段目＝賢・リ・運、2段目＝ア・身・通）は男女で同じ位置。縦に並ぶ児童でそろう */
.bs.gd{margin:0 0 0 auto;align-self:stretch;width:calc(3*var(--slot));flex:none}
.l2{display:flex;min-width:0;padding:0 4px 0 0}
.l2>.bs:first-child{flex:1;--slot:var(--slotL)}
/* 事案の数：旧番号の帯の反対側（右端）に、2段の真ん中で置く */
.chip .bs>.b{z-index:1}
/* ＋のアイコン（学・欠・問・保）は大きくし、下へはみ出してよい */
.chip .bs>.b[data-lv="2"]{z-index:2;transform:translateY(-50%) scale(1.3);transform-origin:50% 10%}
.jr{grid-column:3;grid-row:1/3;display:flex;align-items:center;justify-content:flex-start;font-size:var(--ic)}
.bs>.b{width:1.25em;height:1.25em}
.bs>.b.pill,.bs>.b.para{width:1.3em}
/* 横幅はいちばん広い形（貝）にそろえ、ほかの形も横に広げる（縦はそのまま） */
.b.b{width:2.15em}
.bs>.b.b{width:1.8em}
.rt{font-size:.85em;font-weight:700;flex:none}
.rt.far{color:var(--alert)} .rt.near{color:var(--link)}
.lkm{flex:none;color:var(--sub);font-size:.85em}
.cmpwrap{flex:1;min-height:0;overflow:auto}
table.cmp{border-collapse:collapse;background:var(--panel);font-variant-numeric:tabular-nums}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:6px 12px;text-align:center;white-space:nowrap}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp thead th{background:var(--fill);cursor:pointer;white-space:normal;min-width:7em}
table.cmp td.best{font-weight:700}
table.cmp td.best::after{content:" ★";color:var(--link)}

  // 行の高さとアイコンの大きさを、空の列の寸法から決める（全員を1画面に収める）。
  // カードを入れた後に測ると、140人分の配置を2回計算することになり重い
  function fit(rows) {
    var gc = document.querySelector('.gcol');
    if (!gc) return;
    var rh = (gc.clientHeight - (rows - 1) * 2) / rows, rhc = Math.max(18, Math.min(40, rh)), root = document.documentElement.style;
    root.setProperty('--rowh', rhc.toFixed(2) + 'px');
    // アイコンの間隔は崩れない範囲で最大にとる（＋で大きくしたアイコンどうしが重ならないように）。
    // 右の枠（1段目＝賢・リ・運、2段目＝ア・身・通）は縦にそろえるので同じ間隔：1段目の名前（空白を含め NAME_CHARS 文字）の残り。
    // 2段目の左の枠（学・欠・問・保）は、右の枠の残りを使い切る間隔
    var W = gc.clientWidth - 2 - rhc * .31 - rhc * .5 - 8, ic = rhc * .36;
    var nameW = (C.NAME_CHARS - .5) * rhc * .38 + 6; // 空白は半角の幅
    var nL = C.ATTRS.filter(function (a) { return !a.good && !a.side; }).length;
    // 右の枠（賢・リ・運／ア・身・通）は有無だけなので＋が無い：間隔はアイコン1つ分＋すき間。
    // 左の枠（学・欠・問・保）の＋は1.3倍で、右上の＋は中心から (.48em＋.62em)×1.3 はみ出す。
    // 間隔は「＋のアイコンの中心から＋の右端まで」＋「隣のアイコンの左半分」以上にする（＋が隣に被らない）
    var IW = 1.8, RW = IW + .1, PLUSW = Math.max((.48 + .62) * 1.3, IW / 2 * 1.3) + IW / 2; // IW＝カードのアイコンの横幅（em）
    // 右の枠は要る分（少しゆとり）だけ取り、残りを左の枠へ回す。足りなければアイコンを小さくする
    var slotR = Math.min((W - nameW) / 3, RW * ic * 1.15);
    ic = Math.min(ic, slotR / RW);
    var slotL = Math.min((W - 3 * slotR - 1.3 * IW * ic - 6) / (nL - 1), ic * 4);
    if (slotL < PLUSW * ic) {
      ic = (W - 6) / (3 * RW * 1.15 + (nL - 1) * PLUSW + 1.3 * IW);
      slotR = Math.min((W - nameW) / 3, RW * ic * 1.15); ic = Math.min(ic, slotR / RW);
      slotL = (W - 3 * slotR - 1.3 * IW * ic - 6) / (nL - 1);
    }
    ic = Math.max(8, ic);
    ic *= App.iconScale(); // ⚙ 設定の「表示」で選んだ倍率
    root.setProperty('--ic', ic.toFixed(2) + 'px');
    root.setProperty('--slot', slotR.toFixed(2) + 'px');
    root.setProperty('--slotL', Math.max(ic * 1.2, slotL).toFixed(2) + 'px');
  }

  function renderCmp() {

      }).join('') + '</tr>';
    });
    App.$('board').className = 'cmpwrap';
    App.$('board').innerHTML = h + '</tbody></table><p class="note">「所属が違う児童」は組の番号の付け替えを無視して数える。重みの略号：頭文字＋段階（な＝なし）。</p></div>';
  }
