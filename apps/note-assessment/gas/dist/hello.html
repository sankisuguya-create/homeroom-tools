<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<!-- shared/ui/tokens.css から scripts/build.py が作る。 正本を直すこと。 -->
<style>
/* 色と書体のトークン — 両画面が読む。@dark{} は build.py が
   @media (prefers-color-scheme:dark) 側と [data-theme="dark"] 側の
   2つに展開する。暗い配色の値はここ1箇所にしかない。 */
:root{
  /* 書体。ウェブフォントは読まない。--font-ja は左から
     Mac（Hiragino）→ Windows（Yu Gothic / BIZ UD / Meiryo）→ Chromebook
     （Noto）の順に当たる。BIZ UD は Windows 10 以降の標準添付。
     --font-mono は数・記号の桁そろえ用。日本語が入る場面（診断行など）は
     後ろの BIZ UDゴシック／Noto Sans Mono CJK JP に落ちて読める。 */
  --font-ja:"Hiragino Sans","Yu Gothic UI","BIZ UDPGothic","Noto Sans JP","Noto Sans CJK JP","Meiryo",sans-serif;
  --font-mono:"Consolas","Menlo","Roboto Mono","BIZ UDGothic","Noto Sans Mono CJK JP",monospace;

  --paper:#FCFBF7; --sheet:#FFFFFF; --ink:#1D2126;
  --ink-soft:#5A6470; --ink-faint:#9AA3AD;
  --rule:#DFDCD2; --rule-soft:#EDEAE2; --accent:#2C5C9E;

  /* 評価の色。A 系と突破層にだけ置く。B 系は無色、警告層は文字だけ */
  --a-bg:#DCE8F6; --a-line:#8FB4DC; --a-ink:#173E70;
  --z-bg:#F7EBCB; --z-line:#D6B461; --z-ink:#5C4408;
  --warn:#B0392B; --warn-bg:#FBEEEC;
  --ok:#2F6E4E;

  /* 教師の貫通・ロック・スケール外の記号 */
  --open:#2E7D8A; --open-bg:#EAF5F6;
  --open-cell:#FFF4E4; --open-line:#DFAE62;
  --lock-ink:#A29C90;
  --off-bg:#EFEDE8; --off-ink:#8A8578; --skip-line:rgba(29,33,38,.42);
  --stripe:rgba(29,33,38,.07);

  /* 単元の20色。色相を 126° ずつ飛ばしてあるので連番でも近づかない
     （20 と 126 は互いに素）。明度は色相ごとに補正済み */
  --u0:#57C18C; --u1:#A670CA; --u2:#B08F41; --u3:#61C4B0; --u4:#BE69C8;
  --u5:#AFAF41; --u6:#69BEC8; --u7:#C461B0; --u8:#8FB041; --u9:#70A6CA;
  --u10:#C1578C; --u11:#70B543; --u12:#748ECC; --u13:#BE4E65; --u14:#52BB46;
  --u15:#7575CC; --u16:#BB5246; --u17:#4EBE65; --u18:#8E74CC; --u19:#B57043;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131619; --sheet:#1A1E23; --ink:#E8EBEF;
    --ink-soft:#A0A9B4; --ink-faint:#6A727C;
    --rule:#2E343B; --rule-soft:#242A30; --accent:#7BAAE4;

    --a-bg:#1E3352; --a-line:#3F6598; --a-ink:#BDD5F0;
    --z-bg:#3D3113; --z-line:#8A7028; --z-ink:#F0D794;
    --warn:#E5776A; --warn-bg:#2E1C1A;
    --ok:#6FBF92;

    --open:#6FBECC; --open-bg:#182C30;
    --open-cell:#33270F; --open-line:#7E6224;
    --lock-ink:#6A727C;
    --off-bg:#22262B; --off-ink:#767E88; --skip-line:rgba(232,235,239,.45);
    --stripe:rgba(232,235,239,.09);

    --u0:#72C59C; --u1:#B389CF; --u2:#BA9C56; --u3:#7BC9B9; --u4:#C583CC;
    --u5:#B9B955; --u6:#83C5CC; --u7:#C97BB9; --u8:#9CBA56; --u9:#89B3CF;
    --u10:#C5729C; --u11:#81BC5A; --u12:#8DA2D1; --u13:#C2697B; --u14:#6ABE61;
    --u15:#8F8FD1; --u16:#BE6A61; --u17:#69C27B; --u18:#A28DD1; --u19:#BC815A;
  }
}
:root[data-theme="dark"]{
  --paper:#131619; --sheet:#1A1E23; --ink:#E8EBEF;
  --ink-soft:#A0A9B4; --ink-faint:#6A727C;
  --rule:#2E343B; --rule-soft:#242A30; --accent:#7BAAE4;

  --a-bg:#1E3352; --a-line:#3F6598; --a-ink:#BDD5F0;
  --z-bg:#3D3113; --z-line:#8A7028; --z-ink:#F0D794;
  --warn:#E5776A; --warn-bg:#2E1C1A;
  --ok:#6FBF92;

  --open:#6FBECC; --open-bg:#182C30;
  --open-cell:#33270F; --open-line:#7E6224;
  --lock-ink:#6A727C;
  --off-bg:#22262B; --off-ink:#767E88; --skip-line:rgba(232,235,239,.45);
  --stripe:rgba(232,235,239,.09);

  --u0:#72C59C; --u1:#B389CF; --u2:#BA9C56; --u3:#7BC9B9; --u4:#C583CC;
  --u5:#B9B955; --u6:#83C5CC; --u7:#C97BB9; --u8:#9CBA56; --u9:#89B3CF;
  --u10:#C5729C; --u11:#81BC5A; --u12:#8DA2D1; --u13:#C2697B; --u14:#6ABE61;
  --u15:#8F8FD1; --u16:#BE6A61; --u17:#69C27B; --u18:#A28DD1; --u19:#BC815A;
}
</style>
<style>
  body{margin:0;background:#FCFBF7;color:#1D2126;
       font-family:var(--font-ja);font-size:16px;line-height:1.8}
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px}
  h1{font-size:22px;margin:0 0 4px}
  .role{display:inline-block;border:1.5px solid currentColor;border-radius:6px;
        padding:2px 12px;font-size:13px;font-weight:700}
  .role.student{color:#2C5C9E}
  .role.teacher{color:#2E7D8A}
  .role.unknown{color:var(--warn)}
  dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:22px 0 0;
     font-size:14px;border-top:1px solid var(--rule);padding-top:16px}
  dt{color:var(--ink-soft)}
  dd{margin:0;font-family:var(--font-mono);word-break:break-all}
  .bad{color:var(--warn);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="hello">…</h1>
  <span class="role" id="role"></span>
  <dl id="detail"></dl>
</div>

<!-- スケールの定義。サーバ側の Scale.gs と同じ1つの元から作られている。 -->
<!-- apps/note-assessment/web/src/scale.js から scripts/build.py が作る。 正本を直すこと。 -->
<script>
/* ==================================================================
   評価スケール — プロジェクトの正本。
   児童画面と教師画面がこの1ファイルを読む。build.py が両方に差し込む。
   実装では GAS の Scale.gs と scale.html になる。

   段は**表**で持つ。以前は「基本字 × ニュアンス4」の掛け算で出していたが、
   上端だけ段数が違う形になったので、掛け算では表せなくなった。
   表なら、どの帯が何段でも同じ規則で扱える。

   保存は記号の文字列で行い、計算のときだけ値に変換する。
================================================================== */

/* 基本字は下から上へ。上位が増えたら末尾に足す。
   途中に差し込むと既存の内部値がずれて、過去の記録の意味が変わる。 */
const BASES = ["D","C","B","A","Z","Y"];

/* 帯ごとの刻み。段数は帯によって違う。

   D は1段。「やるべきことを何もしていない」に濃淡は要らない。
   C は2段。届いていない中での差はこの2つで足りる。
   B と A は4段。ここが最頻帯で、いちばん細かく見分ける。
   Z と Y は2段。上端でその細かさは使い分けられない。

   帯ごとに幅を変えたのは、**見分けが要るところに段を寄せる**ため。
   均等に刻むと、使わない段が増えるだけで判定が重くなる。 */
const MODS_ONE  = [""];
const MODS_TWO  = ["", "+"];
const MODS_FULL = ["−", "", "+", "++"];
const MODS_OF = {
  "D": MODS_ONE,  "C": MODS_TWO,
  "B": MODS_FULL, "A": MODS_FULL,
  "Z": MODS_TWO,  "Y": MODS_TWO
};

/* 内部値 1..N の並び。ここが唯一の正本で、変換はすべてこの表を引く。 */
const LEVELS = [];
BASES.forEach(b => (MODS_OF[b] || MODS_FULL).forEach(m => LEVELS.push(b + m)));
const NLEVEL = LEVELS.length;          // 15
const NBASE  = BASES.length;
const ALL_SYMS = LEVELS.slice();

/* 層の境目。コードのどこにも "Z" や "Y" を直接書かない。
   書いた瞬間、基本字を足したときにそこだけ取り残される。 */
const TOP_FROM     = "Z";   // これ以上は突破層（箔をかける・突破回数に数える）
const WARN_TO      = "C";   // これ以下は警告層（文字を赤にする）
const RELEASE_FROM = "Y";   // これ以上は、教師が解放するまで児童に出さない

/* 突破層の見た目は基本字ごとに1つ。段では変えない。
   字を足したらここに1行足す。未登録の字は金の箔。実体は material.css。 */
const BASE_LOOK = { "Z":"foil-gold", "Y":"foil-cosmic" };

/* スケールに乗らない記号。どちらも集計から外すが、理由が違うので分けて数える。
   休：児童がいなかった（個人の欠測）
   / ：その授業を評価に含めない（授業側の都合）。教師だけが設定する。 */
const OFF = "休", SKIP = "/";
const isMark = sym => sym === OFF || sym === SKIP;

const iTop     = BASES.indexOf(TOP_FROM);
const iWarn    = BASES.indexOf(WARN_TO);
const iRelease = BASES.indexOf(RELEASE_FROM);

/* 記号 → 基本字。スケール外（休・/・空・知らない記号）は "" を返す。 */
function baseOfSym(sym){
  if(!sym || isMark(sym)) return "";
  const b = String(sym).charAt(0);
  return BASES.indexOf(b) >= 0 ? b : "";
}
const iOf = sym => { const b = baseOfSym(sym); return b ? BASES.indexOf(b) : -1; };

const isTopSym     = sym => iOf(sym) >= iTop;
const isWarnSym    = sym => { const i = iOf(sym); return i >= 0 && i <= iWarn; };
const isReleaseSym = sym => iOf(sym) >= iRelease;   // 解放されるまで児童に出さない段

/* valueOf という名前は使わない。Object.prototype.valueOf と同名で、
   GAS ではトップレベル宣言がグローバルオブジェクト上のそれを隠す。 */
function valueOfSym(sym){                          // "A++" → 11／スケール外は null
  if(!sym || isMark(sym)) return null;
  const i = LEVELS.indexOf(String(sym));
  return i < 0 ? null : i + 1;
}
const symbolOf = v => LEVELS[v - 1];               // 11 → "A++"
const baseOf   = v => baseOfSym(LEVELS[v - 1]);
const isTopVal  = v => iOf(LEVELS[v - 1]) >= iTop;
const isWarnVal = v => { const i = iOf(LEVELS[v - 1]); return i >= 0 && i <= iWarn; };

/* 材質のクラス名。基本字ごとに1つ。 */
const lookOf = sym => BASE_LOOK[baseOfSym(sym)] || "foil-gold";

/* 帯の先頭の内部値。折れ線の目盛りを引くのに使う。 */
function bandStart(base){
  const i = LEVELS.indexOf(base + (MODS_OF[base] || MODS_FULL)[0]);
  return i + 1;
}
const bandSize = base => (MODS_OF[base] || MODS_FULL).length;

/* 児童に出してよい記号。解放されていない帯（Y 以上）を落とす。
   すでに入っている記号は、値が消えないよう残す。 */
function symsFor(opt){
  const released = !!(opt && opt.released);
  const keep     = opt && opt.keep;
  return LEVELS.filter(s => released || !isReleaseSym(s) || s === keep);
}

/* 中央値が2段の間に落ちたときは下側を採る（水増ししない）。
   順序尺度なので平均は取れない。 */
const symbolOfMedian = m => (m == null) ? null : symbolOf(Math.floor(m));

/* 古い記号を今の記号に置き換える表。
   D の4段を1段に、C の4段を2段に畳んだぶん、**内部値は動く**。
   意味が同じところへ寄せてある（D 系はすべて D、C−/C は C、C+/C++ は C+）。
   B 以上は記号も意味も変わらない。

   ※ 前の版（Z−/Z++ を捨てて Y を足した）からの置換もここに含めてある。
     すでに置換ずみのシートに対しては、その行が当たらないだけで害はない。 */
const SYM_MIGRATION = {
  "D−":"D", "D+":"D", "D++":"D",          // D は1段に畳む
  "C−":"C", "C++":"C+",                    // C は2段に畳む
  "Z−":"Z", "Z++":"Y+"                     // 前の版の名残
};
</script>

<script>
  /* 貼り付け一式の版。build.py が dist を作るとき焼き込む。 */
  const PAGE_BUILD = "BUILD_a3884a1c8957";
  const BOOT = <?!= boot ?>;

  const w = BOOT.who;
  document.getElementById("hello").textContent =
    w.role === "student" ? "こんにちは、" + w.name + " さん"
  : w.role === "teacher" ? "こんにちは、先生"
  :                        "だれか わかりません";

  const r = document.getElementById("role");
  r.className = "role " + w.role;
  r.textContent = w.role === "student" ? "児童" : w.role === "teacher" ? "教師" : "不明";

  const rows = [
    ["メール",        w.email || "（取れていない）"],
    ["学級・年度",    BOOT.className + "　" + BOOT.year],
    ["ロックの定時",  String(BOOT.lockTime.h).padStart(2,"0") + ":" +
                      String(BOOT.lockTime.m).padStart(2,"0")],
    ["直近の境界",    BOOT.boundary],
    ["見える教科",    BOOT.subjects.join("、") || "（なし）"],
    ["スケールの段数", NLEVEL + "段　1=" + symbolOf(1) + "　" + NLEVEL + "=" + symbolOf(NLEVEL)],
    ["往復テスト",    (function(){
        for(let v = 1; v <= NLEVEL; v++) if(valueOfSym(symbolOf(v)) !== v) return "× " + v + " で往復しない";
        return "○ 1〜" + NLEVEL + " すべて往復する";
      })()]
  ];
  if(w.reason) rows.push(["理由", w.reason]);
  rows.push(["貼り付け版", PAGE_BUILD]);
  if(PAGE_BUILD !== BOOT.build)
    rows.push(["版ずれ", "× 貼ったファイルが混在しています。一式を貼り直してください（サーバは " + BOOT.build + "）"]);

  document.getElementById("detail").innerHTML = rows.map(function(x){
    const bad = /^×|取れていない/.test(x[1]) ? ' class="bad"' : "";
    return "<dt>" + x[0] + "</dt><dd" + bad + ">" + x[1] + "</dd>";
  }).join("");
</script>
</body>
</html>
