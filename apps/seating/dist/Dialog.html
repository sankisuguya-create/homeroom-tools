<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>席替え</title>
<style>
:root{
  --paper:#FCFBF7; --sheet:#FFFFFF; --ink:#1D2126; --ink-soft:#5A6470; --ink-faint:#9AA3AD;
  --rule:#DFDCD2; --accent:#2C5C9E; --accent-ink:#FFFFFF;
  --warn:#B0392B; --warn-bg:#FBEEEC; --ok:#2F6E4E; --sel:#F2A93B; --hl:#B0392B;
  --g1:#E4EEF9; --g2:#F7EBCB; --g3:#E3F2E8; --g4:#F6E3EC; --g5:#EDE6F7;
  --g6:#E3F2F3; --g7:#F4EADF; --g8:#EEF3DB; --g9:#F9E6E3; --g10:#E8EAF0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer;touch-action:manipulation}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button:disabled{opacity:.45;cursor:default}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.bar .grow{flex:1}
.tabs{display:flex;gap:4px}
.tab{min-width:92px;text-align:left;line-height:1.2;padding:4px 10px}
.tab small{display:block;color:var(--ink-soft);font-size:11px}
.tab[aria-selected=true]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
main{display:grid;grid-template-columns:1fr 330px;height:calc(100vh - 61px)}
#stage{overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.front{background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center;border-radius:6px;padding:4px 0}
.grid{display:grid;gap:6px}
.seat{min-height:58px;border:1px solid var(--rule);border-radius:8px;padding:4px 6px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;position:relative;user-select:none}
.seat .no{font-size:11px;color:var(--ink-soft)}
.seat .nm{font-size:15px;font-weight:600;text-align:center;line-height:1.2}
.seat.empty .nm{color:var(--ink-faint);font-weight:400}
.seat.sel{outline:3px solid var(--sel);outline-offset:1px}
.seat.hl{outline:3px solid var(--hl);outline-offset:1px}
.seat.bad::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.seat .pin{position:absolute;top:2px;left:5px;font-size:11px}
.seat.fixed{cursor:default}
aside{border-left:1px solid var(--rule);background:var(--sheet);overflow:auto;padding:12px}
aside h2{font-size:13px;margin:12px 0 6px;color:var(--ink-soft)}
.summary{font-size:13px}
.summary b{font-size:22px}
.issues{list-style:none;margin:0;padding:0}
.issues li{padding:7px 8px;border-radius:6px;margin-bottom:4px;cursor:pointer;border:1px solid transparent}
.issues li:hover,.issues li.on{border-color:var(--rule);background:var(--paper)}
.issues li.hard{background:var(--warn-bg);color:var(--warn);font-weight:600}
.issues .k{display:inline-block;min-width:3em;font-size:11px;color:var(--ink-soft)}
.issues li.new{box-shadow:inset 3px 0 0 var(--warn)}
.msg{padding:16px;max-width:720px;margin:20px auto;background:var(--sheet);border:1px solid var(--rule);border-radius:10px}
.msg.err{border-color:var(--warn)}
.msg li{margin:4px 0}
.muted{color:var(--ink-soft);font-size:12px}
.ok{color:var(--ok)}
#reveal{position:fixed;inset:0;background:var(--paper);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9}
#reveal.on{display:flex}
#reveal .big{font-size:64px;font-weight:800}
#reveal .grid .seat{min-height:48px}
#reveal .seat.hide .nm,#reveal .seat.hide .no{visibility:hidden}
#reveal .seat.just{outline:4px solid var(--sel)}
.hint{font-size:12px;color:var(--ink-soft);text-align:center}
</style>
</head>
<body>
<div class="bar">
  <button id="make" class="primary" disabled>席を作る</button>
  <div class="tabs" id="tabs" role="tablist"></div>
  <span class="grow"></span>
  <button id="flip" title="表示の向き">教卓側から見る</button>
  <button id="show" disabled>発表</button>
  <button id="commit" class="primary" disabled>この席で決定</button>
</div>
<main id="main">
  <section id="stage"><div class="msg">読み込み中…</div></section>
  <aside id="side"></aside>
</main>
<div id="reveal"></div>

<script>
/* 生成物：apps/seating/src/ から scripts/build.mjs が作る。直接編集しない。 */
/* 席替えの計算部。ブラウザ（Dialog.html）と node（tests/）の両方で読む。
   外部参照なし。入力は Code.gs の readInput() が返す形。 */
var Seating = (function(){

  var HARD = 100000;
  var W = {
    sepAdj: 60, sepFb: 40, sepDiag: 20, sepGroup: 30,
    near: 30,
    genderPair: 20, genderGrid: 10, genderGroup: 10,
    leaderNone: 40, leaderExtra: 12,
    careGroup: 40, careAdj: 30,
    histAdj: 50, histGroup: 12, histDecay: 0.6, sameSeat: 15,
    frontBias: 20
  };

  function rng(seed){
    var a = seed >>> 0;
    return function(){
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* 座席どうしの関係を前計算する。rel[i][j] = 'adj' | 'fb' | 'diag' | null */
  function buildModel(input){
    var seats = input.seats;            // [{r,c,group}]
    var students = input.students;      // [{id,name,gender,front,fixed,leader,care}]
    var n = seats.length;
    var key = {};
    seats.forEach(function(s, i){ key[s.r + ',' + s.c] = i; });
    var rows = [];
    seats.forEach(function(s){ if(rows.indexOf(s.r) < 0) rows.push(s.r); });
    rows.sort(function(a, b){ return a - b; });
    var frontRows = input.settings.frontRows || 2;
    var isFront = seats.map(function(s){ return rows.indexOf(s.r) < frontRows; });
    var adj = [], fb = [], diag = [], grid4 = [];
    for(var i = 0; i < n; i++){
      var s = seats[i], a = [], f = [], d = [];
      var L = key[s.r + ',' + (s.c - 1)], R = key[s.r + ',' + (s.c + 1)];
      var U = key[(s.r - 1) + ',' + s.c], D = key[(s.r + 1) + ',' + s.c];
      if(L !== undefined) a.push(L);
      if(R !== undefined) a.push(R);
      if(U !== undefined) f.push(U);
      if(D !== undefined) f.push(D);
      [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(function(o){
        var k = key[(s.r + o[0]) + ',' + (s.c + o[1])];
        if(k !== undefined) d.push(k);
      });
      adj.push(a); fb.push(f); diag.push(d); grid4.push(a.concat(f));
    }
    var groupOf = seats.map(function(s){ return String(s.group); });
    var groups = {};
    groupOf.forEach(function(g, i){ (groups[g] = groups[g] || []).push(i); });

    function relation(i, j){
      if(adj[i].indexOf(j) >= 0) return 'adj';
      if(fb[i].indexOf(j) >= 0) return 'fb';
      if(diag[i].indexOf(j) >= 0) return 'diag';
      return null;
    }

    /* 児童インデックス。空席は仮想児童 (id=null) */
    var people = students.slice();
    while(people.length < n) people.push({ id: null, name: '', gender: '', ghost: true });
    var idx = {};
    people.forEach(function(p, k){ if(p.id != null) idx[p.id] = k; });

    /* 条件を児童ごとに引けるようにする */
    var pairs = [];
    (input.conditions || []).forEach(function(c){
      if(idx[c.a] === undefined || idx[c.b] === undefined) return;
      pairs.push({ a: idx[c.a], b: idx[c.b], type: c.type, must: !!c.must });
    });
    var pairsOf = people.map(function(){ return []; });
    pairs.forEach(function(p, k){ pairsOf[p.a].push(k); pairsOf[p.b].push(k); });

    /* 履歴：recent[k] = {seatKeyOf: {id: 'r,c'}, groupOf: {id: g}}（k=0 が前回） */
    var hist = (input.history || []).slice(0, input.settings.historyDepth || 3);
    var histAdj = people.map(function(){ return {}; });
    var histGroup = people.map(function(){ return {}; });
    var lastSeat = people.map(function(){ return null; });
    hist.forEach(function(h, k){
      var decay = Math.pow(W.histDecay, k);
      var byPos = {}, byGroup = {};
      h.forEach(function(e){
        if(idx[e.id] === undefined) return;
        byPos[e.r + ',' + e.c] = idx[e.id];
        (byGroup[e.group] = byGroup[e.group] || []).push(idx[e.id]);
        if(k === 0) lastSeat[idx[e.id]] = e.r + ',' + e.c;
      });
      h.forEach(function(e){
        var p = idx[e.id]; if(p === undefined) return;
        [byPos[e.r + ',' + (e.c - 1)], byPos[e.r + ',' + (e.c + 1)]].forEach(function(q){
          if(q !== undefined) histAdj[p][q] = (histAdj[p][q] || 0) + decay;
        });
        (byGroup[e.group] || []).forEach(function(q){
          if(q !== p) histGroup[p][q] = (histGroup[p][q] || 0) + decay;
        });
      });
    });
    /* 場所の偏り：全履歴の前方率 */
    var frontRate = people.map(function(){ return 0; });
    var allHist = input.history || [];
    if(allHist.length){
      var cnt = people.map(function(){ return 0; });
      allHist.forEach(function(h){
        var rs = [];
        h.forEach(function(e){ if(rs.indexOf(e.r) < 0) rs.push(e.r); });
        rs.sort(function(a, b){ return a - b; });
        h.forEach(function(e){
          var p = idx[e.id]; if(p === undefined) return;
          cnt[p]++;
          if(rs.indexOf(e.r) < frontRows) frontRate[p]++;
        });
      });
      frontRate = frontRate.map(function(v, p){ return cnt[p] ? v / cnt[p] : 0; });
    }
    var meanFront = isFront.filter(Boolean).length / n;

    var fixedSeat = people.map(function(p){
      if(!p.fixed) return -1;
      var k = key[p.fixed.r + ',' + p.fixed.c];
      return k === undefined ? -1 : k;
    });

    return computeNear({
      n: n, seats: seats, people: people, idx: idx, adj: adj, fb: fb, diag: diag, grid4: grid4,
      groupOf: groupOf, groups: groups, isFront: isFront, relation: relation,
      pairs: pairs, pairsOf: pairsOf, histAdj: histAdj, histGroup: histGroup, lastSeat: lastSeat,
      frontRate: frontRate, meanFront: meanFront, fixedSeat: fixedSeat,
      genderMode: input.settings.genderMode || '隣は男女',
      useLeaders: people.some(function(p){ return p.leader; }),
      /* 班長候補が班の数より少ないなら「いない班」は避けようがないので数えない */
      leadersEnough: people.filter(function(p){ return p.leader; }).length >= Object.keys(groups).length,
      useCare: people.some(function(p){ return p.care; })
    });
  }

  /* 入力の致命的な矛盾を先に見つける。返り値は文の配列（空なら生成可） */
  function precheck(input){
    var errs = [];
    var seats = input.seats, st = input.students;
    if(!seats.length) errs.push('配置シートに座席がありません。');
    if(st.length > seats.length) errs.push('座席が ' + (st.length - seats.length) + ' 席足りません（在籍 ' + st.length + ' 人、座席 ' + seats.length + ' 席）。');
    var seatKey = {};
    seats.forEach(function(s){ seatKey[s.r + ',' + s.c] = 1; });
    var used = {};
    st.forEach(function(p){
      if(!p.fixed) return;
      var k = p.fixed.r + ',' + p.fixed.c;
      if(!seatKey[k]) errs.push(label(p) + ' の固定席（' + p.fixed.text + '）は座席ではありません。');
      else if(used[k]) errs.push(label(p) + ' と ' + label(used[k]) + ' の固定席が重なっています。');
      else used[k] = p;
    });
    var rows = [];
    seats.forEach(function(s){ if(rows.indexOf(s.r) < 0) rows.push(s.r); });
    rows.sort(function(a, b){ return a - b; });
    var fr = input.settings.frontRows || 2;
    var frontSeats = seats.filter(function(s){ return rows.indexOf(s.r) < fr; }).length;
    var needFront = st.filter(function(p){ return p.front; }).length;
    if(needFront > frontSeats) errs.push('前方が必要な児童 ' + needFront + ' 人に対し、前方の座席は ' + frontSeats + ' 席です（設定「前方の行数」を増やすか、前方の指定を減らしてください）。');
    return errs.concat(input.problems || []);
  }

  function label(p){ return p.id + '番 ' + (p.name || ''); }

  /* ---- 採点 ---- */
  /* asg[seat] = person index。pos[person] = seat */
  function genderClash(m, a, b){
    var ga = m.people[a].gender, gb = m.people[b].gender;
    return ga && gb && ga === gb;
  }

  /* 1人の児童 p が seat にいるときの、他者との関係項（半分ずつ持つ対称項は pairKey で重複回避）。
     差分計算を簡単にするため、「p に関わる全項」を返す関数と、全体採点関数を分ける。 */
  function personCost(m, asg, pos, p, out){
    var s = pos[p], P = m.people[p], c = 0;
    if(P.ghost) return 0;
    if(P.front && !m.isFront[s]){ c += HARD; if(out) out.push({ w: HARD, kind: '前方', text: label(P) + ' が前方の席ではありません。', seats: [s] }); }
    // 場所の偏り
    if(m.isFront[s] && m.frontRate[p] > m.meanFront && !P.front){
      var v = W.frontBias * (m.frontRate[p] - m.meanFront);
      c += v; if(out && v >= 5) out.push({ w: v, kind: '偏り', text: label(P) + ' はこれまでも前方が多めです。', seats: [s] });
    }
    if(m.lastSeat[p] && m.lastSeat[p] === m.seats[s].r + ',' + m.seats[s].c){
      c += W.sameSeat; if(out) out.push({ w: W.sameSeat, kind: '履歴', text: label(P) + ' が前回と同じ席です。', seats: [s] });
    }
    return c;
  }

  function pairCost(m, asg, pos, a, b, out){
    // a<b を前提に1回だけ数える
    var A = m.people[a], B = m.people[b];
    if(A.ghost || B.ghost) return 0;
    var sa = pos[a], sb = pos[b], c = 0;
    var rel = m.relation(sa, sb);
    var sameG = m.groupOf[sa] === m.groupOf[sb];
    // 履歴
    var ha = m.histAdj[a][b];
    if(ha && rel === 'adj'){ var v = W.histAdj * ha; c += v; if(out) out.push({ w: v, kind: '履歴', text: label(A) + ' と ' + label(B) + ' は最近も隣でした。', seats: [sa, sb] }); }
    var hg = m.histGroup[a][b];
    if(hg && sameG){ var v2 = W.histGroup * hg; c += v2; if(out && v2 >= 6) out.push({ w: v2, kind: '履歴', text: label(A) + ' と ' + label(B) + ' は最近も同じ班でした。', seats: [sa, sb] }); }
    // 男女
    if(genderClash(m, a, b)){
      if(m.genderMode === '隣は男女' && rel === 'adj'){ c += W.genderPair; if(out) out.push({ w: W.genderPair, kind: '男女', text: label(A) + ' と ' + label(B) + ' の隣が同性です。', seats: [sa, sb] }); }
      if(m.genderMode === '市松' && (rel === 'adj' || rel === 'fb')){ c += W.genderGrid; if(out) out.push({ w: W.genderGrid, kind: '男女', text: label(A) + ' と ' + label(B) + ' が同性で接しています。', seats: [sa, sb] }); }
    }
    // 配慮
    if(m.useCare && A.care && B.care && (rel === 'adj' || rel === 'fb')){
      c += W.careAdj; if(out) out.push({ w: W.careAdj, kind: '配慮', text: label(A) + ' と ' + label(B) + '（配慮）が接しています。', seats: [sa, sb] });
    }
    return c;
  }

  function condCost(m, pos, k, out){
    var q = m.pairs[k], A = m.people[q.a], B = m.people[q.b];
    var sa = pos[q.a], sb = pos[q.b];
    var rel = m.relation(sa, sb), sameG = m.groupOf[sa] === m.groupOf[sb], c = 0;
    if(q.type === '離す'){
      var hit = [];
      if(q.must){
        if(rel || sameG){ c = HARD; hit.push(rel ? { adj: '隣', fb: '前後', diag: '斜め' }[rel] : '同じ班'); }
      } else {
        if(rel === 'adj'){ c += W.sepAdj; hit.push('隣'); }
        if(rel === 'fb'){ c += W.sepFb; hit.push('前後'); }
        if(rel === 'diag'){ c += W.sepDiag; hit.push('斜め'); }
        if(sameG){ c += W.sepGroup; hit.push('同じ班'); }
      }
      if(c && out) out.push({ w: c, kind: '離す', text: label(A) + ' と ' + label(B) + ' が' + hit.join('・') + 'です（離す' + (q.must ? '・必須' : '') + '）。', seats: [sa, sb] });
    } else if(q.type === '近く'){
      if(!(rel === 'adj' || rel === 'fb' || sameG)){
        c = q.must ? HARD : W.near;
        if(out) out.push({ w: c, kind: '近く', text: label(A) + ' と ' + label(B) + ' が離れています（近く' + (q.must ? '・必須' : '') + '）。', seats: [sa, sb] });
      }
    }
    return c;
  }

  function groupCost(m, asg, g, out){
    var list = m.groups[g], c = 0, boys = 0, girls = 0, leaders = 0, care = 0, members = 0;
    list.forEach(function(s){
      var P = m.people[asg[s]]; if(P.ghost) return;
      members++;
      if(P.gender === '男') boys++; else if(P.gender === '女') girls++;
      if(P.leader) leaders++;
      if(P.care) care++;
    });
    if(members < 2) return 0;
    if(m.genderMode !== '考えない'){
      var diff = Math.abs(boys - girls) - 1;
      if(diff > 0){ c += W.genderGroup * diff; if(out) out.push({ w: W.genderGroup * diff, kind: '男女', text: g + '班の男女が偏っています（男' + boys + '・女' + girls + '）。', seats: list }); }
    }
    if(m.useLeaders){
      if(leaders === 0 && m.leadersEnough){ c += W.leaderNone; if(out) out.push({ w: W.leaderNone, kind: '班長', text: g + '班に班長候補がいません。', seats: list }); }
      else if(leaders > 1){ c += W.leaderExtra * (leaders - 1); if(out) out.push({ w: W.leaderExtra * (leaders - 1), kind: '班長', text: g + '班に班長候補が ' + leaders + ' 人います。', seats: list }); }
    }
    if(m.useCare && care > 1){ c += W.careGroup * (care - 1); if(out) out.push({ w: W.careGroup * (care - 1), kind: '配慮', text: g + '班に配慮の児童が ' + care + ' 人います。', seats: list }); }
    return c;
  }

  /* 近傍（接している席と同じ班）の人 */
  function neighborsOf(m, s){ return m.near[s]; }
  function computeNear(m){
    m.near = [];
    for(var s = 0; s < m.n; s++){
      var set = {};
      m.adj[s].concat(m.fb[s], m.diag[s], m.groups[m.groupOf[s]]).forEach(function(t){ if(t !== s) set[t] = 1; });
      m.near.push(Object.keys(set).map(Number));
    }
    return m;
  }

  function totalCost(m, asg, pos, out){
    var c = 0, i, j;
    for(i = 0; i < m.n; i++) c += personCost(m, asg, pos, i, out);
    for(i = 0; i < m.n; i++){
      var ns = neighborsOf(m, i);
      for(j = 0; j < ns.length; j++){
        var t = ns[j]; if(t <= i) continue;
        var a = asg[i], b = asg[t];
        c += pairCost(m, asg, pos, Math.min(a, b), Math.max(a, b), out);
      }
    }
    for(i = 0; i < m.pairs.length; i++) c += condCost(m, pos, i, out);
    Object.keys(m.groups).forEach(function(g){ c += groupCost(m, asg, g, out); });
    return c;
  }

  /* 席 s1,s2 の入れ替えで変わりうる項だけの合計 */
  function localCost(m, asg, pos, s1, s2){
    var c = 0, seen = {};
    [s1, s2].forEach(function(s){
      c += personCost(m, asg, pos, asg[s]);
      neighborsOf(m, s).forEach(function(t){
        var k = Math.min(s, t) + ',' + Math.max(s, t);
        if(seen[k]) return; seen[k] = 1;
        var a = asg[s], b = asg[t];
        c += pairCost(m, asg, pos, Math.min(a, b), Math.max(a, b));
      });
    });
    var ks = {};
    m.pairsOf[asg[s1]].concat(m.pairsOf[asg[s2]]).forEach(function(k){ ks[k] = 1; });
    Object.keys(ks).forEach(function(k){ c += condCost(m, pos, +k); });
    var g1 = m.groupOf[s1], g2 = m.groupOf[s2];
    c += groupCost(m, asg, g1);
    if(g2 !== g1) c += groupCost(m, asg, g2);
    return c;
  }

  function swap(asg, pos, s1, s2){
    var a = asg[s1], b = asg[s2];
    asg[s1] = b; asg[s2] = a; pos[b] = s1; pos[a] = s2;
  }

  function initial(m, rand){
    var asg = new Array(m.n), pos = new Array(m.n), free = [], people = [];
    for(var s = 0; s < m.n; s++) free.push(s);
    m.people.forEach(function(p, k){
      var f = m.fixedSeat[k];
      if(f >= 0){ asg[f] = k; pos[k] = f; free.splice(free.indexOf(f), 1); }
      else people.push(k);
    });
    // 前方指定を先に前方席へ
    people.sort(function(a, b){ return (m.people[b].front ? 1 : 0) - (m.people[a].front ? 1 : 0); });
    shuffle(free, rand);
    free.sort(function(a, b){ return (m.isFront[b] ? 1 : 0) - (m.isFront[a] ? 1 : 0); });
    var frontN = people.filter(function(k){ return m.people[k].front; }).length;
    var head = free.slice(0, frontN), tail = free.slice(frontN);
    shuffle(tail, rand);
    free = head.concat(tail);
    people.forEach(function(k, i){ asg[free[i]] = k; pos[k] = free[i]; });
    return { asg: asg, pos: pos };
  }

  function shuffle(a, rand){
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(rand() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function anneal(m, seed, iters){
    var rand = rng(seed);
    var st = initial(m, rand), asg = st.asg, pos = st.pos;
    var movable = [];
    for(var s = 0; s < m.n; s++) if(m.fixedSeat[asg[s]] < 0) movable.push(s);
    var cur = totalCost(m, asg, pos), best = cur, bestAsg = asg.slice();
    if(movable.length < 2) return { asg: bestAsg, cost: best };
    var T0 = 60, T1 = 0.5;
    for(var it = 0; it < iters; it++){
      var T = T0 * Math.pow(T1 / T0, it / iters);
      var s1 = movable[Math.floor(rand() * movable.length)];
      var s2 = movable[Math.floor(rand() * movable.length)];
      if(s1 === s2) continue;
      if(m.people[asg[s1]].ghost && m.people[asg[s2]].ghost) continue;
      var before = localCost(m, asg, pos, s1, s2);
      swap(asg, pos, s1, s2);
      var d = localCost(m, asg, pos, s1, s2) - before;
      if(d <= 0 || rand() < Math.exp(-d / T)){
        cur += d;
        if(cur < best - 1e-9){ best = cur; bestAsg = asg.slice(); }
      } else swap(asg, pos, s1, s2);
    }
    return { asg: bestAsg, cost: totalCost(m, bestAsg, posOf(bestAsg)) };
  }

  function posOf(asg){
    var pos = new Array(asg.length);
    asg.forEach(function(p, s){ pos[p] = s; });
    return pos;
  }

  /* 候補を count 個。互いの席の一致率が高すぎるものは捨てる */
  function solve(input, opts){
    opts = opts || {};
    var m = buildModel(input);
    var count = opts.count || 3, iters = opts.iters || Math.max(20000, m.n * 1500);
    var seed = opts.seed == null ? (Date.now() & 0x7fffffff) : opts.seed;
    var tries = [], limit = count * 3;
    for(var t = 0; t < limit && tries.length < count * 2; t++){
      tries.push(anneal(m, seed + t * 7919, iters));
    }
    tries.sort(function(a, b){ return a.cost - b.cost; });
    var picked = [];
    tries.forEach(function(r){
      if(picked.length >= count) return;
      var similar = picked.some(function(p){
        var same = 0;
        for(var s = 0; s < m.n; s++) if(p.asg[s] === r.asg[s]) same++;
        return same / m.n > 0.6;
      });
      if(!similar) picked.push(r);
    });
    tries.forEach(function(r){ if(picked.length < count && picked.indexOf(r) < 0) picked.push(r); });
    return picked.map(function(r){ return describe(m, r.asg); });
  }

  /* 表示用：配置と違反一覧 */
  function describe(m, asg){
    var pos = posOf(asg), out = [];
    var cost = totalCost(m, asg, pos, out);
    out.sort(function(a, b){ return b.w - a.w; });
    return {
      cost: Math.round(cost),
      hard: out.filter(function(v){ return v.w >= HARD; }).length,
      issues: out.map(function(v){ return { kind: v.kind, text: v.text, w: Math.round(v.w), hard: v.w >= HARD, seats: v.seats }; }),
      seats: m.seats.map(function(s, i){
        var P = m.people[asg[i]];
        return { r: s.r, c: s.c, group: s.group, id: P.ghost ? null : P.id, name: P.name || '' };
      })
    };
  }

  /* 手で入れ替えた後の再採点。seatIds[i] = 席 i の児童番号（空席は null） */
  function evaluate(input, seatIds){
    var m = buildModel(input);
    var asg = new Array(m.n), used = {}, ghosts = [];
    m.people.forEach(function(p, k){ if(p.ghost) ghosts.push(k); });
    seatIds.forEach(function(id, s){
      if(id == null || m.idx[id] === undefined){ asg[s] = ghosts.pop(); }
      else { asg[s] = m.idx[id]; used[id] = 1; }
    });
    return describe(m, asg);
  }

  return { solve: solve, evaluate: evaluate, precheck: precheck, buildModel: buildModel, weights: W, HARD: HARD, _rng: rng };
})();

</script>
<script>
var S = { input: null, cands: [], cur: -1, sel: -1, flip: false, pins: {}, hl: null, baseIssues: null };
var $ = function(id){ return document.getElementById(id); };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }

function server(fn){
  var args = [].slice.call(arguments, 1);
  return new Promise(function(ok, ng){
    if(typeof google === 'undefined' || !google.script){ return ng(new Error('Apps Script の外では動きません')); }
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(ng);
    r[fn].apply(r, args);
  });
}

function load(){
  server('loadInput').then(function(inp){
    if(inp.needSetup){
      $('stage').innerHTML = '<div class="msg"><p>席替え用のシートがまだありません。</p><button class="primary" id="setup">シートを用意する</button></div>';
      $('setup').onclick = function(){ server('setupSheets').then(function(){ $('stage').innerHTML = '<div class="msg">シートを作りました。「名簿」に児童を入れてから、もう一度開いてください。<br><span class="muted">試すだけなら、メニュー「席替え」→「試し用の学級を入れる」。</span></div>'; }); };
      return;
    }
    S.input = inp;
    var errs = Seating.precheck(inp);
    if(!inp.students.length) errs.unshift('名簿に在籍の児童がいません。');
    if(errs.length){
      $('stage').innerHTML = '<div class="msg err"><b>このままでは席を作れません</b><ul>' + errs.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul><p class="muted">シートを直したら、このウインドウを閉じて開き直してください。</p></div>';
      return;
    }
    $('make').disabled = false;
    var w = inp.warnings.length ? '<h2>読み飛ばした行</h2><ul class="issues">' + inp.warnings.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '';
    $('stage').innerHTML = '<div class="msg"><p><b>' + inp.students.length + '人</b>・<b>' + inp.seats.length + '席</b>・条件 <b>' + inp.conditions.length + '件</b>・履歴 <b>' + inp.history.length + '回分</b> を読みました。</p><p>「席を作る」を押すと、条件と過去の席を踏まえた案を ' + inp.settings.count + ' つ出します。</p></div>';
    $('side').innerHTML = w;
  }).catch(function(e){ $('stage').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
}

/* ---- 作る ---- */
function inputWithPins(){
  var inp = JSON.parse(JSON.stringify(S.input));
  var byId = {};
  inp.students.forEach(function(p){ byId[p.id] = p; });
  Object.keys(S.pins).forEach(function(k){
    var pin = S.pins[k], p = byId[pin.id];
    if(p) p.fixed = { r: pin.r, c: pin.c, text: 'その場で固定' };
  });
  return inp;
}

function make(){
  $('make').disabled = true;
  $('make').textContent = '計算中…';
  var inp = inputWithPins(), n = inp.settings.count, seed = Date.now() & 0x7fffffff, out = [];
  /* 1案ずつ計算して画面を止めない */
  (function step(i){
    if(i >= n){
      out.sort(function(a, b){ return a.cost - b.cost; });
      S.cands = out; S.base = out.map(function(c){ return c.issues; });
      $('make').disabled = false; $('make').textContent = '作り直す';
      select(0);
      return;
    }
    $('make').textContent = '計算中… ' + (i + 1) + '/' + n;
    setTimeout(function(){
      var r = Seating.solve(inp, { count: 1, seed: seed + i * 104729 });
      out.push(r[0]);
      step(i + 1);
    }, 30);
  })(0);
}

function select(i){
  S.cur = i; S.sel = -1; S.hl = null;
  S.baseIssues = keys(S.base[i]);
  renderTabs(); render();
  $('commit').disabled = false; $('commit').textContent = 'この席で決定'; $('show').disabled = false;
}

function keys(list){ var o = {}; list.forEach(function(v){ o[v.text] = 1; }); return o; }

function renderTabs(){
  $('tabs').innerHTML = S.cands.map(function(c, i){
    var label = String.fromCharCode(65 + i);
    var sub = c.hard ? '必須違反 ' + c.hard : '気になる点 ' + c.issues.length;
    return '<button class="tab" role="tab" aria-selected="' + (i === S.cur) + '" data-i="' + i + '">案' + label + '<small>' + sub + '</small></button>';
  }).join('');
  [].forEach.call($('tabs').children, function(b){ b.onclick = function(){ select(+b.dataset.i); }; });
}

/* ---- 描画 ---- */
function render(){
  var c = S.cands[S.cur]; if(!c) return;
  var rows = S.input.rows, cols = [];
  c.seats.forEach(function(s){ if(cols.indexOf(s.c) < 0) cols.push(s.c); });
  var cmin = Math.min.apply(null, c.seats.map(function(s){ return s.c; }));
  var cmax = Math.max.apply(null, c.seats.map(function(s){ return s.c; }));
  var rmin = rows[0], rmax = rows[rows.length - 1];
  var W = cmax - cmin + 1, H = rmax - rmin + 1;
  var bad = {};
  /* 印は個人・ペアの問題だけ。班全体の問題まで付けると全席に付いて意味を失う */
  (S.hl ? [S.hl] : c.issues.filter(function(v){ return (v.seats || []).length <= 2; }))
    .forEach(function(v){ (v.seats || []).forEach(function(s){ bad[s] = 1; }); });
  var fixedIds = {};
  S.input.students.forEach(function(p){ if(p.fixed) fixedIds[p.id] = 1; });
  var cells = c.seats.map(function(s, i){
    var y = s.r - rmin, x = s.c - cmin;
    if(S.flip){ y = H - 1 - y; x = W - 1 - x; }
    var pinned = S.pins[i] && S.pins[i].id === s.id;
    var cls = 'seat' + (s.id == null ? ' empty' : '') + (i === S.sel ? ' sel' : '') +
      (S.hl && bad[i] ? ' hl' : '') + (!S.hl && bad[i] ? ' bad' : '') + (fixedIds[s.id] ? ' fixed' : '');
    return '<div class="' + cls + '" data-i="' + i + '" style="grid-row:' + (y + 1) + ';grid-column:' + (x + 1) + ';background:var(--g' + gnum(s.group) + ')">' +
      (fixedIds[s.id] ? '<span class="pin" title="名簿で固定">固定</span>' : pinned ? '<span class="pin" title="この場で固定">📌</span>' : '') +
      '<span class="no">' + (s.id == null ? '' : esc(s.id)) + '</span><span class="nm">' + (s.id == null ? '空席' : esc(s.name)) + '</span></div>';
  }).join('');
  var front = '<div class="front" style="width:' + (W * 96) + 'px;max-width:100%">' + (S.flip ? '教卓（前）' : '黒板（前）') + '</div>';
  var grid = '<div class="grid" style="grid-template-columns:repeat(' + W + ',minmax(64px,90px))">' + cells + '</div>';
  $('stage').innerHTML = (S.flip ? grid + front : front + grid) +
    '<p class="hint">席を2つ続けてタップすると入れ替わります。選んだ席の「📌固定」で、その席を残して作り直せます。</p>';
  [].forEach.call(document.querySelectorAll('#stage .seat'), function(el){ el.onclick = function(){ tap(+el.dataset.i); }; });
  renderSide();
}

function gnum(g){ var n = parseInt(g, 10); return isNaN(n) ? 10 : ((n - 1) % 10 + 10) % 10 + 1; }

function renderSide(){
  var c = S.cands[S.cur];
  var hard = c.issues.filter(function(v){ return v.hard; });
  var soft = c.issues.filter(function(v){ return !v.hard; });
  var h = '<div class="summary">' + (hard.length ? '<span style="color:var(--warn)">必須の条件を <b>' + hard.length + '</b> 件満たしていません</span>' : '<span class="ok">必須の条件はすべて満たしています</span>') +
    '<br>気になる点 <b>' + soft.length + '</b> 件　<span class="muted">（点数 ' + c.cost + '・小さいほど良い）</span></div>';
  if(S.sel >= 0){
    var s = c.seats[S.sel], pinned = !!S.pins[S.sel];
    h += '<h2>選んだ席</h2><p>' + (s.id == null ? '空席' : esc(s.id) + '番 ' + esc(s.name)) + '（' + esc(s.group) + '班）</p>' +
      (s.id != null ? '<button id="pinbtn">' + (pinned ? '📌 固定を外す' : '📌 この席に固定') + '</button> ' : '') +
      '<button id="unsel">選択をやめる</button>';
  }
  var pins = Object.keys(S.pins).length;
  if(pins) h += '<p class="muted">この場で固定：' + pins + '人（「作り直す」で残ります）　<a href="#" id="clearpins">すべて外す</a></p>';
  h += '<h2>気になる点（重い順）</h2>';
  if(!c.issues.length) h += '<p class="muted">ありません。</p>';
  h += '<ul class="issues">' + c.issues.map(function(v, k){
    var isNew = !S.baseIssues[v.text];
    return '<li data-k="' + k + '" class="' + (v.hard ? 'hard ' : '') + (isNew ? 'new ' : '') + (S.hl === v ? 'on' : '') + '"><span class="k">' + esc(v.kind) + '</span>' + esc(v.text) + (isNew ? ' <span class="muted">（入れ替えで増えた）</span>' : '') + '</li>';
  }).join('') + '</ul>';
  if(S.input.warnings.length) h += '<h2>読み飛ばした行</h2><ul class="issues">' + S.input.warnings.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
  $('side').innerHTML = h;
  [].forEach.call(document.querySelectorAll('#side .issues li[data-k]'), function(li){
    li.onclick = function(){ var v = c.issues[+li.dataset.k]; S.hl = S.hl === v ? null : v; render(); };
  });
  if($('pinbtn')) $('pinbtn').onclick = function(){
    if(S.pins[S.sel]) delete S.pins[S.sel];
    else { var s = c.seats[S.sel]; S.pins[S.sel] = { id: s.id, r: s.r, c: s.c }; }
    render();
  };
  if($('unsel')) $('unsel').onclick = function(){ S.sel = -1; render(); };
  if($('clearpins')) $('clearpins').onclick = function(e){ e.preventDefault(); S.pins = {}; render(); };
}

function tap(i){
  var c = S.cands[S.cur];
  var fixedIds = {};
  S.input.students.forEach(function(p){ if(p.fixed) fixedIds[p.id] = 1; });
  if(fixedIds[c.seats[i].id]){ S.sel = -1; render(); return; }
  if(S.sel < 0 || S.sel === i){ S.sel = S.sel === i ? -1 : i; S.hl = null; render(); return; }
  var ids = c.seats.map(function(s){ return s.id; });
  var t = ids[S.sel]; ids[S.sel] = ids[i]; ids[i] = t;
  [S.sel, i].forEach(function(k){ delete S.pins[k]; });
  var next = Seating.evaluate(S.input, ids);
  S.cands[S.cur] = next;
  S.sel = -1; S.hl = null;
  renderTabs(); render();
}

/* ---- 決定 ---- */
function commit(){
  var c = S.cands[S.cur];
  var hard = c.issues.filter(function(v){ return v.hard; }).length;
  var msg = '案' + String.fromCharCode(65 + S.cur) + ' で決定し、「座席表」と「履歴」に書きます。' + (hard ? '\n必須の条件を ' + hard + ' 件満たしていません。' : '') + '\nよろしいですか？';
  if(!confirm(msg)) return;
  $('commit').disabled = true; $('commit').textContent = '書き込み中…';
  server('commit', c.seats, S.input.nextRound).then(function(r){
    $('commit').textContent = '第' + r.round + '回として決定しました';
    S.input.history.unshift(c.seats.filter(function(s){ return s.id != null; }).map(function(s){ return { id: s.id, r: s.r, c: s.c, group: s.group }; }));
    S.input.nextRound = r.round + 1;
  }).catch(function(e){ $('commit').disabled = false; $('commit').textContent = 'この席で決定'; alert('書き込めませんでした：' + e.message); });
}

/* ---- 発表（投影用。番号順に1人ずつ表示） ---- */
function show(){
  var c = S.cands[S.cur], R = $('reveal');
  var order = c.seats.map(function(s, i){ return i; }).filter(function(i){ return c.seats[i].id != null; });
  order.sort(function(a, b){ return String(c.seats[a].id).localeCompare(String(c.seats[b].id), 'ja', { numeric: true }); });
  var shown = 0;
  var cmin = Math.min.apply(null, c.seats.map(function(s){ return s.c; }));
  var rmin = S.input.rows[0];
  var cells = c.seats.map(function(s, i){
    return '<div class="seat hide" id="rv' + i + '" style="grid-row:' + (s.r - rmin + 1) + ';grid-column:' + (s.c - cmin + 1) + ';background:var(--g' + gnum(s.group) + ')"><span class="no">' + (s.id == null ? '' : esc(s.id)) + '</span><span class="nm">' + (s.id == null ? '' : esc(s.name)) + '</span></div>';
  }).join('');
  var W = Math.max.apply(null, c.seats.map(function(s){ return s.c; })) - cmin + 1;
  R.innerHTML = '<div class="big" id="rvnow">　</div><div class="front" style="width:' + (W * 80) + 'px">黒板（前）</div><div class="grid" style="grid-template-columns:repeat(' + W + ',72px)">' + cells + '</div>' +
    '<div><button id="rvnext" class="primary">次（スペース）</button> <button id="rvall">全員</button> <button id="rvclose">閉じる（Esc）</button></div>';
  R.classList.add('on');
  function next(){
    if(shown >= order.length) return;
    var i = order[shown++], s = c.seats[i];
    [].forEach.call(R.querySelectorAll('.just'), function(e){ e.classList.remove('just'); });
    var el = $('rv' + i); el.classList.remove('hide'); el.classList.add('just');
    $('rvnow').textContent = s.id + '番 ' + s.name;
  }
  function all(){ while(shown < order.length) next(); $('rvnow').textContent = '　'; }
  function close(){ R.classList.remove('on'); document.removeEventListener('keydown', key); }
  function key(e){ if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); next(); } if(e.key === 'Escape') close(); }
  $('rvnext').onclick = next; $('rvall').onclick = all; $('rvclose').onclick = close;
  document.addEventListener('keydown', key);
}

$('make').onclick = make;
$('commit').onclick = commit;
$('show').onclick = show;
$('flip').onclick = function(){ S.flip = !S.flip; this.textContent = S.flip ? '黒板側から見る' : '教卓側から見る'; render(); };
load();
</script>
