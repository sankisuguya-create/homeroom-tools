<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>席替え</title>
<style>
:root{
  --paper:#FCFBF7; --sheet:#FFFFFF; --ink:#1D2126; --ink-soft:#5A6470; --ink-faint:#9AA3AD;
  --rule:#DFDCD2; --accent:#2C5C9E; --accent-ink:#FFFFFF;
  --warn:#B0392B; --warn-bg:#FBEEEC; --ok:#2F6E4E; --sel:#F2A93B; --hl:#B0392B;
  --g1:#E4EEF9; --g2:#F7EBCB; --g3:#E3F2E8; --g4:#F6E3EC; --g5:#EDE6F7;
  --g6:#E3F2F3; --g7:#F4EADF; --g8:#EEF3DB; --g9:#F9E6E3; --g10:#E8EAF0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer;touch-action:manipulation}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button:disabled{opacity:.45;cursor:default}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.bar .grow{flex:1}
.tabs{display:flex;gap:4px}
.tab{min-width:92px;text-align:left;line-height:1.2;padding:4px 10px}
.tab small{display:block;color:var(--ink-soft);font-size:11px}
.tab[aria-selected=true]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
main{display:grid;grid-template-columns:1fr 330px;height:calc(100vh - 61px)}
#stage{overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.front{background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center;border-radius:6px;padding:4px 0}
.grid{display:grid;gap:3px}
.seat{min-height:58px;border:1px solid var(--ink-faint);border-radius:8px;padding:4px 6px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;position:relative;user-select:none}
.seat .no{font-size:11px;color:var(--ink-soft)}
.seat .nm{font-size:15px;font-weight:600;text-align:center;line-height:1.2}
.seat.empty .nm{color:var(--ink-faint);font-weight:400}
.seat.sel{outline:3px solid var(--sel);outline-offset:1px}
.seat.hl{outline:3px solid var(--hl);outline-offset:1px}
.seat.bad::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.seat .pin{position:absolute;top:2px;left:5px;font-size:11px}
.seat.fixed{cursor:default}
aside{border-left:1px solid var(--rule);background:var(--sheet);overflow:auto;padding:12px}
aside h2{font-size:13px;margin:12px 0 6px;color:var(--ink-soft)}
.summary{font-size:13px}
.summary b{font-size:22px}
.issues{list-style:none;margin:0;padding:0}
.issues li{padding:7px 8px;border-radius:6px;margin-bottom:4px;cursor:pointer;border:1px solid transparent}
.issues li:hover,.issues li.on{border-color:var(--rule);background:var(--paper)}
.issues li.hard{background:var(--warn-bg);color:var(--warn);font-weight:600}
.issues .k{display:inline-block;min-width:3em;font-size:11px;color:var(--ink-soft)}
.issues li.new{box-shadow:inset 3px 0 0 var(--warn)}
.msg{padding:16px;max-width:720px;margin:20px auto;background:var(--sheet);border:1px solid var(--rule);border-radius:10px}
.msg.err{border-color:var(--warn)}
.msg li{margin:4px 0}
.muted{color:var(--ink-soft);font-size:12px}
.ok{color:var(--ok)}
#reveal{position:fixed;inset:0;background:var(--paper);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9}
#reveal.on{display:flex}
#reveal .big{font-size:64px;font-weight:800}
#reveal .grid .seat{min-height:48px}
#reveal .seat.hide .nm,#reveal .seat.hide .no{visibility:hidden}
#reveal .seat.just{outline:4px solid var(--sel)}
.hint{font-size:12px;color:var(--ink-soft);text-align:center}
.views{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.views button{border:0;border-radius:0;min-width:64px}
.views button[aria-pressed=true]{background:var(--ink);color:var(--sheet);font-weight:700}
body[data-view=layout] .seatonly,body[data-view=weights] .seatonly,body[data-view=import] .seatonly{display:none}
/* 取り込み */
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%;max-width:820px}
.form input,.form select{min-height:40px;font:inherit;border:1px solid var(--rule);border-radius:8px;padding:0 8px;background:var(--sheet);color:var(--ink)}
.form input.url{flex:1;min-width:280px}
.pv{border-collapse:collapse;font-size:12px}
.pv td{border:1px solid var(--rule);min-width:56px;height:36px;padding:2px 4px;text-align:center;vertical-align:middle;line-height:1.2}
.pv td.ok{background:#E3F2E8}
.pv td.guess{background:#F7EBCB}
.pv td.ng{background:var(--warn-bg);color:var(--warn);font-weight:600}
.pv td.lb{color:var(--ink-faint)}
.pv td small{display:block;color:var(--ink-soft)}
.fix select{min-height:34px;font:inherit;max-width:180px}
.legend span{display:inline-block;padding:0 6px;margin-right:4px;border-radius:4px}
.tags{display:flex;gap:2px;margin-top:2px}
.tags i{font-style:normal;font-size:10px;line-height:1;padding:2px 3px;border-radius:3px;background:var(--sheet);color:var(--ink-soft);border:1px solid var(--rule)}
.seat.edge{border-color:var(--ink)}
/* 配置エディタ */
.ed{display:grid;gap:3px;touch-action:none}
.ed div{width:52px;height:44px;border:1px dashed var(--rule);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;user-select:none;cursor:pointer}
.ed div.on{border-style:solid;border-color:var(--ink-faint)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;max-width:720px}
.tools button[aria-pressed=true]{outline:3px solid var(--sel)}
.tools .sw{min-width:40px;padding:0 8px}
.tools select{min-height:40px;font:inherit;border-radius:8px;border:1px solid var(--rule);padding:0 6px}
/* 重視 */
.wt{width:100%;max-width:640px;border-collapse:collapse}
.wt td{padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
.wt td:first-child{width:12em;font-weight:600}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;min-width:52px;padding:0 6px;border-left:1px solid var(--rule)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg button.must[aria-pressed=true]{background:var(--warn)}
</style>
</head>
<body>
<div class="bar">
  <div class="views" id="views">
    <button data-v="seat" aria-pressed="true">席替え</button><button data-v="layout" aria-pressed="false">配置</button><button data-v="weights" aria-pressed="false">重視</button><button data-v="import" aria-pressed="false">取り込み</button>
  </div>
  <button id="make" class="primary seatonly" disabled>席を作る</button>
  <div class="tabs seatonly" id="tabs" role="tablist"></div>
  <span class="grow"></span>
  <button id="flip" class="seatonly" title="表示の向き">教卓側から見る</button>
  <button id="show" class="seatonly" disabled>発表</button>
  <button id="commit" class="primary seatonly" disabled>この席で決定</button>
</div>
<main id="main">
  <section id="stage"><div class="msg">読み込み中…</div></section>
  <aside id="side"></aside>
</main>
<div id="reveal"></div>

<script>
/* 生成物：apps/seating/src/solver.js から埋め込み。直接編集しない。 */
/* 席替えの計算部。ブラウザ（Dialog.html）と node（tests/）の両方で読む。
   外部参照なし。入力は Code.gs の readInput() が返す形。 */
var Seating = (function(){

  var HARD = 100000;
  var W = {
    sepAdj: 60, sepFb: 40, sepDiag: 20, sepGroup: 30,
    near: 30,
    genderPair: 20, genderGrid: 10, genderGroup: 10,
    leaderNone: 40, leaderExtra: 12,
    supportNone: 30, supportExtra: 10,
    careGroup: 40, careAdj: 30,
    tallFront: 25,
    histAdj: 50, histGroup: 12, histDecay: 0.6, sameSeat: 15,
    frontBias: 20
  };
  /* 重視の項目。教員がダイアログで 0〜4 の段階を選ぶ（0=無視 1=弱 2=中 3=強 4=必須）。
     must=false の項目は「必須」を選べない（割合で効く項目は必須にすると意味が壊れる）。 */
  var CATEGORIES = [
    { key: 'sep',       label: '「離す」の組',        keys: ['sepAdj', 'sepFb', 'sepDiag', 'sepGroup'], must: true },
    { key: 'near',      label: '「近く」の組',        keys: ['near'], must: true },
    { key: 'gender',    label: '男女の混ざり方',      keys: ['genderPair', 'genderGrid', 'genderGroup'], must: true },
    { key: 'leader',    label: 'リーダーを各班に',    keys: ['leaderNone', 'leaderExtra'], must: true },
    { key: 'support',   label: '学習支援役を各班に',  keys: ['supportNone', 'supportExtra'], must: true },
    { key: 'care',      label: '配慮の児童を分ける',  keys: ['careGroup', 'careAdj'], must: true },
    { key: 'tall',      label: '高身長は後ろへ',      keys: ['tallFront'], must: true },
    { key: 'histAdj',   label: '最近の隣を避ける',    keys: ['histAdj'], must: false },
    { key: 'histGroup', label: '最近の班を避ける',    keys: ['histGroup'], must: false },
    { key: 'sameSeat',  label: '前回と同じ席を避ける', keys: ['sameSeat'], must: true },
    { key: 'frontBias', label: '前・後ろの回り持ち',  keys: ['frontBias'], must: false }
  ];
  var LEVEL_MUL = [0, 0.4, 1, 2.5];

  function effectiveWeights(levels){
    var w = {};
    Object.keys(W).forEach(function(k){ w[k] = W[k]; });
    CATEGORIES.forEach(function(cat){
      var lv = levels && levels[cat.key] != null ? +levels[cat.key] : 2;
      if(lv >= 4 && !cat.must) lv = 3;
      cat.keys.forEach(function(k){ w[k] = lv >= 4 ? HARD : W[k] * LEVEL_MUL[Math.max(0, lv)]; });
    });
    return w;
  }

  function rng(seed){
    var a = seed >>> 0;
    return function(){
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* 座席どうしの関係を前計算する。rel[i][j] = 'adj' | 'fb' | 'diag' | null */
  function buildModel(input){
    var seats = input.seats;            // [{r,c,group}]
    var students = input.students;      // [{id,name,gender,front,fixed,leader,care}]
    var n = seats.length;
    var key = {};
    seats.forEach(function(s, i){ key[s.r + ',' + s.c] = i; });
    var rows = [];
    seats.forEach(function(s){ if(rows.indexOf(s.r) < 0) rows.push(s.r); });
    rows.sort(function(a, b){ return a - b; });
    var frontRows = input.settings.frontRows || 2;
    var isFront = seats.map(function(s){ return rows.indexOf(s.r) < frontRows; });
    var adj = [], fb = [], diag = [], grid4 = [];
    for(var i = 0; i < n; i++){
      var s = seats[i], a = [], f = [], d = [];
      var L = key[s.r + ',' + (s.c - 1)], R = key[s.r + ',' + (s.c + 1)];
      var U = key[(s.r - 1) + ',' + s.c], D = key[(s.r + 1) + ',' + s.c];
      if(L !== undefined) a.push(L);
      if(R !== undefined) a.push(R);
      if(U !== undefined) f.push(U);
      if(D !== undefined) f.push(D);
      [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(function(o){
        var k = key[(s.r + o[0]) + ',' + (s.c + o[1])];
        if(k !== undefined) d.push(k);
      });
      adj.push(a); fb.push(f); diag.push(d); grid4.push(a.concat(f));
    }
    var groupOf = seats.map(function(s){ var g = s.group == null ? '' : String(s.group); return g === '0' || g === '○' ? '' : g; });
    var groups = {};
    groupOf.forEach(function(g, i){ if(g !== '') (groups[g] = groups[g] || []).push(i); });  // '' ＝班なし

    function relation(i, j){
      if(adj[i].indexOf(j) >= 0) return 'adj';
      if(fb[i].indexOf(j) >= 0) return 'fb';
      if(diag[i].indexOf(j) >= 0) return 'diag';
      return null;
    }

    /* 児童インデックス。空席は仮想児童 (id=null) */
    var people = students.slice();
    while(people.length < n) people.push({ id: null, name: '', gender: '', ghost: true });
    var idx = {};
    people.forEach(function(p, k){ if(p.id != null) idx[p.id] = k; });

    /* 条件を児童ごとに引けるようにする */
    var pairs = [];
    (input.conditions || []).forEach(function(c){
      if(idx[c.a] === undefined || idx[c.b] === undefined) return;
      pairs.push({ a: idx[c.a], b: idx[c.b], type: c.type, must: !!c.must });
    });
    var pairsOf = people.map(function(){ return []; });
    pairs.forEach(function(p, k){ pairsOf[p.a].push(k); pairsOf[p.b].push(k); });

    /* 履歴：recent[k] = {seatKeyOf: {id: 'r,c'}, groupOf: {id: g}}（k=0 が前回） */
    var hist = (input.history || []).slice(0, input.settings.historyDepth || 3);
    var histAdj = people.map(function(){ return {}; });
    var histGroup = people.map(function(){ return {}; });
    var lastSeat = people.map(function(){ return null; });
    hist.forEach(function(h, k){
      var decay = Math.pow(W.histDecay, k);
      var byPos = {}, byGroup = {};
      h.forEach(function(e){
        if(idx[e.id] === undefined) return;
        byPos[e.r + ',' + e.c] = idx[e.id];
        var eg = e.group == null ? '' : String(e.group);
        if(eg !== '' && eg !== '0' && eg !== '○') (byGroup[eg] = byGroup[eg] || []).push(idx[e.id]);
        if(k === 0) lastSeat[idx[e.id]] = e.r + ',' + e.c;
      });
      h.forEach(function(e){
        var p = idx[e.id]; if(p === undefined) return;
        [byPos[e.r + ',' + (e.c - 1)], byPos[e.r + ',' + (e.c + 1)]].forEach(function(q){
          if(q !== undefined) histAdj[p][q] = (histAdj[p][q] || 0) + decay;
        });
        (byGroup[String(e.group)] || []).forEach(function(q){
          if(q !== p) histGroup[p][q] = (histGroup[p][q] || 0) + decay;
        });
      });
    });
    /* 場所の偏り：全履歴の前方率 */
    var frontRate = people.map(function(){ return 0; });
    var allHist = input.history || [];
    if(allHist.length){
      var cnt = people.map(function(){ return 0; });
      allHist.forEach(function(h){
        var rs = [];
        h.forEach(function(e){ if(rs.indexOf(e.r) < 0) rs.push(e.r); });
        rs.sort(function(a, b){ return a - b; });
        h.forEach(function(e){
          var p = idx[e.id]; if(p === undefined) return;
          cnt[p]++;
          if(rs.indexOf(e.r) < frontRows) frontRate[p]++;
        });
      });
      frontRate = frontRate.map(function(v, p){ return cnt[p] ? v / cnt[p] : 0; });
    }
    var meanFront = isFront.filter(Boolean).length / n;

    var fixedSeat = people.map(function(p){
      if(!p.fixed) return -1;
      var k = key[p.fixed.r + ',' + p.fixed.c];
      return k === undefined ? -1 : k;
    });

    return computeNear({
      n: n, seats: seats, people: people, idx: idx, adj: adj, fb: fb, diag: diag, grid4: grid4,
      groupOf: groupOf, groups: groups, isFront: isFront, relation: relation,
      pairs: pairs, pairsOf: pairsOf, histAdj: histAdj, histGroup: histGroup, lastSeat: lastSeat,
      frontRate: frontRate, meanFront: meanFront, fixedSeat: fixedSeat,
      genderMode: input.settings.genderMode || '隣は男女',
      useLeaders: people.some(function(p){ return p.leader; }),
      /* 班長候補が班の数より少ないなら「いない班」は避けようがないので数えない */
      leadersEnough: people.filter(function(p){ return p.leader; }).length >= Object.keys(groups).length,
      useCare: people.some(function(p){ return p.care; }),
      useSupport: people.some(function(p){ return p.support; }),
      supportEnough: people.filter(function(p){ return p.support; }).length >= Object.keys(groups).length,
      w: effectiveWeights(input.settings.weights)
    });
  }

  /* 入力の致命的な矛盾を先に見つける。返り値は文の配列（空なら生成可） */
  function precheck(input){
    var errs = [];
    var seats = input.seats, st = input.students;
    if(!seats.length) errs.push('配置シートに座席がありません。');
    if(st.length > seats.length) errs.push('座席が ' + (st.length - seats.length) + ' 席足りません（在籍 ' + st.length + ' 人、座席 ' + seats.length + ' 席）。');
    var seatKey = {};
    seats.forEach(function(s){ seatKey[s.r + ',' + s.c] = 1; });
    var used = {};
    st.forEach(function(p){
      if(!p.fixed) return;
      var k = p.fixed.r + ',' + p.fixed.c;
      if(!seatKey[k]) errs.push(label(p) + ' の固定席（' + p.fixed.text + '）は座席ではありません。');
      else if(used[k]) errs.push(label(p) + ' と ' + label(used[k]) + ' の固定席が重なっています。');
      else used[k] = p;
    });
    var rows = [];
    seats.forEach(function(s){ if(rows.indexOf(s.r) < 0) rows.push(s.r); });
    rows.sort(function(a, b){ return a - b; });
    var fr = input.settings.frontRows || 2;
    var frontSeats = seats.filter(function(s){ return rows.indexOf(s.r) < fr; }).length;
    var needFront = st.filter(function(p){ return p.front; }).length;
    if(needFront > frontSeats) errs.push('前方が必要な児童 ' + needFront + ' 人に対し、前方の座席は ' + frontSeats + ' 席です（設定「前方の行数」を増やすか、前方の指定を減らしてください）。');
    return errs.concat(input.problems || []);
  }

  function label(p){ return p.id + '番 ' + (p.name || ''); }

  /* ---- 採点 ---- */
  /* asg[seat] = person index。pos[person] = seat */
  function genderClash(m, a, b){
    var ga = m.people[a].gender, gb = m.people[b].gender;
    return ga && gb && ga === gb;
  }

  /* 1人の児童 p が seat にいるときの、他者との関係項（半分ずつ持つ対称項は pairKey で重複回避）。
     差分計算を簡単にするため、「p に関わる全項」を返す関数と、全体採点関数を分ける。 */
  function personCost(m, asg, pos, p, out){
    var s = pos[p], P = m.people[p], c = 0;
    if(P.ghost) return 0;
    if(P.front && !m.isFront[s]){ c += HARD; if(out) out.push({ w: HARD, kind: '前方', text: label(P) + ' が前方の席ではありません。', seats: [s] }); }
    if(P.tall && !P.front && m.isFront[s] && m.w.tallFront){
      c += m.w.tallFront; if(out) out.push({ w: m.w.tallFront, kind: '高身長', text: label(P) + '（高身長）が前方の席です。', seats: [s] });
    }
    // 場所の偏り
    if(m.w.frontBias && m.isFront[s] && m.frontRate[p] > m.meanFront && !P.front){
      var v = m.w.frontBias * (m.frontRate[p] - m.meanFront);
      c += v; if(out && v >= 5) out.push({ w: v, kind: '偏り', text: label(P) + ' はこれまでも前方が多めです。', seats: [s] });
    }
    if(m.w.sameSeat && m.lastSeat[p] && m.lastSeat[p] === m.seats[s].r + ',' + m.seats[s].c){
      c += m.w.sameSeat; if(out) out.push({ w: m.w.sameSeat, kind: '履歴', text: label(P) + ' が前回と同じ席です。', seats: [s] });
    }
    return c;
  }

  function pairCost(m, asg, pos, a, b, out){
    // a<b を前提に1回だけ数える
    var A = m.people[a], B = m.people[b];
    if(A.ghost || B.ghost) return 0;
    var sa = pos[a], sb = pos[b], c = 0;
    var rel = m.relation(sa, sb);
    var sameG = (m.groupOf[sa] !== '' && m.groupOf[sa] === m.groupOf[sb]);
    // 履歴
    var ha = m.histAdj[a][b];
    if(ha && rel === 'adj' && m.w.histAdj){ var v = m.w.histAdj * ha; c += v; if(out) out.push({ w: v, kind: '履歴', text: label(A) + ' と ' + label(B) + ' は最近も隣でした。', seats: [sa, sb] }); }
    var hg = m.histGroup[a][b];
    if(hg && sameG && m.w.histGroup){ var v2 = m.w.histGroup * hg; c += v2; if(out && v2 >= 6) out.push({ w: v2, kind: '履歴', text: label(A) + ' と ' + label(B) + ' は最近も同じ班でした。', seats: [sa, sb] }); }
    // 男女
    if(genderClash(m, a, b)){
      if(m.genderMode === '隣は男女' && rel === 'adj' && m.w.genderPair){ c += m.w.genderPair; if(out) out.push({ w: m.w.genderPair, kind: '男女', text: label(A) + ' と ' + label(B) + ' の隣が同性です。', seats: [sa, sb] }); }
      if(m.genderMode === '市松' && (rel === 'adj' || rel === 'fb') && m.w.genderGrid){ c += m.w.genderGrid; if(out) out.push({ w: m.w.genderGrid, kind: '男女', text: label(A) + ' と ' + label(B) + ' が同性で接しています。', seats: [sa, sb] }); }
    }
    // 配慮
    if(m.useCare && m.w.careAdj && A.care && B.care && (rel === 'adj' || rel === 'fb')){
      c += m.w.careAdj; if(out) out.push({ w: m.w.careAdj, kind: '配慮', text: label(A) + ' と ' + label(B) + '（配慮）が接しています。', seats: [sa, sb] });
    }
    return c;
  }

  function condCost(m, pos, k, out){
    var q = m.pairs[k], A = m.people[q.a], B = m.people[q.b];
    var sa = pos[q.a], sb = pos[q.b];
    var rel = m.relation(sa, sb), sameG = (m.groupOf[sa] !== '' && m.groupOf[sa] === m.groupOf[sb]), c = 0;
    if(q.type === '離す'){
      var hit = [];
      if(q.must){
        if(rel || sameG){ c = HARD; hit.push(rel ? { adj: '隣', fb: '前後', diag: '斜め' }[rel] : '同じ班'); }
      } else {
        if(rel === 'adj'){ c += m.w.sepAdj; hit.push('隣'); }
        if(rel === 'fb'){ c += m.w.sepFb; hit.push('前後'); }
        if(rel === 'diag'){ c += m.w.sepDiag; hit.push('斜め'); }
        if(sameG){ c += m.w.sepGroup; hit.push('同じ班'); }
      }
      if(c && out) out.push({ w: c, kind: '離す', text: label(A) + ' と ' + label(B) + ' が' + hit.join('・') + 'です（離す' + (q.must ? '・必須' : '') + '）。', seats: [sa, sb] });
    } else if(q.type === '近く'){
      if(!(rel === 'adj' || rel === 'fb' || sameG)){
        c = q.must ? HARD : m.w.near;
        if(out) out.push({ w: c, kind: '近く', text: label(A) + ' と ' + label(B) + ' が離れています（近く' + (q.must ? '・必須' : '') + '）。', seats: [sa, sb] });
      }
    }
    return c;
  }

  function groupCost(m, asg, g, out){
    var list = m.groups[g] || [], c = 0, boys = 0, girls = 0, leaders = 0, care = 0, support = 0, members = 0;
    list.forEach(function(s){
      var P = m.people[asg[s]]; if(P.ghost) return;
      members++;
      if(P.gender === '男') boys++; else if(P.gender === '女') girls++;
      if(P.leader) leaders++;
      if(P.care) care++;
      if(P.support) support++;
    });
    if(members < 2) return 0;
    if(m.genderMode !== '考えない' && m.w.genderGroup){
      var diff = Math.abs(boys - girls) - 1;
      if(diff > 0){ c += m.w.genderGroup * diff; if(out) out.push({ w: m.w.genderGroup * diff, kind: '男女', text: g + '班の男女が偏っています（男' + boys + '・女' + girls + '）。', seats: list }); }
    }
    if(m.useLeaders && m.w.leaderNone){
      if(leaders === 0 && m.leadersEnough){ c += m.w.leaderNone; if(out) out.push({ w: m.w.leaderNone, kind: 'リーダー', text: g + '班にリーダーがいません。', seats: list }); }
      else if(leaders > 1){ c += m.w.leaderExtra * (leaders - 1); if(out) out.push({ w: m.w.leaderExtra * (leaders - 1), kind: 'リーダー', text: g + '班にリーダーが ' + leaders + ' 人います。', seats: list }); }
    }
    if(m.useSupport && m.w.supportNone){
      if(support === 0 && m.supportEnough){ c += m.w.supportNone; if(out) out.push({ w: m.w.supportNone, kind: '学習支援', text: g + '班に学習支援役がいません。', seats: list }); }
      else if(support > 1){ c += m.w.supportExtra * (support - 1); if(out) out.push({ w: m.w.supportExtra * (support - 1), kind: '学習支援', text: g + '班に学習支援役が ' + support + ' 人います。', seats: list }); }
    }
    if(m.useCare && m.w.careGroup && care > 1){ c += m.w.careGroup * (care - 1); if(out) out.push({ w: m.w.careGroup * (care - 1), kind: '配慮', text: g + '班に配慮の児童が ' + care + ' 人います。', seats: list }); }
    return c;
  }

  /* 近傍（接している席と同じ班）の人 */
  function neighborsOf(m, s){ return m.near[s]; }
  function computeNear(m){
    m.near = [];
    for(var s = 0; s < m.n; s++){
      var set = {};
      m.adj[s].concat(m.fb[s], m.diag[s], m.groups[m.groupOf[s]] || []).forEach(function(t){ if(t !== s) set[t] = 1; });
      m.near.push(Object.keys(set).map(Number));
    }
    return m;
  }

  function totalCost(m, asg, pos, out){
    var c = 0, i, j;
    for(i = 0; i < m.n; i++) c += personCost(m, asg, pos, i, out);
    for(i = 0; i < m.n; i++){
      var ns = neighborsOf(m, i);
      for(j = 0; j < ns.length; j++){
        var t = ns[j]; if(t <= i) continue;
        var a = asg[i], b = asg[t];
        c += pairCost(m, asg, pos, Math.min(a, b), Math.max(a, b), out);
      }
    }
    for(i = 0; i < m.pairs.length; i++) c += condCost(m, pos, i, out);
    Object.keys(m.groups).forEach(function(g){ c += groupCost(m, asg, g, out); });
    return c;
  }

  /* 席 s1,s2 の入れ替えで変わりうる項だけの合計 */
  function localCost(m, asg, pos, s1, s2){
    var c = 0, seen = {};
    [s1, s2].forEach(function(s){
      c += personCost(m, asg, pos, asg[s]);
      neighborsOf(m, s).forEach(function(t){
        var k = Math.min(s, t) + ',' + Math.max(s, t);
        if(seen[k]) return; seen[k] = 1;
        var a = asg[s], b = asg[t];
        c += pairCost(m, asg, pos, Math.min(a, b), Math.max(a, b));
      });
    });
    var ks = {};
    m.pairsOf[asg[s1]].concat(m.pairsOf[asg[s2]]).forEach(function(k){ ks[k] = 1; });
    Object.keys(ks).forEach(function(k){ c += condCost(m, pos, +k); });
    var g1 = m.groupOf[s1], g2 = m.groupOf[s2];
    c += groupCost(m, asg, g1);
    if(g2 !== g1) c += groupCost(m, asg, g2);
    return c;
  }

  function swap(asg, pos, s1, s2){
    var a = asg[s1], b = asg[s2];
    asg[s1] = b; asg[s2] = a; pos[b] = s1; pos[a] = s2;
  }

  function initial(m, rand){
    var asg = new Array(m.n), pos = new Array(m.n), free = [], people = [];
    for(var s = 0; s < m.n; s++) free.push(s);
    m.people.forEach(function(p, k){
      var f = m.fixedSeat[k];
      if(f >= 0){ asg[f] = k; pos[k] = f; free.splice(free.indexOf(f), 1); }
      else people.push(k);
    });
    // 前方指定を先に前方席へ
    people.sort(function(a, b){ return (m.people[b].front ? 1 : 0) - (m.people[a].front ? 1 : 0); });
    shuffle(free, rand);
    free.sort(function(a, b){ return (m.isFront[b] ? 1 : 0) - (m.isFront[a] ? 1 : 0); });
    var frontN = people.filter(function(k){ return m.people[k].front; }).length;
    var head = free.slice(0, frontN), tail = free.slice(frontN);
    shuffle(tail, rand);
    free = head.concat(tail);
    people.forEach(function(k, i){ asg[free[i]] = k; pos[k] = free[i]; });
    return { asg: asg, pos: pos };
  }

  function shuffle(a, rand){
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(rand() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function anneal(m, seed, iters){
    var rand = rng(seed);
    var st = initial(m, rand), asg = st.asg, pos = st.pos;
    var movable = [];
    for(var s = 0; s < m.n; s++) if(m.fixedSeat[asg[s]] < 0) movable.push(s);
    var cur = totalCost(m, asg, pos), best = cur, bestAsg = asg.slice();
    if(movable.length < 2) return { asg: bestAsg, cost: best };
    var T0 = 60, T1 = 0.5;
    for(var it = 0; it < iters; it++){
      var T = T0 * Math.pow(T1 / T0, it / iters);
      var s1 = movable[Math.floor(rand() * movable.length)];
      var s2 = movable[Math.floor(rand() * movable.length)];
      if(s1 === s2) continue;
      if(m.people[asg[s1]].ghost && m.people[asg[s2]].ghost) continue;
      var before = localCost(m, asg, pos, s1, s2);
      swap(asg, pos, s1, s2);
      var d = localCost(m, asg, pos, s1, s2) - before;
      if(d <= 0 || rand() < Math.exp(-d / T)){
        cur += d;
        if(cur < best - 1e-9){ best = cur; bestAsg = asg.slice(); }
      } else swap(asg, pos, s1, s2);
    }
    return { asg: bestAsg, cost: totalCost(m, bestAsg, posOf(bestAsg)) };
  }

  function posOf(asg){
    var pos = new Array(asg.length);
    asg.forEach(function(p, s){ pos[p] = s; });
    return pos;
  }

  /* 候補を count 個。互いの席の一致率が高すぎるものは捨てる */
  function solve(input, opts){
    opts = opts || {};
    var m = buildModel(input);
    var count = opts.count || 3, iters = opts.iters || Math.max(20000, m.n * 1500);
    var seed = opts.seed == null ? (Date.now() & 0x7fffffff) : opts.seed;
    var tries = [], limit = count * 3;
    for(var t = 0; t < limit && tries.length < count * 2; t++){
      tries.push(anneal(m, seed + t * 7919, iters));
    }
    tries.sort(function(a, b){ return a.cost - b.cost; });
    var picked = [];
    tries.forEach(function(r){
      if(picked.length >= count) return;
      var similar = picked.some(function(p){
        var same = 0;
        for(var s = 0; s < m.n; s++) if(p.asg[s] === r.asg[s]) same++;
        return same / m.n > 0.6;
      });
      if(!similar) picked.push(r);
    });
    tries.forEach(function(r){ if(picked.length < count && picked.indexOf(r) < 0) picked.push(r); });
    return picked.map(function(r){ return describe(m, r.asg); });
  }

  /* 表示用：配置と違反一覧 */
  function describe(m, asg){
    var pos = posOf(asg), out = [];
    var cost = totalCost(m, asg, pos, out);
    out.sort(function(a, b){ return b.w - a.w; });
    return {
      cost: Math.round(cost),
      hard: out.filter(function(v){ return v.w >= HARD; }).length,
      issues: out.map(function(v){ return { kind: v.kind, text: v.text, w: Math.round(v.w), hard: v.w >= HARD, seats: v.seats }; }),
      seats: m.seats.map(function(s, i){
        var P = m.people[asg[i]];
        return { r: s.r, c: s.c, group: s.group, id: P.ghost ? null : P.id, name: P.name || '' };
      })
    };
  }

  /* 手で入れ替えた後の再採点。seatIds[i] = 席 i の児童番号（空席は null） */
  function evaluate(input, seatIds){
    var m = buildModel(input);
    var asg = new Array(m.n), used = {}, ghosts = [];
    m.people.forEach(function(p, k){ if(p.ghost) ghosts.push(k); });
    seatIds.forEach(function(id, s){
      if(id == null || m.idx[id] === undefined){ asg[s] = ghosts.pop(); }
      else { asg[s] = m.idx[id]; used[id] = 1; }
    });
    return describe(m, asg);
  }

  return { solve: solve, evaluate: evaluate, precheck: precheck, buildModel: buildModel, weights: W, categories: CATEGORIES, HARD: HARD, _rng: rng };
})();

<script>
/* 生成物：apps/seating/src/importer.js から埋め込み。直接編集しない。 */
/* 過去の座席表（任意のスプレッドシートの格子）を読み、名簿の児童に対応づける。
   ブラウザ（Dialog.html）と node（tests/）の両方で読む。外部参照なし。 */
var SeatImport = (function(){

  /* 座席ではない見出し。これを含むセルは児童として扱わず、向きの判定に使う */
  var FRONT = /黒板|教卓|前（|^前$|ホワイトボード|スクリーン/;
  var LABEL = /黒板|教卓|ホワイトボード|スクリーン|窓|廊下|入口|出口|ドア|ロッカー|空席|欠番|^前$|^後ろ?$|座席表|向き|第\s*\d+\s*回|^\d{4}[\/\-年]/;

  function half(s){
    return String(s).replace(/[０-９Ａ-Ｚａ-ｚ]/g, function(d){ return String.fromCharCode(d.charCodeAt(0) - 0xFEE0); });
  }
  function normName(s){
    return half(s).replace(/[\s　・]/g, '').replace(/(さん|くん|君|ちゃん)$/, '');
  }

  /* 1セルを {num, name} に分ける。「3 あおき」「3\nあおき」「あおき(3)」「3」「あおき」 */
  function splitCell(raw){
    var s = half(String(raw == null ? '' : raw)).trim();
    if(!s) return null;
    var m = s.match(/^(\d{1,3})\s*(?:番)?[\s\n.:：、,)）-]*(.*)$/) || s.match(/^(.*?)[\s(（]*(\d{1,3})\s*(?:番)?[)）]?$/);
    if(m){
      var numFirst = /^\d/.test(s);
      var num = +(numFirst ? m[1] : m[2]), name = (numFirst ? m[2] : m[1]).trim();
      return { num: num, name: name };
    }
    return { num: null, name: s };
  }

  /* values: 2次元配列（表示値）。students: [{id,name}]。
     opts.flip: 教卓側から見た向きなら true（null なら見出しの位置から推定）
   opts.overrides: {'r,c': 児童番号 | 'skip'}  教員が手で直した対応 */
  function parse(values, students, opts){
    opts = opts || {};
    var byNum = {}, byName = {}, names = [];
    students.forEach(function(p){
      byNum[String(p.id)] = p;
      var k = normName(p.name);
      if(k){ (byName[k] = byName[k] || []).push(p); names.push({ k: k, p: p }); }
    });
    var cells = [], labels = [], frontRows = [];
    values.forEach(function(row, r){
      row.forEach(function(v, c){
        var raw = String(v == null ? '' : v).trim();
        if(!raw) return;
        if(FRONT.test(raw)) frontRows.push(r);
        if(LABEL.test(raw)){ labels.push({ r: r, c: c, raw: raw }); return; }
        var x = splitCell(raw);
        var hit = null, why = '';
        var ov = opts.overrides && opts.overrides[r + ',' + c];
        if(ov === 'skip'){ labels.push({ r: r, c: c, raw: raw, skipped: true }); return; }
        if(ov != null && byNum[String(ov)]){
          hit = byNum[String(ov)];
        } else if(x.num != null && byNum[String(x.num)]){
          hit = byNum[String(x.num)];
          if(x.name && normName(x.name) !== normName(hit.name) && normName(hit.name).indexOf(normName(x.name)) < 0 && normName(x.name).indexOf(normName(hit.name)) < 0)
            why = '番号は ' + hit.id + '番 ' + hit.name + ' だが、名前「' + x.name + '」と合わない';
        } else if(x.name){
          var k = normName(x.name), list = byName[k];
          if(list && list.length === 1) hit = list[0];
          else if(list && list.length > 1) why = '同じ名前が名簿に ' + list.length + ' 人いる';
          else {
            /* 姓だけ・名だけの書き方に備え、前方一致・部分一致で1人に絞れるときだけ採る */
            var part = names.filter(function(n){ return n.k.indexOf(k) === 0 || k.indexOf(n.k) === 0 || (k.length >= 2 && n.k.indexOf(k) >= 0); });
            if(part.length === 1){ hit = part[0].p; why = '名前の一部で「' + hit.name + '」とみなした'; }
            else if(part.length > 1) why = '「' + x.name + '」に当たる児童が ' + part.length + ' 人いる';
            else if(x.num != null) why = x.num + '番は名簿にいない';
            else why = '名簿に見つからない';
          }
        } else if(x.num != null) why = x.num + '番は名簿にいない';
        cells.push({ r: r, c: c, raw: raw, id: hit ? hit.id : null, name: hit ? hit.name : '', note: why, sure: !!hit && !why, manual: ov != null });
      });
    });

    /* 同じ児童が2か所：2つ目以降を外す */
    var seen = {}, dup = [];
    cells.forEach(function(x){
      if(x.id == null) return;
      if(seen[x.id]){ dup.push(x); x.note = x.id + '番が2か所にある（' + seen[x.id].raw + '）'; x.id = null; x.name = ''; x.sure = false; }
      else seen[x.id] = x;
    });

    /* 向き：前の見出しが座席より下にあれば、教卓側から見た表 */
    var flip = opts.flip;
    if(flip == null){
      var seatRows = cells.map(function(x){ return x.r; });
      var mid = seatRows.length ? (Math.min.apply(null, seatRows) + Math.max.apply(null, seatRows)) / 2 : 0;
      flip = frontRows.length ? frontRows.every(function(r){ return r > mid; }) : false;
    }
    var H = values.length, W = values.reduce(function(m, row){ return Math.max(m, row.length); }, 0);
    var entries = cells.filter(function(x){ return x.id != null; }).map(function(x){
      var r = flip ? H - 1 - x.r : x.r, c = flip ? W - 1 - x.c : x.c;
      return { id: x.id, name: x.name, r: r, c: c, group: '' };
    });
    /* 座席の左上を配置シートの座席の起点（2行目・A列）にそろえる。見出しの行・列は座標に含めない */
    if(entries.length){
      var rMin = Math.min.apply(null, entries.map(function(e){ return e.r; }));
      var cMin = Math.min.apply(null, entries.map(function(e){ return e.c; }));
      entries.forEach(function(e){ e.r = e.r - rMin + 2; e.c = e.c - cMin + 1; });
    }
    var missing = students.filter(function(p){ return !seen[p.id]; });
    return {
      cells: cells, labels: labels, flip: flip, entries: entries,
      problems: cells.filter(function(x){ return x.note; }),
      /* 同じ児童がほぼ全員2回ずつ＝向き違いの表が2つ並んでいる（この道具の座席表シートなど） */
      twoBlocks: dup.length >= 4 && dup.length >= entriesCount(cells) * 0.8,
      missing: missing
    };
  }

  function entriesCount(cells){ return cells.filter(function(x){ return x.id != null; }).length; }

  /* 大きな範囲から、空でないセルを囲む最小の矩形を切り出す */
  function trim(values){
    var r0 = Infinity, r1 = -1, c0 = Infinity, c1 = -1;
    values.forEach(function(row, r){ row.forEach(function(v, c){
      if(String(v == null ? '' : v).trim()){ r0 = Math.min(r0, r); r1 = Math.max(r1, r); c0 = Math.min(c0, c); c1 = Math.max(c1, c); }
    }); });
    if(r1 < 0) return [];
    return values.slice(r0, r1 + 1).map(function(row){
      var o = row.slice(c0, c1 + 1); while(o.length < c1 - c0 + 1) o.push(''); return o;
    });
  }

  return { parse: parse, trim: trim, splitCell: splitCell, normName: normName };
})();

<script>
var S = { input: null, cands: [], cur: -1, sel: -1, flip: false, pins: {}, hl: null, baseIssues: null, view: 'seat', ed: null };
var $ = function(id){ return document.getElementById(id); };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }

function server(fn){
  var args = [].slice.call(arguments, 1);
  return new Promise(function(ok, ng){
    if(typeof google === 'undefined' || !google.script){ return ng(new Error('Apps Script の外では動きません')); }
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(ng);
    r[fn].apply(r, args);
  });
}

function load(){
  server('loadInput').then(function(inp){
    if(inp.needSetup){
      $('stage').innerHTML = '<div class="msg"><p>席替え用のシートがまだありません。</p><button class="primary" id="setup">シートを用意する</button></div>';
      $('setup').onclick = function(){ server('setupSheets').then(function(){ $('stage').innerHTML = '<div class="msg">シートを作りました。「名簿」に児童を入れてから、もう一度開いてください。<br><span class="muted">試すだけなら、メニュー「席替え」→「試し用の学級を入れる」。</span></div>'; }); };
      return;
    }
    setInput(inp);
    showView(S.view);
  }).catch(function(e){ $('stage').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
}

function setInput(inp){
  S.input = inp; S.cands = []; S.cur = -1; S.sel = -1; S.pins = {}; S.hl = null;
  $('tabs').innerHTML = ''; $('commit').disabled = true; $('show').disabled = true;
  $('make').textContent = '席を作る';
}

function errorsOf(inp){
  var errs = Seating.precheck(inp);
  if(!inp.students.length) errs.unshift('名簿に在籍の児童がいません。');
  return errs;
}

function showView(v){
  S.view = v;
  document.body.dataset.view = v;
  /* ---- 取り込み（別のスプレッドシートの過去の座席表） ---- */
function renderImport(){
  var M = S.im || (S.im = { url: '', info: null, sheet: '', range: '', values: null, flip: null, overrides: {}, date: '', busy: false, msg: '' });
  var h = '<div class="msg" style="max-width:860px;margin-top:0">' +
    '<p><b>過去の座席表を履歴に取り込みます。</b>別のスプレッドシート（前の学期・去年の座席表など）の格子をそのまま読みます。' +
    'セルは「番号」「氏名」「番号＋氏名」のどれでもよく、黒板・教卓・空席などの見出しは飛ばします。</p>' +
    '<div class="form"><input class="url" id="imurl" placeholder="スプレッドシートの URL（空欄ならこのファイル）" value="' + esc(M.url) + '"><button id="imopen">開く</button></div>';
  if(M.info){
    h += '<div class="form" style="margin-top:8px"><span>「' + esc(M.info.name) + '」</span><select id="imsheet">' +

  }
  if(M.msg) h += '<p style="color:var(--warn)">' + esc(M.msg) + '</p>';
  h += '</div>';
  var side = '<h2>手順</h2><p class="muted">1. URL を貼って「開く」<br>2. シートと範囲を選んで「読む」<br>3. 色で対応を確かめ、赤い所を直す<br>4. その席替えの日付を入れて取り込む</p>';
  if(M.values){
    var r = SeatImport.parse(M.values, S.input.students, { flip: M.flip, overrides: M.overrides });
    M.last = r;
    var key = {};
    r.cells.forEach(function(x){ key[x.r + ',' + x.c] = x; });
    r.labels.forEach(function(x){ key[x.r + ',' + x.c] = { label: true, raw: x.raw, skipped: x.skipped }; });
    var t = '<table class="pv">';
    M.values.forEach(function(row, i){
      t += '<tr>' + row.map(function(v, j){
        var x = key[i + ',' + j];
        if(!x) return '<td></td>';
        if(x.label) return '<td class="lb">' + esc(x.raw) + (x.skipped ? '<small>飛ばす</small>' : '') + '</td>';
        var cls = x.id == null ? 'ng' : (x.sure || x.manual ? 'ok' : 'guess');
        return '<td class="' + cls + '">' + esc(x.raw) + (x.id != null ? '<small>→ ' + esc(x.id) + '番</small>' : '') + '</td>';
      }).join('') + '</tr>';
    });
    t += '</table>';
    h += '<div class="form" style="justify-content:space-between"><span class="legend"><span style="background:#E3F2E8">対応した</span><span style="background:#F7EBCB">推定</span><span style="background:var(--warn-bg);color:var(--warn)">対応できない</span></span>' +
      '<label><input type="checkbox" id="imflip"' + (r.flip ? ' checked' : '') + '> 教卓側から見た表（上下左右を反転）</label></div>' +
      '<div style="overflow:auto;max-width:100%">' + t + '</div>';
    if(r.twoBlocks) h += '<p style="color:var(--warn)">同じ児童がほぼ全員2回ずつ出ています。向きの違う座席表が2つ並んでいるようです。範囲に片方だけを指定してください（例：A1:H9）。</p>';
    var roster = S.input.students.slice().sort(function(a, b){ return String(a.id).localeCompare(String(b.id), 'ja', { numeric: true }); });
    var fixes = r.problems.map(function(x){
      var opts = '<option value="">（選ぶ）</option><option value="skip">飛ばす（児童ではない）</option>' +
        roster.map(function(p){ return '<option value="' + esc(p.id) + '">' + esc(p.id) + '番 ' + esc(p.name) + '</option>'; }).join('');
      return '<li class="fix' + (x.id == null ? ' hard' : '') + '"><b>' + esc(x.raw) + '</b>：' + esc(x.note) + '<br><select data-k="' + x.r + ',' + x.c + '">' + opts + '</select></li>';
    }).join('');
    side = '<h2>読んだ結果</h2><p><b>' + r.entries.length + '</b> 人を座席に対応づけました。</p>' +
      (r.missing.length ? '<p class="muted">この表にいない在籍児童：' + r.missing.map(function(p){ return esc(p.id) + '番'; }).join('、') + '<br>（欠席・転入などで居なかった児童は、そのままで構いません）</p>' : '') +
      (fixes ? '<h2>確かめる所（' + r.problems.length + '）</h2><ul class="issues">' + fixes + '</ul>' : '<p class="ok">確かめる所はありません。</p>') +
      '<h2>取り込む</h2><div class="form"><input type="date" id="imdate" value="' + esc(M.date) + '"><button id="imgo" class="primary"' + (r.entries.length && M.date && !M.busy ? '' : ' disabled') + '>履歴に取り込む</button></div>' +
      '<p class="muted">日付は、その席で過ごし始めた日。「前回」はこの日付の順で決まります。班の区切りは取り込みません（隣と席の位置だけを使います）。</p>';
  }
  $('stage').innerHTML = h;
  $('side').innerHTML = side;
  $('imopen').onclick = function(){
    M.url = $('imurl').value; M.msg = ''; M.info = null; M.values = null; M.overrides = {};
    server('sourceInfo', M.url).then(function(info){
      M.info = info;
      if(!info.sheets.length){ M.msg = '読めるシートがありません。'; }
      else M.sheet = (info.sheets.filter(function(x){ return /座席|席/.test(x.name); })[0] || info.sheets[0]).name;
      renderImport();
    }).catch(function(e){ M.msg = e.message; renderImport(); });
  };
  if($('imread')) $('imread').onclick = function(){
    M.sheet = $('imsheet').value; M.range = $('imrange').value; M.msg = ''; M.overrides = {}; M.flip = null;
    this.disabled = true; this.textContent = '読んでいます…';
    server('readSource', M.url, M.sheet, M.range).then(function(v){
      M.values = SeatImport.trim(v);
      if(!M.values.length){ M.values = null; M.msg = 'そのシート（範囲）は空です。'; }
      renderImport();
    }).catch(function(e){ M.msg = e.message; renderImport(); });
  };
  if($('imflip')) $('imflip').onchange = function(){ M.flip = this.checked; renderImport(); };
  [].forEach.call(document.querySelectorAll('.fix select'), function(sel){
    sel.onchange = function(){ if(sel.value){ M.overrides[sel.dataset.k] = sel.value === 'skip' ? 'skip' : sel.value; renderImport(); } };
  });
  if($('imdate')) $('imdate').onchange = function(){ M.date = this.value; renderImport(); };
  if($('imgo')) $('imgo').onclick = function(){
    var r = M.last;
    if(r.problems.some(function(x){ return x.id == null; }) && !confirm('対応できないセルが残っています。それらを飛ばして取り込みますか？')) return;
    M.busy = true; this.disabled = true; this.textContent = '取り込み中…';
    server('importEntries', r.entries, M.date).then(function(res){
      setInput(res.input);
      S.im = { url: M.url, info: M.info, sheet: M.sheet, range: '', values: null, flip: null, overrides: {}, date: '', busy: false,
        msg: '' };
      renderImport();
      $('side').innerHTML = '<p class="ok"><b>第' + res.round + '回として ' + r.entries.length + ' 人分を取り込みました。</b></p><p class="muted">過去の席替えは今 ' + res.input.history.length + ' 回分あります。続けて別の回を取り込めます。</p>';
    }).catch(function(e){ M.busy = false; M.msg = e.message; renderImport(); });
  };
}

[].forEach.call($('views').children, function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === v)); });
  if(!S.input) return;
  if(v === 'layout') return renderEditor();
  if(v === 'weights') return renderWeights();
  if(v === 'import') return renderImport();
  if(S.cands.length) return render();
  var inp = S.input, errs = errorsOf(inp);
  $('make').disabled = !!errs.length;
  if(errs.length){
    $('stage').innerHTML = '<div class="msg err"><b>このままでは席を作れません</b><ul>' + errs.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul><p class="muted">座席の数や位置は「配置」で直せます。名簿を直したら、このウインドウを閉じて開き直してください。</p></div>';
  } else {
    $('stage').innerHTML = '<div class="msg"><p><b>' + inp.students.length + '人</b>・<b>' + inp.seats.length + '席</b>・条件 <b>' + inp.conditions.length + '件</b>・過去の席替え <b>' + inp.history.length + '回分</b> を読みました。</p><p>「席を作る」を押すと、条件・属性・過去の席を踏まえた案を ' + inp.settings.count + ' つ出します。何を重視するかは「重視」で変えられます。</p>' + attrSummary(inp) + '</div>';
  }
  $('side').innerHTML = inp.warnings.length ? '<h2>読み飛ばした行</h2><ul class="issues">' + inp.warnings.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '';
}

function attrSummary(inp){
  var n = function(k){ return inp.students.filter(function(p){ return p[k]; }).length; };
  var groups = {};
  inp.seats.forEach(function(s){ if(s.group) groups[s.group] = 1; });
  var g = Object.keys(groups).length;
  var t = '<p class="muted">班 ' + g + ' ／ リーダー ' + n('leader') + '人・学習支援役 ' + n('support') + '人・配慮 ' + n('care') + '人・高身長 ' + n('tall') + '人・前方 ' + n('front') + '人</p>';
  var short = [];
  if(g && n('leader') && n('leader') < g) short.push('リーダーが班の数より少ないので、「いない班」は数えず、同じ班に重ならないことだけを見ます。');
  if(g && n('support') && n('support') < g) short.push('学習支援役が班の数より少ないので、同じ班に重ならないことだけを見ます。');
  return t + short.map(function(x){ return '<p class="muted">' + x + '</p>'; }).join('');
}

/* ---- 作る ---- */
function inputWithPins(){
  var inp = JSON.parse(JSON.stringify(S.input));
  var byId = {};
  inp.students.forEach(function(p){ byId[p.id] = p; });
  Object.keys(S.pins).forEach(function(k){
    var pin = S.pins[k], p = byId[pin.id];
    if(p) p.fixed = { r: pin.r, c: pin.c, text: 'その場で固定' };
  });
  return inp;
}

function make(){
  $('make').disabled = true;
  $('make').textContent = '計算中…';
  var inp = inputWithPins(), n = inp.settings.count, seed = Date.now() & 0x7fffffff, out = [];
  /* 1案ずつ計算して画面を止めない */
  (function step(i){
    if(i >= n){
      out.sort(function(a, b){ return a.cost - b.cost; });
      S.cands = out; S.base = out.map(function(c){ return c.issues; });
      $('make').disabled = false; $('make').textContent = '作り直す';
      select(0);
      return;
    }
    $('make').textContent = '計算中… ' + (i + 1) + '/' + n;
    setTimeout(function(){
      var r = Seating.solve(inp, { count: 1, seed: seed + i * 104729 });
      out.push(r[0]);
      step(i + 1);
    }, 30);
  })(0);
}

function select(i){
  S.cur = i; S.sel = -1; S.hl = null;
  S.baseIssues = keys(S.base[i]);
  renderTabs(); render();
  $('commit').disabled = false; $('commit').textContent = 'この席で決定'; $('show').disabled = false;
}

function keys(list){ var o = {}; list.forEach(function(v){ o[v.text] = 1; }); return o; }

function renderTabs(){
  $('tabs').innerHTML = S.cands.map(function(c, i){
    var label = String.fromCharCode(65 + i);
    var sub = c.hard ? '必須違反 ' + c.hard : '気になる点 ' + c.issues.length;
    return '<button class="tab" role="tab" aria-selected="' + (i === S.cur) + '" data-i="' + i + '">案' + label + '<small>' + sub + '</small></button>';
  }).join('');
  [].forEach.call($('tabs').children, function(b){ b.onclick = function(){ select(+b.dataset.i); }; });
}

/* ---- 描画 ---- */
function render(){
  var c = S.cands[S.cur]; if(!c || S.view !== 'seat') return;
  var rows = S.input.rows, cols = [];
  c.seats.forEach(function(s){ if(cols.indexOf(s.c) < 0) cols.push(s.c); });
  var cmin = Math.min.apply(null, c.seats.map(function(s){ return s.c; }));
  var cmax = Math.max.apply(null, c.seats.map(function(s){ return s.c; }));
  var rmin = rows[0], rmax = rows[rows.length - 1];
  var W = cmax - cmin + 1, H = rmax - rmin + 1;
  var bad = {};
  /* 印は個人・ペアの問題だけ。班全体の問題まで付けると全席に付いて意味を失う */
  (S.hl ? [S.hl] : c.issues.filter(function(v){ return (v.seats || []).length <= 2; }))
    .forEach(function(v){ (v.seats || []).forEach(function(s){ bad[s] = 1; }); });
  var fixedIds = {};
  S.input.students.forEach(function(p){ if(p.fixed) fixedIds[p.id] = 1; });
  var gAt = {};
  c.seats.forEach(function(s){ gAt[s.r + ',' + s.c] = s.group || '○'; });
  var byId = {};
  S.input.students.forEach(function(p){ byId[p.id] = p; });
  var cells = c.seats.map(function(s, i){
    var y = s.r - rmin, x = s.c - cmin;
    var bw = groupEdges(gAt, s, S.flip);
    if(S.flip){ y = H - 1 - y; x = W - 1 - x; }
    var P = byId[s.id] || {};
    var tags = (P.leader ? '<i title="リーダー">リ</i>' : '') + (P.support ? '<i title="学習支援役">支</i>' : '') +
      (P.tall ? '<i title="高身長">高</i>' : '') + (P.front ? '<i title="前方">前</i>' : '') + (P.care ? '<i title="配慮">配</i>' : '');
    var pinned = S.pins[i] && S.pins[i].id === s.id;
    var cls = 'seat' + (s.id == null ? ' empty' : '') + (i === S.sel ? ' sel' : '') +
      (S.hl && bad[i] ? ' hl' : '') + (!S.hl && bad[i] ? ' bad' : '') + (fixedIds[s.id] ? ' fixed' : '');
    return '<div class="' + cls + '" data-i="' + i + '" style="grid-row:' + (y + 1) + ';grid-column:' + (x + 1) + ';background:var(--g' + gnum(s.group) + ');' + bw + '">' +
      (fixedIds[s.id] ? '<span class="pin" title="名簿で固定">固定</span>' : pinned ? '<span class="pin" title="この場で固定">📌</span>' : '') +
      '<span class="no">' + (s.id == null ? '' : esc(s.id)) + '</span><span class="nm">' + (s.id == null ? '空席' : esc(s.name)) + '</span>' +
      (tags ? '<span class="tags">' + tags + '</span>' : '') + '</div>';
  }).join('');
  var front = '<div class="front" style="width:' + (W * 96) + 'px;max-width:100%">' + (S.flip ? '教卓（前）' : '黒板（前）') + '</div>';
  var grid = '<div class="grid" style="grid-template-columns:repeat(' + W + ',minmax(64px,90px))">' + cells + '</div>';
  $('stage').innerHTML = (S.flip ? grid + front : front + grid) +
    '<p class="hint">席を2つ続けてタップすると入れ替わります。選んだ席の「📌固定」で、その席を残して作り直せます。</p>';
  [].forEach.call(document.querySelectorAll('#stage .seat'), function(el){ el.onclick = function(){ tap(+el.dataset.i); }; });
  renderSide();
}

/* 班の境目の辺だけ太くする。返り値は CSS の border-width（上 右 下 左） */
function groupEdges(gAt, s, flip){
  var g = s.group || '○';
  function e(dr, dc){ var n = gAt[(s.r + dr) + ',' + (s.c + dc)]; return !n || g === '○' || n !== g; }
  var t = e(-1, 0), r = e(0, 1), b = e(1, 0), l = e(0, -1);
  var sides = flip ? [b, l, t, r] : [t, r, b, l];
  return 'border-width:' + sides.map(function(x){ return x ? '3px' : '1px'; }).join(' ') +
    ';border-color:' + sides.map(function(x){ return x ? 'var(--ink)' : 'var(--rule)'; }).join(' ');
}

function gnum(g){ var n = parseInt(g, 10); return isNaN(n) ? 10 : ((n - 1) % 10 + 10) % 10 + 1; }

function renderSide(){
  var c = S.cands[S.cur];
  var hard = c.issues.filter(function(v){ return v.hard; });
  var soft = c.issues.filter(function(v){ return !v.hard; });
  var h = '<div class="summary">' + (hard.length ? '<span style="color:var(--warn)">必須の条件を <b>' + hard.length + '</b> 件満たしていません</span>' : '<span class="ok">必須の条件はすべて満たしています</span>') +
    '<br>気になる点 <b>' + soft.length + '</b> 件　<span class="muted">（点数 ' + c.cost + '・小さいほど良い）</span></div>';
  if(S.sel >= 0){
    var s = c.seats[S.sel], pinned = !!S.pins[S.sel];
    h += '<h2>選んだ席</h2><p>' + (s.id == null ? '空席' : esc(s.id) + '番 ' + esc(s.name)) + '（' + (s.group ? esc(s.group) + '班' : '班なし') + '）</p>' +
      (s.id != null ? pastNeighbors(s.id) : '') +
      (s.id != null ? '<button id="pinbtn">' + (pinned ? '📌 固定を外す' : '📌 この席に固定') + '</button> ' : '') +
      '<button id="unsel">選択をやめる</button>';
  }
  var pins = Object.keys(S.pins).length;
  if(pins) h += '<p class="muted">この場で固定：' + pins + '人（「作り直す」で残ります）　<a href="#" id="clearpins">すべて外す</a></p>';
  h += '<h2>気になる点（重い順）</h2>';
  if(!c.issues.length) h += '<p class="muted">ありません。</p>';
  h += '<ul class="issues">' + c.issues.map(function(v, k){
    var isNew = !S.baseIssues[v.text];
    return '<li data-k="' + k + '" class="' + (v.hard ? 'hard ' : '') + (isNew ? 'new ' : '') + (S.hl === v ? 'on' : '') + '"><span class="k">' + esc(v.kind) + '</span>' + esc(v.text) + (isNew ? ' <span class="muted">（入れ替えで増えた）</span>' : '') + '</li>';
  }).join('') + '</ul>';
  if(S.input.warnings.length) h += '<h2>読み飛ばした行</h2><ul class="issues">' + S.input.warnings.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
  $('side').innerHTML = h;
  [].forEach.call(document.querySelectorAll('#side .issues li[data-k]'), function(li){
    li.onclick = function(){ var v = c.issues[+li.dataset.k]; S.hl = S.hl === v ? null : v; render(); };
  });
  if($('pinbtn')) $('pinbtn').onclick = function(){
    if(S.pins[S.sel]) delete S.pins[S.sel];
    else { var s = c.seats[S.sel]; S.pins[S.sel] = { id: s.id, r: s.r, c: s.c }; }
    render();
  };
  if($('unsel')) $('unsel').onclick = function(){ S.sel = -1; render(); };
  if($('clearpins')) $('clearpins').onclick = function(e){ e.preventDefault(); S.pins = {}; render(); };
}

/* 選んだ児童が過去に隣・同じ班になった相手と回数 */
function pastNeighbors(id){
  var adj = {}, grp = {}, names = {};
  S.input.students.forEach(function(p){ names[p.id] = p.name; });
  S.input.history.forEach(function(h){
    var me = null;
    h.forEach(function(e){ if(String(e.id) === String(id)) me = e; });
    if(!me) return;
    h.forEach(function(e){
      if(e === me) return;
      if(e.r === me.r && Math.abs(e.c - me.c) === 1) adj[e.id] = (adj[e.id] || 0) + 1;
      else if(me.group && me.group !== '○' && String(e.group) === String(me.group)) grp[e.id] = (grp[e.id] || 0) + 1;
    });
  });
  function list(o){
    var ks = Object.keys(o).sort(function(a, b){ return o[b] - o[a]; });
    return ks.length ? ks.map(function(k){ return esc(k) + '番 ' + esc(names[k] || '') + (o[k] > 1 ? '×' + o[k] : ''); }).join('、') : 'なし';
  }
  if(!S.input.history.length) return '';
  return '<p class="muted">過去' + S.input.history.length + '回で隣：' + list(adj) + '<br>同じ班：' + list(grp) + '</p>';
}

function tap(i){
  var c = S.cands[S.cur];
  var fixedIds = {};
  S.input.students.forEach(function(p){ if(p.fixed) fixedIds[p.id] = 1; });
  if(fixedIds[c.seats[i].id]){ S.sel = -1; render(); return; }
  if(S.sel < 0 || S.sel === i){ S.sel = S.sel === i ? -1 : i; S.hl = null; render(); return; }
  var ids = c.seats.map(function(s){ return s.id; });
  var t = ids[S.sel]; ids[S.sel] = ids[i]; ids[i] = t;
  [S.sel, i].forEach(function(k){ delete S.pins[k]; });
  var next = Seating.evaluate(S.input, ids);
  S.cands[S.cur] = next;
  S.sel = -1; S.hl = null;
  renderTabs(); render();
}

/* ---- 決定 ---- */
function commit(){
  var c = S.cands[S.cur];
  var hard = c.issues.filter(function(v){ return v.hard; }).length;
  var msg = '案' + String.fromCharCode(65 + S.cur) + ' で決定し、「座席表」と「履歴」に書きます。' + (hard ? '\n必須の条件を ' + hard + ' 件満たしていません。' : '') + '\nよろしいですか？';
  if(!confirm(msg)) return;
  $('commit').disabled = true; $('commit').textContent = '書き込み中…';
  server('commit', c.seats, S.input.nextRound).then(function(r){
    $('commit').textContent = '第' + r.round + '回として決定しました';
    S.input.history.unshift(c.seats.filter(function(s){ return s.id != null; }).map(function(s){ return { id: s.id, r: s.r, c: s.c, group: s.group }; }));
    S.input.nextRound = r.round + 1;
  }).catch(function(e){ $('commit').disabled = false; $('commit').textContent = 'この席で決定'; alert('書き込めませんでした：' + e.message); });
}

/* ---- 発表（投影用。番号順に1人ずつ表示） ---- */
function show(){
  var c = S.cands[S.cur], R = $('reveal');
  var order = c.seats.map(function(s, i){ return i; }).filter(function(i){ return c.seats[i].id != null; });
  order.sort(function(a, b){ return String(c.seats[a].id).localeCompare(String(c.seats[b].id), 'ja', { numeric: true }); });
  var shown = 0;
  var cmin = Math.min.apply(null, c.seats.map(function(s){ return s.c; }));
  var rmin = S.input.rows[0];
  var cells = c.seats.map(function(s, i){
    return '<div class="seat hide" id="rv' + i + '" style="grid-row:' + (s.r - rmin + 1) + ';grid-column:' + (s.c - cmin + 1) + ';background:var(--g' + gnum(s.group) + ')"><span class="no">' + (s.id == null ? '' : esc(s.id)) + '</span><span class="nm">' + (s.id == null ? '' : esc(s.name)) + '</span></div>';
  }).join('');
  var W = Math.max.apply(null, c.seats.map(function(s){ return s.c; })) - cmin + 1;
  R.innerHTML = '<div class="big" id="rvnow">　</div><div class="front" style="width:' + (W * 80) + 'px">黒板（前）</div><div class="grid" style="grid-template-columns:repeat(' + W + ',72px)">' + cells + '</div>' +
    '<div><button id="rvnext" class="primary">次（スペース）</button> <button id="rvall">全員</button> <button id="rvclose">閉じる（Esc）</button></div>';
  R.classList.add('on');
  function next(){
    if(shown >= order.length) return;
    var i = order[shown++], s = c.seats[i];
    [].forEach.call(R.querySelectorAll('.just'), function(e){ e.classList.remove('just'); });
    var el = $('rv' + i); el.classList.remove('hide'); el.classList.add('just');
    $('rvnow').textContent = s.id + '番 ' + s.name;
  }
  function all(){ while(shown < order.length) next(); $('rvnow').textContent = '　'; }
  function close(){ R.classList.remove('on'); document.removeEventListener('keydown', key); }
  function key(e){ if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); next(); } if(e.key === 'Escape') close(); }
  $('rvnext').onclick = next; $('rvall').onclick = all; $('rvclose').onclick = close;
  document.addEventListener('keydown', key);
}

/* ---- 配置エディタ ---- */
var PRESETS = {
  '2人組×3列': function(R, C){ return fill(R, C, function(r, c){ var cols = [0, 1, 3, 4, 6, 7]; var k = cols.indexOf(c); return k < 0 || r > 5 ? '' : String(Math.floor(r / 2) * 3 + Math.floor(k / 2) + 1); }); },
  '4人の島': function(R, C){ return fill(R, C, function(r, c){ if(r % 3 === 2 || c % 3 === 2 || r > 7) return ''; return String(Math.floor(r / 3) * 3 + Math.floor(c / 3) + 1); }); },
  '6人の島': function(R, C){ return fill(R, C, function(r, c){ if(r % 4 === 3 || c % 3 === 2 || r > 6) return ''; return String(Math.floor(r / 4) * 3 + Math.floor(c / 3) + 1); }); },
  'コの字': function(R, C){ return fill(R, C, function(r, c){ var onU = (r === 0 && c >= 2 && c <= 5) || ((c === 0 || c === 7) && r <= 5) || ((c === 1 || c === 6) && r <= 5); return onU ? '○' : ''; }); },
  '1人ずつ': function(R, C){ return fill(R, C, function(r, c){ return c % 2 === 0 && r < 6 ? '○' : ''; }); }
};
function fill(R, C, f){ var g = []; for(var r = 0; r < R; r++){ g.push([]); for(var c = 0; c < C; c++) g[r].push(f(r, c) || ''); } return g; }

function renderEditor(){
  if(!S.ed){
    var src = S.input.layoutGrid || fill(8, 8, function(){ return ''; });
    S.ed = { grid: src.map(function(r){ return r.slice(); }), tool: '1', dirty: false };
  }
  var E = S.ed, R = E.grid.length, C = E.grid[0].length;
  var sizes = function(id, v){ var o = ''; for(var k = 4; k <= 10; k++) o += '<option' + (k === v ? ' selected' : '') + '>' + k + '</option>'; return '<select id="' + id + '">' + o + '</select>'; };
  var sw = '<button class="sw" data-t="" aria-pressed="' + (E.tool === '') + '">通路</button><button class="sw" data-t="○" aria-pressed="' + (E.tool === '○') + '">○班なし</button>';
  for(var g = 1; g <= 12; g++) sw += '<button class="sw" data-t="' + g + '" style="background:var(--g' + gnum(g) + ')" aria-pressed="' + (E.tool === String(g)) + '">' + g + '</button>';
  var gAt = {}, seats = 0;
  E.grid.forEach(function(row, r){ row.forEach(function(v, c){ if(v !== ''){ gAt[r + ',' + c] = v; seats++; } }); });
  var cells = '';
  E.grid.forEach(function(row, r){ row.forEach(function(v, c){
    var bw = v === '' ? '' : ';' + groupEdges(gAt, { r: r, c: c, group: v === '○' ? '' : v }, false);
    cells += '<div data-r="' + r + '" data-c="' + c + '" class="' + (v !== '' ? 'on' : '') + '" style="' + (v !== '' ? 'background:var(--g' + gnum(v) + ')' : '') + bw + '">' + esc(v) + '</div>';
  }); });
  $('stage').innerHTML =
    '<div class="tools">行 ' + sizes('edR', R) + ' 列 ' + sizes('edC', C) + '　ひな形：' +
      Object.keys(PRESETS).map(function(k){ return '<button data-p="' + k + '">' + k + '</button>'; }).join('') + '</div>' +
    '<div class="tools">塗る：' + sw + '</div>' +
    '<div class="front" style="width:' + (C * 55) + 'px">前（黒板）</div>' +
    '<div class="ed" id="ed" style="grid-template-columns:repeat(' + C + ',52px)">' + cells + '</div>' +
    '<p class="hint">番号を選んでマスをなぞると、その班の座席になります。同じ番号のまとまりの外周に太線が引かれます。「通路」でなぞると消えます。</p>' +
    '<div class="tools"><button id="edsave" class="primary"' + (E.dirty ? '' : ' disabled') + '>配置シートに保存（' + seats + '席）</button><button id="edreset"' + (E.dirty ? '' : ' disabled') + '>保存前に戻す</button></div>';
  var groups = {};
  E.grid.forEach(function(row){ row.forEach(function(v){ if(v !== '' && v !== '○') groups[v] = (groups[v] || 0) + 1; }); });
  var gk = Object.keys(groups).sort(function(a, b){ return a - b; });
  $('side').innerHTML = '<h2>この配置</h2><p><b>' + seats + '</b> 席（在籍 ' + S.input.students.length + ' 人）' +
    (seats < S.input.students.length ? '<br><span style="color:var(--warn)">' + (S.input.students.length - seats) + ' 席足りません</span>' : '') + '</p>' +
    '<h2>班ごとの席数</h2><p>' + (gk.length ? gk.map(function(k){ return k + '班 ' + groups[k]; }).join('<br>') : '班なし') + '</p>' +
    '<p class="muted">保存すると、作った案は消えます（席の位置が変わるため）。</p>';
  [].forEach.call(document.querySelectorAll('.tools .sw'), function(b){ b.onclick = function(){ E.tool = b.dataset.t; renderEditor(); }; });
  [].forEach.call(document.querySelectorAll('.tools [data-p]'), function(b){ b.onclick = function(){ E.grid = PRESETS[b.dataset.p](R, C); E.dirty = true; renderEditor(); }; });
  $('edR').onchange = $('edC').onchange = function(){
    var nr = +$('edR').value, nc = +$('edC').value;
    E.grid = fill(nr, nc, function(r, c){ return E.grid[r] && E.grid[r][c] !== undefined ? E.grid[r][c] : ''; });
    E.dirty = true; renderEditor();
  };
  var ed = $('ed'), painting = false;
  function paintAt(x, y){
    var el = document.elementFromPoint(x, y);
    if(!el || !el.dataset || el.dataset.r === undefined) return;
    var r = +el.dataset.r, c = +el.dataset.c;
    if(E.grid[r][c] === E.tool) return;
    E.grid[r][c] = E.tool; E.dirty = true;
    el.textContent = E.tool; el.className = E.tool !== '' ? 'on' : '';
    el.style.background = E.tool !== '' ? 'var(--g' + gnum(E.tool) + ')' : '';
  }
  ed.onpointerdown = function(e){ painting = true; ed.setPointerCapture && ed.setPointerCapture(e.pointerId); paintAt(e.clientX, e.clientY); };
  ed.onpointermove = function(e){ if(painting) paintAt(e.clientX, e.clientY); };
  ed.onpointerup = ed.onpointercancel = function(){ if(painting){ painting = false; renderEditor(); } };
  $('edsave').onclick = function(){
    if(S.cands.length && !confirm('配置を保存すると、今の案は消えます。よろしいですか？')) return;
    this.disabled = true; this.textContent = '保存中…';
    server('saveLayout', E.grid).then(function(inp){ S.ed = null; setInput(inp); renderEditor(); })
      .catch(function(e){ alert('保存できませんでした：' + e.message); renderEditor(); });
  };
  $('edreset').onclick = function(){ S.ed = null; renderEditor(); };
}

/* ---- 重視 ---- */
var LEVELS = ['無視', '弱', '中', '強', '必須'];
function renderWeights(){
  var w = S.input.settings.weights || (S.input.settings.weights = {});
  var rows = Seating.categories.map(function(cat){
    var lv = w[cat.key] != null ? w[cat.key] : 2;
    var btn = LEVELS.map(function(name, k){
      if(k === 4 && !cat.must) return '';
      return '<button data-k="' + cat.key + '" data-l="' + k + '" class="' + (k === 4 ? 'must' : '') + '" aria-pressed="' + (lv === k) + '">' + name + '</button>';
    }).join('');
    return '<tr><td>' + esc(cat.label) + '</td><td><div class="seg">' + btn + '</div></td></tr>';
  }).join('');
  $('stage').innerHTML = '<div class="msg" style="max-width:700px;margin-top:0"><p><b>何を重視するか</b>を選びます。「必須」は、満たせないと必須違反として赤で出します。' +
    '「無視」はその項目を計算に入れません。選ぶとすぐ設定シートに保存し、今の案の点数も付け直します。</p>' +
    '<table class="wt">' + rows + '</table>' +
    '<p class="muted">個別の「離す／近く」で強さを「必須」にした組は、ここの段階によらず必須です。</p>' +
    '<p><button id="wreset">すべて「中」に戻す</button></p></div>';
  $('side').innerHTML = '<h2>段階の意味</h2><p class="muted">弱＝中の0.4倍、強＝中の2.5倍。<br>「最近の隣を避ける」などの履歴の項目と「前・後ろの回り持ち」は、割合で効くため「必須」を選べません。</p>' +
    (S.cands.length ? '<h2>今の案</h2><p>' + S.cands.map(function(c, i){ return '案' + String.fromCharCode(65 + i) + '：気になる点 ' + c.issues.length + (c.hard ? '・必須違反 ' + c.hard : ''); }).join('<br>') + '</p><p class="muted">重視を大きく変えたら「作り直す」と、新しい重みで探し直します。</p>' : '');
  [].forEach.call(document.querySelectorAll('.seg button'), function(b){
    b.onclick = function(){ setWeight(b.dataset.k, +b.dataset.l); };
  });
  $('wreset').onclick = function(){ Seating.categories.forEach(function(c){ w[c.key] = 2; }); saveWeights(); };
}
function setWeight(k, lv){ S.input.settings.weights[k] = lv; saveWeights(); }
var wTimer = null;
function saveWeights(){
  /* 今の案は並びを保ったまま新しい重みで採点し直す */
  S.cands = S.cands.map(function(c){ return Seating.evaluate(S.input, c.seats.map(function(s){ return s.id; })); });
  if(S.cands.length){ S.base = S.cands.map(function(c){ return c.issues; }); S.baseIssues = keys(S.base[S.cur]); renderTabs(); }
  renderWeights();
  clearTimeout(wTimer);
  wTimer = setTimeout(function(){ server('saveWeights', S.input.settings.weights).catch(function(e){ alert('設定を保存できませんでした：' + e.message); }); }, 400);
}

/* ---- 取り込み（別のスプレッドシートの過去の座席表） ---- */
function renderImport(){
  var M = S.im || (S.im = { url: '', info: null, sheet: '', range: '', values: null, flip: null, overrides: {}, date: '', busy: false, msg: '' });
  var h = '<div class="msg" style="max-width:860px;margin-top:0">' +
    '<p><b>過去の座席表を履歴に取り込みます。</b>別のスプレッドシート（前の学期・去年の座席表など）の格子をそのまま読みます。' +
    'セルは「番号」「氏名」「番号＋氏名」のどれでもよく、黒板・教卓・空席などの見出しは飛ばします。</p>' +
    '<div class="form"><input class="url" id="imurl" placeholder="スプレッドシートの URL（空欄ならこのファイル）" value="' + esc(M.url) + '"><button id="imopen">開く</button></div>';
  if(M.info){
    h += '<div class="form" style="margin-top:8px"><span>「' + esc(M.info.name) + '」</span><select id="imsheet">' +
      M.info.sheets.map(function(x){ return '<option' + (x.name === M.sheet ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') +
      '</select><input id="imrange" placeholder="範囲（空欄＝シート全体、例 A1:H9）" value="' + esc(M.range) + '" style="width:16em"><button id="imread" class="primary">読む</button></div>';
  }
  if(M.msg) h += '<p style="color:var(--warn)">' + esc(M.msg) + '</p>';
  h += '</div>';
  var side = '<h2>手順</h2><p class="muted">1. URL を貼って「開く」<br>2. シートと範囲を選んで「読む」<br>3. 色で対応を確かめ、赤い所を直す<br>4. その席替えの日付を入れて取り込む</p>';
  if(M.values){
    var r = SeatImport.parse(M.values, S.input.students, { flip: M.flip, overrides: M.overrides });
    M.last = r;
    var key = {};
    r.cells.forEach(function(x){ key[x.r + ',' + x.c] = x; });
    r.labels.forEach(function(x){ key[x.r + ',' + x.c] = { label: true, raw: x.raw, skipped: x.skipped }; });
    var t = '<table class="pv">';
    M.values.forEach(function(row, i){
      t += '<tr>' + row.map(function(v, j){
        var x = key[i + ',' + j];
        if(!x) return '<td></td>';
        if(x.label) return '<td class="lb">' + esc(x.raw) + (x.skipped ? '<small>飛ばす</small>' : '') + '</td>';
        var cls = x.id == null ? 'ng' : (x.sure || x.manual ? 'ok' : 'guess');
        return '<td class="' + cls + '">' + esc(x.raw) + (x.id != null ? '<small>→ ' + esc(x.id) + '番</small>' : '') + '</td>';
      }).join('') + '</tr>';
    });
    t += '</table>';
    h += '<div class="form" style="justify-content:space-between"><span class="legend"><span style="background:#E3F2E8">対応した</span><span style="background:#F7EBCB">推定</span><span style="background:var(--warn-bg);color:var(--warn)">対応できない</span></span>' +
      '<label><input type="checkbox" id="imflip"' + (r.flip ? ' checked' : '') + '> 教卓側から見た表（上下左右を反転）</label></div>' +
      '<div style="overflow:auto;max-width:100%">' + t + '</div>';
    if(r.twoBlocks) h += '<p style="color:var(--warn)">同じ児童がほぼ全員2回ずつ出ています。向きの違う座席表が2つ並んでいるようです。範囲に片方だけを指定してください（例：A1:H9）。</p>';
    var roster = S.input.students.slice().sort(function(a, b){ return String(a.id).localeCompare(String(b.id), 'ja', { numeric: true }); });
    var fixes = r.problems.map(function(x){
      var opts = '<option value="">（選ぶ）</option><option value="skip">飛ばす（児童ではない）</option>' +
        roster.map(function(p){ return '<option value="' + esc(p.id) + '">' + esc(p.id) + '番 ' + esc(p.name) + '</option>'; }).join('');
      return '<li class="fix' + (x.id == null ? ' hard' : '') + '"><b>' + esc(x.raw) + '</b>：' + esc(x.note) + '<br><select data-k="' + x.r + ',' + x.c + '">' + opts + '</select></li>';
    }).join('');
    side = '<h2>読んだ結果</h2><p><b>' + r.entries.length + '</b> 人を座席に対応づけました。</p>' +
      (r.missing.length ? '<p class="muted">この表にいない在籍児童：' + r.missing.map(function(p){ return esc(p.id) + '番'; }).join('、') + '<br>（欠席・転入などで居なかった児童は、そのままで構いません）</p>' : '') +
      (fixes ? '<h2>確かめる所（' + r.problems.length + '）</h2><ul class="issues">' + fixes + '</ul>' : '<p class="ok">確かめる所はありません。</p>') +
      '<h2>取り込む</h2><div class="form"><input type="date" id="imdate" value="' + esc(M.date) + '"><button id="imgo" class="primary"' + (r.entries.length && M.date && !M.busy ? '' : ' disabled') + '>履歴に取り込む</button></div>' +
      '<p class="muted">日付は、その席で過ごし始めた日。「前回」はこの日付の順で決まります。班の区切りは取り込みません（隣と席の位置だけを使います）。</p>';
  }
  $('stage').innerHTML = h;
  $('side').innerHTML = side;
  $('imopen').onclick = function(){
    M.url = $('imurl').value; M.msg = ''; M.info = null; M.values = null; M.overrides = {};
    server('sourceInfo', M.url).then(function(info){
      M.info = info;
      if(!info.sheets.length){ M.msg = '読めるシートがありません。'; }
      else M.sheet = (info.sheets.filter(function(x){ return /座席|席/.test(x.name); })[0] || info.sheets[0]).name;
      renderImport();
    }).catch(function(e){ M.msg = e.message; renderImport(); });
  };
  if($('imread')) $('imread').onclick = function(){
    M.sheet = $('imsheet').value; M.range = $('imrange').value; M.msg = ''; M.overrides = {}; M.flip = null;
    this.disabled = true; this.textContent = '読んでいます…';
    server('readSource', M.url, M.sheet, M.range).then(function(v){
      M.values = SeatImport.trim(v);
      if(!M.values.length){ M.values = null; M.msg = 'そのシート（範囲）は空です。'; }
      renderImport();
    }).catch(function(e){ M.msg = e.message; renderImport(); });
  };
  if($('imflip')) $('imflip').onchange = function(){ M.flip = this.checked; renderImport(); };
  [].forEach.call(document.querySelectorAll('.fix select'), function(sel){
    sel.onchange = function(){ if(sel.value){ M.overrides[sel.dataset.k] = sel.value === 'skip' ? 'skip' : sel.value; renderImport(); } };
  });
  if($('imdate')) $('imdate').onchange = function(){ M.date = this.value; renderImport(); };
  if($('imgo')) $('imgo').onclick = function(){
    var r = M.last;
    if(r.problems.some(function(x){ return x.id == null; }) && !confirm('対応できないセルが残っています。それらを飛ばして取り込みますか？')) return;
    M.busy = true; this.disabled = true; this.textContent = '取り込み中…';
    server('importEntries', r.entries, M.date).then(function(res){
      setInput(res.input);
      S.im = { url: M.url, info: M.info, sheet: M.sheet, range: '', values: null, flip: null, overrides: {}, date: '', busy: false,
        msg: '' };
      renderImport();
      $('side').innerHTML = '<p class="ok"><b>第' + res.round + '回として ' + r.entries.length + ' 人分を取り込みました。</b></p><p class="muted">過去の席替えは今 ' + res.input.history.length + ' 回分あります。続けて別の回を取り込めます。</p>';
    }).catch(function(e){ M.busy = false; M.msg = e.message; renderImport(); });
  };
}

[].forEach.call($('views').children, function(b){ b.onclick = function(){ showView(b.dataset.v); }; });
$('make').onclick = make;
$('commit').onclick = commit;
$('show').onclick = show;
$('flip').onclick = function(){ S.flip = !S.flip; this.textContent = S.flip ? '黒板側から見る' : '教卓側から見る'; render(); };
load();
</script>
</body>
