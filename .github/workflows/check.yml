# 生成物（dist）が正本（src）と一致するか、テストが通るかを、push と PR のたびに確かめる。
# 失敗したら、手元で python3 scripts/build.py を実行して dist を作り直し、テストを直してから push する。
#
# 試験用のマシンは ubuntu-24.04 に固定している（2026-11：ubuntu-latest が 26.04 になり、Playwright 1.56.1 がブラウザを入れられないため）。
# 最新のマシンで通るようになったかは、runner-watch.yml が毎月確かめて、通れば Issue で知らせる。
# 固定を解除する時は、下の default を ubuntu-latest に変え、runner-watch.yml を消す。
name: check
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      os:
        description: 試験用のマシン
        type: string
        default: ubuntu-24.04
    outputs:
      os_version:
        description: 実際に動いたマシンの OS の版
        value: ${{ jobs.check.outputs.os_version }}
jobs:
  check:
    runs-on: ${{ inputs.os || 'ubuntu-24.04' }}
    timeout-minutes: 20
    outputs:
      os_version: ${{ steps.os.outputs.version }}
    steps:
      - name: マシンの版
        id: os
        run: . /etc/os-release && echo "version=$VERSION_ID" >> "$GITHUB_OUTPUT" && echo "$PRETTY_NAME"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 生成物と正本の一致
        run: python3 scripts/build.py --check
      - name: アイコンメーカーの生成物と正本の一致
        run: |
          node apps/icon-maker/scripts/build.mjs
          if ! git diff --exit-code -- apps/icon-maker/dist; then
            echo "::error::apps/icon-maker/dist が src と合っていません。node apps/icon-maker/scripts/build.mjs を実行してコミットしてください。"
            exit 1
          fi
      - name: アイコンメーカーとノート評価の検査
        run: |
          node apps/icon-maker/tests/test-app.mjs
          node apps/note-assessment/gas/scripts/localcheck.js
      - name: 計算とサーバーのテスト
        run: node --test apps/child-support/tests/engine.test.mjs apps/child-support/tests/gas.test.mjs apps/child-support/tests/paste.test.mjs apps/classroom-clock/tests/core.test.mjs apps/group-maker/tests/core.test.mjs
      - name: Playwright を入れる
        run: |
          # 実行環境に入っている Microsoft の配布元は、署名の切れで apt を止めることがある（2026-11 に 403）。使わないので外してから入れる
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure-cli*.list /etc/apt/sources.list.d/microsoft*.sources
          npm install -g playwright@1.56.1
          npx -y playwright@1.56.1 install --with-deps chromium
      - name: 画面のテスト
        run: |
          node apps/child-support/tests/ui.test.mjs
          node --test apps/child-support/tests/gas-ui.test.mjs
          node apps/classroom-clock/tests/ui.test.mjs
          node apps/group-maker/tests/ui.test.mjs
